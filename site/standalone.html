ssure\n\nYour workers share the model provider's rate limits with the API. If 50 workers start a bulk job, they can starve interactive users.\n\n- Separate queues and worker pools for **interactive** and **batch** work, with batch workers capped.\n- A global concurrency limit on model calls (a Redis semaphore or token bucket shared across processes).\n- Batch work should use the provider's batch API when latency does not matter (cheaper and on separate limits).\n- Autoscale workers on **queue depth and age**, not CPU. A worker waiting on a model API uses almost no CPU.\n\n> [!numbers] Ingestion and memory jobs average 6 seconds of wall time, mostly waiting on APIs. One async worker process can run 20 jobs concurrently. To drain 10,000 jobs in under 30 minutes you need 10,000 × 6 s / 1,800 s ≈ 34 concurrent slots, so two worker processes with concurrency 20, provided your rate limits allow about 34 concurrent model calls.\n\n## Scheduled jobs\n\nSome work runs on a clock: nightly reconciliation, evals against production snapshots, cleanup of expired sessions, budget resets. Use your platform's scheduler (Cloud Scheduler, EventBridge, Kubernetes CronJob) to enqueue a job, rather than a `while True: sleep` in a container. Make scheduled jobs idempotent too: schedulers can fire twice.\n\n## Design review questions\n\n> [!interview] A worker crashes after calling the payment API but before marking the job done. What happens on retry?\n\n> [!interview] How many database connections does your system open at peak scale, and what is the database's limit?\n\n> [!interview] How do you stop a bulk backfill from slowing down live chats?\n\n> [!interview] Where is the state of a pending approval, and what happens to it during a deploy?\n\n## Further reading\n\n- [Transactional outbox](https://microservices.io/patterns/data/transactional-outbox.html), microservices.io.\n- [Implementing Stripe-like Idempotency Keys in Postgres](https://brandur.org/idempotency-keys).\n- [Temporal documentation](https://docs.temporal.io/), for durable execution concepts even if you never use it.\n- [arq](https://arq-docs.helpmanual.io/), a small async job queue for Python.\n- [Designing Data-Intensive Applications](https://dataintensive.net/), Martin Kleppmann. Not free, but often in libraries; chapters on transactions and stream processing are the background for this lesson.\n\n```quiz\n[\n  {\"q\": \"Why should you not hold a database connection while waiting on an LLM call?\", \"options\": [\"LLM SDKs forbid it\", \"Connections are scarce; holding them during multi-second waits exhausts the pool under load\", \"It corrupts data\", \"It increases token usage\"], \"answer\": 1, \"why\": \"A slow model call holding a connection wastes a limited resource. Keep transactions short around the slow work.\"},\n  {\"q\": \"What does at-least-once delivery imply for your job handlers?\", \"options\": [\"Nothing\", \"They must be idempotent, because a job can run more than once\", \"They must be faster\", \"They must use Redis\"], \"answer\": 1, \"why\": \"Duplicate execution is normal. Unique constraints, idempotency keys, and guarded state transitions make it harmless.\"},\n  {\"q\": \"What problem does the transactional outbox solve?\", \"options\": [\"Slow queries\", \"Writing to the database and publishing to a queue atomically, so neither happens without the other\", \"Rate limiting\", \"Embedding updates\"], \"answer\": 1, \"why\": \"By recording the message in the same transaction as the data, a separate relay can publish reliably.\"},\n  {\"q\": \"What should you autoscale model-calling workers on?\", \"options\": [\"CPU usage\", \"Queue depth and job age\", \"Memory\", \"Number of API instances\"], \"answer\": 1, \"why\": \"Workers waiting on remote APIs use little CPU, so CPU-based autoscaling never triggers. Queue metrics reflect actual demand.\"}\n]\n```\n"}, {"id": "w4-cicd", "week": 4, "kind": "lesson", "title": "Automated testing and deployment with CI/CD", "short": "CI/CD for AI apps", "minutes": 45, "summary": "A pipeline that lints, tests, evaluates, builds, and deploys an AI application on every change, with prompt and model versioning, environments, progressive rollout, and one-command rollback.", "body": "\n## What is different about CI/CD for AI systems\n\nThe mechanics are the same as any service: build, test, package, deploy. Three things differ:\n\n1. **Tests are probabilistic and cost money.** Your eval suite takes minutes, spends tokens, and has noise. It needs tiers, budgets, and statistical gates (Week 3).\n2. **Behaviour changes without code changes.** Prompts, model versions, knowledge base content, and config all change behaviour. They must flow through the pipeline too.\n3. **Production is the real test.** Offline evals approximate reality, so progressive rollout with online monitoring is part of the pipeline, not an afterthought.\n\n## The pipeline\n\n```mermaid\nflowchart LR\n  PR[Pull request] --> L[Lint + types<br/>ruff, mypy]\n  L --> U[Unit tests<br/>no model calls]\n  U --> S[Eval smoke<br/>20 cases]\n  S --> G[Eval PR gate<br/>200 cases × 3]\n  G --> R[Review + merge]\n  R --> B[Build image<br/>tag = git SHA]\n  B --> SC[Scan image]\n  SC --> ST[Deploy staging]\n  ST --> E2E[E2E smoke<br/>against staging]\n  E2E --> C[Canary 5%<br/>prod]\n  C -->|metrics OK| F[100% prod]\n  C -->|regression| RB[Auto rollback]\n```\n\n### Stage by stage\n\n**Lint and type check.** Ruff and a type checker. Cheap, fast, catch a surprising number of bugs.\n\n**Unit tests without models.** Most of your code (tool logic, auth, permission checks, guardrails, parsing, the retrieval SQL) can be tested deterministically with fake models. Use a fake LLM client that returns scripted responses, including tool calls, so you can test the agent loop's control flow: step limits, error handling, parallel tool results. These run in seconds and cost nothing.\n\n```python\nclass ScriptedLLM:\n    \"\"\"Returns pre-baked responses in order. Lets you test the loop without the API.\"\"\"\n    def __init__(self, responses): self.responses = iter(responses)\n    async def create(self, **kwargs): return next(self.responses)\n\nasync def test_step_limit_escalates():\n    llm = ScriptedLLM([tool_use(\"get_order\", {\"order_id\": 1})] * 20)   # never stops\n    result = await run_turn(ctx_with(llm), [user(\"hi\")], on_text=noop)\n    assert ctx.escalations == [\"step_limit\"]\n```\n\n**Eval smoke and PR gate.** Run only when behaviour-affecting paths change (`app/**`, `prompts/**`, `evals/**`, model config). Post results as a PR comment. Block merge on gate failure.\n\n**Build once, deploy the same artifact everywhere.** The image built from `main` at SHA `9f3e2c1` is what goes to staging and then production. Never rebuild for production.\n\n**Scan.** Check the image for known vulnerabilities (Trivy, Grype, or your registry's scanner) and dependencies for licences and CVEs.\n\n**Staging + end-to-end smoke.** Deploy to a staging environment with its own database and model key, then run a handful of real requests through the public endpoint: auth works, a chat streams, a tool call succeeds.\n\n**Canary, then full rollout.** Covered below.\n\n## A GitHub Actions example\n\n```yaml\n# .github/workflows/ci.yml\nname: ci\non:\n  pull_request:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pull-requests: write          # to post eval comments\n  id-token: write               # for keyless cloud auth (OIDC)\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    services:\n      db:\n        image: pgvector/pgvector:pg16\n        env: { POSTGRES_PASSWORD: relay }\n        ports: [\"5432:5432\"]\n        options: --health-cmd pg_isready --health-interval 5s\n    steps:\n      - uses: actions/checkout@v7\n      - uses: astral-sh/setup-uv@v10.0.1\n        with: { enable-cache: true }\n      - run: uv sync --frozen\n      - run: uv run ruff check . && uv run ruff format --check .\n      - run: uv run pytest -q\n\n  evals:\n    needs: test\n    if: github.event_name == 'pull_request'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v7\n      - uses: dorny/paths-filter@v4\n        id: changed\n        with:\n          filters: |\n            behaviour: ['app/**', 'prompts/**', 'evals/**', 'config/models.yaml']\n      - if: steps.changed.outputs.behaviour == 'true'\n        uses: astral-sh/setup-uv@v10.0.1\n      - if: steps.changed.outputs.behaviour == 'true'\n        env:\n          ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}   # separate key with a spend cap\n        run: |\n          uv sync --frozen\n          uv run python -m evals.run --suite pr --trials 3 \\\n            --baseline gs://relay-evals/baselines/main.json --report report.md\n      - if: always() && steps.changed.outputs.behaviour == 'true'\n        uses: marocchino/sticky-pull-request-comment@v3.0.5\n        with: { path: report.md }\n```\n\nA separate `deploy.yml` on pushes to `main` builds the image, pushes it to a registry, deploys to staging, runs the E2E smoke, then promotes to production.\n\nSecurity notes for pipelines (see GitHub's [security hardening guide](https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions)):\n\n- Use **OIDC** to authenticate to your cloud instead of storing long-lived cloud keys in GitHub.\n- Give workflows **minimal permissions**.\n- Do not expose secrets to workflows triggered by pull requests from forks.\n- Pin third-party actions to an exact version or, better, a commit SHA. Not every action publishes a moving major tag such as `@v10`, so check the action's releases page for the tags that actually exist.\n\n## Versioning prompts and models\n\nTreat prompts as code:\n\n- Store prompts as files (`prompts/system.md`, `prompts/judges/refund_promise.md`), not strings scattered through Python.\n- Reference models through one config file:\n\n```yaml\n# config/models.yaml\nagent:      {model: claude-sonnet-5-5, max_tokens: 2048}\nrouter:     {model: claude-haiku-5-5,  max_tokens: 64}\njudge:      {model: claude-opus-5-5,   max_tokens: 512}\nembeddings: {model: voyage-3.5, dim: 1024}\n```\n\n- Log the prompt hash and model ID on every trace, so any conversation can be tied to the exact behaviour that produced it.\n- Upgrading a model is a PR that changes one line in this file and must pass the full release suite.\n\nSome teams use a prompt management platform so non-engineers can edit prompts. That is fine if edits still go through evals and produce a versioned artifact the deploy pins to. \"Edit in a web UI and it is live instantly\" bypasses everything this week teaches.\n\n## Feature flags\n\nFlags decouple deploy from release. Ship new behaviour dark, then turn it on for staff, then 5% of users, then everyone. Useful flags in AI systems:\n\n- Which prompt version or model a user gets (for A/B tests).\n- Enabling a new tool.\n- Kill switches: disable the refund tool instantly if something goes wrong, without a deploy.\n\n## Progressive delivery and rollback\n\n```mermaid\nsequenceDiagram\n  participant P as Pipeline\n  participant LB as Traffic split\n  participant N as New revision\n  participant O as Old revision\n  P->>N: deploy (0% traffic)\n  P->>LB: 5% → N\n  Note over N: watch 30 min: error rate, p95 latency,<br/>judge pass rate, escalation rate, cost/convo\n  alt healthy\n    P->>LB: 25% → 50% → 100%\n  else regression\n    P->>LB: 100% → O (rollback)\n  end\n```\n\nCanary analysis for AI services should watch AI-specific signals in addition to errors and latency:\n\n- Online judge pass rates on sampled conversations.\n- Escalation-to-human rate and thumbs-down rate.\n- Tokens and cost per conversation.\n- Tool error rates and guardrail firing rates.\n\nRollback must be one command (or automatic) and fast: shift traffic back to the previous revision. Because the image tag is the Git SHA and prompts are inside the image, rolling back the image rolls back the prompt too.\n\n> [!warn] Database migrations do not roll back with traffic. Make schema changes backward-compatible (expand, migrate, contract over several deploys) so the previous revision can still run against the new schema.\n\n## Design review questions\n\n> [!interview] A product manager wants to change one sentence in the system prompt. Walk me through how it reaches production.\n\n> [!interview] How long from merge to 100% production, and how long to roll back?\n\n> [!interview] Which signals does the canary watch, and who decided the thresholds?\n\n> [!interview] How would you know if your eval budget in CI doubled?\n\n## Further reading\n\n- [GitHub Actions documentation](https://docs.github.com/en/actions).\n- [Using uv in GitHub Actions](https://docs.astral.sh/uv/guides/integration/github/).\n- [Security hardening for GitHub Actions](https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions).\n- [SLSA](https://slsa.dev/), a framework for supply-chain integrity of build artifacts.\n- [promptfoo CI integration](https://github.com/promptfoo/promptfoo) for a ready-made eval-in-CI option.\n\n```quiz\n[\n  {\"q\": \"What can you unit test without calling a model?\", \"options\": [\"Nothing useful\", \"Tool logic, permission checks, guardrails, retrieval SQL, and the agent loop's control flow using a scripted fake LLM\", \"Only formatting\", \"Only the database\"], \"answer\": 1, \"why\": \"Most of an AI application is deterministic code. Fakes let you test it fast and for free, leaving evals for model behaviour.\"},\n  {\"q\": \"Why build the image once and promote it through environments?\", \"options\": [\"It saves CI minutes only\", \"So production runs exactly the artifact that was tested, including prompts\", \"Registries charge per build\", \"Docker requires it\"], \"answer\": 1, \"why\": \"Rebuilding can pull different dependencies. Promoting one artifact guarantees what you tested is what you run.\"},\n  {\"q\": \"Which signal is specific to canarying an AI service?\", \"options\": [\"HTTP 5xx rate\", \"CPU usage\", \"Online judge pass rate and escalation rate on sampled conversations\", \"Disk usage\"], \"answer\": 2, \"why\": \"A new prompt can be fast and error-free but worse at the job. Quality signals must be part of canary analysis.\"},\n  {\"q\": \"Why must schema migrations be backward-compatible?\", \"options\": [\"For performance\", \"Rolling back the app does not roll back the database; the old revision must still work with the new schema\", \"Postgres requires it\", \"To keep migrations small\"], \"answer\": 1, \"why\": \"Expand and contract migrations let you roll back code safely.\"}\n]\n```\n"}, {"id": "w4-cloud", "week": 4, "kind": "lesson", "title": "Managing containerized AI apps on the cloud", "short": "Containers on the cloud", "minutes": 45, "summary": "Choose a runtime for your containers, size and autoscale it for I/O-bound LLM traffic, wire up networking, secrets, and managed data services, and keep the bill predictable.", "body": "\n## Choosing a runtime\n\nYour Relay image can run on many platforms. The choice is mostly about how much infrastructure you want to operate.\n\n| Platform | Model | Good for | Trade-offs |\n|---|---|---|---|\n| Google Cloud Run, Azure Container Apps | Serverless containers, scale to zero, per-request billing | Most API-calling AI apps, small teams, spiky traffic | Request timeouts (Cloud Run up to 60 min), cold starts, less control |\n| AWS ECS on Fargate | Managed containers, no servers | AWS shops, steady services | More configuration (task defs, load balancers) |\n| Fly.io, Render, Railway | Developer platforms | Fast setup, free or cheap small apps | Fewer enterprise features |\n| Kubernetes (GKE, EKS, AKS) | Full orchestration | Many services, GPUs, custom networking, platform teams | Significant operational cost |\n| VMs | You manage everything | Special hardware or licensing | You manage everything |\n\n> [!rule] If your app calls hosted model APIs and you do not already run Kubernetes, start on a serverless container platform. Move only when you hit a concrete limit.\n\n**When you self-host models** (open-weight models on GPUs), the picture changes: GPU scheduling, model loading time, and batching make Kubernetes with an inference server (vLLM, TGI, or similar) or a managed inference platform the usual choice. This course focuses on API-calling apps; the same deployment principles apply to the API layer in front of self-hosted models.\n\n## LLM apps are I/O bound\n\nA request to Relay spends perhaps 95% of its time waiting: for the model API, the database, the reranker. CPU and memory use per request are small. This shapes sizing and scaling:\n\n- **Use async servers** (FastAPI on uvicorn with async handlers and async clients). One process can hold hundreds of concurrent waiting requests.\n- **Scale on concurrency, not CPU.** CPU-based autoscaling sees idle CPUs and never scales out, while requests queue. Cloud Run's concurrency setting and Kubernetes HPA on custom metrics (in-flight requests) fit better.\n- **Long requests limit throughput per instance.** If streams last 20 seconds, each instance can only complete a bounded number per minute even when idle.\n\n> [!numbers] Peak: 40 new chats/sec, each holding a streaming connection for 12 s on average. By Little's law, concurrent requests = arrival rate × duration = 40 × 12 = **480**. With async instances configured for 80 concurrent requests each, you need 6 instances at peak, 8 with headroom. Memory per in-flight request is small (tens of KB of conversation), so 1 vCPU / 1 GB instances are plenty. Your real bottleneck will be the model provider's rate limits, not compute.\n\n## Cold starts and minimum instances\n\nScale-to-zero platforms start containers on demand. A Python app that imports heavy libraries can take several seconds to start, which a user experiences as a slow first response.\n\n- Keep images small and imports lean (do not import a local reranker model in the API container if it is only used by workers).\n- Set **minimum instances** to 1 or 2 for user-facing services. The cost is small compared with the experience.\n- Lazy-load rarely used heavy components.\n\n## Networking and data services\n\nA minimal production layout on Google Cloud (equivalents exist on every cloud):\n\n```mermaid\nflowchart TB\n  U[Users] --> LB[HTTPS load balancer<br/>+ Cloud Armor WAF]\n  LB --> API[Cloud Run: relay-api<br/>min 1, max 20]\n  API --> SQL[(Cloud SQL Postgres<br/>+ pgvector, private IP)]\n  API --> R[(Memorystore Redis)]\n  API --> PUB[Pub/Sub or<br/>Postgres queue]\n  PUB --> WRK[Cloud Run: relay-worker<br/>scaled on backlog]\n  WRK --> SQL\n  WRK --> GCS[(Cloud Storage)]\n  API & WRK --> SM[Secret Manager]\n  API & WRK --> LLM[Model provider API]\n  API & WRK --> OBS[Logging, tracing, metrics]\n```\n\nPrinciples:\n\n- **Private networking for data.** Databases and caches have no public IP. Services reach them through a VPC connector or private service access.\n- **Managed databases.** Use a managed Postgres (Cloud SQL, RDS, Neon, Supabase). Backups, point-in-time recovery, and failover are not things you want to build. Check the provider supports pgvector.\n- **Secrets from a secret manager**, mounted as environment variables, with each service's identity granted access only to its own secrets.\n- **Service identities.** Each service runs as its own service account with least-privilege IAM. The worker can write to the bucket; the API cannot.\n- **Egress control.** If tools make outbound requests, consider routing through a proxy with an allow-list, which also helps against injection-driven exfiltration.\n\n## Configuration per environment\n\nSame image, different configuration:\n\n| Setting | Staging | Production |\n|---|---|---|\n| Database | `relay-staging` | `relay-prod` |\n| Model API key | Staging key, $50/day cap | Prod key, monitored |\n| Models | Same as prod (test what you ship) | Pinned IDs |\n| Min instances | 0 | 2 |\n| Refund tool | Writes to sandbox payment provider | Live |\n| Log level | Debug | Info |\n\n## Infrastructure as code\n\nClick-ops does not survive the second environment. Describe infrastructure in code (Terraform/OpenTofu, Pulumi, or the platform's own config files) and apply it from CI. Then staging and production differ only in variables, and every change is reviewed. For a course project, a short shell script with `gcloud run deploy` flags checked into the repo is an acceptable start. Treat servers and containers as **immutable**: replace them with new versions rather than patching them in place.\n\n## Cost management\n\nFor API-calling apps, the cloud bill is usually small compared with the model bill. Still:\n\n- Set **budgets and alerts** on the cloud account and on the model provider account, from day one.\n- Scale to zero for staging and preview environments.\n- Right-size the database: it is often the largest fixed cost.\n- Watch egress charges if you move large files.\n- Track **cost per conversation** as a product metric, combining model tokens, infrastructure, and third-party APIs.\n\nFree tiers are enough for this course: Cloud Run, [Google Cloud free tier](https://cloud.google.com/free), [AWS free tier](https://aws.amazon.com/free/), [Render free instances](https://render.com/docs/free), [Neon](https://neon.com/) and [Supabase](https://supabase.com/docs/guides/ai) free Postgres with pgvector.\n\n## Reliability basics\n\n- **Run at least two instances** for anything users depend on, across zones if the platform allows.\n- **Graceful shutdown**: when an instance is told to stop (SIGTERM), stop accepting new requests and let in-flight streams finish within the grace period. Configure the platform's termination grace period longer than your typical stream.\n- **Timeouts everywhere**: platform request timeout > your agent's overall timeout > per-tool timeouts > model call timeout. Mismatched timeouts cause confusing failures (the platform kills the request while your code thinks it has time).\n- **Backups tested by restoring them.**\n\n## Design review questions\n\n> [!interview] How many instances do you need at peak, and how did you calculate it?\n\n> [!interview] What happens to in-flight streaming responses during a deploy?\n\n> [!interview] Which service can read which secret? Show me the IAM bindings.\n\n> [!interview] What is the monthly cost at today's traffic and at 10x, split into model, compute, database, and other?\n\n## Further reading\n\n- [Cloud Run documentation](https://cloud.google.com/run/docs) and its [concurrency guide](https://cloud.google.com/run/docs/configuring/concurrency).\n- [Fly.io docs](https://fly.io/docs/), a simple alternative with a generous developer experience.\n- [Kubernetes autoscaling concepts](https://kubernetes.io/docs/concepts/workloads/autoscaling/), when you outgrow serverless.\n- [AWS Well-Architected Generative AI Lens](https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html), a checklist-style review of AI workloads.\n- [Azure AI architecture guidance](https://learn.microsoft.com/en-us/azure/architecture/ai-ml/) and [Google Cloud AI/ML architecture](https://cloud.google.com/architecture/ai-ml).\n\n```quiz\n[\n  {\"q\": \"Your CPU-based autoscaler never adds instances, yet users see queueing. Why?\", \"options\": [\"The autoscaler is broken\", \"LLM requests are I/O-bound; CPU stays low while concurrency is saturated\", \"Too many instances\", \"The model is slow\"], \"answer\": 1, \"why\": \"Waiting on remote APIs uses little CPU. Scale on concurrent requests or queue depth instead.\"},\n  {\"q\": \"40 chats per second each hold a connection for 10 seconds. How many concurrent requests is that?\", \"options\": [\"4\", \"40\", \"400\", \"4,000\"], \"answer\": 2, \"why\": \"Little's law: concurrency = arrival rate × duration = 40 × 10 = 400.\"},\n  {\"q\": \"Why set minimum instances to 1 or 2 on a user-facing serverless service?\", \"options\": [\"Required by the platform\", \"To avoid cold-start delays and keep at least one warm, available instance\", \"To reduce cost\", \"For logging\"], \"answer\": 1, \"why\": \"Cold starts add seconds to the first request. A small always-on floor is cheap insurance.\"},\n  {\"q\": \"What should the relationship between timeouts be?\", \"options\": [\"All equal\", \"Platform request timeout greater than agent timeout greater than tool and model call timeouts\", \"Model timeout largest\", \"No timeouts on streaming\"], \"answer\": 1, \"why\": \"Inner operations must time out before outer ones, so your code handles the failure instead of being killed mid-flight.\"}\n]\n```\n"}, {"id": "w4-lab", "week": 4, "kind": "lab", "title": "Lab 4: Deploy the agent to the cloud with secure APIs", "short": "Lab: deploy", "minutes": 270, "builds": "Relay on Cloud Run with CI/CD", "summary": "Containerise Relay, add real authentication, rate limits, and idempotency, move background work to a worker service, and ship it to the cloud through a pipeline that runs your evals and supports instant rollback.", "body": "\n## What you will build\n\n```mermaid\nflowchart LR\n  GH[GitHub PR] --> CI[CI: lint, unit,<br/>eval gate]\n  CI --> M[Merge to main]\n  M --> CD[CD: build image,<br/>push, deploy staging,<br/>smoke, promote]\n  CD --> API[relay-api<br/>Cloud Run]\n  CD --> WK[relay-worker<br/>Cloud Run]\n  API & WK --> DB[(Managed Postgres<br/>+ pgvector)]\n  API & WK --> SM[Secret Manager]\n  U[Client with JWT] --> API\n```\n\nThe lab shows Google Cloud Run. Fly.io, Render, Railway, ECS Fargate, or Azure Container Apps work too; translate the commands.\n\n**Acceptance criteria**\n\n1. `docker build` produces a non-root image that runs locally with `docker compose up` (API, worker, Postgres). Record its size and what makes it big: the reference image is 417 MB because it bundles a local embedding runtime; one that calls a hosted embedding API can be much smaller.\n2. The API verifies JWTs from an identity provider (Auth0, Clerk, Supabase Auth, or Firebase Auth free tiers). Customer identity comes only from the token.\n3. Per-user rate limit (messages per minute) and daily token budget, returning `429` with `Retry-After`.\n4. `Idempotency-Key` support on the refund approval endpoint.\n5. Memory extraction and ingestion run in a separate worker service, not in API background tasks.\n6. CI runs lint, unit tests (with a scripted fake LLM), and the eval PR gate. CD deploys to staging, runs a smoke test, then production.\n7. You can roll back production to the previous revision with one command, and you have done it once.\n\n> [!tip] A tested reference implementation is under [`relay/` at tag `lab4`](https://github.com/Rachneet/ai-system-design-course/tree/lab4/relay). Its CI builds the image and runs the real API and worker containers against Postgres on every push. The Cloud Run pipeline is included but has not been run against a live project.\n\n## Step 1: container and compose\n\nUse the multi-stage Dockerfile from the secure APIs lesson. Add a worker entry point that uses the same image:\n\n```yaml\n# docker-compose.yml\nservices:\n  db:\n    image: pgvector/pgvector:pg16\n    environment: { POSTGRES_PASSWORD: relay, POSTGRES_DB: relay }\n  api:\n    build: .\n    env_file: .env\n    environment: { DATABASE_URL: postgresql://postgres:relay@db/relay }\n    ports: [\"8080:8080\"]\n    depends_on: [db]\n  worker:\n    build: .\n    command: [\"python\", \"-m\", \"app.worker\"]\n    env_file: .env\n    environment: { DATABASE_URL: postgresql://postgres:relay@db/relay }\n    depends_on: [db]\n```\n\nAdd `.dockerignore` (exclude `.venv`, `evals/runs`, `.git`, `.env`). Check the image size with `docker image ls` and that `docker run --rm relay id` prints a non-root user.\n\n## Step 2: authentication\n\nCreate a free application in an identity provider. Configure the API with the JWKS URL, issuer, and audience. Replace the `X-Customer-Id` dependency with `current_user` from the lesson. Map the token's `sub` to your `customers` table (create the row on first login).\n\nWrite tests: expired token → 401; token for customer A requesting session of customer B → 404; valid token → 200.\n\n## Step 3: rate limits and budgets\n\nImplement a token bucket in Postgres or Redis keyed by user:\n\n```python\nasync def allow(user_id: str, cost: int = 1, rate_per_min: int = 20, burst: int = 20) -> tuple[bool, float]:\n    \"\"\"Atomic token bucket in Redis using a small Lua script. Returns (allowed, retry_after_s).\"\"\"\n    now = time.time()\n    allowed, retry = await redis.eval(TOKEN_BUCKET_LUA, 1, f\"rl:{user_id}\", now, rate_per_min / 60, burst, cost)\n    return bool(allowed), float(retry)\n```\n\nAlso record tokens used per user per day (from `resp.usage`), and refuse new turns past the budget with a clear message.\n\n## Step 4: worker service and idempotency\n\nMove memory extraction and ingestion into `app/worker.py`, consuming the Postgres job table from Lab 2. The API enqueues jobs in the same transaction as the data that triggers them (outbox style).\n\nAdd an `idempotency_keys` table and wrap `POST /approvals/{id}/decision`: the first request with a key stores its response; repeats return it.\n\n## Step 5: cloud setup\n\n```bash\ngcloud services enable run.googleapis.com sqladmin.googleapis.com secretmanager.googleapis.com artifactregistry.googleapis.com\ngcloud artifacts repositories create relay --repository-format=docker --location=europe-west1\n\n# Postgres: Cloud SQL (or a free Neon/Supabase database with pgvector)\n# Secrets\nprintf \"%s\" \"$ANTHROPIC_API_KEY\" | gcloud secrets create anthropic-key --data-file=-\nprintf \"%s\" \"$DATABASE_URL\"      | gcloud secrets create database-url  --data-file=-\n\n# Service accounts with least privilege\ngcloud iam service-accounts create relay-api\ngcloud iam service-accounts create relay-worker\ngcloud secrets add-iam-policy-binding anthropic-key \\\n  --member=serviceAccount:relay-api@$PROJECT.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor\n# ... repeat per secret and per service as needed\n```\n\nDeploy:\n\n```bash\nIMAGE=europe-west1-docker.pkg.dev/$PROJECT/relay/relay:$(git rev-parse --short HEAD)\ndocker build -t $IMAGE . && docker push $IMAGE\n\ngcloud run deploy relay-api --image $IMAGE --region europe-west1 \\\n  --service-account relay-api@$PROJECT.iam.gserviceaccount.com \\\n  --set-secrets ANTHROPIC_API_KEY=anthropic-key:latest,DATABASE_URL=database-url:latest \\\n  --concurrency 80 --min-instances 1 --max-instances 10 --timeout 300 \\\n  --allow-unauthenticated          # the app checks JWTs itself\n\ngcloud run deploy relay-worker --image $IMAGE --region europe-west1 \\\n  --command python --args=-m,app.worker \\\n  --service-account relay-worker@$PROJECT.iam.gserviceaccount.com \\\n  --set-secrets ANTHROPIC_API_KEY=anthropic-key:latest,DATABASE_URL=database-url:latest \\\n  --no-cpu-throttling --min-instances 1 --max-instances 3 --no-allow-unauthenticated\n```\n\n`--no-cpu-throttling` keeps CPU allocated to the worker between requests so its polling loop runs. A Cloud Run *service* must listen on `$PORT`, so have the worker start a tiny health endpoint alongside its loop (a few lines with `uvicorn` or `http.server`). Alternatively, use Cloud Run worker pools (`gcloud run worker-pools deploy`), which are built for continuous background work and need no endpoint, but do not autoscale, so you set the instance count yourself. Run database migrations as a one-off job (`gcloud run jobs`) before shifting traffic.\n\n## Step 6: CI/CD\n\nCreate `.github/workflows/ci.yml` from the CI/CD lesson. Then `deploy.yml` on push to `main`:\n\n1. Authenticate to Google Cloud with **Workload Identity Federation** (OIDC), no JSON keys.\n2. Build and push the image tagged with the Git SHA.\n3. Deploy to `relay-api-staging` and run `scripts/smoke.sh` (get a test token, send one chat, assert a streamed reply and a tool call).\n4. Deploy to production with `--no-traffic --tag canary`, shift 10% of traffic, wait, check error rate and latency from the platform's metrics, then shift 100%.\n\nRollback:\n\n```bash\ngcloud run services update-traffic relay-api --to-revisions=PREVIOUS_REVISION=100\n```\n\nPractice it. Deploy a deliberately broken prompt (for example one that makes the agent refuse everything), watch the smoke test or canary catch it, and roll back. Write down how long it took.\n\n## Stretch goals\n\n- Terraform or Pulumi for all of the above.\n- A `preview` environment per PR, torn down on merge.\n- Cloud Armor (or your platform's WAF) rate limiting at the edge.\n- Egress through a proxy with an allow-list for any tool that calls external URLs.\n- Graceful shutdown: handle SIGTERM by finishing in-flight streams within the grace period.\n\n## Reference reading\n\n- [Cloud Run docs](https://cloud.google.com/run/docs).\n- [Using uv in Docker](https://docs.astral.sh/uv/guides/integration/docker/) and [in GitHub Actions](https://docs.astral.sh/uv/guides/integration/github/).\n- [Security hardening for GitHub Actions](https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions).\n- [FastAPI in containers](https://fastapi.tiangolo.com/deployment/docker/).\n"}, {"id": "w5-tracing", "week": 5, "kind": "lesson", "title": "Tracing requests across agent actions and MCP", "short": "Tracing agents + MCP", "minutes": 45, "summary": "Instrument an agent so every conversation becomes a navigable trace of model calls, tool calls, retrieval, and remote MCP servers, using OpenTelemetry and its GenAI conventions, with context propagated across process boundaries.", "body": "\n## Why logs are not enough\n\nAn agent turn might involve a router call, three model calls, five tool calls (two in parallel), a retrieval with reranking, and a call to a remote MCP server that itself queries a database. When a user says \"it gave me the wrong refund amount\", you need to see that entire tree, in order, with inputs, outputs, timings, and token counts. Flat log lines with no relationship to one another make this nearly impossible.\n\n**Distributed tracing** records each unit of work as a **span** with a start time, duration, attributes, and a parent. All spans for one request share a **trace ID**. The result is a tree you can open and read.\n\n```mermaid\nflowchart TB\n  T[\"trace: POST /chat (session 8fa2, user c_77) 7.9 s\"]\n  T --> R[\"router.classify · haiku · 210 ms · 640 tok\"]\n  T --> A[\"agent.run · 7.4 s · 3 steps\"]\n  A --> M1[\"chat claude-sonnet-5-5 · step 1 · 1.9 s · in 9,120 / out 85\"]\n  A --> P[\"tools (parallel)\"]\n  P --> T1[\"execute_tool get_order · 40 ms\"]\n  P --> T2[\"execute_tool search_kb · 610 ms\"]\n  T2 --> S1[\"retrieval.hybrid · 70 ms\"]\n  T2 --> S2[\"rerank · 230 ms\"]\n  A --> M2[\"chat claude-sonnet-5-5 · step 2 · 1.2 s\"]\n  M2 --> X[\"mcp tools/call shipping.track · 880 ms (remote server)\"]\n  A --> M3[\"chat claude-sonnet-5-5 · step 3 · 2.6 s · out 240\"]\n  T --> G[\"guardrails.output · 35 ms\"]\n```\n\n## OpenTelemetry and the GenAI conventions\n\n[OpenTelemetry](https://opentelemetry.io/docs/languages/python/) (OTel) is the vendor-neutral standard for traces, metrics, and logs. Instrument once, send anywhere: Jaeger, Grafana Tempo, Honeycomb, Datadog, or LLM-focused tools like [Langfuse](https://langfuse.com/docs) and [Arize Phoenix](https://github.com/Arize-ai/phoenix) that accept OTel data.\n\nOTel defines [semantic conventions for generative AI](https://github.com/open-telemetry/semantic-conventions-genai/tree/main/docs/gen-ai): standard span names and attribute keys for model calls, agent operations, and tool executions. Using them means your traces work across tools without custom mapping. Key attributes include:\n\n| Attribute | Example |\n|---|---|\n| `gen_ai.operation.name` | `chat`, `execute_tool`, `invoke_agent`, `embeddings` |\n| `gen_ai.provider.name` | `anthropic` |\n| `gen_ai.request.model` / `gen_ai.response.model` | `claude-sonnet-5-5` |\n| `gen_ai.usage.input_tokens` / `gen_ai.usage.output_tokens` | `9120` / `85` |\n| `gen_ai.response.finish_reasons` | `[\"tool_use\"]` |\n| `gen_ai.tool.name` / `gen_ai.tool.call.id` | `get_order` / `toolu_01A…` |\n| `gen_ai.conversation.id` | session ID |\n\nThe conventions are marked **Development** (not yet stable) and moved to their own repository in 2026, so pin the version you follow and expect renames. Cached tokens, for example, are `gen_ai.usage.cache_read.input_tokens` and `gen_ai.usage.cache_write.input_tokens`. Libraries like [OpenLLMetry](https://github.com/traceloop/openllmetry) and the OTel contrib instrumentations can auto-instrument popular SDKs.\n\n## Instrumenting the agent loop\n\nAuto-instrumentation gives you model calls. Add manual spans for the parts that carry your application's meaning: the agent run, each tool, retrieval stages, guardrails.\n\n```python\nfrom opentelemetry import trace\ntracer = trace.get_tracer(\"relay\")\n\nasync def run_turn(ctx, messages, on_text):\n    with tracer.start_as_current_span(\"invoke_agent relay\") as span:\n        span.set_attribute(\"gen_ai.operation.name\", \"invoke_agent\")\n        span.set_attribute(\"gen_ai.conversation.id\", str(ctx.session_id))\n        span.set_attribute(\"relay.prompt_sha\", PROMPT_SHA)\n        span.set_attribute(\"enduser.id\", ctx.customer_hash)       # hashed, not raw\n        for step in range(MAX_STEPS):\n            with tracer.start_as_current_span(f\"chat {MODEL}\") as llm:\n                llm.set_attribute(\"gen_ai.operation.name\", \"chat\")\n                llm.set_attribute(\"gen_ai.request.model\", MODEL)\n                llm.set_attribute(\"relay.step\", step)\n                resp = await call_model(ctx, messages, on_text)\n                llm.set_attribute(\"gen_ai.usage.input_tokens\", resp.usage.input_tokens)\n                llm.set_attribute(\"gen_ai.usage.output_tokens\", resp.usage.output_tokens)\n                llm.set_attribute(\"gen_ai.usage.cache_read.input_tokens\", resp.usage.cache_read_input_tokens or 0)\n                llm.set_attribute(\"gen_ai.usage.cache_write.input_tokens\", resp.usage.cache_creation_input_tokens or 0)\n                llm.set_attribute(\"gen_ai.response.finish_reasons\", [resp.stop_reason])\n            ...\n\nasync def run_tool(ctx, block):\n    with tracer.start_as_current_span(f\"execute_tool {block.name}\") as span:\n        span.set_attribute(\"gen_ai.operation.name\", \"execute_tool\")\n        span.set_attribute(\"gen_ai.tool.name\", block.name)\n        span.set_attribute(\"gen_ai.tool.call.id\", block.id)\n        try:\n            ...\n        except ToolError as e:\n            span.set_status(trace.Status(trace.StatusCode.ERROR, str(e)))\n            span.set_attribute(\"relay.tool.error_kind\", type(e).__name__)\n            raise\n```\n\nBecause `asyncio.gather` runs tools inside the current context, parallel tool spans correctly share the agent span as parent.\n\n## Propagating context across services and MCP\n\nA trace is only useful if it crosses process boundaries. When the API enqueues a job for a worker, or calls a remote MCP server, the trace context (trace ID and parent span ID) must travel with the request so downstream spans attach to the same trace.\n\n- **HTTP**: OTel's W3C `traceparent` header. Auto-instrumented HTTP clients and servers (httpx, FastAPI) inject and extract it.\n- **Queues**: put the `traceparent` in the job payload when enqueuing; extract it in the worker and start the job span as a child (or as a linked span for long-delayed jobs).\n- **MCP**: the [Model Context Protocol](https://modelcontextprotocol.io/) sends JSON-RPC messages over stdio or Streamable HTTP. The OpenTelemetry MCP convention puts the W3C `traceparent` (and `tracestate`, `baggage`) inside each request's `params._meta` field, unprefixed, on every transport, and the server uses it as the remote parent for its spans. Because it travels in the message body, it works on stdio too. Support varies by SDK version, so verify it end to end: make an MCP tool call and check that the server's spans appear under your agent's trace.\n\n```python\nfrom opentelemetry.propagate import inject, extract\n\n# producer\ncarrier = {}\ninject(carrier)                                # {\"traceparent\": \"00-<trace>-<span>-01\"}\nawait enqueue(\"extract_memory\", {\"session_id\": sid, \"trace\": carrier})\n\n# consumer\nctx = extract(job.payload[\"trace\"])\nwith tracer.start_as_current_span(\"job extract_memory\", context=ctx):\n    ...\n```\n\n> [!warn] Third-party MCP servers you do not control will not send spans to your backend. Record a client-side span for every MCP call (server name, tool name, duration, error, response size) so you can at least see their latency and failures from your side.\n\n## What to capture, and what not to\n\nTraces are most useful when you can read the actual prompts and responses. They are also full of personal data. Decide deliberately:\n\n| Capture | Default |\n|---|---|\n| Model, tokens, latency, finish reason, step, tool names, errors | Always |\n| Prompt hash, model config, feature flags, deploy SHA | Always |\n| Full message content and tool arguments/results | In a restricted store with retention limits, or sampled, or redacted |\n| User identifiers | Hashed or pseudonymous IDs; raw only where policy allows |\n| Secrets, card numbers | Never (redact before export) |\n\nThe OTel GenAI conventions keep message content out of span attributes by default and make content capture opt-in, for this reason. Apply redaction in an exporter or processor, so it cannot be forgotten in application code.\n\n## Sampling\n\nHigh-volume systems cannot keep every trace. Typical policy:\n\n- **Head sampling** keeps a percentage chosen at the start of the request (for example 10%).\n- **Tail sampling** decides after the trace completes: keep **all** traces with errors, guardrail firings, step-limit hits, high cost, high latency, or negative user feedback, plus a random sample of the rest. Tail sampling needs a collector (the OTel Collector) that buffers spans per trace.\n\nFor AI systems, tail sampling is almost always worth it: the interesting traces are rare, and they are the ones you need for error analysis.\n\n## From traces to evals\n\nTraces are the raw material for Week 3's eval datasets. Make the path short:\n\n1. A user gives a thumbs-down, or an online judge fails a conversation.\n2. The trace ID is attached to that feedback.\n3. A reviewer opens the trace, labels the failure category, and clicks \"add to dataset\", which runs your trace-to-case converter.\n\nTools like Langfuse and Phoenix have dataset features for exactly this loop. You can also build it with a small script against your trace store.\n\n## Design review questions\n\n> [!interview] Open the trace for the slowest conversation yesterday. Which span dominated?\n\n> [!interview] When a worker processes a memory job, can you see which chat request caused it?\n\n> [!interview] Where does message content in traces go, who can read it, and when is it deleted?\n\n> [!interview] Which traces are guaranteed to be kept under your sampling policy?\n\n## Further reading\n\n- [OpenTelemetry semantic conventions for GenAI](https://github.com/open-telemetry/semantic-conventions-genai/tree/main/docs/gen-ai).\n- [OpenTelemetry Python](https://opentelemetry.io/docs/languages/python/) and [contrib instrumentations](https://github.com/open-telemetry/opentelemetry-python-contrib).\n- [OpenLLMetry](https://github.com/traceloop/openllmetry), OTel-based auto-instrumentation for LLM SDKs.\n- [Langfuse docs](https://langfuse.com/docs) and [Arize Phoenix](https://github.com/Arize-ai/phoenix), open-source LLM observability.\n- [Model Context Protocol](https://modelcontextprotocol.io/).\n\n```quiz\n[\n  {\"q\": \"What links all spans belonging to one user request?\", \"options\": [\"The session ID\", \"A shared trace ID, with parent-child relationships between spans\", \"Timestamps\", \"The model name\"], \"answer\": 1, \"why\": \"Spans share a trace ID and point to their parent, which builds the tree you navigate.\"},\n  {\"q\": \"How do spans in a background worker join the trace of the API request that enqueued the job?\", \"options\": [\"Automatically, always\", \"The producer injects trace context (traceparent) into the job payload and the worker extracts it\", \"By matching timestamps\", \"They cannot\"], \"answer\": 1, \"why\": \"Context propagation must cross every boundary, including queues, explicitly.\"},\n  {\"q\": \"Which sampling policy best fits AI systems?\", \"options\": [\"Keep 1% randomly\", \"Tail sampling that keeps all errors, guardrail firings, expensive, slow, or negatively rated traces plus a random sample\", \"Keep nothing\", \"Head sampling at 100%\"], \"answer\": 1, \"why\": \"The traces you need for debugging and eval building are rare. Tail sampling keeps them.\"},\n  {\"q\": \"A third-party MCP server you do not control is slow. How do you see it in your traces?\", \"options\": [\"You cannot\", \"Record a client-side span around each MCP call with server, tool, duration, and errors\", \"Ask the vendor for logs\", \"Use print statements\"], \"answer\": 1, \"why\": \"Even without their spans, your client span shows their latency and failure rate inside your trace.\"}\n]\n```\n"}, {"id": "w5-monitoring", "week": 5, "kind": "lesson", "title": "Monitoring errors, token usage, and user feedback", "short": "Monitoring cost + quality", "minutes": 45, "summary": "The metrics that tell you whether an AI system is healthy, affordable, and actually helping users, and how to collect explicit and implicit feedback and turn it into online evaluation.", "body": "\n## Three questions every dashboard answers\n\n1. **Is it working?** Errors, latency, availability, dependency health.\n2. **What does it cost?** Tokens, dollars, per user, per tenant, per feature.\n3. **Is it any good?** Quality signals from users, judges, and outcomes.\n\nTraditional services stop at the first. AI systems fail quietly on the second and third: a prompt change that makes answers 30% longer doubles the bill without a single error; a retrieval regression makes answers worse with every request returning 200 OK.\n\n## Golden signals, adapted\n\nThe classic four (latency, traffic, errors, saturation, from Google's [SRE book](https://sre.google/sre-book/monitoring-distributed-systems/)) still apply, with AI-specific detail:\n\n| Signal | What to track | Why |\n|---|---|---|\n| Latency | TTFT p50/p95, total turn time p50/p95, per-stage (retrieval, model, tools) | Users feel TTFT; total time affects abandonment |\n| Traffic | Conversations, turns, model calls per turn, by route and model | Calls-per-turn growth is often a looping or prompt bug |\n| Errors | HTTP 5xx; provider errors by type (429, 5xx, overloaded, timeouts); tool errors by tool; refusals; step-limit hits; guardrail blocks | Many AI failures are not exceptions |\n| Saturation | Provider rate-limit headroom (tokens/min used vs limit), worker queue depth and age, DB connections | Rate limits are the usual bottleneck |\n\n## Token and cost monitoring\n\nRecord usage on every model call (you already have it in spans): model, input tokens, cached input tokens, output tokens, and the feature, user, and tenant it served. Compute cost from a price table versioned in your repo.\n\n```python\nPRICES = {  # USD per million tokens, from the provider's pricing page (checked 2026-10-14)\n    \"claude-opus-5-5\":   {\"in\": 4.00, \"cache_write\": 5.00,  \"cache_read\": 0.20, \"out\": 20.00},\n    \"claude-sonnet-5-5\": {\"in\": 2.00, \"cache_write\": 2.50,  \"cache_read\": 0.10, \"out\": 10.00},\n    \"claude-haiku-5-5\":  {\"in\": 0.10, \"cache_write\": 0.125, \"cache_read\": 0.01, \"out\": 0.50},  # prompts ≤100k tokens\n}\n\ndef cost_usd(model, usage) -> float:\n    p = PRICES[model]\n    # The three input counts are disjoint: input_tokens is only the uncached part.\n    return (usage.input_tokens * p[\"in\"]\n            + (usage.cache_creation_input_tokens or 0) * p[\"cache_write\"]   # 5-minute writes\n            + (usage.cache_read_input_tokens or 0) * p[\"cache_read\"]\n            + usage.output_tokens * p[\"out\"]) / 1e6\n```\n\n> [!warn] Check exactly how your provider reports cached tokens and cache writes. On the Claude API, `input_tokens`, `cache_creation_input_tokens`, and `cache_read_input_tokens` are separate counts that add up to the total input. Cache writes cost more than normal input (1.25x for 5-minute, 2x for 1-hour caches), and Haiku 5.5 charges higher rates when a prompt exceeds 100,000 tokens. Getting this wrong makes your cost dashboards disagree with the invoice, and nobody trusts a dashboard that disagrees with the invoice. Reconcile against the provider's usage report monthly.\n\nDashboards to build:\n\n- **Cost per conversation** (p50, p95, max) over time, by route and model. The single most useful AI cost chart.\n- **Tokens per turn**, split into input, cached input, and output. Rising input means context bloat; rising output means verbosity.\n- **Cache hit rate** (cached input / total input). A sudden drop means a prefix change broke caching.\n- **Spend by tenant and by feature**, for pricing and abuse detection.\n- **Top 20 most expensive conversations** this week, linked to their traces. Read them. They are usually loops, huge tool results, or abuse.\n\n> [!numbers] Relay's p50 conversation costs $0.012 but p99 costs $0.85. The top 1% of conversations is about 0.01 × 0.85 / (0.99 × 0.012 + 0.01 × 0.85) ≈ **42% of total spend** (using p99 as a rough stand-in for the tail). Fixing the tail (step limits, result truncation, compaction) often saves more than optimising the median.\n\n## Quality monitoring\n\n### Explicit feedback\n\nThumbs up/down, star ratings, \"report a problem\". Cheap to add, but:\n\n- Response rates are low (often 1 to 5%) and skewed toward unhappy users.\n- A thumbs-down without a reason is hard to act on. Offer quick reason chips (\"wrong info\", \"didn't do what I asked\", \"too long\", \"unsafe\") and an optional comment.\n- Always store the trace ID with feedback.\n\n### Implicit feedback\n\nBehaviour tells you more, more often:\n\n| Signal | Suggests |\n|---|---|\n| User rephrases the same question | The answer missed |\n| User asks for a human / escalation rate | The agent could not resolve it |\n| Conversation abandoned mid-flow | Frustration or slowness |\n| Copy or click on a cited source | The answer was useful |\n| Repeat contact on the same order within 48 hours | The issue was not actually resolved |\n| Refund reversed or approval rejected by staff | The agent proposed a wrong action |\n\nDefine a **resolution rate**: the share of conversations that end without escalation and without repeat contact within N days. It is a better north-star metric for a support agent than thumbs-up rate.\n\n### Online evaluation\n\nRun your Week 3 judges on a sample of live conversations (for example 5%, plus all conversations with negative signals). Chart judge pass rates per category over time. A drop after a deploy is a regression; a slow drift may mean user behaviour or the knowledge base changed.\n\n```mermaid\nflowchart LR\n  P[Production traces] --> S{Sampler:<br/>5% random +<br/>all negative signals}\n  S --> J[Online judges]\n  J --> D[Dashboards:<br/>pass rate by category]\n  J -->|fail| RQ[Review queue]\n  RQ --> L[Human label + category]\n  L --> DS[(Eval dataset)]\n  L --> JC[Judge calibration data]\n```\n\nHuman review of the review queue keeps judges honest and turns production failures into eval cases. Budget a few hours a week for it. This loop is where most quality improvement comes from after launch.\n\n## Error tracking\n\nUse an error tracker (for example [Sentry](https://docs.sentry.io/), which has a free tier) for exceptions with stack traces, grouped and deduplicated. Tag errors with model, prompt SHA, route, and trace ID. Many AI \"errors\" are not exceptions (a refusal, a guardrail block, a step-limit hit, a malformed tool argument the model retried), so emit them as **metrics and structured events** too.\n\n## Metrics plumbing\n\nA simple, standard stack: OTel metrics (or Prometheus client) → [Prometheus](https://prometheus.io/docs/introduction/overview/) or your cloud's metrics service → [Grafana](https://grafana.com/docs/grafana/latest/) dashboards. LLM observability platforms (Langfuse, Phoenix, and commercial ones) give you token, cost, and feedback views out of the box from traces. Many teams use both: infrastructure metrics in Grafana, conversation-level analytics in an LLM tool.\n\nWatch **cardinality**: do not put user IDs or session IDs as metric labels (millions of series). Put them on traces and events; keep metric labels to bounded sets like route, model, tool, and tenant tier.\n\n## A Relay dashboard\n\n| Row | Panels |\n|---|---|\n| Health | Requests/min, 5xx rate, provider error rate by type, TTFT p95, turn p95 |\n| Cost | $/hour, $/conversation p50/p95/p99, cache hit rate, tokens/turn split, spend by tenant |\n| Agent behaviour | Steps per turn histogram, step-limit hits, tool calls by tool, tool error rate, guardrail fires by guardrail |\n| Quality | Online judge pass rate by category, resolution rate, escalation rate, thumbs-down rate, review queue size |\n| Capacity | Rate-limit headroom per model, queue depth and age, DB connections, instance count |\n\n## Design review questions\n\n> [!interview] What did the most expensive conversation yesterday cost, and why?\n\n> [!interview] How would you notice a 10-point drop in answer quality that throws no errors?\n\n> [!interview] What is your resolution rate, and how is it defined?\n\n> [!interview] Does your cost dashboard match last month's invoice within 5%?\n\n## Further reading\n\n- [Monitoring Distributed Systems](https://sre.google/sre-book/monitoring-distributed-systems/), Google SRE book.\n- [Building A Generative AI Platform](https://huyenchip.com/2024/07/25/genai-platform.html), Chip Huyen. The observability and feedback sections.\n- [Langfuse docs](https://langfuse.com/docs) for cost tracking, scores, and datasets.\n- [Arize Phoenix](https://github.com/Arize-ai/phoenix) for open-source tracing and online evals.\n- [Prometheus overview](https://prometheus.io/docs/introduction/overview/) and [Grafana docs](https://grafana.com/docs/grafana/latest/).\n\n```quiz\n[\n  {\"q\": \"Average input tokens per turn rose 40% after a release while error rates stayed flat. What is the likely issue?\", \"options\": [\"Traffic growth\", \"Context bloat: larger prompts, tool results, or history, or broken compaction\", \"The provider raised prices\", \"Users typing more\"], \"answer\": 1, \"why\": \"Input growth per turn points to what you put in the context. Check prompt size, tool result size, and compaction.\"},\n  {\"q\": \"Why is resolution rate a better north-star than thumbs-up rate for a support agent?\", \"options\": [\"It is easier to compute\", \"It measures whether the problem was actually solved, from behaviour on all conversations rather than a small, skewed sample\", \"Users prefer it\", \"It is always higher\"], \"answer\": 1, \"why\": \"Explicit feedback is sparse and biased. Outcome-based metrics reflect real value.\"},\n  {\"q\": \"Why not use user IDs as metric labels?\", \"options\": [\"Privacy only\", \"Unbounded label values create huge numbers of time series and overwhelm the metrics system\", \"Prometheus forbids strings\", \"They are not useful\"], \"answer\": 1, \"why\": \"High cardinality explodes metric storage. Keep per-user detail in traces and events.\"},\n  {\"q\": \"Your cache hit rate dropped from 80% to 5% overnight. What should you check first?\", \"options\": [\"Provider status page\", \"Recent changes to anything at the start of the prompt: system prompt, tool definitions, or their ordering\", \"User traffic\", \"Database indexes\"], \"answer\": 1, \"why\": \"Cache hits depend on byte-identical prefixes. A small change near the top invalidates everything after it.\"}\n]\n```\n"}, {"id": "w5-scaling", "week": 5, "kind": "lesson", "title": "Caching, rate limits, and async execution", "short": "Caching, limits, async", "minutes": 55, "summary": "The levers that make an AI system faster and cheaper at scale, prompt caching, response caching, model routing, batching, concurrency control, retries, and fallbacks, and the trade-offs of each.", "body": "\n## The scaling problem is usually upstream\n\nYour API can scale horizontally almost without limit. Your model provider cannot, at least not for you: you have rate limits on requests per minute and tokens per minute per model, and latency you do not control. Scaling an AI system is mostly about **using fewer tokens, using cheaper tokens, and using your quota well**.\n\nThe levers, roughly in order of payoff per unit of effort:\n\n| Lever | Saves | Effort | Risk |\n|---|---|---|---|\n| Prompt caching | Input cost (90 to 95% off the cached part), TTFT | Low | Low |\n| Trimming context (tool results, history) | Input cost, latency | Low to medium | Medium (quality) |\n| Shorter outputs | Output cost, latency | Low | Low to medium |\n| Model routing (small model for easy traffic) | Cost, latency | Medium | Medium (quality) |\n| Exact-match response caching | Everything, for repeats | Low | Low |\n| Semantic caching | Everything, for near-repeats | Medium | High (wrong answers, leaks) |\n| Batch API for offline work | ~50% on batch jobs | Low | None for offline |\n| Lower effort / thinking settings | Cost, latency | Low | Medium (quality) |\n\n## Prompt caching\n\nProviders cache the processed state of a prompt **prefix**. When the next request starts with the same bytes, those tokens are read from cache at a steep discount and with lower latency. For agents, where every loop iteration resends the system prompt, tools, and history, this is the most important cost lever. See the [prompt caching docs](https://platform.claude.com/docs/en/build-with-claude/prompt-caching) for exact rules.\n\nHow to get high hit rates:\n\n- **Stable prefix first.** System prompt and tool definitions identical across all users and requests. No timestamps, names, or request IDs in them.\n- **Deterministic serialisation.** Sort tools; serialise JSON with sorted keys.\n- **Append, do not rewrite.** Each turn appends to the message list, so the previous turn's whole context is a cached prefix of the next request.\n- **Put cache breakpoints** where your provider requires them (for example on the system prompt and the last message), or use automatic caching where offered.\n- **Mind the TTL.** The default cache lifetime is 5 minutes, refreshed each time it is read. A 1-hour option costs 2x base input to write instead of 1.25x. Long pauses between turns lose a 5-minute cache.\n- **Mind minimum sizes.** Prefixes shorter than the model's minimum (512 tokens on current Claude models, more on some older ones) are silently not cached.\n\n> [!numbers] An agent turn with 12,000 prefix tokens (system + tools + history) and 3 loop iterations, on Sonnet 5.5. Prices per million tokens: $2 input, $2.50 for a 5-minute cache write (1.25x), $0.10 for a cache read (0.05x). Without caching: 3 × 12,000 × $2 / 1e6 = **$0.072**. With caching, the first call writes the prefix and the next two read it: 12,000 × $2.50 / 1e6 + 2 × 12,000 × $0.10 / 1e6 = $0.030 + $0.0024 = **$0.032** (ignoring the small per-step growth). The write premium is paid back after a single read, and across a long conversation the savings compound as history grows.\n\n## Response caching\n\n### Exact-match caching\n\nHash the full normalised request (model, prompt version, system, messages, tools, parameters) and cache the response. Hit rates are low for chat, but high for:\n\n- Deterministic pipeline steps (classifying the same product description, summarising the same document).\n- Embeddings of the same text (always cache these).\n- Repeated eval runs and judge calls.\n\n### Semantic caching\n\nEmbed the user's question; if a previous question is within a similarity threshold, return its answer. Tools like [GPTCache](https://github.com/zilliztech/GPTCache) and Redis vector search implement this. It is tempting and dangerous:\n\n- \"Can I return a used tent?\" and \"Can I return an unused tent?\" are very similar embeddings with opposite answers.\n- Answers depend on context the cache key may not include: the user's orders, permissions, conversation history, today's date, the current policy version.\n- A cross-user hit can **leak** one user's personalised or permission-restricted answer to another.\n\n> [!rule] Only semantic-cache answers that are generic (no user data, no permissions, no history), include the knowledge-base version and permission scope in the key, use a strict threshold validated on labelled pairs, and expire entries when the underlying documents change.\n\nFor most agents, semantic caching of final answers is not worth the risk. Caching **retrieval results** or **query rewrites** for popular queries is safer and still saves latency.\n\n## Model routing and cascades\n\nSend each request to the cheapest model that can handle it:\n\n- **Classifier routing**: a small model (or a fine-tuned classifier) labels the intent and difficulty, and a rule picks the model and toolset.\n- **Cascades**: try a small model first; if a confidence check or validator fails, escalate to a larger model. Works well when failures are detectable (schema validation, a judge, tool errors).\n\nMeasure routing with evals: the routed system must hold quality on every category, not only on average. Also measure the simpler alternative first: a capable model at a lower effort setting may match a cascade with less complexity and one cache namespace (caches are per model, so routing between models reduces cache reuse).\n\n## Rate limits: yours and theirs\n\n### Respecting provider limits\n\nProviders enforce limits per minute on requests and tokens. Exceeding them returns `429`. Design for it:\n\n- **Client-side throttling.** Keep a shared token bucket (in Redis) per model that tracks tokens per minute across all instances, and make callers wait for capacity rather than firing and failing.\n- **Retry with exponential backoff and jitter** on 429, 5xx, overloaded, and timeouts, honouring the `retry-after` header. Jitter prevents synchronised retry storms. See AWS's [Timeouts, retries and backoff with jitter](https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/).\n- **Cap retries and total time.** A user-facing request should give up (and fall back) within its latency budget.\n- **Prioritise.** Interactive traffic gets first claim on quota; batch work uses what is left, or the batch API.\n\n```python\nimport random, asyncio\nimport anthropic\n\nRETRYABLE = (anthropic.RateLimitError, anthropic.InternalServerError, anthropic.APIConnectionError, anthropic.APITimeoutError)\n\nasync def call_with_retry(fn, *, attempts=4, base=0.5, cap=8.0, deadline_s=20.0):\n    start = asyncio.get_running_loop().time()\n    for i in range(attempts):\n        try:\n            return await fn()\n        except RETRYABLE as e:\n            retry_after = getattr(getattr(e, \"response\", None), \"headers\", {}).get(\"retry-after\")\n            delay = float(retry_after) if retry_after else random.uniform(0, min(cap, base * 2 ** i))  # full jitter\n            if i == attempts - 1 or asyncio.get_running_loop().time() - start + delay > deadline_s:\n                raise\n            await asyncio.sleep(delay)\n```\n\n(The official SDKs already retry some errors by default. Know what your client does so you do not multiply retries: two layers of 3 retries is 16 attempts.)\n\n### Your own limits\n\nPer-user and per-tenant limits (Week 4) protect your quota from one customer. Tie them to plans: free users get a small model and low limits; paying tenants get more.\n\n## Async execution and concurrency\n\n- **Async I/O everywhere** on the request path: model client, database driver, HTTP clients. One blocking call in an async server stalls every request on that worker.\n- **Parallelise independent work**: retrieval and input guardrails concurrently; parallel tool calls; multi-query retrieval.\n- **Bound concurrency** with semaphores so a burst does not open 5,000 simultaneous model calls.\n- **Stream** to cut perceived latency: users see the first tokens in under a second even if the full answer takes six.\n- **Move non-urgent work off the path**: memory, analytics, online judging, all in workers.\n- **Speculate carefully**: start retrieval while the router is still classifying; discard if not needed. Costs a little, saves hundreds of milliseconds.\n\n## Batch processing\n\nWork that does not need an immediate answer, such as nightly evals, back-filling contextual chunk descriptions, re-classifying old tickets, or generating synthetic data, should use the provider's **batch API**: submit many requests, get results within hours, typically at about half price, and on separate capacity from your interactive traffic.\n\n## Fallbacks and graceful degradation\n\nWhen the primary model is rate-limited or down:\n\n1. Retry briefly (above).\n2. Fall back to another model or another provider region. Abstraction layers such as [LiteLLM](https://docs.litellm.ai/docs/) can route across providers, but every fallback model must be in your eval suite: behaviour, tool calling, and refusals differ.\n3. Degrade features: turn off optional steps (reranking, query rewriting) to save time; serve cached FAQ answers for common questions; offer a human handoff.\n4. Fail clearly: \"Our assistant is busy, here is how to reach support\" beats a spinner.\n\nWrap provider calls in a **circuit breaker** ([Fowler](https://martinfowler.com/bliki/CircuitBreaker.html)): after N consecutive failures, stop calling for a cool-down period and go straight to the fallback, instead of making every user wait for timeouts.\n\n## Design review questions\n\n> [!interview] What is your cache hit rate, and what is the cost per conversation with and without caching?\n\n> [!interview] Show me two questions your semantic cache would wrongly treat as the same. Why is that safe or unsafe?\n\n> [!interview] At what traffic level do you hit the provider's token-per-minute limit, and what happens to the next user?\n\n> [!interview] How many total attempts can a single model call make, counting SDK retries and your own?\n\n## Further reading\n\n- [Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching), Claude Platform docs.\n- [Timeouts, retries, and backoff with jitter](https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/), Amazon Builders' Library.\n- [Exponential backoff and jitter](https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/), AWS Architecture Blog.\n- [Circuit Breaker](https://martinfowler.com/bliki/CircuitBreaker.html), Martin Fowler.\n- [LLM numbers every developer should know](https://github.com/ray-project/llm-numbers), Anyscale (dated prices, still useful ratios).\n- [Artificial Analysis](https://artificialanalysis.ai/) for independent latency and price comparisons across models.\n\n```quiz\n[\n  {\"q\": \"Why does appending (not rewriting) the conversation each turn matter for cost?\", \"options\": [\"It uses less storage\", \"The previous request becomes a byte-identical prefix of the next one, so it is served from the prompt cache\", \"Providers require it\", \"It shortens outputs\"], \"answer\": 1, \"why\": \"Prefix caching needs identical leading bytes. Rewriting history invalidates the cache from the first changed byte.\"},\n  {\"q\": \"Which item is safest to semantic-cache?\", \"options\": [\"Personalised order answers\", \"Generic policy answers keyed with KB version, with a strict validated threshold\", \"Answers that depend on conversation history\", \"Refund decisions\"], \"answer\": 1, \"why\": \"Only context-free, permission-free answers are candidates, and the key must capture what the answer depends on.\"},\n  {\"q\": \"Why add jitter to exponential backoff?\", \"options\": [\"To make retries faster\", \"To spread retries out so many clients do not retry in synchronised waves\", \"Providers require it\", \"To reduce token use\"], \"answer\": 1, \"why\": \"Without jitter, clients that failed together retry together, recreating the overload.\"},\n  {\"q\": \"Your SDK retries 3 times by default and your wrapper retries 3 times around it. How many attempts can one call make?\", \"options\": [\"3\", \"6\", \"9\", \"16\"], \"answer\": 3, \"why\": \"Each of 4 wrapper attempts (1 + 3 retries) makes up to 4 SDK attempts: 4 × 4 = 16. Know your layers.\"},\n  {\"q\": \"What does a circuit breaker do for a failing provider?\", \"options\": [\"Retries faster\", \"After repeated failures, stops calling it for a cool-down and goes straight to the fallback\", \"Caches all responses\", \"Switches off logging\"], \"answer\": 1, \"why\": \"It avoids making every request wait for timeouts while the dependency is down.\"}\n]\n```\n"}, {"id": "w5-inference", "week": 5, "kind": "lesson", "title": "LLM inference for system designers", "short": "Inference internals", "minutes": 45, "summary": "What happens inside a model server between request and response, so you can explain why a chatbot is slow, size a self-hosted deployment, and judge techniques like KV caching, batching, quantization, and speculative decoding.", "body": "\n## Why a system designer needs this\n\nYou can build everything in this course on hosted APIs and never touch a GPU. But two questions come up in every design review and interview, and both need a mental model of inference:\n\n1. **\"Why is the chatbot so slow?\"** The answer is rarely \"the model is slow\". It is usually something you control.\n2. **\"Should we self-host an open model?\"** You cannot answer without knowing what limits a GPU's throughput and what one conversation costs in memory.\n\nThis lesson gives you that model, with numbers you can reproduce.\n\n## Two phases: prefill and decode\n\nGenerating a reply has two very different phases.\n\n```mermaid\nflowchart LR\n  P[Prompt tokens] --> PF[Prefill<br/>all prompt tokens in parallel<br/>compute-bound]\n  PF --> KV[(KV cache<br/>keys and values<br/>for every token)]\n  KV --> D1[Decode token 1] --> D2[Decode token 2] --> D3[... token N<br/>one at a time<br/>memory-bandwidth-bound]\n  D1 & D2 & D3 -.read.-> KV\n```\n\n- **Prefill** processes the whole prompt in one parallel pass and fills the KV cache. It is limited by raw compute, and its time grows with prompt length. It determines **time to first token** (TTFT).\n- **Decode** generates one token at a time. Each step must read all the model weights (and the KV cache so far) from GPU memory to produce a single token. It is limited by **memory bandwidth**, not compute, and its time grows with output length.\n\n> [!numbers] An 8-billion-parameter model in 16-bit precision has about 8B × 2 bytes = **16 GB** of weights. A current datacenter GPU reads memory at roughly 3 TB/s, so one decode step at batch size 1 takes at least 16 GB ÷ 3 TB/s ≈ **5 ms**, a ceiling of about 200 tokens per second for one user. The GPU's compute sits mostly idle. Serving many users at once is how you use it.\n\n## The KV cache\n\nDuring attention, every new token looks at the keys and values of all previous tokens. Recomputing them at every step would be wasteful, so servers keep them in a **KV cache**. It makes decoding fast, and it is the main consumer of GPU memory under load.\n\nPer token, the cache holds: 2 (keys and values) × layers × KV heads × head dimension × bytes per value.\n\n> [!numbers] A Llama-3-8B-shaped model: 32 layers, 8 KV heads (grouped-query attention), head dimension 128, 16-bit values. Per token: 2 × 32 × 8 × 128 × 2 bytes = **128 KB**. One 8,000-token conversation: about **1 GB**. On an 80 GB GPU holding 16 GB of weights, roughly 60 GB is left for caches, so about 60 such conversations fit at once. Without grouped-query attention (32 KV heads instead of 8), each token needs 512 KB and only about 15 conversations fit.\n\nThis is why long contexts are expensive even when a provider accepts a million tokens. A long conversation occupies memory for its whole life, which limits how many others can be served alongside it. Hugging Face's [Optimizing your LLM in production](https://huggingface.co/blog/optimize-llm) walks through the same arithmetic, including how multi-query and grouped-query attention shrink the cache.\n\n## Batching: where throughput comes from\n\nBecause decode is bandwidth-bound, a server that reads the weights once can produce one token for *many* sequences at the same cost. Batching is therefore the main lever for throughput.\n\n- **Static batching** waits to fill a batch and runs it until the longest sequence finishes. Short requests wait for long ones.\n- **Continuous batching** adds and removes sequences at every decode step, so the GPU stays full and short requests leave early. Every modern server does this.\n- **PagedAttention** (the technique behind [vLLM](https://docs.vllm.ai/en/latest/)) stores the KV cache in fixed-size pages, like virtual memory, which removes fragmentation and lets requests share cached prefixes. The [vLLM paper](https://arxiv.org/abs/2309.06180) reports 2 to 4 times higher throughput than earlier systems at the same latency.\n\nThe trade-off: larger batches raise total throughput but make each step slightly slower, so per-user tokens per second fall. Servers let you tune this against your latency target.\n\n## Making each token cheaper\n\n| Technique | What it does | Typical effect | Cost |\n|---|---|---|---|\n| Quantization (8-bit, 4-bit) | Stores weights in fewer bits | Weights shrink 2 to 4 times; faster decode, more room for KV cache | Some quality loss; must evaluate |\n| Grouped-query attention | Fewer KV heads shared by query heads | KV cache shrinks several times | A model architecture choice, not a runtime switch |\n| FlashAttention | Computes attention without materialising the full attention matrix | Less memory, faster on long prompts | None; it is the default in modern stacks |\n| Prefix caching | Reuses the KV cache for a shared prompt prefix | Skips prefill for repeated system prompts and history | Memory to hold cached prefixes |\n| Speculative decoding | A small draft model proposes several tokens; the large model checks them in one pass | The [original paper](https://arxiv.org/abs/2211.17192) reports 2 to 3 times faster decoding with **identical outputs** | A draft model to run; gains depend on how often drafts are accepted |\n\nProvider-side prompt caching (Week 5) is prefix caching sold as an API feature: you are paying less because the provider skips prefill for your repeated prefix.\n\n## Why is the chatbot so slow? A diagnostic order\n\nWhen users complain about speed, check these in order. Most are not about the model.\n\n1. **No streaming.** Users stare at a spinner for the whole generation. Stream, and perceived latency drops to TTFT.\n2. **Too many sequential model calls.** A router, a query rewrite, three agent steps, and an output judge are six round trips in a row. Trace a slow request (Week 5) and count them. Parallelise or remove steps.\n3. **Long outputs.** Decode time is proportional to output tokens. Ask for shorter answers.\n4. **Long prompts without caching.** TTFT grows with uncached prompt length. Check your cache hit rate.\n5. **Reasoning tokens.** Models that think before answering spend output tokens you do not see. Lower the effort setting on routes that do not need it.\n6. **Slow tools.** A 3-second inventory API inside an agent loop is a 3-second delay per call. Add timeouts and caching.\n7. **Queueing.** Hitting rate limits means waiting for capacity. Check 429 rates and client-side throttles.\n8. **Model size.** Only now: a smaller model on easy routes.\n\n> [!tip] Put TTFT and total turn time on the same dashboard, broken down by span: router, retrieval, each model call, each tool. The slow part is usually obvious within a minute of looking.\n\n## API or self-host?\n\n| Factor | Hosted API | Self-hosted open model |\n|---|---|---|\n| Quality | Frontier models | Strong but usually behind the frontier |\n| Cost at low or spiky volume | Pay per token, scale to zero | Idle GPUs cost money around the clock |\n| Cost at very high, steady volume | Can be expensive | Can be cheaper if GPUs stay busy |\n| Data control | Provider terms, regions, zero-retention options | Full control |\n| Latency control | Limited | Full (batch size, hardware, placement) |\n| Operational burden | Low | High: GPUs, serving stack, upgrades, on-call |\n\nA rough break-even test: estimate your monthly tokens, price them on the API, then price the GPUs needed at a realistic utilisation (often 30 to 60%, not 100%) plus the engineering time to run them. For most teams building products, the API wins until volume is large and steady, or a data constraint forces the decision.\n\n## Design review questions\n\n> [!interview] Walk me through where the time goes in your slowest p95 turn. How many sequential model calls are there?\n\n> [!interview] How much KV cache does one of your longest conversations need, and how many fit on one GPU?\n\n> [!interview] What would speculative decoding change for your users, and what would it not change?\n\n> [!interview] At what monthly volume would self-hosting be cheaper than your API bill, including people?\n\n## Further reading\n\n- [Optimizing your LLM in production](https://huggingface.co/blog/optimize-llm), Hugging Face. Quantization, FlashAttention, KV cache, and grouped-query attention with worked numbers.\n- [Efficient Memory Management for LLM Serving with PagedAttention](https://arxiv.org/abs/2309.06180), the vLLM paper.\n- [Fast Inference from Transformers via Speculative Decoding](https://arxiv.org/abs/2211.17192).\n- [vLLM documentation](https://docs.vllm.ai/en/latest/), the most widely used open-source serving engine.\n- [Artificial Analysis](https://artificialanalysis.ai/), for measured TTFT and tokens per second across hosted models.\n\n```quiz\n[\n  {\"q\": \"Which phase of generation is limited mainly by memory bandwidth?\", \"options\": [\"Prefill\", \"Decode\", \"Tokenization\", \"Embedding lookup\"], \"answer\": 1, \"why\": \"Each decode step reads all weights and the KV cache to produce one token, so bandwidth, not compute, is the limit.\"},\n  {\"q\": \"A model has 32 layers, 8 KV heads, head dimension 128, 16-bit values. How much KV cache does a 4,000-token conversation need?\", \"options\": [\"About 50 MB\", \"About 500 MB\", \"About 5 GB\", \"About 50 GB\"], \"answer\": 1, \"why\": \"2 × 32 × 8 × 128 × 2 bytes = 128 KB per token; × 4,000 ≈ 512 MB.\"},\n  {\"q\": \"Why does batching raise throughput so much for LLM serving?\", \"options\": [\"It reduces output length\", \"One read of the weights produces a token for many sequences at once\", \"It skips prefill\", \"It compresses the KV cache\"], \"answer\": 1, \"why\": \"Decode is bandwidth-bound; batching amortises the cost of reading the weights across many sequences.\"},\n  {\"q\": \"What does speculative decoding change about the model's outputs?\", \"options\": [\"They become shorter\", \"Nothing; the output distribution is identical, it is only faster\", \"They come from the small draft model\", \"They skip the KV cache\"], \"answer\": 1, \"why\": \"The large model verifies every drafted token, so outputs match standard decoding while several tokens can be accepted pe
