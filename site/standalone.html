5) covers LLM internals, optimisations, and reasoning.\n- [Krish Naik's Agentic AI roadmap](https://github.com/krishnaik06/Roadmap-To-Learn-Agentic-AI): free YouTube playlists for LangChain, LangGraph, MCP, CrewAI, and AutoGen. Strongest for breadth across frameworks.\n- [LangChain Academy](https://academy.langchain.com/) for LangGraph, and [DeepLearning.AI short courses](https://www.deeplearning.ai/short-courses/) for one-to-two-hour introductions to specific tools.\n\n## Foundations\n\n- ★ [Intro to Large Language Models](https://www.youtube.com/watch?v=zjkBMFhNj_g), Andrej Karpathy. One hour, the best mental model of what an LLM is.\n- ★ [Building A Generative AI Platform](https://huyenchip.com/2024/07/25/genai-platform.html), Chip Huyen. A reference architecture for everything in this course.\n- [AI Engineering book resources](https://github.com/chiphuyen/aie-book), Chip Huyen's companion repo.\n- ★ [What We Learned from a Year of Building with LLMs](https://applied-llms.org/), practitioners' lessons across tactics, operations, and strategy.\n- [Patterns for Building LLM-based Systems & Products](https://eugeneyan.com/writing/llm-patterns/), Eugene Yan.\n- [Emerging Patterns in Building GenAI Products](https://martinfowler.com/articles/gen-ai-patterns/), martinfowler.com.\n- [LLM Course](https://github.com/mlabonne/llm-course), Maxime Labonne. A roadmap for deeper ML background.\n- [System Design Primer](https://github.com/donnemartin/system-design-primer), for general distributed systems design.\n\n## Agents and context\n\n- ★ [Building effective agents](https://www.anthropic.com/engineering/building-effective-agents), Anthropic.\n- [How we built our multi-agent research system](https://www.anthropic.com/engineering/multi-agent-research-system), Anthropic.\n- [Don't build multi-agents](https://cognition.ai/blog/dont-build-multi-agents), Cognition.\n- ★ [Effective context engineering for AI agents](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents), Anthropic.\n- [Writing effective tools for agents](https://www.anthropic.com/engineering/writing-tools-for-agents), Anthropic.\n- [Context Engineering for Agents](https://rlancemartin.github.io/2025/06/23/context_engineering/), Lance Martin.\n- [The New Skill in AI is Context Engineering](https://www.philschmid.de/context-engineering), Philipp Schmid.\n- [Context Rot](https://www.trychroma.com/research/context-rot), Chroma research.\n- [12-factor agents](https://github.com/humanlayer/12-factor-agents), HumanLayer.\n- [LLM Powered Autonomous Agents](https://lilianweng.github.io/posts/2023-06-23-agent/), Lilian Weng.\n- [ReAct](https://arxiv.org/abs/2210.03629), [MemGPT](https://arxiv.org/abs/2310.08560), [Generative Agents](https://arxiv.org/abs/2304.03442), [CoALA](https://arxiv.org/abs/2309.02427): foundational papers.\n- [LangGraph memory overview](https://docs.langchain.com/oss/python/langgraph/memory).\n- Open-source memory layers to study: [Mem0](https://github.com/mem0ai/mem0), [Letta](https://github.com/letta-ai/letta), [Graphiti](https://github.com/getzep/graphiti).\n- Free courses: [Hugging Face Agents Course](https://huggingface.co/learn/agents-course), [AI Agents for Beginners](https://github.com/microsoft/ai-agents-for-beginners).\n\n## Retrieval\n\n- ★ [Contextual Retrieval](https://www.anthropic.com/engineering/contextual-retrieval), Anthropic.\n- ★ [Systematically Improving Your RAG](https://jxnl.co/writing/2024/05/22/systematically-improving-your-rag/), Jason Liu.\n- [pgvector](https://github.com/pgvector/pgvector) and [pgvector-python](https://github.com/pgvector/pgvector-python).\n- [HNSW explained](https://www.pinecone.io/learn/series/faiss/hnsw/), Pinecone, and the [HNSW paper](https://arxiv.org/abs/1603.09320).\n- [Hybrid search explained](https://weaviate.io/blog/hybrid-search-explained), Weaviate.\n- [Reciprocal Rank Fusion](https://plg.uwaterloo.ca/~gvcormac/cormacksigir09-rrf.pdf), the original paper.\n- [Retrieve and re-rank](https://sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html), Sentence-Transformers.\n- [MTEB leaderboard](https://huggingface.co/spaces/mteb/leaderboard) for embedding models.\n- [Qdrant filtering](https://qdrant.tech/documentation/concepts/filtering/) and [Postgres full-text search](https://www.postgresql.org/docs/current/textsearch.html).\n- [Docling](https://github.com/docling-project/docling) for document parsing.\n- Papers: [RAG](https://arxiv.org/abs/2005.11401), [Lost in the Middle](https://arxiv.org/abs/2307.03172), [HyDE](https://arxiv.org/abs/2212.10496), [RAPTOR](https://arxiv.org/abs/2401.18059), [ColBERT](https://arxiv.org/abs/2004.12832), [RAG survey](https://arxiv.org/abs/2312.10997), [Financial report chunking](https://arxiv.org/abs/2402.05131).\n- Authorization: [OpenFGA](https://openfga.dev/) and the [Zanzibar paper](https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/).\n\n## Evals\n\n- ★ [Your AI Product Needs Evals](https://hamel.dev/blog/posts/evals/), Hamel Husain.\n- ★ [AI Evals FAQ](https://hamel.dev/blog/posts/evals-faq/), Hamel Husain and Shreya Shankar.\n- [Creating a LLM-as-a-Judge That Drives Business Results](https://hamel.dev/blog/posts/llm-judge/), Hamel Husain.\n- [Evaluating the Effectiveness of LLM-Evaluators](https://eugeneyan.com/writing/llm-evaluators/), Eugene Yan.\n- ★ [Demystifying evals for AI agents](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents), Anthropic.\n- Papers: [τ-bench](https://arxiv.org/abs/2406.12045), [Judging LLM-as-a-Judge](https://arxiv.org/abs/2306.05685), [Who Validates the Validators?](https://arxiv.org/abs/2404.12272), [RAGAS](https://arxiv.org/abs/2309.15217), [AgentBench](https://arxiv.org/abs/2308.03688).\n- Tools: [promptfoo](https://github.com/promptfoo/promptfoo), [Inspect](https://inspect.aisi.org.uk/), [DeepEval](https://github.com/confident-ai/deepeval), [RAGAS](https://docs.ragas.io/), [τ-bench code](https://github.com/sierra-research/tau-bench), [OpenAI evals](https://github.com/openai/evals).\n\n## Security\n\n- ★ [The lethal trifecta](https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/), Simon Willison, and his [prompt injection series](https://simonwillison.net/series/prompt-injection/).\n- [The Dual LLM pattern](https://simonwillison.net/2023/Apr/25/dual-llm-pattern/), Simon Willison.\n- ★ [Design Patterns for Securing LLM Agents against Prompt Injections](https://arxiv.org/abs/2506.08837).\n- [Defeating Prompt Injections by Design (CaMeL)](https://arxiv.org/abs/2503.18813).\n- [Indirect prompt injection](https://arxiv.org/abs/2302.12173), Greshake et al.\n- [OWASP Top 10 for LLM Applications](https://genai.owasp.org/llm-top-10/) and [OWASP API Security Top 10](https://owasp.org/API-Security/).\n- [MCP security best practices](https://modelcontextprotocol.io/specification/2026-07-28/basic/security_best_practices).\n- [Adversarial attacks on LLMs](https://lilianweng.github.io/posts/2023-10-25-adv-attack-llm/), Lilian Weng.\n- [Embrace The Red](https://embracethered.com/blog/), real-world AI exploit write-ups.\n- [MITRE ATLAS](https://atlas.mitre.org/), adversarial technique catalogue.\n- Tools: [AgentDojo](https://github.com/ethz-spylab/agentdojo), [garak](https://github.com/NVIDIA/garak), [PyRIT](https://github.com/Azure/PyRIT), [promptfoo red teaming](https://www.promptfoo.dev/docs/red-team/), [Presidio](https://microsoft.github.io/presidio/), [Llama Guard 3](https://huggingface.co/meta-llama/Llama-Guard-3-8B), [NeMo Guardrails](https://github.com/NVIDIA/NeMo-Guardrails), [Guardrails AI](https://github.com/guardrails-ai/guardrails).\n- [NIST AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework).\n\n## Deployment and operations\n\n- [FastAPI](https://fastapi.tiangolo.com/), including [security](https://fastapi.tiangolo.com/tutorial/security/) and [Docker](https://fastapi.tiangolo.com/deployment/docker/) guides.\n- [uv with Docker](https://docs.astral.sh/uv/guides/integration/docker/) and [with GitHub Actions](https://docs.astral.sh/uv/guides/integration/github/).\n- [The Twelve-Factor App](https://12factor.net/).\n- [Docker build best practices](https://docs.docker.com/build/building/best-practices/).\n- [GitHub Actions](https://docs.github.com/en/actions) and its [security hardening guide](https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions).\n- [Cloud Run](https://cloud.google.com/run/docs), [Fly.io](https://fly.io/docs/), [Render free tier](https://render.com/docs/free), [Kubernetes autoscaling](https://kubernetes.io/docs/concepts/workloads/autoscaling/).\n- ★ [Implementing Stripe-like Idempotency Keys in Postgres](https://brandur.org/idempotency-keys), Brandur Leach.\n- [Transactional outbox](https://microservices.io/patterns/data/transactional-outbox.html).\n- [Temporal](https://docs.temporal.io/), [arq](https://arq-docs.helpmanual.io/), [RQ](https://python-rq.org/), [Celery](https://docs.celeryq.dev/).\n- [SLSA](https://slsa.dev/) for supply-chain integrity.\n- [AWS Well-Architected Generative AI Lens](https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html).\n\n## Observability and scaling\n\n- ★ [OpenTelemetry GenAI semantic conventions](https://github.com/open-telemetry/semantic-conventions-genai/tree/main/docs/gen-ai) and [OTel Python](https://opentelemetry.io/docs/languages/python/).\n- [OpenLLMetry](https://github.com/traceloop/openllmetry), [Langfuse](https://langfuse.com/docs), [Arize Phoenix](https://github.com/Arize-ai/phoenix).\n- ★ Google SRE: [Monitoring Distributed Systems](https://sre.google/sre-book/monitoring-distributed-systems/), [Service Level Objectives](https://sre.google/sre-book/service-level-objectives/), [Alerting on SLOs](https://sre.google/workbook/alerting-on-slos/), the [full SRE book](https://sre.google/sre-book/table-of-contents/).\n- [Timeouts, retries, and backoff with jitter](https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/), Amazon Builders' Library.\n- [Circuit Breaker](https://martinfowler.com/bliki/CircuitBreaker.html), Martin Fowler.\n- [Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching), Claude Platform docs.\n- [LiteLLM](https://docs.litellm.ai/docs/) for multi-provider routing.\n- [Artificial Analysis](https://artificialanalysis.ai/) for model speed and price comparisons.\n- [Prometheus](https://prometheus.io/docs/introduction/overview/), [Grafana](https://grafana.com/docs/grafana/latest/), [Sentry](https://docs.sentry.io/).\n\n## Protocols and SDKs\n\n- [Model Context Protocol](https://modelcontextprotocol.io/) and [A2A, the agent-to-agent protocol](https://a2a-protocol.org/latest/).\n- [Code execution with MCP](https://www.anthropic.com/engineering/code-execution-with-mcp), Anthropic.\n- Inference: [Optimizing your LLM in production](https://huggingface.co/blog/optimize-llm), [vLLM](https://docs.vllm.ai/en/latest/), [PagedAttention](https://arxiv.org/abs/2309.06180), [speculative decoding](https://arxiv.org/abs/2211.17192).\n- [Why Do Multi-Agent LLM Systems Fail?](https://arxiv.org/abs/2503.13657)\n- [Claude tool use docs](https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview) and [Claude cookbooks](https://github.com/anthropics/claude-cookbooks).\n- Agent frameworks to compare: [Pydantic AI](https://github.com/pydantic/pydantic-ai), [OpenAI Agents SDK](https://openai.github.io/openai-agents-python/), [Google ADK](https://google.github.io/adk-docs/), [LlamaIndex](https://docs.llamaindex.ai/en/stable/).\n- [Ollama](https://ollama.com/) for running open models locally.\n"}];

};

/* ---------- Markdown ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TICK = '<svg viewBox="0 0 21 18" aria-hidden="true"><path d="M3 10 L8.5 15 L19 2"/></svg>';
const tickBox = (on, draw) => `<i class="tick${draw ? " draw" : ""}" aria-hidden="true">${on ? TICK : ""}</i>`;
let quizCount = 0, figCount = 0, figPrefix = "";
const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  lang = (lang || "").trim();
  if (lang === "mermaid") {
    figCount++;
    return `<figure class="fig" id="fig-${figPrefix}${figCount}"><div class="mmd" data-src="${esc(code)}">${esc(code)}</div><figcaption><b>Fig. ${figPrefix}${figCount}</b></figcaption></figure>`;
  }
  if (lang === "quiz") {
    let items; try { items = JSON.parse(code); } catch { return `<pre>${esc(code)}</pre>`; }
    const id = "quiz" + (quizCount++);
    const qs = items.map((it, i) => `<div class="q" data-answer="${it.answer}" data-why="${esc(it.why || "")}">
      <p>${i + 1}. ${marked.parseInline(it.q)}</p>
      <div class="opts">${it.options.map((o, j) => `<button class="opt" type="button" data-i="${j}">${tickBox(false)}<span>${marked.parseInline(o)}</span></button>`).join("")}</div>
    </div>`).join("");
    return `<div class="quiz" id="${id}"><div class="quiz-head"><span>Check yourself</span><small data-score>0 of ${items.length} answered</small></div>${qs}</div>`;
  }
  const valid = lang && hljs.getLanguage(lang);
  const html = valid ? hljs.highlight(code, { language: lang }).value : esc(code);
  return `<div class="codewrap"><button class="copy" type="button">Copy</button><pre><code class="hljs language-${esc(lang || "text")}">${html}</code></pre></div>`;
};
renderer.table = (header, body) => `<div class="table-wrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
renderer.link = (href, title, text) => {
  const ext = /^https?:/.test(href || "");
  return `<a href="${esc(href || "")}"${title ? ` title="${esc(title)}"` : ""}${ext ? ' target="_blank" rel="noopener"' : ""}>${text}</a>`;
};
const CALLOUTS = { rule: "Design rule", warn: "Watch out", tip: "Tip", numbers: "Worked numbers", interview: "Design review question" };
renderer.blockquote = quote => {
  const m = quote.match(/^<p>\[!(\w+)\]\s*/);
  if (m && CALLOUTS[m[1]]) return `<div class="callout ${m[1]}"><div class="label">${CALLOUTS[m[1]]}</div>${quote.replace(m[0], "<p>")}</div>`;
  return `<blockquote>${quote}</blockquote>`;
};
marked.setOptions({ renderer, gfm: true });

/* ---------- Mermaid, drawn in the pad's inks ---------- */
const isDark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
async function drawDiagrams(root) {
  if (!window.mermaid) return;
  const nodes = [...root.querySelectorAll(".mmd")];
  if (!nodes.length) return;
  mermaid.initialize({
    startOnLoad: false, securityLevel: "strict", theme: "base",
    fontFamily: "Archivo, Helvetica Neue, Arial, sans-serif",
    themeVariables: {
      darkMode: isDark(), background: css("--sheet"), fontSize: "14px",
      primaryColor: css("--sheet"), primaryTextColor: css("--ink"), primaryBorderColor: css("--ink"),
      secondaryColor: css("--box"), tertiaryColor: css("--box"), lineColor: css("--ink-2"),
      clusterBkg: css("--box"), clusterBorder: css("--ink-2"), edgeLabelBackground: css("--sheet"),
      actorBkg: css("--sheet"), actorBorder: css("--ink"), actorTextColor: css("--ink"), signalColor: css("--ink"), signalTextColor: css("--ink"),
      noteBkgColor: css("--box"), noteBorderColor: css("--ink-2"), noteTextColor: css("--ink"),
      labelBoxBkgColor: css("--box"), labelBoxBorderColor: css("--ink-2"), labelTextColor: css("--ink"),
    },
    flowchart: { htmlLabels: true, curve: "basis" },
  });
  for (const [i, n] of nodes.entries()) {
    try {
      const { svg } = await mermaid.render(`m${Date.now()}${i}`, n.dataset.src);
      n.innerHTML = svg; n.dataset.done = "1";
      const el = n.querySelector("svg"), w = el?.viewBox?.baseVal?.width;
      if (w) el.style.minWidth = `${Math.round(w * 0.8)}px`; // wide diagrams scroll rather than shrink past legibility
    } catch (e) { n.textContent = n.dataset.src; }
  }
  const mark = () => nodes.forEach(n => n.closest("figure")?.classList.toggle("scrolls", n.scrollWidth > n.clientWidth + 2));
  mark(); document.fonts?.ready.then(mark);
  if (window.ResizeObserver) { const ro = new ResizeObserver(mark); nodes.forEach(n => ro.observe(n)); }
}

const slug = s => s.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function weekGroups() {

}
const groupName = w => w == 0 ? "Start" : w == 7 ? "Library" : `Week ${w}`;
function renderNav(current) {
  const g = weekGroups();

    html += `<section class="group"><div class="group-head"><b>${w >= 1 && w <= 6 ? `${groupName(w)}: ${esc(WEEKS[w].title)}` : groupName(w)}</b>${w <= 6 ? `<small>${count}/${items.length}</small>` : ""}</div><ul class="nav">`;
    html += items.map(e => {
      const no = sheetNo[e.id] || "";
      const tracked = e.week <= 6;
      return `<li><a href="#${e.id}" ${e.id === current ? 'aria-current="page"' : ""}>${tracked ? tickBox(done.has(e.id)) : "<i></i>"}<span class="no">${no}</span><span class="t">${esc(e.title)}${e.kind === "lab" ? '<span class="lab-tag">lab</span>' : ""}</span></a></li>`;
    }).join("");
    html += `</ul></section>`;
  }
  document.getElementById("navWrap").innerHTML = html;
  const n = trackable.filter(e => done.has(e.id)).length;

    return `<section class="wk"><div class="wk-no"><b>${w === 0 ? "Start" : `Week ${w}`}</b><small>Lessons ${Number(first)}-${Number(last)}</small><small>${c} of ${items.length} done</small></div><div>
      <h2>${esc(WEEKS[w].title)}</h2><p>${esc(WEEKS[w].blurb)}</p>
      <ul class="sheets">${items.map(e => `<li><a href="#${e.id}"${e.id === next.id ? ' class="next-up"' : ""}>${tickBox(done.has(e.id))}<span class="no">${sheetNo[e.id]}</span><span class="t">${esc(e.short || e.title)}${e.kind === "lab" ? '<span class="lab-tag">lab</span>' : ""}</span></a></li>`).join("")}</ul>
    </div></section>`;
  };
  const extras = (g[7] || []).map(e => `<li><a href="#${e.id}"><b>${esc(e.title)}</b><span>${esc(e.summary || "")}</span></a></li>`).join("");
  const minutes = COURSE.reduce((s, e) => s + e.minutes, 0);
  const strip = `<div class="header-strip pad-strip">
      <div><small>Your progress</small><span>${n} of ${trackable.length} lessons done</span></div>
      <div><small>Up next</small><span><a href="#${next.id}">${Number(sheetNo[next.id])}. ${esc(next.short || next.title)}</a></span></div>
      <div><small>Length</small><span>6 weeks, about ${Math.round(minutes / 60)} hours</span></div>
      <div><small>Price</small><span>Free</span></div>
    </div>`;
  return `<div class="sheet">${strip}<div class="cover">
    <h1>Design AI systems that survive production.</h1>
    <p class="lede">Six weeks on agents, retrieval, evals, security, deployment and operations, worked through one system you build from prototype to monitored service. Free, with tested reference code for every lab.</p>
    <div class="resume">
      <a class="go" href="#${next.id}">${n ? `Continue with lesson ${Number(sheetNo[next.id])}` : "Start the course"}</a>
    </div>
    <div class="weeks">${[0, 1, 2, 3, 4, 5, 6].map(week).join("")}</div>
    <section class="library"><h2>Library</h2><ul>${extras}</ul></section>
    <p class="note">An independent, original course. Its weekly topics follow the public outline of paid AI system design cohorts so anyone can study the same ground for free; none of their material is reproduced. Your ticks are saved only in this browser.</p>
  </div></div>`;
}

function renderEntry(e) {
  quizCount = 0; figCount = 0;
  const idx = COURSE.indexOf(e);
  const prev = COURSE[idx - 1], next = COURSE[idx + 1];
  const no = sheetNo[e.id];
  figPrefix = no ? `${Number(no)}.` : "";
  const body = marked.parse(e.body);
  const tracked = e.week <= 6;
  const kind = { lesson: "Lesson", lab: "Lab", page: "Reference" }[e.kind] || e.kind;
  const weekCell = e.week >= 1 && e.week <= 6 ? `Week ${e.week}: ${WEEKS[e.week].title}` : groupName(e.week);
  const strip = `<div class="header-strip">
      <div class="sheetno"><small>Lesson</small><span>${no ? `${Number(no)} of ${trackable.length}` : "Reference"}</span></div>
      <div class="wk-cell"><small>Week</small><span>${esc(weekCell)}</span></div>
      <div><small>Type</small><span>${kind}</span></div>
      <div><small>Time</small><span>${e.minutes ? `${e.minutes} min` : "As needed"}</span></div>
      <div><small>Status</small><span>${tracked ? (done.has(e.id) ? "Done" : "Not done yet") : "Reference"}</span></div>
    </div>`;
  const nextLabel = n => `${sheetNo[n.id] ? `Sheet ${sheetNo[n.id]}` : "Library"}`;
  return `<div class="sheet">${strip}<div class="sheet-body"><article>
    <h1>${esc(e.title)}</h1>
    ${e.summary ? `<p class="lede">${esc(e.summary)}</p>` : ""}
    <div class="body">${body}</div>
    ${tracked ? `<div class="sign-off"><button class="mark" id="doneBtn" type="button" aria-pressed="${done.has(e.id)}">${tickBox(done.has(e.id), justTicked === e.id)}${done.has(e.id) ? "Done" : "Mark as done"}</button><p>${done.has(e.id) ? "Marked as done. Click again to undo." : "Mark it done once you can answer the self-check questions without looking back."}</p></div>` : ""}
    <nav class="pager" aria-label="Lessons">${prev ? `<a class="prev" href="#${prev.id}"><small>${nextLabel(prev)}</small><b>${esc(prev.title)}</b></a>` : "<span></span>"}${next ? `<a class="next" href="#${next.id}"><small>Next: ${nextLabel(next)}</small><b>${esc(next.title)}</b></a>` : ""}</nav>
  </article><aside class="margin" id="margin"></aside></div></div>`;
}

function enhance(root, e) {
  const heads = [...root.querySelectorAll(".body h2")];
  heads.forEach(h => h.id = slug(h.textContent));
  const margin = root.querySelector("#margin");
  const figs = [...root.querySelectorAll("figure.fig")].map(f => {
    let h = f.previousElementSibling; while (h && h.tagName !== "H2") h = h.previousElementSibling;
    return { id: f.id, no: f.querySelector("figcaption b").textContent.replace("Fig. ", ""), near: h ? h.textContent : e.title };
  });
  if (margin && (heads.length > 2 || figs.length)) {
    margin.innerHTML = (heads.length > 2 ? "<b>In this lesson</b>" + heads.map((h, i) => `<a href="#${e.id}" data-target="${h.id}"><span>${pad2(i + 1)}</span><span>${esc(h.textContent)}</span></a>`).join("") : "")
      + (figs.length ? `<b class="figs-head">Figures</b>` + figs.map(f => `<a class="fig-link" href="#${e.id}" data-target="${f.id}"><span>${f.no}</span><span>${esc(f.near)}</span></a>`).join("") : "");
    margin.addEventListener("click", ev => {
      const a = ev.target.closest("a[data-target]"); if (!a) return;
      ev.preventDefault(); document.getElementById(a.dataset.target)?.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }
  root.querySelectorAll(".copy").forEach(b => b.addEventListener("click", async () => {
    const pre = b.nextElementSibling;
    try { await navigator.clipboard.writeText(pre.innerText); b.textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; }
    setTimeout(() => b.textContent = "Copy", 1500);
  }));
  root.querySelectorAll(".quiz").forEach(qz => {
    const total = qz.querySelectorAll(".q").length; let answered = 0, right = 0;
    qz.querySelectorAll(".q").forEach(q => q.addEventListener("click", ev => {
      const btn = ev.target.closest(".opt"); if (!btn || btn.disabled) return;
      const ans = +q.dataset.answer, pick = +btn.dataset.i;
      q.querySelectorAll(".opt").forEach((o, i) => {
        o.disabled = true;
        if (i === ans) { o.classList.add("right"); o.querySelector(".tick").outerHTML = tickBox(true, true); }
      });
      if (pick !== ans) btn.classList.add("wrong"); else right++;
      answered++;
      const why = document.createElement("div"); why.className = "why";
      why.innerHTML = (pick === ans ? "<strong>Correct.</strong> " : "<strong>Not quite.</strong> ") + marked.parseInline(q.dataset.why);
      q.appendChild(why);
      qz.querySelector("[data-score]").textContent = answered === total ? `${right} of ${total} correct` : `${answered} of ${total} answered`;
    }));
  });
  const doneBtn = root.querySelector("#doneBtn");
  if (doneBtn) doneBtn.addEventListener("click", () => {
    if (done.has(e.id)) { done.delete(e.id); justTicked = null; } else { done.add(e.id); justTicked = e.id; }
    store.set("aisd.done", [...done]);
    const y = scrollY; route(); scrollTo(0, y);
    document.getElementById("doneBtn")?.focus({ preventScroll: true });
    justTicked = null;
  });
  drawDiagrams(root);
}

function route() {
  const id = (location.hash || "#home").slice(1);
  const main = document.getElementById("main");
  const e = byId[id];
  main.innerHTML = e ? renderEntry(e) : renderHome();
  if (e) enhance(main, e);
  renderNav(e ? e.id : null);
  document.title = e ? `${e.title} · AI System Design` : "AI System Design";
  closeMenu();
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

/* ---------- Search ---------- */
const plain = COURSE.map(e => ({ e, text: (e.title + " " + e.body).toLowerCase() }));
const qInput = document.getElementById("q");
qInput.addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase();
  const out = document.getElementById("results"), nav = document.getElementById("navWrap");
  if (q.length < 2) { out.hidden = true; nav.hidden = false; return; }
  const terms = q.split(/\s+/);
  const hits = plain.filter(p => terms.every(t => p.text.includes(t))).slice(0, 12);
  out.innerHTML = hits.length ? hits.map(({ e, text }) => {
    const i = text.indexOf(terms[0]);
    const snip = e.body.slice(Math.max(0, i - 50), i + 90).replace(/[#*`>\[\]]/g, "").replace(/\s+/g, " ");
    return `<li><a href="#${e.id}">${sheetNo[e.id] ? `${sheetNo[e.id]} · ` : ""}${esc(e.title)}<small>…${esc(snip)}…</small></a></li>`;
  }).join("") : `<li class="empty">Nothing matches “${esc(q)}”. Try a shorter term such as “cache” or “judge”.</li>`;
  out.hidden = false; nav.hidden = true;
});
document.getElementById("results").addEventListener("click", () => { qInput.value = ""; document.getElementById("results").hidden = true; document.getElementById("navWrap").hidden = false; });

/* ---------- Theme, menu, reset ---------- */
const themes = ["system", "light", "dark"];
function applyTheme(t) {
  if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  document.getElementById("themeBtn").textContent = "Theme: " + t;
}
let theme = store.get("aisd.theme", "system"); applyTheme(theme);
document.getElementById("themeBtn").addEventListener("click", () => {
  theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set("aisd.theme", theme); applyTheme(theme); route();
});
let armed = false;
document.getElementById("resetBtn").addEventListener("click", ev => {
  if (!armed) { armed = true; ev.target.textContent = "Click again to reset"; setTimeout(() => { armed = false; ev.target.textContent = "Reset progress"; }, 3000); return; }
  done = new Set(); store.set("aisd.done", []); armed = false; ev.target.textContent = "Progress reset"; route();
});
const app = document.getElementById("app"), scrim = document.getElementById("scrim"), menuBtn = document.getElementById("menuBtn");
function closeMenu() { const was = app.classList.contains("open"); app.classList.remove("open"); scrim.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); if (was) menuBtn.focus(); }
menuBtn.addEventListener("click", () => { app.classList.add("open"); scrim.hidden = false; menuBtn.setAttribute("aria-expanded", "true"); qInput.focus(); });
scrim.addEventListener("click", closeMenu);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeMenu(); if (ev.key === "/" && document.activeElement !== qInput) { ev.preventDefault(); qInput.focus(); } });

route();
</script>

</body>
