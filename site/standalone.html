ume (seasonality, launches, new tenants) | Ticket forecasts from the business; one line per tenant |\n| Conversation length and steps per turn | Calls per conversation from traces; a prompt change can add a step |\n| Cache hit rate | `cache_read_tokens` share; a broken prefix can multiply input cost several times |\n| Model prices and model mix | Vendors' pricing pages; your routing share per model |\n| Fallbacks | `fallbacks` column; an outage can move traffic to a pricier model for hours |\n\n## The model mix: the biggest lever inside the AI bill\n\nInside the AI bill, which model serves which route is the largest lever. Week 6 showed caching and routing taking one design from $0.19 to $0.035 per conversation. On the IT desk, suppose evals show the small model resolves password resets and account unlocks (35% of conversations) as well as the mid-tier model, at 5 calls of 8,000 tokens in and 300 out:\n\n- Small-model conversation: 5 × (8,000 × $0.10 + 300 × $0.50) / 1M = **$0.00475**\n- Blended: 0.35 × $0.00475 + 0.65 × $0.0459 = **$0.0315** per conversation, so model spend falls from $1,837 to **$1,260** a month.\n\nThat saves $577 a month. Now check it against the unit that matters: if the cheaper route resolved 5 points fewer of those 14,000 conversations, 700 more tickets would reach people at $8 each, **$5,600** a month. Ship the routing change only when the route's eval suite and online resolution rate say quality held.\n\n> [!tip] Report savings in the unit the business uses: \"routing saved $577 a month and resolution held at 60%\" is a result; \"routing cut tokens by 31%\" is not.\n\n## Commitments, on-demand and self-hosting\n\nThe FinOps for AI overview lists the purchasing options: on-demand per token; **committed use discounts** and **provisioned capacity** (it cites examples such as Azure OpenAI's provisioned throughput units and OpenAI's Scale Tier), which trade a commitment for a lower rate or reserved throughput and \"can result in low utilization\" if usage does not match; and **batch** or spare-capacity pricing for work that can wait. Self-hosting an open model is the extreme case of commitment: you pay for GPUs whether or not anyone is asking.\n\n```viz\ncaption: Commit to the floor of steady usage, pay on demand for the peaks, and send anything that can wait to batch.\n<div class=\"vz-bars\"><span>Jan<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:62%\"><\/i><\/span><b>$1,700<\/b><span>Feb<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:66%\"><\/i><\/span><b>$1,800<\/b><span>Mar<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:70%\"><\/i><\/span><b>$1,920<\/b><span>Dec<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:87%\"><\/i><\/span><b>$2,387<\/b><\/div>\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk g\"><h5>Commit<\/h5><p>up to the lowest month you are confident of, not the average<\/p><\/div>\n  <div class=\"vz-panel sk\"><h5>On demand<\/h5><p>everything above the floor<\/p><\/div>\n  <div class=\"vz-panel sk g\"><h5>Batch<\/h5><p>nightly evals, offline judging, bulk classification<\/p><\/div>\n<\/div>\n<p>illustrative monthly model spend for the IT desk<\/p>\n```\n\nSeveral providers price their batch APIs at about half the on-demand rate (see the [Anthropic](https://platform.claude.com/docs/en/about-claude/pricing) and [OpenAI](https://developers.openai.com/api/docs/pricing) pricing pages). Eval runs and red-team suites rarely need an answer in seconds, so they are the first workload to move.\n\nFor self-hosting, use the calculator from the [inference lesson](#w5-inference). It starts at a realistic 40% utilisation; idle hours are the cost that per-token pricing hides from you.\n\n```widget\n{\"type\": \"cost\", \"preset\": \"Same node at a realistic 40% utilisation\"}\n```\n\n> [!warn] The calculator prices output tokens. Agent workloads are input-heavy: the IT desk above reads about 51,000 tokens for every 1,250 it writes, roughly 40 to 1. Prefill capacity is a large part of a self-hosted fleet for this shape of traffic, so size GPUs on both, and compare against your cached input price, not the uncached one.\n\n## Reconciling with the bill: FOCUS\n\nSwitchboard computes cost from list prices in its own price table. Your invoice includes discounts, commitments, credits and taxes, so the two will differ. Reconcile monthly: the ledger is right about **who** spent, the invoice is right about **how much**, and the ratio between them is your effective discount to apply in showback.\n\nThe FinOps Foundation's [FOCUS specification](https://focus.finops.org/what-is-focus/) is an open format for billing data from cloud, SaaS, AI and other technology vendors, so cost from different providers lands in the same columns. The current version, FOCUS 1.4, was ratified on 4 June 2026 and added Invoice Detail and Billing Period datasets for tying usage to invoices. The next version, 1.5, is in its working draft with ratification planned for 3 December 2026; its [release scope](https://focus.finops.org/focus-1-5-release-scope/) includes AI cost columns that name the model and its developer, separate cached from uncached and input from output tokens, and identify the principal and API key behind a charge. Until 1.5 is ratified and vendors adopt it, treat those columns as planned, not available.\n\n> [!tip] Export Switchboard's ledger in FOCUS-style columns (billing period, provider, service, charge, cost, usage quantity and unit, plus your org, team and app as tags). Then your gateway's view and your providers' bills join in one table, and the move to FOCUS 1.5 is a mapping change.\n\n## Failure modes\n\n| Failure | Symptom | Mitigation |\n|---|---|---|\n| Optimising the wrong unit | Token cost falls, escalations rise | Report cost per resolved ticket beside every saving |\n| Budget as outage | Customer desk refuses requests on day 29 | Alerts and degradation for critical apps; hard stops only at org level or for non-critical apps |\n| Retry storm on budget refusal | Slow failures, extra load on the gateway | Honour `x-should-retry: false` and the `budget:` header in every retry layer |\n| Invisible eval spend | Team bill doubles after adding pass^k trials | Separate eval app keys; show them in the team's tree |\n| Cache collapse after a deploy | Input cost jumps several times with no traffic change | Alert on cache-read share per app (Week 5) |\n| Fallback cost spike | A provider outage moves traffic to a pricier model | Watch the `fallbacks` column; price fallbacks into the forecast |\n| Disputed allocation | Teams argue about shared platform cost every month | One published rule, agreed in advance, reviewed quarterly |\n| Ledger and invoice disagree | Finance distrusts showback | Monthly reconciliation and an effective-discount factor |\n\n## Design review questions\n\n> [!interview] What is your cost per resolved ticket, fully loaded, and how does it compare with the process before AI?\n\n> [!interview] What happens to a customer-facing agent when its team runs out of budget on the 29th?\n\n> [!interview] Which single change would most reduce your cost per resolved ticket next quarter, and how would you prove it did not hurt quality?\n\n> [!interview] How much of last month's spend was evals, fallbacks or retries, and where can you see it?\n\n> [!interview] Why does your gateway's cost figure differ from the invoice, and by how much?\n\n## Further reading\n\n- [FinOps for AI overview](https://www.finops.org/wg/finops-for-ai-overview/), FinOps Foundation: KPIs such as cost per inference and cost per API call, and purchasing options.\n- FinOps Framework capabilities: [Unit Economics](https://www.finops.org/framework/capabilities/unit-economics/) and [Invoicing and Chargeback](https://www.finops.org/framework/capabilities/invoicing-chargeback/).\n- [FOCUS](https://focus.finops.org/what-is-focus/) and the [FOCUS 1.5 release scope](https://focus.finops.org/focus-1-5-release-scope/).\n- [Switchboard README](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/switchboard): the ledger, budgets and chargeback endpoint.\n- [Failure modes and cost trade-offs](#w6-tradeoffs) and [LLM inference for system designers](#w5-inference).\n\n```quiz\n[\n  {\"q\": \"Why is cost per resolved ticket a better unit than cost per token?\", \"options\": [\"Tokens are hard to count\", \"It measures what the business buys and includes the cost of attempts that failed\", \"Vendors bill per ticket\", \"It is always lower\"], \"answer\": 1, \"why\": \"Tokens are a resource metric. A cheaper configuration that resolves fewer tickets raises the business cost.\"},\n  {\"q\": \"An agent costs $0.080 per conversation and resolves 60% of conversations. What is the AI cost per AI-resolved ticket?\", \"options\": [\"$0.048\", \"$0.080\", \"About $0.133\", \"$0.200\"], \"answer\": 2, \"why\": \"All spend divided by resolved tickets: $0.080 / 0.6 is about $0.133.\"},\n  {\"q\": \"What is the difference between showback and chargeback?\", \"options\": [\"Showback is for cloud, chargeback for AI\", \"Showback shows groups their costs; chargeback formally posts them to the groups' budgets\", \"Chargeback is optional for every practice and showback is forbidden\", \"They are the same\"], \"answer\": 1, \"why\": \"The FinOps Foundation describes the difference as formality: chargeback goes into the accounts.\"},\n  {\"q\": \"Your customer-support agent's team budget will run out on day 29. What should the platform do?\", \"options\": [\"Hard stop at 100%\", \"Alert early on burn rate and degrade gracefully (cheaper model, fewer online judges); keep hard stops for non-critical apps or a high org-level guard\", \"Nothing\", \"Delete the app's key\"], \"answer\": 1, \"why\": \"A hard stop on a customer-facing app is a self-inflicted outage.\"},\n  {\"q\": \"Routing 35% of traffic to a small model saves $577 a month. Resolution on that route drops 5 points, sending 700 more tickets to people at $8 each. What is the net effect?\", \"options\": [\"Saves $577\", \"Costs about $5,000 more a month\", \"No change\", \"Saves $5,600\"], \"answer\": 1, \"why\": \"$5,600 of extra human work against $577 saved: a net loss of about $5,000.\"},\n  {\"q\": \"How much model spend should you cover with a commitment?\", \"options\": [\"The peak month\", \"The average month\", \"The floor of steady usage you are confident of\", \"None, ever\"], \"answer\": 2, \"why\": \"Commitments are paid whether used or not; cover the floor and pay on demand above it.\"},\n  {\"q\": \"What is the status of AI token columns (model, cached versus uncached tokens) in FOCUS as of October 2026?\", \"options\": [\"In FOCUS 1.0\", \"In FOCUS 1.4, ratified June 2026\", \"Planned for FOCUS 1.5, with ratification scheduled for 3 December 2026\", \"FOCUS does not cover AI vendors\"], \"answer\": 2, \"why\": \"FOCUS 1.4 is current; the AI cost columns are in the 1.5 working draft.\"}\n]\n```\n"}, {"id": "w10-capstone", "week": 10, "kind": "lab", "title": "Enterprise capstone: Helpdesk OS, a multi-tenant support platform", "short": "Capstone: Helpdesk OS", "minutes": 600, "summary": "Build Helpdesk OS, an employee IT and HR desk and an external customer desk whose specialist agents run through Switchboard, Atlas and Checkpoint, and prove it with per-agent evals, per-tenant red-teaming, SLOs, cost per resolved ticket and an audit evidence pack.", "body": "\n## The brief\n\nBuild **Helpdesk OS**: one support platform serving two tenants that must never see each other's data.\n\n- **Employee desk** (internal): IT access (account unlocks, access requests) and HR policy questions for staff, signed in with company SSO.\n- **Customer desk** (external): billing and returns for customers of a fictional store, signed in with the store's customer identity.\n\nSpecialist agents resolve tickets end to end. Every model call goes through **Switchboard**, every tool call through **Checkpoint**, and every agent, MCP server and skill is approved in **Atlas** before it runs. The [Week 6 capstone](#w6-lab) asked you to ship one trustworthy agent. This one asks you to run several agents for several tenants on a shared platform, and to prove that it is safe, reliable, affordable and auditable.\n\nThe bar is the same as before: a live workflow, real numbers, and evidence for every claim.\n\n## Architecture\n\n```viz\ncaption: Two tenants, five agents, three platform services. Agents hold no provider keys and no tool credentials; every write passes Checkpoint policy.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk c\"><h5>Employee desk<\/h5><div class=\"vz-row\"><span class=\"ch sk c\">triage<\/span><span class=\"ch sk c\">IT access<\/span><span class=\"ch sk c\">HR policy<\/span><\/div><p>company SSO<\/p><\/div>\n  <div class=\"vz-panel sk c\"><h5>Customer desk<\/h5><div class=\"vz-row\"><span class=\"ch sk c\">triage<\/span><span class=\"ch sk c\">billing<\/span><span class=\"ch sk c\">returns<\/span><\/div><p>customer identity<\/p><\/div>\n<\/div>\n<span class=\"arr d sk\"><\/span>\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk m\"><h5>Switchboard<\/h5><p>one org per tenant; team per agent; app per environment; budgets<\/p><\/div>\n  <div class=\"vz-panel sk m\"><h5>Checkpoint<\/h5><p>agent and user identity; Cedar per tool; approvals; decision log<\/p><\/div>\n  <div class=\"vz-panel sk m\"><h5>Atlas<\/h5><p>agent cards, MCP servers, skills; review; versions<\/p><\/div>\n<\/div>\n<span class=\"arr d sk\"><\/span>\n<div class=\"vz-row\"><span class=\"ch sk\">ticketing MCP<\/span><span class=\"ch sk\">identity provider MCP<\/span><span class=\"ch sk\">knowledge base MCP<\/span><span class=\"ch sk\">orders and billing MCP<\/span><span class=\"ch sk\">human console<\/span><\/div>\n```\n\nA ticket's path, from first message to resolution:\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant TR as Triage agent\n  participant SP as Specialist agent\n  participant SB as Switchboard\n  participant CP as Checkpoint\n  participant H as Human console\n  U->>TR: \"I'm locked out of my laptop\"\n  TR->>SB: classify (small model)\n  TR->>SP: A2A handoff: IT access, ticket id, summary\n  SP->>SB: plan (mid-tier model)\n  SP->>CP: idp__unlock_account (agent token + user JWT)\n  CP->>CP: Cedar: allow, own account only\n  CP-->>SP: unlocked\n  SP->>CP: tickets__resolve\n  SP-->>U: done, with what was changed\n  Note over SP,H: access to a sensitive group: Cedar holds the call, a person approves in the console\n```\n\n## Required components\n\n| # | Component | Minimum |\n|---|---|---|\n| 1 | **Tenancy** | Two Switchboard orgs; a team per agent; separate apps for production, staging and evals. Tenant isolation in data (row-level security or separate schemas), retrieval filters, memory, caches and keys |\n| 2 | **Agents** | Triage per tenant plus four specialists: IT access, HR policy, billing, returns. Each published to Atlas as an A2A agent card, its know-how as Agent Skills |\n| 3 | **Handoffs** | A2A or an equivalent typed handoff carrying ticket ID, tenant, user and a summary; a loop and depth limit; a fallback to a person |\n| 4 | **MCP servers** | Ticketing, identity provider (unlock, access request), knowledge base, orders and billing. Real or realistic mocks, each registered and approved in Atlas |\n| 5 | **Policy** | Cedar rules per tool: unlock only the caller's own account; access to sensitive groups and refunds above a limit need approval; HR agent read-only; no tool crosses tenants |\n| 6 | **Human console** | Approval queue (Checkpoint's approvals API), escalation queue with the agent's summary and trace link, and a kill switch per agent |\n| 7 | **Identity** | SSO for staff (OIDC), customer sign-in for the customer desk; the user's token reaches Checkpoint on every tool call |\n| 8 | **Observability** | One trace per ticket across agents, Switchboard and Checkpoint; dashboards per tenant; alerts with runbooks |\n| 9 | **Evals** | A suite per agent, a handoff suite, and a red-team suite per tenant, in CI with gates |\n| 10 | **FinOps** | Ticket ID joined to Switchboard usage; cost per resolved ticket per tenant and agent; budgets with alerts |\n| 11 | **Governance** | Inventory, risk assessment per agent, AI disclosure in both front ends, retention settings, change log |\n\nUse any model provider through Switchboard. Keep every model choice in one config file so the same suite can run on a second model.\n\n## Phased plan\n\n```viz\ncaption: Evidence starts in phase 1, not at the end. Each phase ends with acceptance criteria you can show, not describe.\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk\"><h5>0. Design, days 1 to 2<\/h5><p>design doc, threat model, cost target<\/p><\/div>\n  <div class=\"vz-panel sk c\"><h5>1. One agent, days 3 to 5<\/h5><p>unlock end to end; no keys in the agent<\/p><\/div>\n  <div class=\"vz-panel sk c\"><h5>2. All agents, days 6 to 8<\/h5><p>handoffs, console, approvals once only<\/p><\/div>\n  <div class=\"vz-panel sk c\"><h5>3. Security, days 9 to 10<\/h5><p>red-team per tenant; zero cross-tenant leaks<\/p><\/div>\n  <div class=\"vz-panel sk c\"><h5>4. Operations, days 11 to 12<\/h5><p>SLOs under load; cost per resolved ticket<\/p><\/div>\n  <div class=\"vz-panel sk g\"><h5>5. Evidence, days 13 to 14<\/h5><p>evidence pack, readiness review, demo<\/p><\/div>\n<\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">eval cases grow every phase<\/span><span>40 by day 5, every suite gated by day 8<\/span><\/div>\n```\n\n### Phase 0: design (days 1 and 2)\n\nWrite the design doc: C4 context and container diagrams, the tenancy model, a STRIDE threat model with cross-tenant leakage as a named threat, ADRs for handoff protocol and tenant isolation, SLOs, and a cost model with your assumptions labelled.\n\n**Accept when:** a peer has run the [architecture review](#w6-review) on it; every tool in the plan has a proposed Cedar rule and a write or read tier; the cost model gives a target cost per resolved ticket per tenant.\n\n### Phase 1: one agent end to end (days 3 to 5)\n\nProvision both tenants in Switchboard, register the identity provider and ticketing MCP servers in Atlas, and ship the employee-desk triage and IT access agents through the whole platform.\n\n**Accept when:**\n- An account unlock works from chat to resolved ticket in staging, with one trace showing every model and tool call.\n- No provider key and no tool credential exists in the agent's repository or environment; the agent knows only Switchboard and Checkpoint URLs.\n- Every tool call appears in Checkpoint's decision log with the policy that allowed it.\n- 40 eval cases for the IT access agent, gated in CI.\n\n### Phase 2: all agents, handoffs and the console (days 6 to 8)\n\nAdd HR policy, billing and returns, the customer-desk triage, handoffs, and the human console.\n\n**Accept when:**\n- Each specialist has at least 50 eval cases, including must-call, must-not-call and end-state checks; the handoff suite has at least 30 cases covering wrong-agent routing and handoff loops.\n- A refund above the limit is held, approved in the console by a second person, and executed exactly once with the approved arguments; a modified retry is refused.\n- An escalation reaches the console with a summary a person can act on without rereading the conversation.\n\n### Phase 3: security (days 9 and 10)\n\nRed-team each tenant separately, then together.\n\n**Accept when:**\n- Each tenant has a red-team suite of at least 30 cases: injection through tickets, emails and knowledge base articles; attempts to unlock someone else's account; social engineering for refunds; data exfiltration through links.\n- Cross-tenant suite: at least 20 cases trying to reach the other tenant's data, run with at least 3 trials each. Pass criterion: **zero** leaks in every trial.\n- Zero writes executed without a matching allow or approval in the decision log.\n- The HR agent cannot reach any write tool, proven by policy tests, not by the prompt.\n\n### Phase 4: operations and FinOps (days 11 and 12)\n\n**Accept when** dashboards and a load test show these targets (set for this brief; justify any change in an ADR):\n\n| SLO | Target |\n|---|---|\n| Switchboard overhead | under 10 ms p95, excluding provider time |\n| Time to first token, chat | under 2 s p95 |\n| Availability of the chat endpoints | 99.5% over the test window |\n| Approval decision time | under 15 minutes p95 in staffed hours |\n| Resolution rate (not reopened within 7 days) | stated per agent, measured on the eval suite and a simulated traffic run |\n\n- Cost per resolved ticket per tenant and per agent, computed from Switchboard's ledger joined to ticket outcomes (add a ticket tag or join through trace IDs), fully loaded with your assumed human costs, compared with the Phase 0 target.\n- Budgets per app with burn-rate alerts; a demonstration that a customer-facing app degrades rather than stops.\n- One optimisation with a before and after table in cost per resolved ticket, with resolution held.\n\n### Phase 5: evidence and demo (days 13 and 14)\n\nAssemble the evidence pack and pass a [readiness review](#w6-readiness).\n\n**Accept when** the pack contains, each generated from the system rather than typed:\n- **Inventory**: every agent, MCP server and skill with owner, version, digest, status and risk tier.\n- **Risk assessment per agent**, including why the HR agent is not making decisions about workers (Annex III point 4) and the NIST AI 600-1 risks it addresses ([governance lesson](#w10-governance)).\n- **Logs and oversight**: a query that reconstructs one ticket from start to end, including every decision and approval.\n- **Change control**: the history of one prompt change and one model change, each with its eval report and reviewer.\n- **Retention**: configured periods per table and proof the purge ran.\n- **Disclosure**: both front ends tell users they are talking to an AI, with a test that checks it.\n\n## Review rubric\n\n| Area | Excellent (4) | Adequate (2) | Missing (0) |\n|---|---|---|---|\n| Platform use | All model and tool traffic through Switchboard and Checkpoint; all artifacts approved in Atlas; no credentials in agents | Most traffic through the platform | Direct provider or tool calls |\n| Tenancy | Isolation at data, retrieval, memory, cache and keys; zero leaks across all trials | Isolation in data only, tested | Untested |\n| Agents and handoffs | Clear specialist boundaries, typed handoffs, loop limits, graceful escalation | Works, some routing errors | One agent pretending to be many |\n| Policy and approvals | Least privilege per tool and argument; approvals bound to exact calls; policy tests | Policies exist, partly tested | Permissions in prompts |\n| Evals and red-team | Per-agent, handoff and per-tenant suites in CI with gates and pass^k | Suites exist, partly gated | Ad hoc |\n| Operations | SLOs met under load, dashboards per tenant, alerts with runbooks | SLOs defined and measured | None |\n| FinOps | Cost per resolved ticket per tenant, fully loaded, joined from the ledger; budgets that degrade | Cost per conversation only | No cost numbers |\n| Governance | Evidence pack generated from the system | Documents written by hand | None |\n| Communication | Clear demo, honest trade-offs, crisp answers | Understandable | Unclear |\n\nA total of 28 or more out of 36 is a strong portfolio project.\n\n## What to present (20 minutes plus 10 minutes of questions)\n\n1. **The problem and the tenants** (1 min).\n2. **Live demo** (6 min): an account unlock end to end; a refund held, approved and executed once; a cross-tenant attack that fails; the trace of one ticket; the kill switch.\n3. **Architecture** (3 min): one diagram, one ticket walk-through, two ADRs with their \"revisit when\".\n4. **Evidence** (6 min): eval and red-team results per agent and tenant, SLO dashboard, cost per resolved ticket against target, the evidence pack.\n5. **Failure modes and trade-offs** (3 min): what can still go wrong, how you would know, what you chose not to build.\n6. **What's next** (1 min).\n\n```viz\ncaption: Twelve of twenty minutes are proof: the live demo and the evidence.\n<div class=\"vz-bars\"><span>problem, tenants<\/span><span class=\"bar sk\"><i class=\"sk\" style=\"--w:17%\"><\/i><\/span><b>1 min<\/b><span>live demo<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:100%\"><\/i><\/span><b>6 min<\/b><span>architecture<\/span><span class=\"bar sk\"><i class=\"sk\" style=\"--w:50%\"><\/i><\/span><b>3 min<\/b><span>evidence<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:100%\"><\/i><\/span><b>6 min<\/b><span>failure modes<\/span><span class=\"bar sk\"><i class=\"sk\" style=\"--w:50%\"><\/i><\/span><b>3 min<\/b><span>what's next<\/span><span class=\"bar sk\"><i class=\"sk\" style=\"--w:17%\"><\/i><\/span><b>1 min<\/b><\/div>\n```\n\nRecord a backup of the demo. Live identity providers and payment mocks fail at the worst moment.\n\n## What is not required\n\n- A production identity provider or real payment system: realistic mocks behind MCP are fine.\n- Every component of the reference services' \"not built yet\" lists. Build what your demo needs (for example token exchange instead of a two-audience token), and record the rest in ADRs.\n- A legal opinion. The risk assessments are engineering documents written to help counsel decide.\n\n## The reference implementation\n\n[Helpdesk OS](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/helpdesk) is a working answer\nto this brief. Read it after your design doc, not before: it is one set of choices, and the review rubric rewards\nchoices you can defend. It is built from the same parts: six agents, four MCP systems, `helpdesk.cedar`, the console,\ncost per resolved ticket from ticket tags, and an evidence pack. Three of its decisions are worth arguing with in\nyour ADRs:\n\n- **Handoffs run in process, typed, not over A2A** (its ADR 0001). That fits agents deployed together, and stops fitting when another team owns one.\n- **Approved calls run with the requester's stored token** (its ADR 0002). That is fast, but a bearer token rests in a table; token exchange is the cleaner answer.\n- **Red-team suites script a fully compromised model** (its ADR 0004). They run in CI with no key and test the platform, not the prompt; your behavioural suites test the prompt.\n\nWhat it does not have is what Phase 4 asks you for: a load test, SLO dashboards, alerts with runbooks, and real\nSSO. Its tests start the real Switchboard, Atlas and Checkpoint in one process, which is also a quick way to try\nyour own policies.\n\n## Reference reading\n\n- [Platform engineering for agents](#w10-platform), [Governance and regulation](#w10-governance) and [AI FinOps](#w10-finops).\n- The [Switchboard](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/switchboard), [Atlas](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/atlas) and [Checkpoint](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/checkpoint) READMEs, ADRs and threat models.\n- The [Week 6 capstone](#w6-lab) rubric and [production readiness](#w6-readiness) checklist.\n"}, {"id": "drills", "week": 99, "kind": "page", "title": "Design drills", "short": "Design drills", "summary": "Eight system design problems in interview format, each with a worked solution outline you can check your answer against.", "minutes": 0, "body": "\n## How to use these\n\nEach drill is a 45-minute system design problem, the kind asked in AI engineering interviews and design reviews. Work through it before opening the outline:\n\n1. **Clarify** (5 min): users, scale, latency, quality bar, risk. Write your assumptions.\n2. **Estimate** (5 min): traffic, tokens, cost, storage.\n3. **Design** (20 min): components, data flow, the agent or workflow, retrieval, evals, security.\n4. **Deep dive** (10 min): the hardest part.\n5. **Trade-offs and failure modes** (5 min).\n\n```viz\ncaption: Ten minutes of framing buys twenty of design. Save the deep dive: it is where a strong answer shows depth instead of breadth.\n<div class=\"vz-bars\"><span>clarify<\/span><span class=\"bar sk\"><i class=\"sk\" style=\"--w:25%\"><\/i><\/span><b>5 min<\/b><span>estimate<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:25%\"><\/i><\/span><b>5 min<\/b><span>design<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:100%\"><\/i><\/span><b>20 min<\/b><span>deep dive<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:50%\"><\/i><\/span><b>10 min<\/b><span>trade-offs<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:25%\"><\/i><\/span><b>5 min<\/b><\/div>\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk\"><h5>Out of framing<\/h5><p>assumptions, users, risk, tokens and cost<\/p><\/div>\n  <div class=\"vz-panel sk c\"><h5>Out of design<\/h5><p>one diagram, one request walked end to end<\/p><\/div>\n  <div class=\"vz-panel sk g\"><h5>Out of trade-offs<\/h5><p>what you rejected, and when to revisit<\/p><\/div>\n<\/div>\n```\n\nEvery outline below is provider-neutral on purpose. Where it says \"a small model\" or \"a large model\", any tier works: a hosted API (OpenAI, Anthropic, Google Gemini, Mistral), an open-weights model on vLLM or Ollama, or a mix behind a gateway. Naming the deciding factor (quality on your evals, latency, price, data residency) scores better than naming a brand.\n\nThen compare with the outline. The outlines are not the only right answer; they show the considerations a strong answer covers.\n\n## Drill 1: Internal knowledge assistant for a 5,000-person company\n\n*Employees ask questions over Confluence, Google Drive, and Slack. Answers must respect each employee's existing permissions. Target: answer in under 5 seconds, citations required.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Clarify:** ~5,000 users, maybe 20,000 questions/day, peak ~3/sec. 2M documents, many updated daily. Permissions vary per document and change often. Wrong answers are tolerable if cited; leaks are not.\n- **Estimate:** 2M docs × ~8 chunks = 16M chunks × 1,024 dims × 4 bytes ≈ 65 GB vectors (consider 512-dim or int8: ~16 GB).\n- **Ingestion:** connectors per source using webhooks + nightly reconciliation; queue; parse, structure-aware chunking, contextual prefixes; incremental hash-based upserts. ACLs synced as document metadata, permission changes as fast-path events.\n- **Access control:** the hardest part. Copying ACLs per chunk for Drive's sharing model is fragile; use coarse pre-filter (tenant, group membership snapshot) plus fine post-filter through a ReBAC service (OpenFGA-style) with over-fetching. Never cache answers across users.\n- **Retrieval:** hybrid BM25 + vector, RRF, rerank top 50 → 8; query rewrite for follow-ups; source routing (Slack vs docs).\n- **Generation:** cite chunk IDs; validate citations against retrieved set; abstain when nothing relevant.\n- **Model hosting:** a hosted API is simplest. If documents may not leave the company, serve an open-weights model (Llama, Qwen, Mistral) with vLLM inside your network, and size the GPUs on measured goodput at the ~3 questions a second peak, not on a guess.\n- **Evals:** retrieval recall@8 per source; permission leak tests (must-never); groundedness judge calibrated on 150 labels.\n- **Failure modes:** stale permissions (revocation lag SLO), Slack noise, outdated docs outranking current ones (freshness boost), prompt injection in shared docs (assistant has no write tools; no external links rendered).\n\n<\/details>\n\n## Drill 2: Customer support agent that can issue refunds\n\n*E-commerce, 50,000 conversations/day. The agent should resolve order status, returns, and refunds up to a limit. Fraud is a concern.*\n\n<details><summary>Solution outline<\/summary>\n\n- This is Relay. Key points: router to send simple intents to a small model; tool tiers with refund limits in code; identity from auth context only; approvals for high-value refunds as a state machine with idempotent execution; quarantined processing of emails and reviews.\n- **Estimate:** 50k × ~7 calls × ~11k tokens → caching essential; compute cost per conversation for no-cache, cache, and routing designs.\n- **Fraud:** per-customer refund velocity limits, anomaly alerts on refund rate, human review sampling, never let memory or content grant permissions.\n- **Evals:** τ-bench-style end-state checks; must-not-call cases; red-team via reviews and emails; pass^k on refund flows.\n- **Ops:** kill switch for `issue_refund`; cost and refund-rate alerts; canary on escalation and refund rates.\n\n<\/details>\n\n## Drill 3: Coding agent that opens pull requests from bug reports\n\n*Given a GitHub issue, the agent reproduces the bug, writes a fix and a test, and opens a PR for human review. 500 issues/day across 200 repos.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Execution environment:** per-task sandboxed containers with repo checkout, no production credentials, egress restricted to package registries.\n- **Agent:** single agent with file read/write, search (grep), shell (in sandbox), test runner. Long context needs: just-in-time file exploration, compaction, notes file.\n- **Durability:** tasks take 5 to 30 minutes; run in workers with checkpoints; budgets per task (tokens and wall time).\n- **Security:** issue text is untrusted (injection could ask to exfiltrate secrets or add a backdoor). No secrets in sandbox; PRs always human-reviewed; diff scanners for suspicious changes (CI config, credentials, network calls).\n- **Evals:** historical issues with known fixes (SWE-bench style): does the generated test fail before and pass after? Hidden tests. Measure resolve rate, PR acceptance rate in production.\n- **Cost:** long agent runs; prompt caching on repo context; cap steps; route trivial issues (typos, docs) to cheaper path.\n\n<\/details>\n\n## Drill 4: Document processing pipeline for insurance claims\n\n*Extract 40 fields from scanned claim forms and attachments (photos, invoices), validate, and route for approval. 100,000 documents/day, accuracy matters more than latency.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Workflow, not agent:** the path is known. Steps: classify document type → OCR/vision extraction with structured output schema → code validation (dates, totals, policy number checksum) → cross-document consistency checks → confidence scoring → auto-approve, human review, or reject.\n- **Batch:** use the provider's batch API for cost (OpenAI, Anthropic and Gemini all offer one), or run an open model offline at high batch size if you self-host; queue with priority lanes for urgent claims.\n- **Human in the loop:** low-confidence fields highlighted in a review UI; corrections stored as labelled data.\n- **Evals:** field-level precision/recall per document type on a labelled set; end-to-end decision accuracy; calibration of confidence scores (are 0.9-confidence fields right 90% of the time?).\n- **Compliance:** PII handling, audit log of every decision with model version, explainability for denials, data residency.\n\n<\/details>\n\n## Drill 5: Multi-tenant RAG platform (B2B SaaS)\n\n*Each customer company uploads its own documents and gets a chat assistant. 2,000 tenants, from 100 to 5M documents each.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Isolation:** namespace per tenant (or RLS on shared tables for small tenants, dedicated indexes for large ones). Tenant ID from auth, enforced at the storage layer.\n- **Noisy neighbours:** per-tenant ingestion queues and rate limits; per-tenant model token budgets; fair scheduling.\n- **Sharding:** by tenant; large tenants get dedicated shards; small tenants packed.\n- **Customisation:** per-tenant prompts and settings stored as versioned config; per-tenant eval sets for top customers.\n- **Cost attribution:** tokens, storage, and compute per tenant; pricing tiers map to models and limits.\n- **Failure modes:** cross-tenant cache hits, embedding model migration across 2,000 tenants (blue/green per tenant, gradual), one tenant's malicious documents attempting injection (no cross-tenant tools; outputs scoped).\n\n<\/details>\n\n## Drill 6: Research agent that writes reports from the web\n\n*Users ask open-ended questions (\"compare battery chemistries for grid storage\"); the agent searches, reads, and writes a cited 2,000-word report in under 10 minutes.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Multi-agent is justified:** orchestrator plans sub-questions; parallel sub-agents search and read (context isolation for large pages); orchestrator synthesises; a citation checker verifies each claim against sources.\n- **Delegation quality:** explicit sub-task specs with output format and scope; effort scaling by question complexity.\n- **Async UX:** job with progress events over SSE; resumable.\n- **Security:** web content is untrusted; sub-agents have read-only tools; no private data in this flow, so the trifecta lacks private data (keep it that way: do not add user document access without isolation).\n- **Evals:** rubric-based judges for coverage, accuracy, citation faithfulness; human expert review sample; cost and time per report.\n- **Cost:** multi-agent uses many times the tokens of chat; cap sub-agents and searches per depth tier.\n\n<\/details>\n\n## Drill 7: Voice assistant for restaurant phone orders\n\n*Takes orders by phone, answers menu questions, handles modifications. Must feel natural: under 800 ms response latency.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Latency budget dominates:** streaming speech-to-text, a small fast model for dialogue, streaming text-to-speech, start speaking on first clause. Total budget: STT final ~200 ms + LLM TTFT ~300 ms + TTS first audio ~200 ms.\n- **Structure:** order state as a structured object updated by tool calls (`add_item`, `modify_item`), not free text; confirm the order by reading it back.\n- **Context:** menu in a cached prefix; keep conversation short.\n- **Failure modes:** mishearing (confirmations, spelling-sensitive items), barge-in handling, allergies (hard rules: escalate or confirm; never guess), payment (never by voice to the model; hand to secure IVR or link).\n- **Evals:** recorded call simulations with noise and accents; order accuracy (end-state), latency p95, handoff rate.\n\n<\/details>\n\n## Drill 8: Add memory to an existing chat assistant with 10M users\n\n*Users want the assistant to remember preferences and past context. Privacy and correctness are critical.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Write path:** background extraction after sessions, small model, structured atomic facts with confidence and source; consolidation (add, update, skip) against existing memories; never store instructions or sensitive categories without consent.\n- **Read path:** profile summary always injected (small), plus semantic retrieval of relevant memories filtered by user ID; memory labelled as possibly outdated.\n- **Scale:** 10M users × ~50 memories × 1 KB ≈ 500 GB text + vectors; shard by user ID; most users inactive, so tiered storage.\n- **User control:** view, edit, delete memories; \"forget this\" commands; full deletion on account removal including vectors, caches, traces.\n- **Evals:** extraction precision (wrong memories are worse than none), personalization benefit via A/B on satisfaction, memory poisoning red-team.\n- **Failure modes:** stale facts, cross-user leakage (filter enforced at storage layer), creepiness (surfacing remembered facts unexpectedly).\n\n<\/details>\n"}, {"id": "glossary", "week": 99, "kind": "page", "title": "Glossary", "short": "Glossary", "summary": "Short, plain definitions of the terms used throughout the course, from ADR and goodput to KV cache and τ-bench.", "minutes": 0, "body": "\n| Term | Meaning |\n|---|---|\n| **A2A** | Agent2Agent protocol. An open protocol, now at the Linux Foundation, for one agent to discover and delegate to another agent built by a different team or vendor. MCP connects agents to tools; A2A connects agents to agents. |\n| **ADR** | Architecture decision record. A one-page note of one decision: context, options, choice, consequences, and when to revisit. |\n| **Agent** | A loop in which a model chooses actions (tool calls) based on what it observes, until it decides the task is done. |\n| **ANN** | Approximate nearest neighbour search. Finds vectors close to a query fast, trading a little accuracy. HNSW and IVF are common index types. |\n| **At-least-once delivery** | A queue guarantee that every message is delivered, possibly more than once. Requires idempotent handlers. |\n| **BM25** | A classic keyword ranking function based on term frequency and rarity. Strong on exact terms and identifiers. |\n| **Burn rate** | How fast you are consuming your error budget relative to the sustainable rate. Used for SLO alerting. |\n| **Chunked prefill** | Splitting a long prompt's prefill into pieces of a few thousand tokens and running each piece alongside other users' decode steps, so one long prompt does not freeze everyone's stream. |\n| **Circuit breaker** | A wrapper that stops calling a failing dependency for a cool-down period and uses a fallback instead. |\n| **Cohen's kappa** | Agreement between two raters corrected for chance agreement. Used to compare a judge with human labels. |\n| **Compaction** | Summarising older conversation turns to keep the context within budget. |\n| **Context engineering** | Deciding what tokens go into each model call, in what order and form: instructions, tools, memory, retrieved data, history. |\n| **Contextual retrieval** | Adding a short, model-generated description of where a chunk sits in its document before embedding and indexing it. |\n| **Continuous batching** | Scheduling at the level of each decode step, so a new request takes a slot the moment another finishes instead of waiting for the whole batch. Introduced as iteration-level scheduling in Orca; every modern serving engine does it. |\n| **Cross-encoder (reranker)** | A model that reads a query and a document together to score relevance. Accurate, too slow for first-stage search. |\n| **Dead-letter queue (DLQ)** | Where jobs go after exhausting retries, so they do not block the queue and can be inspected. |\n| **Decode** | The second phase of generation: writing the reply one token at a time, running the whole model once per token. Limited mainly by memory bandwidth; sets TPOT. |\n| **Disaggregated serving** | Running prefill and decode on separate GPU pools, shipping the KV cache between them, so each pool is sized and tuned for its own bottleneck. |\n| **Dual LLM pattern** | Separating a privileged model with tools from a quarantined model that reads untrusted content, so injected text cannot trigger actions. |\n| **Embedding** | A vector representation of text where similar meanings are close together. |\n| **Error analysis** | Reading traces, noting the first failure in each, and grouping failures into categories to prioritise work and evals. |\n| **Error budget** | The amount of unreliability an SLO allows over a period (for example 0.5% of requests in 30 days). |\n| **Expert parallelism** | Spreading the experts of an MoE model across GPUs, with the network routing each token to the GPUs that hold its chosen experts. |\n| **FP8** | An 8-bit floating-point number format. Halves weight memory against 16-bit and is natively supported on NVIDIA Hopper (H100, H200); the usual safe default for quantized serving there. |\n| **Golden signals** | Latency, traffic, errors, saturation: the core service health metrics. |\n| **Goodput** | The highest request rate a system can serve while meeting its latency targets (TTFT and TPOT). Counts only work that arrived in time, unlike raw throughput. |\n| **Groundedness** | Whether an answer's claims are supported by the provided sources. |\n| **Guardrail** | A check outside the main model call that can block, modify, or flag inputs, outputs, or tool calls. |\n| **HNSW** | Hierarchical Navigable Small World graph. The most common ANN index; fast and accurate, memory-hungry. |\n| **Hybrid search** | Combining lexical (BM25) and vector search, usually with rank fusion. |\n| **HyDE** | Hypothetical Document Embeddings. Embed a generated hypothetical answer instead of the question to improve retrieval. |\n| **Idempotency key** | A client-supplied unique key that lets a server recognise and safely deduplicate retried requests. |\n| **Indirect prompt injection** | Malicious instructions embedded in content the agent processes (web pages, emails, documents, tool results). |\n| **KV cache** | The keys and values of every earlier token, kept in GPU memory so each new token does not recompute them. Grows with every token of every live conversation; usually the largest use of memory under load. |\n| **Lethal trifecta** | Private data access + untrusted content + external communication. Together they enable data exfiltration via injection. |\n| **Little's law** | Concurrency = arrival rate × time in system. Used to size instances. |\n| **LLM-as-judge** | Using a model to grade outputs against criteria. Must be calibrated against human labels. |\n| **McNemar's test** | A statistical test on paired pass/fail results, used to decide if a version regressed on the same cases. |\n| **MCP** | Model Context Protocol. An open protocol for connecting models and agents to tools and data sources through servers. |\n| **Memory poisoning** | Getting false facts or instructions stored in an agent's long-term memory so they affect future sessions. |\n| **Model gateway** | A proxy between your application and model providers (LiteLLM, OpenRouter, Hugging Face Inference Providers, or your own) that gives one API, one set of keys, fallbacks, budgets, and logging across hosted and self-hosted models. |\n| **Model spec** | A published document in which a model developer states how its models should behave, including whose instructions win when system, developer and user disagree. OpenAI's Model Spec calls this the chain of command. |\n| **MoE** | Mixture of experts. A model with many expert sub-networks per layer, of which a router activates only a few per token. Memory follows total parameters; compute per token follows active parameters. |\n| **MRR** | Mean reciprocal rank. The average of 1/rank of the first relevant result. |\n| **nDCG** | Normalised discounted cumulative gain. A rank-aware relevance metric supporting graded relevance. |\n| **NVFP4** | NVIDIA's 4-bit floating-point format for Blackwell GPUs: 4-bit values in blocks of 16, each block with its own FP8 scale, about 4.5 bits per value in total. |\n| **OpenAI-compatible API** | The chat completions request and response format that OpenAI introduced and many others accept: Gemini, vLLM, SGLang, Ollama, OpenRouter, LiteLLM and Hugging Face Inference Providers. Switching provider is often a change of base URL, key and model name, but features such as caching and tool-call details still differ. |\n| **OpenTelemetry (OTel)** | The vendor-neutral standard for traces, metrics, and logs, with semantic conventions for GenAI. |\n| **Outbox pattern** | Writing an event to an outbox table in the same transaction as the data change, then publishing it, to avoid dual-write inconsistency. |\n| **PagedAttention** | The vLLM technique of storing the KV cache in small fixed-size blocks allocated as tokens arrive, like virtual memory pages, which cuts wasted cache memory to a few percent. |\n| **pass@k / pass^k** | Passed at least once in k trials (capability) / passed in all k trials (reliability). |\n| **pgvector** | A Postgres extension for vector storage and similarity search. |\n| **Prefill** | The first phase of generation: reading the whole prompt in one parallel pass and building its KV cache. Compute-bound; sets most of TTFT. |\n| **Prompt caching** | Provider-side reuse of a processed prompt prefix, giving cheaper and faster input tokens on repeats. |\n| **Prompt injection** | Input that causes a model to follow an attacker's instructions instead of the developer's. |\n| **Quantization** | Storing model weights (and sometimes the KV cache) in fewer bits, such as FP8, INT4 or NVFP4 instead of 16-bit, for faster decode and more memory headroom. Check quality on your own evals. |\n| **RAG** | Retrieval-augmented generation. Retrieving relevant data and putting it in the prompt so the model can use it. |\n| **Recall@k** | The fraction of relevant items that appear in the top k results. |\n| **RLS** | Row-level security. Database policies that restrict which rows a session can see, enforcing tenant isolation. |\n| **RRF** | Reciprocal rank fusion. Combines ranked lists by summing 1/(k + rank). |\n| **Semantic cache** | A cache that returns a stored answer for a sufficiently similar question. Risky for personalised or permissioned content. |\n| **Shadow mode** | Running a new version on copies of live traffic without showing or acting on its output, to compare with the current version. |\n| **SLI / SLO** | Service level indicator (what you measure) / objective (the target). |\n| **Span / trace** | A span is one timed unit of work; a trace is the tree of spans for one request. |\n| **Speculative decoding** | A small draft model (or extra heads) guesses several tokens and the large model verifies them in one pass. Same output distribution, fewer passes; helps most when the GPU is not already busy. |\n| **SSE** | Server-sent events. A simple HTTP streaming format for sending tokens to a browser. |\n| **Tail sampling** | Deciding which traces to keep after they complete, so you can keep all errors and outliers. |\n| **Tensor / pipeline parallelism** | Two ways to split a model too big for one GPU. Tensor parallelism slices every layer across GPUs that talk constantly, so it stays inside one fast node; pipeline parallelism gives each GPU a block of layers and can span nodes. |\n| **Tool calling** | The model requests a function call with structured arguments; your code executes it and returns the result. |\n| **TPOT** | Time per output token, also called inter-token latency. The steady gap between streamed tokens during decode. |\n| **TTFT** | Time to first token. How long until the user sees output begin. |\n| **Workflow** | A fixed path of LLM calls and code, where your code decides the order of steps. |\n| **τ-bench** | A benchmark for tool-using agents in customer-service domains, with simulated users and database-state grading. |\n"}, {"id": "resources", "week": 99, "kind": "page", "title": "Reading list", "short": "Reading list", "summary": "Every free resource used in the course, grouped by topic, with a note on why each one is worth your time.", "minutes": 0, "body": "\nAll links are free to read. Starred items (★) are the ones to read if you only have time for a few. The course is provider-neutral: where one vendor has a good guide, the equivalent from other providers and from the open-model world sits next to it, so you can learn on whichever stack you use.\n\n## Other free courses worth taking alongside this one\n\n- [LLM Zoomcamp](https://github.com/DataTalksClub/llm-zoomcamp), DataTalks.Club. 10 weeks, video lectures, graded homework in cohorts, strong on RAG, evaluation, and monitoring.\n- [Production Agentic RAG course](https://github.com/jamwithai/production-agentic-rag-course), Jam with AI. A 7-week build of an arXiv research assistant with a tagged code release per week: BM25 first, then hybrid search, Langfuse, caching, and LangGraph agentic RAG. Weekly write-ups on [the Jam with AI Substack](https://jamwithai.substack.com/).\n- [Anthropic Academy](https://anthropic.skilljar.com/) and [Anthropic's course notebooks](https://github.com/anthropics/courses): the Claude API, tool use, MCP, and agent skills.\n- [5-Day AI Agents Intensive](https://www.kaggle.com/learn-guide/5-day-agents) and [5-Day Gen AI Intensive](https://www.kaggle.com/learn-guide/5-day-genai), Google and Kaggle. Self-paced guides that pair Google whitepapers with notebooks; the agents run (November 2025) drew over 1.5 million learners ([Google's recap](https://blog.google/technology/developers/ai-agents-intensive-recap/)).\n- [AI Agents for Beginners](https://github.com/microsoft/ai-agents-for-beginners), Microsoft. 18 open (MIT) lessons from tool use and agentic RAG to memory, protocols, production and security; its samples need an Azure account. The companion [Generative AI for Beginners](https://github.com/microsoft/generative-ai-for-beginners) has 21 lessons on the basics.\n- [Hugging Face Agents Course](https://huggingface.co/learn/agents-course), the best free route to agents on open-weights models, with smolagents, LangGraph and LlamaIndex units.\n- [OpenAI Cookbook](https://developers.openai.com/cookbook), runnable notebooks for tool calling, evals, retrieval and agents.\n- [LLM Twin course](https://github.com/decodingai-magazine/llm-twin-course), Decoding AI, and the companion [LLM Engineer's Handbook code](https://github.com/PacktPublishing/LLM-Engineers-Handbook): end-to-end LLMOps on AWS.\n- [Gaurav Sen's YouTube channel](https://www.youtube.com/@gkcs): short videos on AI system design topics such as multi-agent failures, chatbot latency, long context windows, and speculative decoding. His [AI Engineering course](https://interviewready.io/course-page/ai-engineering) on InterviewReady ($55) covers LLM internals, optimisations, and reasoning.\n- [Krish Naik's Agentic AI roadmap](https://github.com/krishnaik06/Roadmap-To-Learn-Agentic-AI): free YouTube playlists for LangChain, LangGraph, MCP, CrewAI, and AutoGen. Strongest for breadth across frameworks.\n- [LangChain Academy](https://academy.langchain.com/) for LangGraph, and [DeepLearning.AI short courses](https://www.deeplearning.ai/short-courses/) for one-to-two-hour introductions to specific tools.\n\n## Foundations\n\n- ★ [Intro to Large Language Models](https://www.youtube.com/watch?v=zjkBMFhNj_g), Andrej Karpathy. One hour, the best mental model of what an LLM is.\n- ★ [Building A Generative AI Platform](https://huyenchip.com/2024/07/25/genai-platform.html), Chip Huyen. A reference architecture for everything in this course.\n- [AI Engineering book resources](https://github.com/chiphuyen/aie-book), Chip Huyen's companion repo.\n- ★ [What We Learned from a Year of Building with LLMs](https://applied-llms.org/), practitioners' lessons across tactics, operations, and strategy.\n- [Patterns for Building LLM-based Systems & Products](https://eugeneyan.com/writing/llm-patterns/), Eugene Yan.\n- [Emerging Patterns in Building GenAI Products](https://martinfowler.com/articles/gen-ai-patterns/), martinfowler.com.\n- [LLM Course](https://github.com/mlabonne/llm-course), Maxime Labonne. A roadmap for deeper ML background.\n- [System Design Primer](https://github.com/donnemartin/system-design-primer), for general distributed systems design.\n\n## Agents and context\n\n- ★ [Building effective agents](https://www.anthropic.com/engineering/building-effective-agents), Anthropic.\n- [How we built our multi-agent research system](https://www.anthropic.com/engineering/multi-agent-research-system), Anthropic.\n- [Don't build multi-agents](https://cognition.ai/blog/dont-build-multi-agents), Cognition.\n- ★ [Effective context engineering for AI agents](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents), Anthropic.\n- [Writing effective tools for agents](https://www.anthropic.com/engineering/writing-tools-for-agents), Anthropic.\n- [Context Engineering for Agents](https://rlancemartin.github.io/2025/06/23/context_engineering/), Lance Martin.\n- [The New Skill in AI is Context Engineering](https://www.philschmid.de/context-engineering), Philipp Schmid.\n- [Context Rot](https://www.trychroma.com/research/context-rot), Chroma research.\n- [12-factor agents](https://github.com/humanlayer/12-factor-agents), HumanLayer.\n- [LLM Powered Autonomous Agents](https://lilianweng.github.io/posts/2023-06-23-agent/), Lilian Weng.\n- [ReAct](https://arxiv.org/abs/2210.03629), [MemGPT](https://arxiv.org/abs/2310.08560), [Generative Agents](https://arxiv.org/abs/2304.03442), [CoALA](https://arxiv.org/abs/2309.02427): foundational papers.\n- [LangGraph memory overview](https://docs.langchain.com/oss/python/langgraph/memory).\n- Open-source memory layers to study: [Mem0](https://github.com/mem0ai/mem0), [Letta](https://github.com/letta-ai/letta), [Graphiti](https://github.com/getzep/graphiti).\n- ★ [A practical guide to building agents](https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf), OpenAI. 34 pages on when an agent is worth it, single agent before multi-agent, and guardrails as layered defence. Read it next to Anthropic's essay: they agree.\n- [Why Do Multi-Agent LLM Systems Fail?](https://arxiv.org/abs/2503.13657), the MAST taxonomy: 14 failure modes from 1,600+ annotated traces, a ready-made checklist for reading multi-agent traces.\n\n## Retrieval\n\n- ★ [Contextual Retrieval](https://www.anthropic.com/engineering/contextual-retrieval), Anthropic.\n- ★ [Systematically Improving Your RAG](https://jxnl.co/writing/2024/05/22/systematically-improving-your-rag/), Jason Liu.\n- [pgvector](https://github.com/pgvector/pgvector) and [pgvector-python](https://github.com/pgvector/pgvector-python).\n- [HNSW explained](https://www.pinecone.io/learn/series/faiss/hnsw/), Pinecone, and the [HNSW paper](https://arxiv.org/abs/1603.09320).\n- [Hybrid search explained](https://weaviate.io/blog/hybrid-search-explained), Weaviate.\n- [Reciprocal Rank Fusion](https://plg.uwaterloo.ca/~gvcormac/cormacksigir09-rrf.pdf), the original paper.\n- [Retrieve and re-rank](https://sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html), Sentence-Transformers.\n- [MTEB leaderboard](https://huggingface.co/spaces/mteb/leaderboard) for embedding models.\n- [Qdrant filtering](https://qdrant.tech/documentation/concepts/filtering/) and [Postgres full-text search](https://www.postgresql.org/docs/current/textsearch.html).\n- [Docling](https://github.com/docling-project/docling) for document parsing.\n- Papers: [RAG](https://arxiv.org/abs/2005.11401), [Lost in the Middle](https://arxiv.org/abs/2307.03172), [HyDE](https://arxiv.org/abs/2212.10496), [RAPTOR](https://arxiv.org/abs/2401.18059), [ColBERT](https://arxiv.org/abs/2004.12832), [RAG survey](https://arxiv.org/abs/2312.10997), [Financial report chunking](https://arxiv.org/abs/2402.05131).\n- Authorization: [OpenFGA](https://openfga.dev/) and the [Zanzibar paper](https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/).\n\n## Evals\n\n- ★ [Your AI Product Needs Evals](https://hamel.dev/blog/posts/evals/), Hamel Husain.\n- ★ [AI Evals FAQ](https://hamel.dev/blog/posts/evals-faq/), Hamel Husain and Shreya Shankar.\n- [Creating a LLM-as-a-Judge That Drives Business Results](https://hamel.dev/blog/posts/llm-judge/), Hamel Husain.\n- [Evaluating the Effectiveness of LLM-Evaluators](https://eugeneyan.com/writing/llm-evaluators/), Eugene Yan.\n- ★ [Demystifying evals for AI agents](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents), Anthropic.\n- Papers: [τ-bench](https://arxiv.org/abs/2406.12045), [Judging LLM-as-a-Judge](https://arxiv.org/abs/2306.05685), [Who Validates the Validators?](https://arxiv.org/abs/2404.12272), [RAGAS](https://arxiv.org/abs/2309.15217), [AgentBench](https://arxiv.org/abs/2308.03688).\n- Tools: [promptfoo](https://github.com/promptfoo/promptfoo), [Inspect](https://inspect.aisi.org.uk/), [DeepEval](https://github.com/confident-ai/deepeval), [RAGAS](https://docs.ragas.io/), [τ-bench code](https://github.com/sierra-research/tau-bench), [OpenAI evals](https://github.com/openai/evals).\n\n## Security\n\n- ★ [The lethal trifecta](https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/), Simon Willison, and his [prompt injection series](https://simonwillison.net/series/prompt-injection/).\n- [The Dual LLM pattern](https://simonwillison.net/2023/Apr/25/dual-llm-pattern/), Simon Willison.\n- ★ [Design Patterns for Securing LLM Agents against Prompt Injections](https://arxiv.org/abs/2506.08837).\n- [Defeating Prompt Injections by Design (CaMeL)](https://arxiv.org/abs/2503.18813).\n- [Indirect prompt injection](https://arxiv.org/abs/2302.12173), Greshake et al.\n- [OWASP Top 10 for LLM Applications](https://genai.owasp.org/llm-top-10/) and [OWASP API Security Top 10](https://owasp.org/API-Security/).\n- [MCP security best practices](https://modelcontextprotocol.io/specification/2026-07-28/basic/security_best_practices).\n- [Adversarial attacks on LLMs](https://lilianweng.github.io/posts/2023-10-25-adv-attack-llm/), Lilian Weng.\n- [Embrace The Red](https://embracethered.com/blog/), real-world AI exploit write-ups.\n- [MITRE ATLAS](https://atlas.mitre.org/), adversarial technique catalogue.\n- Tools: [AgentDojo](https://github.com/ethz-spylab/agentdojo), [garak](https://github.com/NVIDIA/garak), [PyRIT](https://github.com/Azure/PyRIT), [promptfoo red teaming](https://www.promptfoo.dev/docs/red-team/), [Presidio](https://microsoft.github.io/presidio/), [NeMo Guardrails](https://github.com/NVIDIA/NeMo-Guardrails), [Guardrails AI](https://github.com/guardrails-ai/guardrails).\n- ★ [Purple Llama](https://github.com/meta-llama/PurpleLlama), Meta's open trust and safety tools, which work in front of any model: [Llama Guard 4](https://huggingface.co/meta-llama/Llama-Guard-4-12B) (a 12B multimodal input and output classifier on the MLCommons hazard taxonomy), [Llama Prompt Guard 2](https://huggingface.co/meta-llama/Llama-Prompt-Guard-2-86M) (86M and 22M injection and jailbreak detectors), and CyberSecEval benchmarks.\n- [OpenAI Model Spec](https://model-spec.openai.com/), how one lab says its models should rank system, developer and user instructions (the chain of command). Useful vocabulary when you design your own instruction hierarchy.\n- [NIST AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework).\n\n## Deployment and operations\n\n- [FastAPI](https://fastapi.tiangolo.com/), including [security](https://fastapi.tiangolo.com/tutorial/security/) and [Docker](https://fastapi.tiangolo.com/deployment/docker/) guides.\n- [uv with Docker](https://docs.astral.sh/uv/guides/integration/docker/) and [with GitHub Actions](https://docs.astral.sh/uv/guides/integration/github/).\n- [The Twelve-Factor App](https://12factor.net/).\n- [Docker build best practices](https://docs.docker.com/build/building/best-practices/).\n- [GitHub Actions](https://docs.github.com/en/actions) and its [security hardening guide](https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions).\n- [Cloud Run](https://cloud.google.com/run/docs), [Fly.io](https://fly.io/docs/), [Render free tier](https://render.com/docs/free), [Kubernetes autoscaling](https://kubernetes.io/docs/concepts/workloads/autoscaling/).\n- ★ [Implementing Stripe-like Idempotency Keys in Postgres](https://brandur.org/idempotency-keys), Brandur Leach.\n- [Transactional outbox](https://microservices.io/patterns/data/transactional-outbox.html).\n- [Temporal](https://docs.temporal.io/), [arq](https://arq-docs.helpmanual.io/), [RQ](https://python-rq.org/), [Celery](https://docs.celeryq.dev/).\n- [SLSA](https://slsa.dev/) for supply-chain integrity.\n- [AWS Well-Architected Generative AI Lens](https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html).\n\n## Observability and scaling\n\n- ★ [OpenTelemetry GenAI semantic conventions](https://github.com/open-telemetry/semantic-conventions-genai/tree/main/docs/gen-ai) and [OTel Python](https://opentelemetry.io/docs/languages/python/).\n- [OpenLLMetry](https://github.com/traceloop/openllmetry), [Langfuse](https://langfuse.com/docs), [Arize Phoenix](https://github.com/Arize-ai/phoenix).\n- ★ Google SRE: [Monitoring Distributed Systems](https://sre.google/sre-book/monitoring-distributed-systems/), [Service Level Objectives](https://sre.google/sre-book/service-level-objectives/), [Alerting on SLOs](https://sre.google/workbook/alerting-on-slos/), the [full SRE book](https://sre.google/sre-book/table-of-contents/).\n- [Timeouts, retries, and backoff with jitter](https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/), Amazon Builders' Library.\n- [Circuit Breaker](https://martinfowler.com/bliki/CircuitBreaker.html), Martin Fowler.\n- Prompt caching, three ways: [Anthropic](https://platform.claude.com/docs/en/build-with-claude/prompt-caching) (marked breakpoints), [OpenAI](https://developers.openai.com/api/docs/guides/prompt-caching) (automatic, with explicit breakpoints on newer models), [Gemini](https://ai.google.dev/gemini-api/docs/caching) (implicit by default, explicit cache objects optional). Compare minimum lengths and write prices before you design your prompt order.\n- [Artificial Analysis](https://artificialanalysis.ai/) for model speed and price comparisons.\n- [Prometheus](https://prometheus.io/docs/introduction/overview/), [Grafana](https://grafana.com/docs/grafana/latest/), [Sentry](https://docs.sentry.io/).\n\n## Protocols\n\n- ★ [MCP specification](https://modelcontextprotocol.io/specification/latest) (current version 2026-07-28), the source of truth for how tools, resources and prompts reach any agent, with its own security principles.\n- [A2A specification](https://a2a-protocol.org/latest/specification/) (v1.0), for agents that delegate to agents another team or vendor runs.\n- [Code execution with MCP](https://www.anthropic.com/engineering/code-execution-with-mcp), Anthropic, on cutting tool-definition tokens by letting the agent call tools from code.\n\n## Provider docs: tool calling and agent SDKs\n\nThe same concepts, in each provider's words. Read the one you build on, and skim one other to see what is a standard and what is a vendor choice.\n\n- Tool calling: [OpenAI](https://developers.openai.com/api/docs/guides/function-calling), [Gemini](https://ai.google.dev/gemini-api/docs/function-calling), [Claude](https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview). The JSON schema shapes differ slightly; the loop is the same.\n- [OpenAI Agents SDK](https://openai.github.io/openai-agents-python/): agents, handoffs, guardrails, sessions and tracing in a small API, with adapters (LiteLLM, Any-LLM) for non-OpenAI models.\n- [Google Agent Development Kit (ADK)](https://adk.dev/): open-source, in Python, TypeScript, Go, Java and Kotlin, works with Gemini and other models, with built-in evaluation and user simulation.\n- [Microsoft Foundry Agent Service](https://learn.microsoft.com/en-us/azure/foundry/agents/overview): a managed runtime for prompt agents or your own containerised agent (Agent Framework, LangGraph, OpenAI or Anthropic SDKs), with tracing, evaluation and A2A endpoints. A good map of what \"managed agents\" means.\n- [Claude cookbooks](https://github.com/anthropics/claude-cookbooks) and the [OpenAI Cookbook](https://developers.openai.com/cookbook): worked notebooks per provider.\n- [Gemini's OpenAI compatibility](https://ai.google.dev/gemini-api/docs/openai): call Gemini with the OpenAI client by changing the base URL, a concrete example of the OpenAI-compatible API.\n- Other frameworks to compare: [Pydantic AI](https://github.com/pydantic/pydantic-ai), [smolagents](https://huggingface.co/docs/smolagents/index) (Hugging Face; code-writing agents, any model through Inference Providers, LiteLLM, Transformers or Ollama), [LlamaIndex](https://docs.llamaindex.ai/en/stable/).\n\n## Open models, serving, and gateways\n\n- ★ [vLLM OpenAI-compatible server](https://docs.vllm.ai/en/latest/serving/online_serving/): `vllm serve <model>` gives Llama, Qwen, DeepSeek or Mistral weights the same chat, Responses and embeddings endpoints your app already calls.\n- [SGLang](https://docs.sglang.io/), high-throughput serving with RadixAttention prefix caching, used for large MoE deployments.\n- [Ollama](https://ollama.com/) and its [OpenAI compatibility](https://docs.ollama.com/api/openai-compatibility) (`http://localhost:11434/v1`): the quickest way to run an open model on a laptop for development and evals.\n- [OGX](https://github.com/ogx-ai/ogx), formerly Meta's Llama Stack: an open-source, OpenAI-compatible server that adds vector stores, files, tool calling and agent orchestration on top of pluggable model providers.\n- [Hugging Face Inference Providers](https://huggingface.co/docs/inference-providers/index): open-weights models on many hosts (Groq, Together, Cerebras, Fireworks and others) behind one token and an OpenAI-compatible router, with `:fastest` and `:cheapest` selection.\n- [OpenRouter](https://openrouter.ai/docs/quickstart): hundreds of hosted and open models through one OpenAI-compatible endpoint, with automatic fallbacks.\n- [LiteLLM](https://docs.litellm.ai/docs/): a self-hosted gateway over 100+ providers in the OpenAI format, with retries, fallbacks, virtual keys, budgets and spend tracking per team.\n- Inference background: [Optimizing your LLM in production](https://huggingface.co/blog/optimize-llm), [PagedAttention](https://arxiv.org/abs/2309.06180), [speculative decoding](https://arxiv.org/abs/2211.17192), and this course's [inference lesson](#w5-inference).\n"}];

const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  lang = (lang || "").trim();
  if (lang === "mermaid") {
    figCount++;
    return `<figure class="fig" id="fig-${figPrefix}${figCount}"><div class="mmd" data-src="${esc(code)}">${esc(code)}</div><figcaption><b>Fig. ${figPrefix}${figCount}</b></figcaption></figure>`;
  }
  if (lang === "viz") {
    figCount++;
    const lines = code.split("\n");
    const cap = /^caption:/i.test(lines[0]) ? lines.shift().replace(/^caption:\s*/i, "") : "";
    return `<figure class="fig" id="fig-${figPrefix}${figCount}"><div class="viz">${lines.join("\n")}</div><figcaption><b>Fig. ${figPrefix}${figCount}</b>${cap ? " " + marked.parseInline(cap) : ""}</figcaption></figure>`;
  }
  if (lang === "widget") {
    let spec; try { spec = JSON.parse(code); } catch { return `<pre>${esc(code)}</pre>`; }
    return `<div class="widget" data-spec="${esc(JSON.stringify(spec))}"></div>`;
  }
  if (lang === "quiz") {
    let items; try { items = JSON.parse(code); } catch { return `<pre>${esc(code)}</pre>`; }
    const id = "quiz" + (quizCount++);
    const qs = items.map((it, i) => `<div class="q" data-answer="${it.answer}" data-why="${esc(it.why || "")}">
      <p>${i + 1}. ${marked.parseInline(it.q)}</p>

    </div>`).join("");
    return `<div class="quiz" id="${id}"><div class="quiz-head"><span>Check yourself</span><small data-score>0 of ${items.length} answered</small></div>${qs}</div>`;
  }
  const valid = lang && hljs.getLanguage(lang);
  const html = valid ? hljs.highlight(code, { language: lang }).value : esc(code);
  return `<div class="codewrap"><button class="copy" type="button">Copy</button><pre><code class="hljs language-${esc(lang || "text")}">${html}</code></pre></div>`;
};

/* ---------- Sketch figures: rough.js strokes over an HTML layout ---------- */
const INK = { c: "--vz-compute", m: "--vz-memory", g: "--vz-good", w: "--vz-warn", b: "--vz-bad" };
const tone = el => Object.keys(INK).find(k => el.classList.contains(k));
function sketch(fig) {
  if (!window.rough) return;
  const box = fig.getBoundingClientRect();
  if (!box.width) return;
  fig.querySelector(":scope > svg.rough")?.remove();
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "rough"); svg.setAttribute("aria-hidden", "true");
  fig.prepend(svg);
  const rc = rough.svg(svg), ink = css("--ink"), ink2 = css("--ink-2"), sheet = css("--sheet");
  let seed = 11;
  const at = el => { const b = el.getBoundingClientRect(); return { x: b.left - box.left + fig.scrollLeft, y: b.top - box.top, w: b.width, h: b.height }; };
  const o = (extra = {}) => ({ seed: seed++, roughness: 1.1, bowing: 0.8, strokeWidth: 1.4, ...extra });
  fig.querySelectorAll(".sk").forEach(el => {
    const r = at(el), t = tone(el), col = t ? css(INK[t]) : ink2;
    if (el.classList.contains("arr")) {
      const vert = el.classList.contains("d");
      const [x1, y1, x2, y2] = vert ? [r.x + r.w / 2, r.y + 1, r.x + r.w / 2, r.y + r.h - 1] : [r.x + 1, r.y + r.h / 2, r.x + r.w - 1, r.y + r.h / 2];
      svg.appendChild(rc.line(x1, y1, x2, y2, o({ stroke: col })));
      const head = vert ? [[x2 - 5, y2 - 7], [x2, y2], [x2 + 5, y2 - 7]] : [[x2 - 7, y2 - 5], [x2, y2], [x2 - 7, y2 + 5]];
      svg.appendChild(rc.linearPath(head, o({ stroke: col })));
      return;
    }
    const isFill = el.parentElement?.classList.contains("bar") || el.classList.contains("fill");
    const opts = { stroke: col };
    if (isFill) Object.assign(opts, { fill: col, fillStyle: "hachure", hachureGap: 4, fillWeight: 1.6 });
    else if (el.classList.contains("x")) Object.assign(opts, { fill: css("--vz-bad"), fillStyle: "cross-hatch", hachureGap: 6, fillWeight: 0.8 });
    else if (t && !el.classList.contains("vz-panel")) Object.assign(opts, { fill: col + "26", fillStyle: "solid" });
    if (el.classList.contains("ghost")) opts.strokeLineDash = [5, 4];
    if (el.classList.contains("vz-panel")) Object.assign(opts, { roughness: 0.8, strokeWidth: 1.2 });
    if (r.w > 0 && r.h > 0) svg.appendChild(rc.rectangle(r.x + 1, r.y + 1, Math.max(2, r.w - 2), Math.max(2, r.h - 2), o(opts)));
  });
  fig.classList.add("roughed");
  void sheet;
}
const sketchObserver = window.ResizeObserver ? new ResizeObserver(es => es.forEach(e => sketch(e.target))) : null;
function drawSketches(root) {
  root.querySelectorAll(".viz").forEach(f => { sketch(f); sketchObserver?.observe(f); });
  document.fonts?.ready.then(() => root.querySelectorAll(".viz").forEach(sketch)); // hand font changes the layout
}
