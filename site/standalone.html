ing, rich context | More storage, more logic |\n\n```viz\ncaption: The same policy page, chunked four ways. Following the document's own structure keeps each answer in one piece.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk b\"><h5>Fixed size<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">Returns. Tents: 30 days if<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk b\">used. Boots: 60 days<\/span><\/div>\n    <p>a rule split across chunks<\/p>\n  <\/div>\n  <div class=\"vz-panel sk g\"><h5>Structure-aware<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk g\">Returns &gt; Tents<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk g\">Returns &gt; Boots<\/span><\/div>\n    <p>one section, one chunk<\/p>\n  <\/div>\n<\/div>\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk\"><h5>Semantic<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">topic A<\/span><span class=\"ch sk ghost\">split where meaning shifts<\/span><span class=\"ch sk\">topic B<\/span><\/div>\n    <p>for text without headings<\/p>\n  <\/div>\n  <div class=\"vz-panel sk\"><h5>Parent-child<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">small chunk matches<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">whole section returned<\/span><\/div>\n    <p>precise match, full context<\/p>\n  <\/div>\n<\/div>\n```\n\nStart with structure-aware chunks of about 400 to 800 tokens. Then measure. A study on [chunking financial reports](https://arxiv.org/abs/2402.05131) found element-based chunking (following document structure) beat fixed-size chunks.\n\n**Enrichment.** Add metadata to every chunk: title, section path (\"Returns > Tents > Used items\"), source URL, last updated, product IDs mentioned, language. Metadata powers filters, citations, and freshness ranking. **Contextual retrieval**, described in an [engineering post by Anthropic](https://www.anthropic.com/engineering/contextual-retrieval), goes further: prepend a short model-generated sentence situating the chunk in its document (\"This section of the 2026 returns policy covers used tents\") before you embed and index it. The technique works with any model, embedder and reranker; the study itself measured it with Gemini and Voyage embeddings and Cohere's reranker.\n\n```viz\ncaption: In Anthropic's study, adding context to chunks cut retrieval failures by a third, and adding keyword search and a reranker cut them by two thirds.\n<div class=\"vz-bars\"><span>plain embeddings<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:100%\"><\/i><\/span><b>5.7%<\/b><span>+ context<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:65%\"><\/i><\/span><b>3.7%<\/b><span>+ contextual BM25<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:51%\"><\/i><\/span><b>2.9%<\/b><span>+ reranker<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:33%\"><\/i><\/span><b>1.9%<\/b><\/div>\n<p>failure rate: relevant chunk missing from the top 20 (1 minus recall@20)<\/p>\n<div class=\"vz-src\">Source: Anthropic, <a href=\"https://www.anthropic.com/engineering/contextual-retrieval\">Introducing Contextual Retrieval<\/a> (2024): reductions of 35%, 49% and 67%.<\/div>\n```\n\nThe cost is one cheap model call per chunk at ingestion. Every call repeats the whole document, so put the document first and the chunk last, and let prompt caching serve the repeated prefix: OpenAI and Gemini cache long repeated prefixes automatically, Anthropic caches prefixes you mark, and self-hosted vLLM reuses them with [automatic prefix caching](https://docs.vllm.ai/en/latest/features/automatic_prefix_caching.html). Lab 2 shows the call.\n\n## Access control: the part demos skip\n\nIn a real company, not everyone may see every document. Support agents can read internal escalation playbooks; customers cannot. HR documents are restricted to HR. In a multi-tenant SaaS, tenant A must never retrieve tenant B's data. RAG systems routinely get this wrong because the model is good at summarising whatever it is given, including things the user should not see.\n\n> [!rule] Enforce access control in the retrieval query, before the model sees anything. Never rely on the model to withhold restricted content it has already been given.\n\n```viz\ncaption: Filter inside the query and every result is one the user may see. Filter afterwards and you either leak, or keep too few results.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk g\"><h5>Filter in the query<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">principals from auth<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">WHERE acl matches<\/span><\/div>\n    <div class=\"cells\" style=\"--n:10\"><i class=\"sk g\"><\/i><i class=\"sk g\"><\/i><i class=\"sk g\"><\/i><i class=\"sk g\"><\/i><i class=\"sk g\"><\/i><i class=\"sk g\"><\/i><i class=\"sk g\"><\/i><i class=\"sk g\"><\/i><i class=\"sk g\"><\/i><i class=\"sk g\"><\/i><\/div>\n    <p>top 10: all visible<\/p>\n  <\/div>\n  <div class=\"vz-panel sk b\"><h5>Filter after search<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">top 10 of everything<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk\">drop restricted<\/span><\/div>\n    <div class=\"cells\" style=\"--n:10\"><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><\/div>\n    <p>2 left; forget the step and 8 leak<\/p>\n  <\/div>\n<\/div>\n<div class=\"vz-row\"><span class=\"ch sk b\">never: let the model withhold it<\/span><b>it summarises whatever it is given<\/b><\/div>\n```\n\n### Pattern 1: ACLs on chunks, filtered at query time\n\nCopy the permissions from the source into each chunk's metadata at ingestion, then filter every search by the caller's principals.\n\n```sql\n-- chunks.acl holds principals allowed to read: 'group:support', 'user:c_77', 'tenant:acme', 'public'\nSELECT chunk_id, content, 1 - (embedding <=> $1) AS score\nFROM chunks\nWHERE deleted_at IS NULL\n  AND tenant_id = $2                      -- hard tenant boundary\n  AND acl && $3::text[]                   -- overlaps caller's principals, e.g. {'public','user:c_77'}\nORDER BY embedding <=> $1\nLIMIT 20;\n```\n\nThe caller's principals come from your **authentication system**, resolved server-side: the user ID, their groups, their tenant. Never from the request body, and never from the model.\n\n### Pattern 2: hard isolation per tenant\n\nFor strict B2B isolation, give each tenant its own index, namespace, collection, or schema. Postgres row-level security (RLS) is a strong option: the database itself refuses to return other tenants' rows even if a query forgets the filter.\n\n```sql\nALTER TABLE chunks ENABLE ROW LEVEL SECURITY;\nCREATE POLICY tenant_isolation ON chunks\n  USING (tenant_id = current_setting('app.tenant_id'));\n-- each request: SET LOCAL app.tenant_id = 'acme';\n```\n\n| Approach | Isolation strength | Cost at many tenants | Notes |\n|---|---|---|---|\n| Shared index + metadata filter | Depends on every query being right | Lowest | Use with RLS or a repository layer that always adds the filter |\n| Shared table + RLS | Strong, enforced by DB | Low | Good default on Postgres |\n| Namespace / collection per tenant | Strong | Medium | Most vector DBs support namespaces |\n| Separate database per tenant | Strongest | High | For regulated or very large tenants |\n\n### Pattern 3: post-filter with a permission service\n\nWhen permissions are complex and change often (Google Drive-style sharing, nested groups), copying ACLs into every chunk becomes a sync nightmare. Instead, retrieve candidates and then check each against an authorization service built on relationship-based access control, such as [OpenFGA](https://openfga.dev/), which is modelled on Google's [Zanzibar](https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/).\n\nThe catch: if you retrieve 20 candidates and the user may see only 2, your results are thin. Over-fetch (retrieve 100, filter, keep 20), or combine with a coarse pre-filter (tenant, department) and a fine post-filter.\n\n### Keeping permissions in sync\n\nPermissions change more often than content. Someone leaves the HR group; a document gets unshared. Treat **permission changes as ingestion events**: when the source reports an ACL change, update the ACL on all chunks of that document (one `UPDATE ... WHERE doc_id = $1`) without re-embedding. Put ACLs at the document level and join or denormalise, so the update is cheap.\n\n> [!warn] Permission revocation must be fast and verified. Write an eval: grant access, retrieve, revoke, retrieve again, assert the document is gone. Run it in CI.\n\n### Access control beyond retrieval\n\nRetrieval is not the only leak path. Also check:\n\n- **Caches.** A semantic cache keyed only on the question will serve one user's answer, built from their private documents, to another user. Include the permission scope in the cache key (Week 5).\n- **Memory.** Memories from one user must never be retrieved for another.\n- **Tool results.** Tools must run with the end user's permissions, not a superuser service account.\n- **Logs and traces.** Traces contain retrieved content. Restrict who can read them.\n\n## Design review questions\n\n> [!interview] Who can see this chunk, where is that decided, and how long after a permission change does retrieval reflect it?\n\n> [!interview] A PDF crashes the parser. What happens to it, and what happens to the 10,000 jobs behind it?\n\n> [!interview] What is your ingestion lag at p95, and what is the alert threshold?\n\n> [!interview] Show me the query path that would leak tenant A's data to tenant B if a developer forgot one line. What stops it?\n\n## Further reading\n\n- [Contextual Retrieval](https://www.anthropic.com/engineering/contextual-retrieval), Anthropic.\n- [Docling](https://github.com/docling-project/docling), open-source document parsing.\n- [Qdrant filtering docs](https://qdrant.tech/documentation/concepts/filtering/), a clear treatment of filtered vector search.\n- [OpenFGA](https://openfga.dev/) and the [Zanzibar paper](https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/), for relationship-based authorization.\n- [Supabase AI docs](https://supabase.com/docs/guides/ai), practical Postgres + pgvector + RLS examples.\n\n```quiz\n[\n  {\"q\": \"Where should the list of principals used to filter retrieval come from?\", \"options\": [\"The request body\", \"The model's tool call arguments\", \"Your server-side authentication context\", \"The chunk metadata\"], \"answer\": 2, \"why\": \"Anything the client or model supplies can be forged or manipulated. Principals must come from the authenticated session, resolved on the server.\"},\n  {\"q\": \"Version 6 of a document finishes processing before version 5 (which was retried). What prevents version 5 from overwriting it?\", \"options\": [\"Nothing; last write wins\", \"A version check in the write (only update if the stored version is older), or per-document ordering\", \"A bigger queue\", \"Deleting version 5\"], \"answer\": 1, \"why\": \"Out-of-order processing is normal with retries. Guard writes with versions so stale jobs become no-ops.\"},\n  {\"q\": \"A user is removed from the HR group. What is the cheapest correct update?\", \"options\": [\"Re-embed all HR documents\", \"Update ACL metadata on the affected documents' chunks without re-embedding\", \"Rebuild the index nightly\", \"Tell the model not to show HR content\"], \"answer\": 1, \"why\": \"Permissions are metadata. Update them in place, quickly, and verify with a revocation test. Embeddings do not change.\"},\n  {\"q\": \"Why can a semantic cache leak data across users?\", \"options\": [\"Caches are unencrypted\", \"Similar questions from different users can hit the same entry, built from the first user's private documents\", \"Cache keys are too long\", \"It cannot\"], \"answer\": 1, \"why\": \"If the cache key does not include the permission scope, it serves answers grounded in documents the second user cannot see.\"},\n  {\"q\": \"What is the main job of a dead-letter queue?\", \"options\": [\"Speed up processing\", \"Hold jobs that keep failing so they do not block the pipeline, and make them visible for investigation\", \"Store deleted documents\", \"Replace retries\"], \"answer\": 1, \"why\": \"Poison messages are isolated with their error so the rest of the queue keeps flowing.\"}\n]\n```\n"}, {"id": "w2-search", "week": 2, "kind": "lesson", "title": "Scalable search for better context", "short": "Scalable search", "minutes": 60, "summary": "Build a retrieval pipeline that finds the right context at scale, with query understanding, hybrid search, fusion, reranking, and the index tuning and sharding that keep it fast.", "body": "\n## Retrieval quality caps answer quality\n\nIf the right passage is not in the context, the best model in the world cannot use it. If ten wrong passages are, the model may use those instead. Most \"the LLM hallucinated\" bugs in RAG systems are retrieval bugs. So treat retrieval as its own system with its own metrics, and measure it separately from generation.\n\nThe modern retrieval pipeline has stages, each trading cost for precision:\n\n```mermaid\nflowchart LR\n  Q[User query] --> QU[Query understanding<br/>rewrite, expand, filter]\n  QU --> L1[Lexical search<br/>BM25 top 50]\n  QU --> V1[Vector search<br/>ANN top 50]\n  L1 --> F[Fusion<br/>RRF]\n  V1 --> F\n  F --> RR[Reranker<br/>cross-encoder top 50 → 8]\n  RR --> CA[Context assembly<br/>dedupe, order, cite]\n  CA --> LLM[Generation]\n```\n\nCheap, broad stages first (recall), expensive, precise stages last (precision).\n\n## Measure retrieval on its own\n\nBuild a retrieval eval set: queries paired with the chunk or document IDs that answer them. 50 to 200 pairs is enough to start. Take queries from real logs and label which documents are relevant, or generate questions from chunks with a model and then review them.\n\n| Metric | Question it answers |\n|---|---|\n| Recall@k | Of the relevant documents, what fraction appear in the top k? The most important metric for RAG, because the model can only use what it sees. |\n| Precision@k | Of the top k, how many are relevant? Matters for context cost and distraction. |\n| MRR | How high is the first relevant result? |\n| nDCG@k | Rank-aware quality with graded relevance. |\n\n> [!rule] Optimise recall@k first (for k equal to what you pass to the model), then precision. Every change to chunking, embedding model, or ranking gets a before/after number.\n\n## Query understanding\n\nUsers write short, vague, or conversational queries. \"what about the blue one?\" is meaningless without the conversation. Fix the query before you search:\n\n- **Conversational rewrite.** Turn the latest message plus history into a standalone query: \"Ridgeline 2P tent in blue: stock and return window\". A cheap model call.\n- **Multi-query.** Generate 3 to 5 paraphrases, search each, and fuse. Improves recall on ambiguous queries at extra search cost.\n- **HyDE.** Generate a hypothetical answer and embed that instead of the question, since answers look more like documents than questions do ([paper](https://arxiv.org/abs/2212.10496)). Helps when queries and documents are phrased very differently.\n- **Filter extraction.** Pull structured constraints from the query: \"return policy for orders in Canada after 2025\" becomes `{region: CA, effective_after: 2025-01-01}` applied as metadata filters.\n- **Routing.** Decide which index (policies, product catalogue, past tickets) or whether to search at all. Many messages (\"thanks!\") need no retrieval.\n\nIn an agent, much of this happens naturally: the model writes the search query as a tool argument. Your job is to give it a good search tool and good description, and to let it search again if the first results are poor.\n\n## Hybrid search: lexical plus semantic\n\nEmbeddings capture meaning but blur exact tokens. Ask a vector index for \"error E-4471\" and you may get documents about other errors. BM25, the classic keyword ranking function, nails exact identifiers, product codes, and rare terms, but misses paraphrases (\"get my money back\" vs \"refund\").\n\nRunning both and fusing the results is the most reliable improvement you can make to a basic RAG system. Weaviate's [hybrid search explainer](https://weaviate.io/blog/hybrid-search-explained) shows the mechanics.\n\nIn Postgres you can do both in one database: `tsvector` with a GIN index for full text, and pgvector for vectors. [ParadeDB](https://github.com/paradedb/paradedb) adds true BM25 to Postgres if you need it.\n\n### Reciprocal rank fusion\n\nLexical and vector scores live on different scales, so you cannot just add them. **Reciprocal rank fusion** (RRF) ignores scores and combines ranks:\n\n`RRF(d) = Σ over result lists of 1 / (k + rank(d))`, with k usually 60.\n\n```python\ndef rrf(*ranked_lists, k=60, top_n=50):\n    scores = {}\n    for results in ranked_lists:\n        for rank, doc_id in enumerate(results, start=1):\n            scores[doc_id] = scores.get(doc_id, 0.0) + 1.0 / (k + rank)\n    return sorted(scores, key=scores.get, reverse=True)[:top_n]\n\nfused = rrf(bm25_ids, vector_ids)\n```\n\nRRF is simple, robust, and needs no tuning. It is from a 2009 [SIGIR paper](https://plg.uwaterloo.ca/~gvcormac/cormacksigir09-rrf.pdf) and is still the default in most hybrid systems.\n\n### Measure before you believe it\n\nHybrid search and reranking usually help, but not always, and not by the same amount. The course's reference implementation measured all four set-ups on its own small eval set:\n\n```viz\ncaption: On this eval set the reranker gave the biggest gain, and plain hybrid scored below vector search alone. Measure on your own data.\n<div class=\"vz-bars\"><span>full text<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:61%\"><\/i><\/span><b>0.61<\/b><span>vector<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:82%\"><\/i><\/span><b>0.82<\/b><span>hybrid (RRF)<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:77%\"><\/i><\/span><b>0.77<\/b><span>hybrid + rerank<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:89%\"><\/i><\/span><b>0.89<\/b><\/div>\n<p>recall@1: the right document ranked first<\/p>\n<div class=\"vz-row\"><span class=\"ch sk\">p50 latency<\/span><span class=\"ch sk\">full text under 1 ms<\/span><span class=\"ch sk\">vector 3 ms<\/span><span class=\"ch sk\">hybrid 3 ms<\/span><span class=\"ch sk g\">rerank 82 ms<\/span><\/div>\n<div class=\"vz-src\">Source: <a href=\"https://github.com/Rachneet/ai-system-design-course/tree/main/relay#measure-retrieval-free-local\">Relay retrieval eval<\/a>: 44 paraphrased queries, 30 documents, bge-small-en-v1.5 embeddings and a MiniLM cross-encoder on a laptop CPU. A small corpus: a worked example of the method, not a general result.<\/div>\n```\n\nWhy did hybrid lose here? RRF gives both lists equal weight, so when the keyword ranker is weak (short paraphrased queries against a small corpus), it pulls noise into the top spot. Fusion helps when both rankers are decent; a reranker fixes the order either way.\n\n## Reranking\n\nFirst-stage retrieval uses **bi-encoders**: query and document are embedded separately, so documents can be pre-computed. Fast, but the model never sees query and document together. A **cross-encoder reranker** reads the pair together and scores relevance much more accurately, at the cost of one model pass per candidate.\n\nSo: retrieve 50 to 100 candidates cheaply, rerank them, keep the top 5 to 10.\n\n```viz\ncaption: A bi-encoder embeds documents ahead of time, so it can search millions. A cross-encoder reads query and document together, so it is more accurate but runs once per candidate.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk c\"><h5>Bi-encoder: first stage<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">query<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">vector<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk\">doc<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">vector, stored<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk\">compare vectors<\/span><b>millions, milliseconds<\/b><\/div>\n  <\/div>\n  <div class=\"vz-panel sk g\"><h5>Cross-encoder: rerank<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">query + doc<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">one model pass<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk\">score<\/span><\/div>\n    <div class=\"vz-row\"><b>sees both at once; 50 pairs, not millions<\/b><\/div>\n  <\/div>\n<\/div>\n```\n\nOptions: hosted rerank APIs (for example [Cohere Rerank](https://docs.cohere.com/docs/rerank-overview) and [Voyage's rerankers](https://docs.voyageai.com/docs/reranker)), open models you run yourself such as [bge-reranker-v2-m3](https://huggingface.co/BAAI/bge-reranker-v2-m3) or the small MS MARCO MiniLM cross-encoders, or an LLM from any provider scoring candidates (accurate, slow, and expensive). Sentence-Transformers documents the [retrieve and re-rank](https://sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html) pattern well.\n\n> [!numbers] In the course's reference implementation, adding a small open cross-encoder on a laptop CPU took p50 retrieval latency from 3 ms to 82 ms and recall@1 from 0.77 to 0.89 ([Relay's retrieval measurements](https://github.com/Rachneet/ai-system-design-course/tree/main/relay#measure-retrieval-free-local)). A hosted reranker adds a network round trip on top of model time, and a GPU-hosted model is faster than a CPU; measure yours with your candidate count and chunk size. Either way it is small next to multi-second generation, and better precision lets you send fewer chunks to the LLM, which usually saves more than the reranker costs.\n\n## Context assembly\n\nWhat you do after ranking also matters:\n\n- **Deduplicate** near-identical chunks (the same paragraph in three versions of a policy).\n- **Prefer fresh content** when documents conflict, or show dates and let the model reason.\n- **Expand** small matched chunks to their parent section if more context helps (parent-child retrieval).\n- **Order** the best chunk first or last, not buried in the middle.\n- **Label** each chunk with an ID and source so the model can cite it, and so you can verify citations.\n\n```text\n<search_results query=\"return window used tent\">\n<doc id=\"POL-RETURNS-2026#3\" title=\"Returns policy 2026 › Tents › Used items\" updated=\"2026-09-01\">\nUsed tents and sleeping bags may be returned within 30 days of delivery ...\n<\/doc>\n<doc id=\"FAQ-118\" title=\"Can I return a tent I camped in?\" updated=\"2026-05-14\">\n...\n<\/doc>\n<\/search_results>\n```\n\n## Choosing an embedding model\n\nCheck the [MTEB leaderboard](https://huggingface.co/spaces/mteb/leaderboard) for retrieval scores, then test the top few on **your** retrieval eval set, because leaderboards rarely match your domain. Consider: dimension (storage and speed), max input length, multilingual support, cost, and whether you can self-host. Many models support shortened (Matryoshka) embeddings: you can store 256 dimensions instead of 1,024 with a small quality loss and a 4x storage saving. Each API names the setting differently: `dimensions` for [OpenAI's text-embedding-3 models](https://developers.openai.com/api/docs/guides/embeddings), `output_dimensionality` for [Gemini embeddings](https://ai.google.dev/gemini-api/docs/embeddings) (Google recommends 768, 1,536 or 3,072), `output_dimension` for [Voyage](https://docs.voyageai.com/docs/embeddings) (256 to 2,048), and `truncate_dim` when you load a Matryoshka-trained open model in [sentence-transformers](https://sbert.net/examples/sentence_transformer/training/matryoshka/README.html). Only truncate models trained for it.\n\n## Making it fast at scale\n\n### ANN tuning\n\nHNSW has three knobs that matter:\n\n| Parameter | Effect | Typical |\n|---|---|---|\n| `m` | Graph connections per node. Higher means better recall, more memory | 16 (pgvector default) to 32 |\n| `ef_construction` | Build-time search width. Higher means a better graph, slower builds | 64 (default) to 200 |\n| `ef_search` | Query-time search width. Higher means better recall, slower queries | 40 (default) to 200 |\n\nTune `ef_search` against your recall eval: plot recall@10 and p95 latency as it rises, and pick the knee.\n\n### Filtering and ANN\n\nMetadata filters (tenant, ACL, language) interact badly with ANN indexes. **Post-filtering** (search, then drop non-matching results) can return almost nothing when the filter is selective. **Pre-filtering** (search only matching vectors) can make HNSW degrade. Modern engines handle this with filtered HNSW traversal or iterative scans. pgvector filters after the index scan, so with the default `hnsw.ef_search = 40` a filter matching 10% of rows returns only about 4 rows on average; version 0.8.0 added iterative index scans (`SET hnsw.iterative_scan = relaxed_order`) to keep scanning until enough rows match. For very selective filters, such as a single tenant's 2,000 documents, an exact scan over the filtered rows is fast and perfectly accurate.\n\n```viz\ncaption: pgvector filters after the index scan. With a filter that matches 10% of rows, the default scan returns about 4 rows, not 20; an iterative scan keeps going until enough rows match.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk b\"><h5>Default: ef_search = 40<\/h5>\n    <div class=\"cells\" style=\"--n:10\"><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><\/div>\n    <p class=\"big b\">about 4 rows<\/p><p>asked for LIMIT 20<\/p>\n  <\/div>\n  <div class=\"vz-panel sk g\"><h5>Iterative scan, 0.8.0+<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">scan 40<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk\">scan more<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">20 matches<\/span><\/div>\n    <p class=\"big g\">full result list<\/p><p>SET hnsw.iterative_scan = relaxed_order<\/p>\n  <\/div>\n<\/div>\n<div class=\"vz-src\">Source: <a href=\"https://github.com/pgvector/pgvector\">pgvector README<\/a>, sections on filtering and iterative index scans.<\/div>\n```\n\n### Memory and sharding\n\n> [!numbers] 10M chunks × 1,024 float32 dimensions × 4 bytes = **41 GB** of raw vectors, plus HNSW graph overhead (roughly m × 2 × 4 bytes per vector for links, about 1.3 GB at m=16). HNSW wants this in RAM. Halving to 512 dimensions or using int8 quantization (1 byte per dimension) brings 41 GB down to about 10 GB. In pgvector, `halfvec` (2 bytes per dimension) halves memory, and an HNSW index on the plain `vector` type supports up to 2,000 dimensions.\n\nWhen one node is not enough, shard. **Shard by tenant** when queries are always tenant-scoped (most B2B apps): each query hits one shard. **Shard by hash** when queries span everything: each query fans out to all shards and results are merged, so latency follows the slowest shard. Add replicas for read throughput.\n\n### Latency budget\n\nSet one and measure each stage.\n\n| Stage | Budget (p95) |\n|---|---|\n| Query rewrite (small model) | 300 ms |\n| BM25 + vector in parallel | 80 ms |\n| Fusion | 1 ms |\n| Rerank 50 → 8 | 200 ms |\n| Assembly | 5 ms |\n| **Retrieval total** | **≈ 600 ms** |\n\n## Advanced: when flat chunks are not enough\n\n- **Hierarchical summaries** ([RAPTOR](https://arxiv.org/abs/2401.18059)) for questions that need a whole-document view.\n- **Late interaction** ([ColBERT](https://arxiv.org/abs/2004.12832)) for higher accuracy than single-vector embeddings at more storage.\n- **Agentic retrieval**: let the agent search, read, and search again with refined queries. Often the biggest gain for complex questions, at the cost of latency.\n- **Structured data**: for \"how many orders shipped late last week?\", generate SQL, do not embed tables.\n\n## Design review questions\n\n> [!interview] What is your recall@8 on the retrieval eval set, and what changed it most?\n\n> [!interview] A user searches for an exact SKU and gets the wrong product. Which stage failed, and what is your fix?\n\n> [!interview] How much RAM does your index need at 10x today's corpus, and what is the plan?\n\n> [!interview] When does the agent decide not to retrieve at all?\n\n## Further reading\n\n- [Systematically Improving Your RAG](https://jxnl.co/writing/2024/05/22/systematically-improving-your-rag/), Jason Liu. Practical, metrics-first.\n- [Patterns for Building LLM-based Systems](https://eugeneyan.com/writing/llm-patterns/), Eugene Yan. The RAG section is excellent.\n- [Hybrid search explained](https://weaviate.io/blog/hybrid-search-explained), Weaviate.\n- [Retrieve and re-rank](https://sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html), Sentence-Transformers.\n- [Reciprocal Rank Fusion paper](https://plg.uwaterloo.ca/~gvcormac/cormacksigir09-rrf.pdf).\n- [RAG survey](https://arxiv.org/abs/2312.10997) for a map of the research.\n\n```quiz\n[\n  {\"q\": \"Which metric matters most for the retrieval stage of a RAG system?\", \"options\": [\"Precision@1\", \"Recall@k, where k is the number of chunks you pass to the model\", \"Embedding dimension\", \"Index build time\"], \"answer\": 1, \"why\": \"The model can only use relevant passages that reach its context. Recall at the cutoff you actually use is the ceiling on answer quality.\"},\n  {\"q\": \"Why use reciprocal rank fusion instead of adding BM25 and cosine scores?\", \"options\": [\"It is more accurate in every case\", \"The scores are on incompatible scales; RRF uses ranks and needs no calibration\", \"BM25 scores are always negative\", \"It is required by pgvector\"], \"answer\": 1, \"why\": \"Raw scores from different retrievers are not comparable. Rank-based fusion is robust without tuning.\"},\n  {\"q\": \"What does a cross-encoder reranker do that a bi-encoder cannot?\", \"options\": [\"Store embeddings\", \"Read the query and document together to judge relevance\", \"Search millions of documents quickly\", \"Generate answers\"], \"answer\": 1, \"why\": \"Joint encoding is far more accurate but costs a model pass per pair, so it runs only on a short candidate list.\"},\n  {\"q\": \"Queries are always scoped to one tenant. How should you shard?\", \"options\": [\"By hash of chunk ID\", \"By tenant, so each query hits one shard\", \"Randomly\", \"By embedding dimension\"], \"answer\": 1, \"why\": \"Tenant sharding means no fan-out, simple isolation, and latency independent of the number of shards.\"},\n  {\"q\": \"10M vectors at 1,024 dimensions in float32 need roughly how much memory for raw vectors?\", \"options\": [\"4 GB\", \"41 GB\", \"410 GB\", \"1 GB\"], \"answer\": 1, \"why\": \"10,000,000 × 1,024 × 4 bytes ≈ 41 GB, before graph overhead. Dimension reduction or quantization shrinks it.\"}\n]\n```\n"}, {"id": "w2-guardrails", "week": 2, "kind": "lesson", "title": "Scalable input and output guardrails", "short": "Guardrails at scale", "minutes": 45, "summary": "Layered checks on what goes into and comes out of your models, designed to be cheap, fast, and measured, so they block real problems without wrecking latency or blocking legitimate users.", "body": "\n## What guardrails are for\n\nA guardrail is a check, outside the main model call, that can block, modify, or flag an input or output. Guardrails exist because the main model is probabilistic: no system prompt makes it follow your rules 100% of the time. Guardrails turn some of those rules into deterministic or independently verified checks.\n\nThey are not a substitute for good design. Least-privilege tools (Week 3) prevent more damage than any filter. But a layered set of guardrails catches a lot: PII leaking into logs, off-topic abuse, a reply that promises a refund the policy does not allow, an answer not supported by the retrieved documents.\n\n```mermaid\nflowchart LR\n  U[User input] --> IG{Input guardrails}\n  IG -->|block| B1[Safe refusal]\n  IG -->|pass / redact| R[Retrieval + agent]\n  R --> OG{Output guardrails}\n  OG -->|block / regenerate| B2[Fallback reply<br/>or human handoff]\n  OG -->|pass| A[Answer to user]\n  R --> TG{Tool-call guardrails}\n  TG -->|deny / require approval| H[Human approval]\n```\n\n## The guardrail menu\n\n### Input side\n\n| Check | Catches | Typical implementation | Cost |\n|---|---|---|---|\n| Size and rate limits | Abuse, cost attacks | Code | ~0 ms |\n| PII detection and redaction | Card numbers, SSNs, emails going to the model or logs | Regex + checksums, [Presidio](https://microsoft.github.io/presidio/) | 1 to 20 ms |\n| Topic / scope classifier | Off-topic use (\"write my essay\") | Small classifier or small LLM | 50 to 300 ms |\n| Harmful content | Self-harm, violence, abuse | Hosted moderation, e.g. OpenAI's free [moderation endpoint](https://developers.openai.com/api/docs/guides/moderation); or open classifiers you host: [Llama Guard 4](https://huggingface.co/meta-llama/Llama-Guard-4-12B), [gpt-oss-safeguard](https://openai.com/index/introducing-gpt-oss-safeguard/) (reads your own written policy) | 100 to 400 ms |\n| Prompt injection detection | Known jailbreak patterns | Small classifier, e.g. [Prompt Guard 2](https://huggingface.co/meta-llama/Llama-Prompt-Guard-2-86M) (86M or 22M parameters) | 20 to 200 ms |\n\n### Output side\n\n| Check | Catches | Typical implementation |\n|---|---|---|\n| Schema validation | Malformed JSON for downstream code | Pydantic / structured outputs |\n| Policy rules | \"We'll refund you $500\" when limit is $200 | Regex for amounts + code rules, or a judge |\n| Groundedness | Claims not supported by retrieved context | NLI model or LLM judge comparing answer to sources |\n| Citation check | Cited IDs that were not retrieved | Code: every `[DOC-ID]` must be in the retrieved set |\n| PII / secrets leakage | Another customer's data, API keys | Regex + allow-list of the current user's identifiers |\n| Tone and brand | Rude, sarcastic, or legally risky phrasing | Small judge |\n\n### Tool-call side\n\nTool-call guardrails are the most important for agents, because that is where the agent touches the world. Validate arguments against business rules, check the caller's permission for this specific resource, and require human approval for high-impact actions. Week 3 covers this in depth.\n\n## Cheap checks first, in parallel where possible\n\nGuardrails add latency and cost to every request. Design the stack like an airport security line: quick checks for everyone, expensive checks only when needed.\n\n```viz\ncaption: Each layer is slower than the one before by orders of magnitude. Run the cheap ones on everything and the expensive ones only where they earn it.\n<div class=\"vz-bars\"><span>regex + Luhn<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:1%\"><\/i><\/span><b>0.01 ms<\/b><span>22M classifier<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:21%\"><\/i><\/span><b>19 ms<\/b><span>86M classifier<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:100%\"><\/i><\/span><b>92 ms<\/b><span>LLM judge<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:100%\"><\/i><\/span><b>a full model call<\/b><\/div>\n<div class=\"vz-row\"><span class=\"ch sk g\">every message<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk w\">most messages<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">flagged or sampled<\/span><\/div>\n<div class=\"vz-src\">Regex + Luhn: the <code>redact_cards<\/code> code below on a 500-character message, about 10 µs on a laptop CPU (our measurement). Classifiers: <a href=\"https://huggingface.co/meta-llama/Llama-Prompt-Guard-2-86M\">Prompt Guard 2 model card<\/a>, 512 tokens on one A100 GPU. The judge bar is not to scale.<\/div>\n```\n\n1. **Deterministic code checks first.** Length, regexes, checksums (a Luhn check catches real card numbers with few false positives), allow-lists. Microseconds.\n2. **Small classifiers next.** Fine-tuned small models or small LLMs, for topic and safety.\n3. **LLM judges last, and selectively.** Only on outputs that trip a cheaper check, or on a sample.\n\n```python\nimport re\n\nCARD = re.compile(r\"\\b(?:\\d[ -]?){13,19}\\b\")\n\ndef luhn_ok(digits: str) -> bool:\n    total, alt = 0, False\n    for d in reversed(digits):\n        n = int(d)\n        if alt:\n            n = n * 2 - 9 if n * 2 > 9 else n * 2\n        total += n\n        alt = not alt\n    return total % 10 == 0\n\ndef redact_cards(text: str) -> tuple[str, int]:\n    count = 0\n    def sub(m):\n        nonlocal count\n        digits = re.sub(r\"\\D\", \"\", m.group())\n        if 13 <= len(digits) <= 19 and luhn_ok(digits):\n            count += 1\n            return \"[CARD REDACTED]\"\n        return m.group()\n    return CARD.sub(sub, text), count\n```\n\n**Run independent checks in parallel with the main call.** The input topic classifier can run concurrently with retrieval. If it says \"block\", cancel the agent run. You pay its cost but not its latency.\n\n```python\nasync def handle(message):\n    guard = asyncio.create_task(input_guard(message))     # ~200 ms\n    work = asyncio.create_task(retrieve_and_answer(message))\n    verdict = await guard\n    if verdict.block:\n        work.cancel()\n        return refusal(verdict.reason)\n    return await work\n```\n\n```viz\ncaption: Start the input check alongside the agent instead of before it. You still pay for the check, but the user no longer waits for it.\n<div class=\"vz-panel sk\"><h5>Sequential: 4.5 s<\/h5>\n  <div class=\"vz-row\"><span class=\"ch sk w\">guard 0.2 s<\/span><span class=\"ch wide sk c\">agent 4.0 s<\/span><span class=\"ch sk w\">output check 0.3 s<\/span><\/div>\n<\/div>\n<div class=\"vz-panel sk\"><h5>Parallel input guard: 4.3 s<\/h5>\n  <div class=\"vz-row\"><span class=\"ch sk w\">guard 0.2 s<\/span><b>runs alongside<\/b><\/div>\n  <div class=\"vz-row\"><span class=\"ch wide sk c\">agent 4.0 s<\/span><span class=\"ch sk w\">output check 0.3 s<\/span><\/div>\n<\/div>\n<p>block verdict: cancel the agent run<\/p>\n```\n\n> [!numbers] Sequential: input guard 200 ms + agent 4,000 ms + output guard 300 ms = 4.5 s. Input guard in parallel: 4.3 s. Output check on streamed text is harder, see below. A judge on a small hosted model, at 1,500 input and 50 output tokens per check, costs about $0.0001 to $0.0002: $0.000175 on Claude Haiku 5.5 ($0.10 / $0.50 per million input / output tokens), $0.00017 on Gemini 2.5 Flash-Lite ($0.10 / $0.40), $0.000095 on GPT-5 nano ($0.05 / $0.40). At 1M messages a month, that is **about $95 to $175** for the check, often worth it, but only if it measurably catches problems. A self-hosted open classifier swaps the per-token bill for GPU hours. Prices as listed in October 2026 by [Anthropic](https://platform.claude.com/docs/en/about-claude/pricing), [Google](https://ai.google.dev/gemini-api/docs/pricing) and [OpenAI](https://developers.openai.com/api/docs/pricing); check before you budget.\n\n## Guardrails and streaming\n\nStreaming shows tokens as they are generated, which conflicts with checking the full output before showing it. Options:\n\n- **Buffer and check** short answers before sending. Simple and safe; adds latency equal to generation time.\n- **Stream with incremental checks**: run cheap regex checks on the growing buffer (sentence by sentence) and stop the stream if one trips, replacing the partial output with a safe message. Good for PII and banned phrases.\n- **Stream, then retract**: check after completion and replace the message if it fails. Acceptable for low-risk issues; not acceptable for leaking data, since the user already saw it.\n- **Do not stream high-risk paths**, such as final refund confirmations.\n\n## Every guardrail has a false-positive rate\n\nA guardrail that blocks legitimate users is a product bug, and often a worse one than the problem it prevents. A topic classifier that blocks \"my tent smells like gas after the stove leaked\" as \"unsafe content\" is turning away a customer with a real safety issue.\n\nTreat each guardrail as a classifier and measure it:\n\n- **Precision**: of the things it blocked, how many should have been blocked?\n- **Recall**: of the things that should be blocked, how many did it catch?\n\nBuild a labelled set for each guardrail with both bad inputs and tricky legitimate ones. Track the block rate in production and sample blocked messages for review. A sudden jump in block rate usually means the guardrail broke, not that users got worse.\n\n> [!rule] Every guardrail ships with an eval set, a precision and recall number, a production block-rate metric, and a defined user experience when it fires.\n\n## What the user sees when a guardrail fires\n\nDesign the failure path:\n\n- **Block with explanation** for clear policy cases (\"I can only help with Northwind orders and products\").\n- **Regenerate** once with feedback when an output check fails (\"Your previous answer cited POL-9, which was not in the sources; answer again using only the sources\"). Cap retries.\n- **Hand off to a human** for high-stakes cases (a safety complaint, a large refund dispute).\n- **Log** every firing with the guardrail name, version, and input hash for analysis, while respecting PII rules.\n\n## Build or buy\n\nFrameworks such as [Guardrails AI](https://github.com/guardrails-ai/guardrails) and [NeMo Guardrails](https://github.com/NVIDIA/NeMo-Guardrails) give you a library of validators and a way to compose them. Model providers and clouds offer managed content filters, such as OpenAI's moderation endpoint, and open safety models (Llama Guard, Prompt Guard, gpt-oss-safeguard) are open weights you can host yourself, so text never leaves your infrastructure. They are good starting points. Whatever you use, the evaluation discipline above still applies: you need your own labelled data to know whether a guardrail works for your traffic.\n\n## Design review questions\n\n> [!interview] List your guardrails with their p95 latency, precision, and recall. Which one would you remove first, and why?\n\n> [!interview] A customer reports being blocked for a legitimate question. How do you find out how often this happens?\n\n> [!interview] What happens on the streaming path if the output contains another customer's email address?\n\n> [!interview] Which of your rules are enforced in code, and which only in the prompt?\n\n## Further reading\n\n- [OWASP Top 10 for LLM Applications](https://genai.owasp.org/llm-top-10/), the standard risk list.\n- [How to use guardrails](https://developers.openai.com/cookbook/examples/how_to_use_guardrails), OpenAI Cookbook (archived; the pattern applies to any provider). Covers async guardrails and their trade-offs.\n- [Microsoft Presidio](https://microsoft.github.io/presidio/), open-source PII detection and anonymisation.\n- [Llama Guard 4](https://huggingface.co/meta-llama/Llama-Guard-4-12B) and [Prompt Guard 2](https://huggingface.co/meta-llama/Llama-Prompt-Guard-2-86M), open safety and injection classifiers.\n- [NeMo Guardrails](https://github.com/NVIDIA/NeMo-Guardrails) and [Guardrails AI](https://github.com/guardrails-ai/guardrails).\n\n```quiz\n[\n  {\"q\": \"How do you add an input safety classifier without adding its latency to every request?\", \"options\": [\"Run it after the response\", \"Run it concurrently with retrieval and the agent, and cancel the agent if it blocks\", \"Use a bigger model\", \"Skip it on weekends\"], \"answer\": 1, \"why\": \"Parallel execution means you pay the classifier's cost but not its latency, as long as it finishes before the agent does.\"},\n  {\"q\": \"Why combine a regex with a Luhn checksum for card numbers?\", \"options\": [\"Regex alone is too slow\", \"The checksum filters out random digit strings like order numbers, cutting false positives\", \"Luhn detects expired cards\", \"It encrypts the card\"], \"answer\": 1, \"why\": \"Real card numbers pass the Luhn check; most arbitrary 16-digit strings do not. Cheap and much more precise.\"},\n  {\"q\": \"A topic guardrail's block rate doubled overnight after a deploy. What is the most likely explanation?\", \"options\": [\"Users became more abusive\", \"The guardrail or its inputs changed and it is now producing false positives\", \"The model got smarter\", \"Traffic doubled\"], \"answer\": 1, \"why\": \"Sudden shifts in a classifier's firing rate usually indicate a regression. Sample blocked messages and check precision.\"},\n  {\"q\": \"When is \\\"stream, then retract\\\" not acceptable?\", \"options\": [\"For tone issues\", \"When the problem is data leakage, because the user has already seen it\", \"For long answers\", \"Never acceptable\"], \"answer\": 1, \"why\": \"Retracting after the fact does not un-leak data. For leakage risks, check before showing, or check incrementally and stop the stream.\"}\n]\n```\n"}, {"id": "w2-lab", "week": 2, "kind": "lab", "title": "Lab 2: Design a scalable RAG application", "short": "Lab: scalable RAG", "minutes": 240, "builds": "Permission-aware hybrid retrieval", "summary": "Give Relay a real knowledge base, with a background ingestion worker, incremental updates, hybrid search with reranking, access control enforced in SQL, guardrails, and a retrieval eval.", "body": "\n## What you will build\n\n```mermaid\nflowchart TB\n  subgraph Ingestion\n    SRC[kb/ folder + webhook endpoint] --> Q[(jobs table)]\n    Q --> WK[Worker: parse, chunk,<br/>contextualise, embed]\n    WK --> IX[(chunks: text, tsvector,<br/>vector, acl, version)]\n  end\n  subgraph Query path\n    AG[Relay agent] -->|search_kb tool| RT[Retriever]\n    RT --> BM[Full-text top 40]\n    RT --> VS[Vector top 40]\n    BM & VS --> RRF[RRF] --> RR[Rerank → 6] --> AG\n  end\n  IX --> BM\n  IX --> VS\n  AG --> OG[Output guardrails:<br/>citations, PII, amounts]\n```\n\n```viz\ncaption: What \"done\" looks like: three checks your finished system passes on demand.\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk\"><h5>Edit one paragraph<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk g\">kept<\/span><span class=\"ch sk g\">kept<\/span><span class=\"ch sk c\">re-embed<\/span><span class=\"ch sk g\">kept<\/span><\/div>\n    <p>delete a file: gone from search within a minute<\/p>\n  <\/div>\n  <div class=\"vz-panel sk\"><h5>Ask as a customer<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk g\">public<\/span><span class=\"ch sk g\">own docs<\/span><span class=\"ch sk b\">playbooks: 0<\/span><\/div>\n    <p>staff also see group:support<\/p>\n  <\/div>\n  <div class=\"vz-panel sk\"><h5>Reply cites POL-9<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk b\">not retrieved<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">regenerate once<\/span><\/div>\n    <p>then a safe fallback<\/p>\n  <\/div>\n<\/div>\n<div class=\"vz-row\"><span class=\"ch sk\">40 queries<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk\">4 retrieval modes<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">recall and MRR in DESIGN.md<\/span><\/div>\n```\n\n**Acceptance criteria**\n\n1. A worker process ingests Markdown and PDF files from `kb/` (provide at least 30 documents: write policies, FAQs, product pages, and 5 internal-only playbooks).\n2. Editing one paragraph re-embeds only the changed chunks. Deleting a file removes it from search within one minute.\n3. Every chunk has an ACL. Customers see `public` and their own `user:` documents; staff also see `group:support`. Enforced in SQL.\n4. `search_kb` uses hybrid retrieval with RRF and a reranker, and returns chunks with IDs for citation.\n5. Output guardrails: every cited ID must be in the retrieved set, card numbers are redacted from inputs and logs, and refund amounts above the limit in replies trigger a regeneration.\n6. A retrieval eval of at least 40 query → relevant-chunk pairs reports recall@6 and MRR for vector-only, BM25-only, hybrid, and hybrid + rerank.\n\n> [!tip] A tested reference implementation is in the course repository under [`relay/` at tag `lab2`](https://github.com/Rachneet/ai-system-design-course/tree/lab2/relay). It runs local embedding and reranking models on a laptop CPU, so the retrieval eval needs no API key: `uv run python -m evals.retrieval`.\n\n> [!tip] **Use any model provider.** Nothing in this lab depends on one vendor. Relay takes a model spec of the form `provider:model` in `RELAY_MODEL` and its sibling settings, for example `openai:gpt-5`, `gemini:gemini-2.5-flash`, `anthropic:claude-haiku-5-5`, `openrouter:qwen/qwen3-235b-a22b`, or a local open-weights model with `ollama:qwen3:8b` or `vllm:Qwen/Qwen3-32B`. The same goes for retrieval: the reference uses the open `bge-small-en-v1.5` (384 dimensions) through fastembed; you can swap in a hosted embedder (OpenAI, Gemini, Cohere, Voyage) or another open one (BGE, E5, anything in sentence-transformers). Set the `vector(...)` column to your model's output size. See \"Choose any model provider\" in `relay/README.md`.\n\n## Step 1: schema\n\n```sql\nCREATE EXTENSION IF NOT EXISTS vector;\n\nCREATE TABLE documents (\n  doc_id      text PRIMARY KEY,\n  title       text,\n  source_path text,\n  version     bigint NOT NULL,\n  acl         text[] NOT NULL,\n  deleted_at  timestamptz\n);\n\nCREATE TABLE chunks (\n  chunk_id     text PRIMARY KEY,\n  doc_id       text REFERENCES documents(doc_id) ON DELETE CASCADE,\n  ord          int,\n  section      text,\n  content      text NOT NULL,\n  context      text,                                   -- contextual retrieval prefix\n  content_hash text NOT NULL,\n  embedding    vector(1024),                           -- your embedding model's size: 384 for bge-small-en-v1.5\n  embed_model  text NOT NULL,\n  tsv          tsvector GENERATED ALWAYS AS (to_tsvector('english', coalesce(context,'') || ' ' || content)) STORED\n);\nCREATE INDEX ON chunks USING gin (tsv);\nCREATE INDEX ON chunks USING hnsw (embedding vector_cosine_ops);\n\nCREATE TABLE ingest_jobs (\n  id         bigserial PRIMARY KEY,\n  doc_path   text NOT NULL,\n  op         text NOT NULL CHECK (op IN ('upsert','delete')),\n  attempts   int NOT NULL DEFAULT 0,\n  status     text NOT NULL DEFAULT 'queued',   -- queued | running | done | dead\n  last_error text,\n  run_after  timestamptz NOT NULL DEFAULT now()\n);\n```\n\nThe ACL lives on `documents` so a permission change is one row update. Retrieval joins to it.\n\n## Step 2: a Postgres-backed job queue\n\nYou do not need Redis or Kafka for this lab. Postgres `SELECT ... FOR UPDATE SKIP LOCKED` makes a solid queue: multiple workers can pull jobs without taking the same one.\n\n```python\nCLAIM = \"\"\"\nUPDATE ingest_jobs SET status = 'running', attempts = attempts + 1\nWHERE id = (\n  SELECT id FROM ingest_jobs\n  WHERE status = 'queued' AND run_after <= now()\n  ORDER BY id FOR UPDATE SKIP LOCKED LIMIT 1\n)\nRETURNING id, doc_path, op, attempts;\n\"\"\"\n\nasync def worker_loop(pool):\n    while True:\n        async with pool.connection() as conn:\n            job = await (await conn.execute(CLAIM)).fetchone()\n        if job is None:\n            await asyncio.sleep(1)\n            continue\n        try:\n            await process(job)\n            await mark(job.id, \"done\")\n        except TransientError as e:\n            backoff = min(300, 2 ** job.attempts) + random.random()\n            status = \"dead\" if job.attempts >= 5 else \"queued\"\n            await requeue(job.id, status, str(e), delay_s=backoff)\n```\n\nWrite `process` using the sync algorithm from the incremental indexing lesson: chunk by headings (about 500 tokens), hash each chunk, diff against stored hashes, embed only new chunks in batches, and apply inserts and deletes in one transaction.\n\nA small file watcher (or a `POST /kb/webhook` endpoint) enqueues jobs. Add a nightly reconcile command that lists `kb/` and enqueues deletes for documents no longer present.\n\n## Step 3: contextual chunks (optional but recommended)\n\nFor each new chunk, ask a small model for one sentence placing the chunk in its document, and store it in `context`. Every call repeats the whole document, so put the document first and the chunk last: the identical prefix can then be served from the provider's prompt cache, and each call mostly pays for the chunk.\n\nMost providers, and local servers such as vLLM and Ollama, accept the OpenAI Chat Completions format, so one client covers them by changing `base_url` and the model name:\n\n```python\nfrom openai import AsyncOpenAI\n\n# base_url examples: OpenAI (default), https://generativelanguage.googleapis.com/v1beta/openai/ (Gemini),\n# https://openrouter.ai/api/v1, https://router.huggingface.co/v1, http://localhost:8000/v1 (vLLM),\n# http://localhost:11434/v1 (Ollama)\nclient = AsyncOpenAI(base_url=BASE_URL, api_key=API_KEY)\n\nresp = await client.chat.completions.create(\n    model=SMALL_MODEL,\n    messages=[\n        {\"role\": \"system\", \"content\": f\"<document>\\n{doc_text}\\n<\/document>\"},   # same prefix for every chunk\n        {\"role\": \"user\", \"content\": f\"<chunk>\\n{chunk_text}\\n<\/chunk>\\nWrite one sentence situating this \"\n                                    \"chunk within the document to improve search retrieval. Answer with the sentence only.\"},\n    ],\n)\ncontext = resp.choices[0].message.content.strip()\n```\n\nHow the cached prefix works depends on the provider:\n\n| Provider | Prefix caching |\n|---|---|\n| OpenAI | Automatic on supported models for long prefixes ([docs](https://developers.openai.com/api/docs/guides/prompt-caching)) |\n| Gemini | Implicit caching on by default for Gemini 2.5 and newer, from 2,048 tokens on 2.5 Flash ([docs](https://ai.google.dev/gemini-api/docs/caching)) |\n| Anthropic | Mark the document block with `cache_control` ([docs](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)) |\n| vLLM | [Automatic prefix caching](https://docs.vllm.ai/en/latest/features/automatic_prefix_caching.html) in the engine |\n\nOn Anthropic's own SDK, the cached call looks like this:\n\n```python\nresp = await client.messages.create(\n    model=SMALL_MODEL,\n    max_tokens=100,\n    system=[{\"type\": \"text\", \"text\": f\"<document>\\n{doc_text}\\n<\/document>\",\n             \"cache_control\": {\"type\": \"ephemeral\"}}],\n    messages=[{\"role\": \"user\", \"content\": f\"<chunk>\\n{chunk_text}\\n<\/chunk>\\nWrite one sentence situating this chunk \"\n               \"within the document to improve search retrieval. Answer with the sentence only.\"}],\n)\n```\n\nMeasure recall with and without it. Keep it only if it helps on your data.\n\n## Step 4: hybrid retrieval with ACLs\n\n```sql\n-- $1 query embedding, $2 query text, $3 caller principals\nWITH visible AS (\n  SELECT c.* FROM chunks c JOIN documents d USING (doc_id)\n  WHERE d.deleted_at IS NULL AND d.acl && $3::text[]\n),\nvec AS (\n  SELECT chunk_id, row_number() OVER (ORDER BY embedding <=> $1) AS r\n  FROM visible ORDER BY embedding <=> $1 LIMIT 40\n),\nlex AS (\n  SELECT chunk_id, row_number() OVER (ORDER BY ts_rank_cd(tsv, q) DESC) AS r\n  FROM visible, websearch_to_tsquery('english', $2) q\n  WHERE tsv @@ q ORDER BY ts_rank_cd(tsv, q) DESC LIMIT 40\n)\nSELECT chunk_id, sum(1.0 / (60 + r)) AS rrf\nFROM (SELECT * FROM vec UNION ALL SELECT * FROM lex) u\nGROUP BY chunk_id ORDER BY rrf DESC LIMIT 40;\n```\n\nAt lab scale this query is fast even if Postgres scans every visible row. At larger scale, check with `EXPLAIN` that the vector branch uses the HNSW index, and enable `SET hnsw.iterative_scan = relaxed_order` so ACL filters do not starve the result list.\n\nThen rerank the 40 with a cross-encoder (an open model such as `BAAI/bge-reranker-v2-m3` via `sentence-transformers`, or a hosted rerank API such as Cohere's or Voyage's) and return the top 6 with IDs and titles.\n\n> [!warn] Test the ACL path explicitly: an eval case where a customer asks about something only in an internal playbook must retrieve nothing from that playbook, and the answer must not reveal its content.\n\n## Step 5: guardrails\n\nImplement three:\n\n1. **Input**: redact card numbers (regex + Luhn) before the message is stored, logged, or sent to the model.\n2. **Output, citations**: parse `[DOC-ID]` citations from the reply; any ID not in this turn's retrieved set fails the check.\n3. **Output, amounts**: find dollar amounts near \"refund\" in the reply; any above the limit, where no approval exists in session state, fails the check.\n\nOn failure, regenerate once with a short note explaining the failure. If it fails again, return a safe fallback and flag the session.\n\n## Step 6: retrieval eval\n\nCreate `evals/retrieval.yaml` with at least 40 pairs. Generate candidates by asking a model to write a realistic customer question for random chunks, then **review and fix them by hand**, and add 10 real-sounding questions written from scratch. Report a table like this in your `DESIGN.md`:\n\n```text\nconfig                recall@6   MRR    p95 ms\nvector only           0.71       0.58   45\nbm25 only             0.63       0.55   12\nhybrid (RRF)          0.83       0.66   52\nhybrid + rerank       0.91       0.79   240\nhybrid + ctx + rerank 0.94       0.82   245\n```\n\n(Illustrative. Your numbers will differ, and the point is to have them.)\n\nThe reference implementation measured this on its 30-document knowledge base with local models (`bge-small-en-v1.5` and a MiniLM cross-encoder), at k=1:\n\n| Mode | recall@1 | MRR | p50 latency |\n|---|---|---|---|\n| Full text | 0.61 | 0.68 | <1 ms |\n| Vector | 0.82 | 0.89 | 3 ms |\n| Hybrid (RRF) | 0.77 | 0.84 | 3 ms |\n| Hybrid + rerank | 0.89 | 0.96 | 82 ms |\n\nNotice that plain hybrid search came out *below* vector search alone: the weaker keyword ranker pulled noise into the top result. Fusion helps when both rankers are decent; a reranker fixes the ordering either way. This is exactly why you measure each change instead of assuming.\n\n## Stretch goals\n\n- Add a query-rewrite step for follow-up questions and measure its effect on conversational queries.\n- Implement blue/green re-embedding: add `embedding_v2`, backfill with a second model, compare recall, switch with a flag.\n- Add a groundedness judge that checks each sentence of the answer against the retrieved chunks, and measure its agreement with your own labels on 30 answers. Run the judge on a different model family from the agent (in Relay, set `RELAY_JUDGE_MODEL` to another provider's spec), because judges tend to favour outputs from their own family ([Panickssery et al., 2024](https://arxiv.org/abs/2404.13076)).\n- Add a revocation test: change a document's ACL and assert it disappears from a customer's results within one worker cycle.\n\n## Reference reading\n\n- [pgvector](https://github.com/pgvector/pgvector) and [pgvector-python](https://github.com/pgvector/pgvector-python).\n- [Postgres full-text search](https://www.postgresql.org/docs/current/textsearch.html).\n- [Contextual Retrieval](https://www.anthropic.com/engineering/contextual-retrieval).\n- Prompt caching for cheap per-chunk context: [OpenAI](https://developers.openai.com/api/docs/guides/prompt-caching), [Gemini](https://ai.google.dev/gemini-api/docs/caching), [Anthropic](https://platform.claude.com/docs/en/build-with-claude/prompt-caching), [vLLM](https://docs.vllm.ai/en/latest/features/automatic_prefix_caching.html).\n"}, {"id": "w3-datasets", "week": 3, "kind": "lesson", "title": "Evaluation datasets for agent actions and tool calls", "short": "Eval datasets for tools", "minutes": 50, "summary": "Build eval datasets that test what agents do, not just what they say, using production traces, error analysis, synthetic generation with dimensions, simulated users, and sandboxed environments.", "body": "\n## From 25 cases to a real dataset\n\nIn Week 1 you wrote 25 cases by hand. That is the right start, and the wrong end state. A mature agent eval set has hundreds of cases that cover the space of real traffic, include every bug you have ever fixed, and run against environments that behave like production.\n\nThis lesson is about building that dataset systematically.\n\n## Start from error analysis, not from a wishlist\n\nThe most effective teams do not begin by brainstorming metrics. They read traces. The workflow popularised by Hamel Husain and Shreya Shankar ([FAQ](https://hamel.dev/blog/posts/evals-faq/)) goes:\n\n1. **Sample** at least 100 real (or realistic) conversations. The FAQ recommends reviewing at least 100 traces and annotating at least the first 30 yourself.\n2. **Open-code** them: read each one and write a short note on the first thing that went wrong, if anything. \"Called `issue_refund` before checking the delivery date.\" \"Answered from an outdated policy.\" \"Asked for the order number twice.\"\n3. **Axial-code**: group the notes into failure categories and count them.\n4. **Prioritise** by frequency and severity. Build evals for the top categories first.\n\n```mermaid\nflowchart LR\n  T[Traces] --> O[Open coding:<br/>note first failure]\n  O --> A[Axial coding:<br/>group into categories]\n  A --> C[Count + rank<br/>by impact]\n  C --> E[Write evals for<br/>top categories]\n  E --> F[Fix] --> T\n```\n\n> [!rule] Your eval categories should come from failures you observed, not from a generic list of metrics. \"Helpfulness\" is not a failure mode. \"Refunds issued without checking the return window\" is.\n\n## Anatomy of an agent test case\n\nAn agent case needs more than input and expected output, because an agent acts in an environment.\n\n```yaml\nid: refund-window-expired-017\ncategory: refund_eligibility          # from error analysis\nsource: prod-trace-2026-09-14-8fa2    # or \"synthetic\", \"red-team\", \"bug-412\"\ntags: [refund, edge-case, used-item]\npersona: \"frustrated, terse, on mobile\"\nenv:\n  customer_id: c_301\n  now: 2026-10-01T10:00:00Z           # freeze time: windows depend on it\n  orders:\n    - {id: 5520, customer_id: c_301, total: 189.00, status: delivered,\n       delivered_at: 2026-08-10, items: [{sku: TENT-RDG-2P, used: true}]}\nconversation:                         # multi-turn: scripted or simulated\n  - user: \"I want to return my tent, order 5520. It leaks.\"\nexpect:\n  must_call:\n    - {tool: get_order, args: {order_id: 5520}}\n  must_not_call: [issue_refund]\n  may_call: [search_kb, escalate_to_human, request_refund_approval]\n  end_state:\n    refunds: []\n  reply:\n    rubric: >\n      Explains that used tents must be returned within 30 days and this one was delivered\n      52 days ago; offers the warranty claim route for the leak; does not promise a refund.\n    must_cite: [POL-RETURNS-2026]\n```\n\n```viz\ncaption: An agent case is a small world plus a checklist. The world is frozen so the run is reproducible; the checklist judges actions and end state, not wording alone.\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk m\"><h5>Frozen env<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk m\">now: Oct 1<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk m\">order 5520, used<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk m\">customer c_301<\/span><\/div>\n  <\/div>\n  <div class=\"vz-panel sk c\"><h5>Conversation<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk c\">\"It leaks.\"<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk ghost\">scripted or simulated<\/span><\/div>\n  <\/div>\n  <div class=\"vz-panel sk g\"><h5>Expect<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk g\">must call get_order<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk g\">never issue_refund<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk g\">refunds: none<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk g\">rubric for the judge<\/span><\/div>\n  <\/div>\n<\/div>\n```\n\nKey ideas in this format:\n\n- **Frozen environment.** Time, database rows, and external API responses are fixed per case, so failures are reproducible.\n- **Required, forbidden, and allowed tools.** Assert the actions that define correctness and leave the path flexible.\n- **End-state assertion.** The single most reliable check for agents with write tools.\n- **Rubric for the reply**, graded by a judge (next lesson), since there are many correct wordings.\n- **Provenance.** Every case says where it came from, so you can tell whether your suite reflects reality.\n\n## Four sources of cases\n\n| Source | Strength | Weakness | Share of a mature suite |\n|---|---|---|---|\n| Production traces | Real distribution, real phrasing | Needs labelling; PII to scrub | 40 to 60% |\n| Bug regressions | Each one is a proven failure | Narrow | Growing over time |\n| Synthetic generation | Covers rare cases and new features before launch | Can be unrealistic or repetitive | 20 to 40% |\n| Red-team / adversarial | Security and abuse coverage | Skews toward attacks | 10 to 20% |\n\n```viz\ncaption: The course's reference suite has 163 cases and none from production yet, because it has no real users. Your first production traces should change that mix.\n<div class=\"vz-bars\"><span>synthetic<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:100%\"><\/i><\/span><b>70<\/b><span>hand-written<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:80%\"><\/i><\/span><b>56<\/b><span>red-team<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:39%\"><\/i><\/span><b>27<\/b><span>encoded attacks<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:14%\"><\/i><\/span><b>10<\/b><span>production<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:1%\"><\/i><\/span><b>0<\/b><\/div>\n<div class=\"vz-src\">Source: counted from the <code>source<\/code> field of every case in <a href=\"https://github.com/Rachneet/ai-system-design-course/tree/main/relay/evals/cases\">relay/evals/cases<\/a> (dev and held-out).<\/div>\n```\n\n### Turning traces into cases\n\nWhen a conversation goes wrong in production (a thumbs-down, a support escalation, an alert), the trace already contains the input, the tool calls, and the tool results. Write a script that converts a trace into a case skeleton: copy the user turns, snapshot the database rows the tools touched into `env`, and leave `expect` for a human to fill in. Then every bug becomes a test in minutes.\n\nScrub PII before a trace enters the eval set: replace names, emails, and addresses with realistic fakes, consistently within a case.\n\n### Synthetic cases with dimensions\n\nAsking a model to \"generate 100 test cases\" produces 100 near-identical easy cases. Instead, define **dimensions** and generate combinations:\n\n```python\nDIMENSIONS = {\n    \"intent\": [\"order_status\", \"return\", \"refund\", \"exchange\", \"product_question\", \"complaint\"],\n    \"complication\": [\"none\", \"wrong_order_id\", \"outside_window\", \"over_refund_limit\",\n                     \"someone_elses_order\", \"multiple_orders\", \"changes_mind\"],\n    \"persona\": [\"polite_detailed\", \"terse_mobile\", \"angry\", \"non_native_english\", \"elderly_confused\"],\n}\n# sample combinations, then for each: generate a realistic first message, an env, and draft expectations\n```\n\nGenerate the scenario and environment with one model call, then have a human review and fix expectations. Any capable model works as the generator, hosted (OpenAI, Gemini, Anthropic) or open-weights (Qwen, Llama, DeepSeek, Mistral) through vLLM, Ollama or a router such as OpenRouter. **Never let the same model that runs the agent write the expected answers unchecked**: you would be testing the model against itself. A generator from a different model family also brings different phrasing and blind spots.\n\n### Simulated users for multi-turn cases\n\nMany agent failures only appear over several turns: the customer gives the order number late, changes their mind, or gets annoyed. Scripted conversations break as soon as the agent asks something unexpected. Use a **user simulator**: a second model given a persona, a goal, and hidden facts, which replies to the agent until the goal is met or a turn limit is hit. This is how [τ-bench](https://github.com/sierra-research/tau-bench) evaluates customer-service agents.\n\n```python\nSIMULATOR = \"\"\"You are role-playing a customer of Northwind Outfitters.\nGoal: {goal}\nFacts you know (reveal only when asked): {facts}\nPersonality: {persona}\nReply in one or two short sentences, as a real customer would. When your goal is\nmet or clearly impossible, end your message with ###DONE###.\"\"\"\n```\n\nSimulators introduce their own variance, so run multi-turn cases several times and look at pass^k: the chance that **all** k trials pass, not just one. In the τ-bench paper, even strong function-calling agents such as GPT-4o solved fewer than 50% of tasks, and pass^8 in the retail domain was below 25%. The simulator does not need to be the agent's model; a cheaper model, or another provider's, keeps the two from sharing habits.\n\n```viz\ncaption: Passing once is not the same as passing reliably. Agents that solved under half of τ-bench tasks once solved under a quarter in all eight retail trials.\n<div class=\"vz-bars\"><span>pass^1<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:50%\"><\/i><\/span><b>under 50%<\/b><span>pass^8, retail<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:25%\"><\/i><\/span><b>under 25%<\/b><\/div>\n<p>bars show the upper bounds reported<\/p>\n<div class=\"vz-src\">Source: Yao et al., <a href=\"https://arxiv.org/abs/2406.12045\">τ-bench<\/a> (2024), abstract.<\/div>\n```\n\n## Environments: sandboxes for write tools\n\nYou cannot run evals against your production order system. Options, from simplest to most realistic:\n\n1. **In-memory fakes.** Tools call a fake repository seeded from the case's `env`. Fast and deterministic. Good default.\n2. **Ephemeral database.** A Postgres schema created per case (or a transaction rolled back after). Tests your real SQL.\n3. **Recorded external APIs.** For third-party services (shipping carrier, payment provider), record responses once and replay them (VCR-style).\n4. **Full staging environment.** For end-to-end release checks. Slow, so use for a small smoke set.\n\nBenchmarks such as [AgentDojo](https://github.com/ethz-spylab/agentdojo) and [AgentBench](https://arxiv.org/abs/2308.03688) are worth studying for how they structure environments, tasks, and checks.\n\n## Coverage: know what you are not testing\n\nTag every case and report coverage as a matrix: intents × complications, tools × (called, must-not-call), risk tier × count. Gaps are obvious: \"we have zero cases where `escalate_to_human` is the right answer.\" Also track the **production distribution** of intents and compare: if 30% of real traffic is exchanges and 5% of your evals are, your pass rate is not telling you much.\n\n## Versioning and hygiene\n\n- Keep cases in Git as YAML or JSONL next to the code. Review changes like code.\n- Version the dataset; report results as `suite v14, 412 cases`.\n- Split into a **dev** set (you look at failures and iterate) and a **held-out** set (run only before release) to avoid overfitting prompts to your evals.\n- When a case is wrong (expectations out of date after a policy change), fix the case in the same PR as the policy change.\n- Prune near-duplicates. 50 copies of the same easy case inflate your score.\n\n## Design review questions\n\n> [!interview] Where did your eval cases come from? What percentage are from real traffic?\n\n> [!interview] Show me the coverage matrix. Which tool has no must-not-call cases?\n\n> [!interview] How long does it take to turn a production failure into a regression test?\n\n> [!interview] How do you stop your team overfitting prompts to the eval set?\n\n## Further reading\n\n- [AI Evals FAQ](https://hamel.dev/blog/posts/evals-faq/), Hamel Husain and Shreya Shankar. Error analysis, synthetic data, and much more.\n- [Demystifying evals for AI agents](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents), Anthropic.\n- [τ-bench](https://arxiv.org/abs/2406.12045), user simulation and database-state grading.\n- [AgentDojo](https://github.com/ethz-spylab/agentdojo), tasks plus injection attacks in tool environments.\n- [Inspect](https://inspect.aisi.org.uk/), the UK AI Security Institute's open-source eval framework, with good agent support.\n\n```quiz\n[\n  {\"q\": \"What should determine your first eval categories?\", \"options\": [\"A standard list like helpfulness, harmlessness, honesty\", \"Failure categories found by reading and grouping real traces\", \"Whatever the eval framework offers by default\", \"Benchmark leaderboards\"], \"answer\": 1, \"why\": \"Error analysis grounds evals in the failures your system actually has, so improvements map to user impact.\"},\n  {\"q\": \"Why freeze 'now' in each test case's environment?\", \"options\": [\"To speed up tests\", \"Eligibility rules depend on dates; a case that passes today could fail next month without a code change\", \"Databases require it\", \"To save tokens\"], \"answer\": 1, \"why\": \"Time-dependent logic needs a fixed clock for reproducibility.\"},\n  {\"q\": \"What is the main problem with asking a model to \\\"generate 100 test cases\\\"?\", \"options\": [\"It is too expensive\", \"The output clusters around similar, easy cases; dimensions and review are needed for coverage\", \"Models cannot write YAML\", \"It violates terms of service\"], \"answer\": 1, \"why\": \"Without explicit dimensions, generated cases are repetitive. Structured sampling plus human review gives diverse, realistic coverage.\"},\n  {\"q\": \"Why use a user simulator instead of scripted multi-turn conversations?\", \"options\": [\"Simulators are deterministic\", \"Scripts break when the agent asks something unexpected; a simulator responds plausibly to any agent turn\", \"Simulators are cheaper\", \"Scripts cannot contain tool calls\"], \"answer\": 1, \"why\": \"Agents take different valid paths. A goal-driven simulator keeps the conversation coherent regardless.\"},\n  {\"q\": \"Why keep a held-out eval set?\", \"options\": [\"To save money\", \"Repeatedly tuning prompts against the same cases overfits to them; a held-out set gives an honest estimate\", \"Regulators require it\", \"Held-out sets run faster\"], \"answer\": 1, \"why\": \"Just as in ML, iterating on the test set inflates scores. Keep some cases you rarely look at.\"}\n]\n```\n"}, {"id": "w3-judge", "week": 3, "kind": "lesson", "title": "LLM-as-judge versus human evaluation", "short": "LLM judge vs humans", "minutes": 50, "summary": "When to use a model as a grader, how to design judges that agree with humans, how to measure that agreement, and the biases that make naive judges unreliable.", "body": "\n## Why judges exist\n\nCode checks answer \"did it call `issue_refund` with $45?\". They cannot answer \"was the explanation of the warranty process correct and kind?\". Humans can, but humans are slow, expensive, and inconsistent at scale. An **LLM judge** is a model prompted to grade an output against criteria. Done well, it gives you near-human judgement on thousands of cases per hour for a few dollars.\n\nDone badly, it gives you confident numbers that mean nothing. The difference is calibration against human labels.\n\n> [!rule] A judge is a classifier. Before you trust its scores, measure its agreement with human labels on your data, just as you would for any other model.\n\n## Human evaluation: the reference\n\nHumans define what \"good\" means. Use them for:\n\n- **Labelling a calibration set** that judges are measured against.\n- **Error analysis** (previous lesson): reading traces to find failure modes.\n- **High-stakes release decisions** and anything legally sensitive.\n- **Spot-checking** judge outputs in production.\n\nMake human labels useful:\n\n- **Use a domain expert**, ideally one \"benevolent dictator\" whose judgement defines quality for the product, rather than averaging many non-experts.\n- **Binary pass/fail with a written reason** beats 1 to 5 Likert scores. Raters disagree on whether something is a 3 or a 4; they agree far more on pass or fail, and the reason is what you learn from.\n- **Write a labelling guide** with examples of pass and fail at the boundary.\n- **Measure inter-rater agreement** when you have more than one rater. If two humans agree only 70% of the time, no judge will exceed that, and your criteria need work.\n\nShreya Shankar's [Who Validates the Validators?](https://arxiv.org/abs/2404.12272) shows a subtle point: people refine their criteria while grading. Expect your rubric to change after the first 50 labels. That is normal and good.\n\n## Designing a judge\n\n### One criterion per judge\n\nA judge that scores \"accuracy, helpfulness, tone, and safety\" in one call produces muddled scores. Build one judge per failure mode that matters, each with a binary verdict:\n\n- `cites_correct_policy`: does the reply state the return window that matches the cited policy?\n- `no_unauthorised_promise`: does the reply promise anything (refund, discount, delivery date) not supported by tool results?\n- `warranty_route_offered`: when a return is ineligible due to a defect, is the warranty path explained?\n\n### Give the judge what it needs\n\nA judge needs the same context a human grader would: the conversation, the tool calls and results, the retrieved documents, and the rubric. Judging \"is this answer correct?\" without the source documents just asks the judge to guess.\n\n### Ask for reasoning, then a verdict, in structured output\n\n```python\nfrom typing import Literal\nfrom openai import OpenAI\nfrom pydantic import BaseModel, ConfigDict\n\nclass Verdict(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\")   # strict schemas need additionalProperties: false\n    reasoning: str                      # short; written before the verdict\n    verdict: Literal[\"pass\", \"fail\"]\n\nJUDGE_PROMPT = \"\"\"You are grading one reply from a customer support agent for an outdoor gear store.\n\nCriterion: The reply must not promise anything (refund, replacement, discount, delivery date)\nunless the tool results in the transcript support it.\n\nPass example: Tool shows refund issued for $45; reply says \"I've refunded $45.\"\nFail example: No refund tool call; reply says \"You'll get your refund in 3 days.\"\nFail example: Tool shows ETA Oct 18; reply says \"It will arrive tomorrow.\"\n\n<transcript>\n{transcript}\n<\/transcript>\n\nExplain your reasoning in two or three sentences, then give the verdict.\"\"\"\n\n# One client for OpenAI, Gemini, OpenRouter, Hugging Face, vLLM or Ollama: change base_url and model.\nc
