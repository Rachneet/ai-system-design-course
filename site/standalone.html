nnot see inside.** You do not know the other agent's prompt, model, tools or memory. You see what it advertises and what it returns.\n2. **It is not your trust domain.** Its output is input from a stranger, exactly like a web page or an email.\n3. **Authority has to travel.** The other agent needs to know who it is acting for, and that must not mean handing it your user's full credentials.\n4. **Cost and latency compound.** Every hop is at least one full agent run, owned and billed by someone else, with its own failure rate.\n\nThis lesson takes each in turn: the protocol that makes agents callable across boundaries, when to use it instead of a tool, the orchestration shapes and their failure modes, trust and delegated authority, and the arithmetic of delegation.\n\n## A2A in depth\n\nThe [Agent2Agent protocol](https://a2a-protocol.org/latest/specification/) (A2A) is an open standard for one agent to call another without either exposing its internals. Week 1 introduced it; here is how it works. Everything below is checked against the [version 1.0.0 specification](https://a2a-protocol.org/v1.0.0/specification/), the latest release at the time of writing. The specification's own phrase is that agents collaborate \"without needing access to each other's internal state, memory, or tools\".\n\n### The Agent Card: what an agent says about itself\n\nEvery A2A agent publishes an **Agent Card**, a JSON document that describes it. The specification makes eight fields required: `name`, `description`, `supportedInterfaces`, `version`, `capabilities`, `defaultInputModes`, `defaultOutputModes` and `skills`. Each skill needs an `id`, `name`, `description` and `tags`. Each interface names a `url`, a `protocolBinding` (the core ones are `JSONRPC`, `GRPC` and `HTTP+JSON`) and a `protocolVersion`.\n\nHere is a card for a fictional carrier's claims agent that Relay might call:\n\n```json\n{\n  \"name\": \"Parcel claims agent\",\n  \"description\": \"Opens and tracks claims for lost or damaged parcels shipped with the carrier.\",\n  \"version\": \"2.3.0\",\n  \"supportedInterfaces\": [\n    {\"url\": \"https://agents.carrier.example/a2a/v1\", \"protocolBinding\": \"JSONRPC\", \"protocolVersion\": \"1.0\"}\n  ],\n  \"capabilities\": {\"streaming\": true, \"pushNotifications\": true, \"extendedAgentCard\": true},\n  \"securitySchemes\": {\n    \"carrier_oauth\": {\n      \"oauth2SecurityScheme\": {\n        \"flows\": {\"clientCredentials\": {\n          \"tokenUrl\": \"https://auth.carrier.example/oauth/token\",\n          \"scopes\": {\"claims:write\": \"Open and update claims\"}\n        }}\n      }\n    }\n  },\n  \"securityRequirements\": [{\"schemes\": {\"carrier_oauth\": {\"list\": [\"claims:write\"]}}}],\n  \"defaultInputModes\": [\"text/plain\", \"application/json\"],\n  \"defaultOutputModes\": [\"application/json\"],\n  \"skills\": [\n    {\"id\": \"open-claim\", \"name\": \"Open a parcel claim\",\n     \"description\": \"Opens a claim for a lost or damaged parcel given a tracking number and a description.\",\n     \"tags\": [\"claims\", \"shipping\"]}\n  ]\n}\n```\n\nA security scheme is a union with exactly one of `apiKeySecurityScheme`, `httpAuthSecurityScheme`, `oauth2SecurityScheme`, `openIdConnectSecurityScheme` or `mtlsSecurityScheme`, modelled on the OpenAPI security scheme object. `securityRequirements` says which schemes and scopes a caller must present; a skill may add its own.\n\n**Discovery.** The standard place for a public card is `https://{server_domain}/.well-known/agent-card.json`. Details that should not be public, such as extra skills for partners, go in an **extended card** that the caller fetches with the Get Extended Agent Card operation, which the specification says \"MUST require authentication\". Inside a company you rarely discover agents by guessing domains: you look them up in a registry. Atlas, the course's registry, accepts A2A cards, checks the required fields from section 4.4 of the specification (`platform/atlas/atlas/kinds.py`), blocks cards with plain HTTP endpoints, and by default blocks agents that declare no `securitySchemes` at all.\n\n**Signed cards.** A card can carry `signatures`: JWS signatures ([RFC 7515](https://www.rfc-editor.org/rfc/rfc7515)) over the card canonicalized with JCS ([RFC 8785](https://www.rfc-editor.org/rfc/rfc8785)). A card fetched over HTTPS proves which server sent it; a signature proves which organisation vouched for it, which matters once cards are copied into registries and caches.\n\n### Tasks and their lifecycle\n\nYou talk to an agent by sending a **Message** (role `ROLE_USER` from the caller, `ROLE_AGENT` from the agent) made of parts: text, files or structured data. The agent may answer with a Message directly, for quick interactions, or create a **Task**: a unit of work with an ID, a status, a history and **artifacts** (its outputs). A `contextId` groups related tasks and messages into one conversation; servers may generate it, and callers should treat server-generated values as opaque.\n\n```viz\ncaption: A task moves forward until it lands in one of four terminal states. Two interrupted states hand control back to the caller, who continues the same task with another message.\n<div class=\"vz-row\"><span class=\"ch sk c\">SUBMITTED<\/span><span class=\"arr sk c\"><\/span><span class=\"ch sk c\">WORKING<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">COMPLETED<\/span><\/div>\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk\"><h5>Interrupted: caller acts<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk ghost\">INPUT_REQUIRED<\/span><span>needs an answer<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk ghost\">AUTH_REQUIRED<\/span><span>needs credentials<\/span><\/div>\n    <p>send a message with the same taskId; work resumes<\/p>\n  <\/div>\n  <div class=\"vz-panel sk b\"><h5>Terminal: no more messages<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk g\">COMPLETED<\/span><span class=\"ch sk b\">FAILED<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk b\">CANCELED<\/span><span class=\"ch sk b\">REJECTED<\/span><\/div>\n    <p>a follow-up starts a new task in the same contextId<\/p>\n  <\/div>\n<\/div>\n<div class=\"vz-src\">States from the <a href=\"https://a2a-protocol.org/v1.0.0/specification/\">A2A 1.0.0 specification<\/a>, section 4.1.3, shown without their <code>TASK_STATE_<\/code> prefix.<\/div>\n```\n\nThe states are `TASK_STATE_SUBMITTED`, `WORKING`, `INPUT_REQUIRED`, `AUTH_REQUIRED`, `COMPLETED`, `FAILED`, `CANCELED` and `REJECTED` (all with the `TASK_STATE_` prefix on the wire). Messages sent to a task in a terminal state are refused with an `UnsupportedOperationError`, so a finished task is a fixed record you can audit.\n\nThe operations are small: **Send Message**, **Send Streaming Message**, **Get Task**, **List Tasks**, **Cancel Task**, **Subscribe to Task**, four operations to create, get, list and delete push notification configurations, and **Get Extended Agent Card**. Each exists in all three bindings; over JSON-RPC the method names are `SendMessage`, `SendStreamingMessage`, `GetTask` and so on, and over HTTP+JSON they become routes such as `POST /message:send` and `GET /tasks/{id}`.\n\n### Three ways to wait for the result\n\nA task can take seconds or days, and A2A offers three ways to follow it.\n\n1. **Blocking.** By default Send Message waits until the task reaches a terminal or interrupted state. Setting `returnImmediately` in the request configuration returns the task at once instead, and you poll with Get Task.\n2. **Streaming.** If the card says `\"streaming\": true`, Send Streaming Message returns a Server-Sent Events stream. It starts with the Task, then carries `TaskStatusUpdateEvent` and `TaskArtifactUpdateEvent` objects, and closes when the task reaches a terminal state. If the connection drops, Subscribe to Task reattaches.\n3. **Push notifications.** If the card says `\"pushNotifications\": true`, you register a webhook: a `url`, an optional `token`, and `authentication` details. The agent then POSTs updates to it, with no open connection on your side. This is the right shape for tasks that wait on people.\n\n```mermaid\nsequenceDiagram\n  participant R as Relay (client agent)\n  participant C as Carrier claims agent\n  R->>C: GET /.well-known/agent-card.json\n  R->>C: SendStreamingMessage (OAuth token, contextId)\n  C-->>R: Task SUBMITTED, then status WORKING\n  C-->>R: status INPUT_REQUIRED: photo of the damage?\n  R->>C: SendMessage (same taskId, photo)\n  C-->>R: artifact: claim CLM-881, then status COMPLETED\n  Note over R,C: stream closes at the terminal state\n```\n\nPush notifications turn the agent into an HTTP client of yours, which brings two obligations from section 13.2 of the specification. The agent \"SHOULD validate webhook URLs to prevent SSRF\" (server-side request forgery): reject private ranges, localhost and link-local addresses, and use allow-lists where possible, because otherwise any caller can make your agent POST into your own network. The receiver \"MUST validate webhook authenticity\" using the configured credentials, should check the task ID is one it created, and should process notifications idempotently, because duplicates happen.\n\n> [!warn] Blocking is the default, and a blocking call to an agent in another company has no natural upper bound on its duration. Set your own deadline on every call, prefer streaming or push for anything that might wait on a person, and call Cancel Task when your deadline passes so the other side stops spending.\n\n### Security in the protocol\n\nA2A authenticates at the HTTP layer with the schemes the card declares; credentials do not travel inside messages. Section 13.1 adds one rule worth copying into any multi-tenant agent: authorization checks \"MUST occur before any database queries or operations that could leak information about the existence of resources outside the caller's authorization scope\", and listing tasks must be scoped to the caller even when no filter is given. The protocol leaves the authorization model itself to each agent. It also defines an optional `tenant` field on interfaces and requests, described as an opaque routing identifier, not an isolation control. Lesson 2 of this week covers isolation.\n\n## MCP or A2A?\n\nBoth protocols let one program call another across a boundary, and teams argue about which to use. The A2A project's own framing is short: [MCP is for agent-to-tool communication; A2A is for agent-to-agent communication](https://a2a-protocol.org/latest/topics/a2a-and-mcp/). In practice the question is who decides the next step.\n\n```viz\ncaption: The deciding question is who chooses the next step. With a tool, your model does. With an agent, the other side does, and it may come back with a question.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk c\"><h5>MCP tool: you decide<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk c\">your model<\/span><span class=\"arr sk c\"><\/span><span class=\"ch sk\">get_tracking(id)<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk\">JSON result<\/span><\/div>\n    <p>one call, one schema, usually seconds<\/p>\n    <p>stateless; your loop owns the plan<\/p>\n  <\/div>\n  <div class=\"vz-panel sk m\"><h5>A2A agent: it decides<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk c\">your model<\/span><span class=\"arr sk m\"><\/span><span class=\"ch sk m\">claims agent<\/span><span class=\"arr sk m\"><\/span><span class=\"ch sk m\">its own tools<\/span><\/div>\n    <p>a task with states, questions back, artifacts<\/p>\n    <p>minutes to days; its loop owns the plan<\/p>\n  <\/div>\n<\/div>\n```\n\n> [!rule] Expose a capability as an MCP tool when the caller should decide each step and the call has a fixed schema. Expose it as an A2A agent when the callee must plan, keep state, ask questions back or run for a long time. If in doubt, start with a tool: it is cheaper, faster and easier to test.\n\nThe two compose. The carrier's claims agent is an A2A agent to Relay, and internally it uses MCP tools for its own database. Relay's `track_package` is an MCP tool (Lab 5's carrier server) because looking up a tracking number is one deterministic call; opening a disputed claim, which needs photos and a human adjuster, is an agent. Do not wrap a single function in an agent: you add a second model's cost, latency and failure modes to a lookup.\n\n## Orchestration patterns and how they fail\n\nWeek 1 named three topologies. Across team boundaries they behave like this:\n\n| Pattern | Shape | Who owns the user | Typical enterprise use |\n|---|---|---|---|\n| Supervisor | One agent plans, calls specialists, merges their results | The supervisor, throughout | A helpdesk agent that asks the IT, HR and billing agents |\n| Handoff | One agent transfers the conversation to another, with a summary | Whoever holds it now | Triage passes a refund dispute to the finance agent |\n| Pipeline | A fixed sequence of agents, each consuming the last one's artifact | Nobody: it is a job | Intake, then classification, then fulfilment |\n\nThe best evidence on how these fail is [Why Do Multi-Agent LLM Systems Fail?](https://arxiv.org/abs/2503.13657) (Cemri and colleagues; version 3, October 2025). The authors annotated more than 1,600 traces from seven open multi-agent frameworks, including MetaGPT, ChatDev, Magentic-One and OpenManus, and grouped the failures into the **MAST** taxonomy: 14 failure modes in 3 categories, with an inter-annotator agreement (kappa) of 0.88.\n\n```viz\ncaption: The most common failures are about stopping, repeating and checking, not about the model being too weak. Each one has a protocol-level or platform-level control.\n<div class=\"vz-bars\"><span>FM-1.3 step repetition<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:100%\"><\/i><\/span><b>15.7%<\/b><span>FM-2.6 reasoning-action mismatch<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:84%\"><\/i><\/span><b>13.2%<\/b><span>FM-1.5 unaware of termination<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:79%\"><\/i><\/span><b>12.4%<\/b><span>FM-1.1 disobey task specification<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:75%\"><\/i><\/span><b>11.8%<\/b><span>FM-3.3 incorrect verification<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:58%\"><\/i><\/span><b>9.1%<\/b><span>FM-3.2 no or incomplete verification<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:52%\"><\/i><\/span><b>8.2%<\/b><span>FM-2.3 task derailment<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:47%\"><\/i><\/span><b>7.4%<\/b><\/div>\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk\"><h5>System design<\/h5><p class=\"big b\">44.2%<\/p><p>five modes<\/p><\/div>\n  <div class=\"vz-panel sk\"><h5>Inter-agent misalignment<\/h5><p class=\"big b\">32.4%<\/p><p>six modes<\/p><\/div>\n  <div class=\"vz-panel sk\"><h5>Task verification<\/h5><p class=\"big b\">23.5%<\/p><p>three modes<\/p><\/div>\n<\/div>\n<div class=\"vz-src\">Share of observed failures per mode, from Cemri et al., <a href=\"https://arxiv.org/abs/2503.13657\">Why Do Multi-Agent LLM Systems Fail?<\/a> (v3). Category totals are the sums of their modes.<\/div>\n```\n\nThe paper also tried simple fixes. In ChatDev, clearer role specifications raised task success by 9.4%, and adding a high-level check that the result met the task's objective raised it by 15.6%, with the same model and prompt. The authors note that these interventions help but leave many failures unresolved. Across team boundaries, the most useful reading is which control addresses which mode:\n\n| MAST mode | What it looks like between teams | Control |\n|---|---|---|\n| Unaware of termination (FM-1.5), step repetition (FM-1.3) | Two agents keep asking each other; a supervisor re-delegates the same subtask | Depth limit, hop budget, cycle check on the delegation chain, task IDs as idempotency keys |\n| Disobey task specification (FM-1.1), task derailment (FM-2.3) | The specialist answers a different question from the one asked | Delegate with a structured request: objective, output schema, scope, effort; reject artifacts that do not match the schema |\n| Fail to ask for clarification (FM-2.2) | The callee guesses instead of asking | Make `INPUT_REQUIRED` a first-class path in your client, not an error |\n| Conversation reset (FM-2.1), loss of history (FM-1.4), information withholding (FM-2.4) | A handoff loses what the customer already said | Hand off a written summary plus the facts as structured data, and keep the `contextId` |\n| No, incomplete or incorrect verification (FM-3.2, FM-3.3), premature termination (FM-3.1) | The supervisor relays a specialist's wrong answer | The caller verifies: schema checks, cross-checks against its own systems, and evals on the composed system |\n\nPattern-specific failure modes to look for in a design review:\n\n- **Supervisor.** It becomes the bottleneck and the most expensive context: every specialist's output lands in it. Ask specialists for condensed artifacts, not transcripts.\n- **Handoff.** Context is lost at each transfer, and nobody owns the outcome after the second one. Allow at most one or two handoffs per conversation, log each as an event, and always offer a human.\n- **Pipeline.** Errors compound silently because no stage sees the whole. Validate every artifact against a schema between stages and stop the line on failure.\n\n## Trust across agents\n\n### Another agent's output is untrusted input\n\nEverything [Week 3's prompt injection lesson](#w3-security) said about web pages, emails and tool results applies to a remote agent's replies. Its text may contain instructions, planted by an attacker who reached that agent, or by the agent's own mistakes. Three habits keep it contained:\n\n1. **Ask for data, not prose.** Request artifacts with a schema (a claim ID, a status, an amount) and validate them. A field that fails validation is rejected, not \"interpreted\".\n2. **Keep remote text away from write tools.** If you must use free text from another agent, pass it through a tool-less model call that extracts narrow fields, the way Relay's `app/quarantine.py` handles reviews and emails.\n3. **Never let a remote agent widen your permissions.** \"The finance agent says this refund is approved\" is a claim, not an approval. Approvals come from your policy engine or a person, recorded on your side ([Week 8](#w8-policy)).\n\n### Delegating authority without handing over credentials\n\nWhen Relay asks the carrier's agent to open a claim for Ada, the carrier needs to know two things: which agent is calling and which customer it acts for. Forwarding Ada's own access token is the wrong answer: it lets the carrier act as Ada anywhere that token is accepted, for as long as it lives.\n\nOAuth 2.0 Token Exchange ([RFC 8693](https://www.rfc-editor.org/rfc/rfc8693.html)) is the standard answer; [Week 7](#w7-identity) covers the mechanics, and here is what it means for chains of agents. The calling agent sends the user's token as the `subject_token` and its own as the `actor_token`, and the authorization server issues a new token for one audience. The RFC separates two models. In **impersonation**, the actor becomes the subject. In **delegation**, which you want, the actor \"still has its own identity\", recorded in the `act` (actor) claim. Each further hop nests another `act`:\n\n```viz\ncaption: Each hop gets a new, narrower token. The subject never changes, and the act claims record who acted. The budget and depth shrink as the chain grows.\n<div class=\"vz-row\"><span class=\"ch sk\">Ada (c_77)<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">Relay agent<\/span><span class=\"arr sk c\"><\/span><span class=\"ch sk c\">carrier claims agent<\/span><span class=\"arr sk c\"><\/span><span class=\"ch sk c\">claims database tool<\/span><\/div>\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk\"><h5>Hop 1 token<\/h5><p>sub: c_77<\/p><p>aud: relay<\/p><p>no act claim<\/p><div class=\"vz-row\"><span class=\"ch sk w\">budget $1.00<\/span><span class=\"ch sk w\">depth 0 of 2<\/span><\/div><\/div>\n  <div class=\"vz-panel sk\"><h5>Hop 2 token<\/h5><p>sub: c_77<\/p><p>aud: carrier-agent<\/p><p>act: {sub: relay}<\/p><div class=\"vz-row\"><span class=\"ch sk w\">budget $0.30<\/span><span class=\"ch sk w\">depth 1 of 2<\/span><\/div><\/div>\n  <div class=\"vz-panel sk\"><h5>Hop 3 token<\/h5><p>sub: c_77<\/p><p>aud: claims-db<\/p><p>act: {sub: carrier-agent, act: {sub: relay}}<\/p><div class=\"vz-row\"><span class=\"ch sk w\">budget $0.10<\/span><span class=\"ch sk w\">depth 2 of 2<\/span><\/div><\/div>\n<\/div>\n<div class=\"vz-row\"><span class=\"ch sk b\">hop 4 refused: depth limit<\/span><span class=\"ch sk b\">relay seen in chain: cycle<\/span><\/div>\n<div class=\"vz-src\">Claim shapes from <a href=\"https://www.rfc-editor.org/rfc/rfc8693.html\">RFC 8693<\/a>, section 4.1. Budget and depth values are an example policy, not part of the RFC.<\/div>\n```\n\nThe RFC is precise about how to read the chain: \"the outermost `act` claim represents the current actor\", and prior actors \"are informational only\" for access control. So each hop authorizes on the subject and the current actor, and keeps the full chain for the audit log. Checkpoint, the course's tool gateway, already uses this shape: the assertion it sends to an MCP server has `sub` set to the user, `act.sub` to the agent, an `aud` for that one server and a 60-second lifetime (`platform/checkpoint/checkpoint/identity.py`). It signs the assertion itself rather than calling an identity provider's token exchange endpoint, which its README lists as not built yet.\n\n### Budgets and depth limits stop loops\n\nAgents that can call agents can call each other forever: A asks B for a policy check, B asks A for the order details, A asks B again. MAST's two most common modes, step repetition and not knowing when to stop, are exactly this. Prompts do not fix it; limits enforced in code do. Pass three values down with every delegation and enforce them on both sides:\n\n- **Depth.** The number of hops so far. Refuse to delegate beyond a fixed maximum (two is plenty for most enterprise flows).\n- **Budget.** The money (or tokens) left for this request. A child receives at most a share of what its parent has left, and refuses work it cannot afford. Switchboard enforces the hard backstop: every internal agent has its own app key with a monthly budget and per-minute limits, so a runaway agent hits a 429, not your invoice.\n- **Deadline.** An absolute time, not a timeout per hop, so that three hops of 30 seconds cannot become 90.\n\nAdd a cycle check: if your own agent ID already appears in the incoming chain of `act` claims, refuse. That reads the chain for loop detection, not for granting access, so it is consistent with the RFC.\n\n## The cost and latency of delegation\n\nDelegation buys specialisation and ownership boundaries; it is paid for in tokens, seconds and reliability. Here are the numbers for one Relay turn, at the course's list prices for the large model ($4 per million input tokens, $20 per million output tokens, as in [Week 1](#w1-agents)), before caching. Assume every model call takes 3 seconds; that is an assumption for the example, not a measurement.\n\n| Design | Model calls | Cost per turn | Wall-clock time |\n|---|---|---|---|\n| One agent: 4 calls of 8,000 in and 400 out | 4 | 4 × (8,000 × $4 + 400 × $20) / 1M = **$0.16** | 4 × 3 s = **12 s** |\n| Supervisor (plan and merge, 2 calls of 6,000 in and 400 out) plus 2 specialists in parallel, 4 calls each | 10 | $0.064 + 2 × $0.16 = **$0.384** | 3 + 12 + 3 = **18 s** |\n| Handoff chain: triage, then specialist A, then specialist B, then a final reply | 10 | about **$0.384** | 3 + 12 + 12 + 3 = **30 s** |\n\n```viz\ncaption: The same turn delegated two ways. Splitting the work costs 2.4 times as much either way; running the specialists in parallel keeps the wait to 1.5 times instead of 2.5.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk\"><h5>Cost per turn<\/h5>\n    <div class=\"vz-bars\"><span>one agent<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:42%\"><\/i><\/span><b>$0.16<\/b><span>supervisor<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:100%\"><\/i><\/span><b>$0.38<\/b><span>handoff chain<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:100%\"><\/i><\/span><b>$0.38<\/b><\/div>\n  <\/div>\n  <div class=\"vz-panel sk\"><h5>Wall-clock time<\/h5>\n    <div class=\"vz-bars\"><span>one agent<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:40%\"><\/i><\/span><b>12 s<\/b><span>supervisor<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:60%\"><\/i><\/span><b>18 s<\/b><span>handoff chain<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:100%\"><\/i><\/span><b>30 s<\/b><\/div>\n  <\/div>\n<\/div>\n<div class=\"vz-src\">Computed in the table above: 3 s per model call is an assumed figure; prices are the course's large-model list prices from <a href=\"https://platform.claude.com/docs/en/about-claude/pricing\">Anthropic's pricing page<\/a>.<\/div>\n```\n\nTwo more effects grow faster than linearly:\n\n> [!numbers] **Fan-out.** If every agent may delegate to 3 others, and depth is unlimited up to 3, one request can start 1 + 3 + 9 + 27 = **40** agent runs. At $0.16 a run that is **$6.40** for one user message. A depth limit of 1 caps it at 1 + 3 = 4 runs, **$0.64**.\n\n> [!numbers] **Reliability.** If each agent completes its part correctly 95% of the time, and the parts are independent, a pipeline of three succeeds 0.95 × 0.95 × 0.95 ≈ **85.7%** of the time. Five stages give 0.95⁵ ≈ **77.4%**. Every hop must earn its place against that loss, or carry a verification step that catches its errors.\n\nNetwork time for an A2A call is small next to these: tens of milliseconds against seconds of model time. The cost that matters is the second agent's own loop. When you compare designs, multiply calls, not hops.\n\n> [!tip] Use Switchboard's chargeback report (`GET /admin/usage?month=...&group_by=team`) to see what each agent's delegations cost the team that owns it. When delegation is free to the caller, everyone delegates.\n\n## Design review questions\n\n> [!interview] Why is this capability an agent rather than a tool? Show me a request where the callee had to plan, ask a question back, or run for longer than one call.\n\n> [!interview] What is the maximum depth and fan-out of delegation in this system, where is it enforced in code, and what does the user see when a limit is hit?\n\n> [!interview] When your agent calls another team's agent for a customer, what token does it present, which audience is it for, how long does it live, and what does the callee's audit log record?\n\n> [!interview] A partner's agent returns text that says \"refund approved, proceed\". Trace what your system does with it.\n\n> [!interview] A delegated task waits on a person for two days. How does your agent learn the result, and what stops a forged webhook from completing it?\n\n> [!interview] What does one user request cost at p50 and p95 once every delegated agent's spend is included, and who is billed for it?\n\n## Further reading\n\n- [A2A specification](https://a2a-protocol.org/latest/specification/), especially sections 3 (operations), 4 (data model), 8 (discovery and card signing) and 13 (security).\n- [A2A and MCP](https://a2a-protocol.org/latest/topics/a2a-and-mcp/), the project's own explanation of how the two protocols fit together.\n- [Why Do Multi-Agent LLM Systems Fail?](https://arxiv.org/abs/2503.13657), Cemri et al. The MAST taxonomy and dataset.\n- [RFC 8693: OAuth 2.0 Token Exchange](https://www.rfc-editor.org/rfc/rfc8693.html), for delegation, impersonation and the `act` claim.\n- [How we built our multi-agent research system](https://www.anthropic.com/engineering/multi-agent-research-system), Anthropic, and [Don't build multi-agents](https://cognition.ai/blog/dont-build-multi-agents), Cognition: the case for and against, with numbers.\n- `platform/atlas` (agent card validation) and `platform/checkpoint` (per-agent identity, signed assertions with `act`) in this course's repository.\n\n```quiz\n[\n  {\"q\": \"Where does an A2A agent publish its public Agent Card by convention?\", \"options\": [\"/agent.json\", \"/.well-known/agent-card.json\", \"/a2a/card\", \"Only in a registry\"], \"answer\": 1, \"why\": \"The specification defines https://{server_domain}/.well-known/agent-card.json. Details that should not be public go in an extended card, which requires authentication.\"},\n  {\"q\": \"A delegated task is in TASK_STATE_INPUT_REQUIRED. What should the calling agent do?\", \"options\": [\"Treat it as a failure and retry from scratch\", \"Answer with a new message on the same taskId, or ask its user\", \"Cancel the task\", \"Wait for COMPLETED\"], \"answer\": 1, \"why\": \"INPUT_REQUIRED is an interrupted state: the callee needs something. Continuing the same task is the protocol's way of asking for clarification, a failure mode MAST counts when it is skipped.\"},\n  {\"q\": \"Which capability should be an MCP tool rather than an A2A agent?\", \"options\": [\"Opening a disputed parcel claim that needs photos and a human adjuster\", \"Looking up the status of a tracking number\", \"Negotiating a delivery slot with a customer over several days\", \"Investigating a payment dispute across three systems\"], \"answer\": 1, \"why\": \"A tracking lookup is one deterministic call with a fixed schema, so the caller's model should decide when to make it. The others need the callee to plan, keep state or wait.\"},\n  {\"q\": \"A token carries act: {sub: carrier-agent, act: {sub: relay}}. Under RFC 8693, who is the current actor?\", \"options\": [\"relay\", \"carrier-agent\", \"The subject\", \"Both equally\"], \"answer\": 1, \"why\": \"The outermost act claim is the current actor. Nested actors are informational for access control, though you can still log them and use them to detect cycles.\"},\n  {\"q\": \"Every agent may delegate to 3 others, with delegation allowed to depth 3. How many agent runs can one request start?\", \"options\": [\"4\", \"9\", \"13\", \"40\"], \"answer\": 3, \"why\": \"1 + 3 + 9 + 27 = 40. A depth limit of 1 cuts it to 4. Fan-out and depth limits belong in code, not in prompts.\"},\n  {\"q\": \"In the MAST study, what kind of failure was most common?\", \"options\": [\"Network errors between agents\", \"Model refusals\", \"Failures of stopping, repetition and verification, such as step repetition and not knowing when to terminate\", \"Tokenizer mismatches\"], \"answer\": 2, \"why\": \"Step repetition (15.7%), reasoning-action mismatch (13.2%) and unawareness of termination conditions (12.4%) lead the list. Limits, schemas and verification steps address them.\"},\n  {\"q\": \"Your agent registers a push notification webhook with a partner's agent. What must your webhook receiver do?\", \"options\": [\"Accept any POST that names a known task\", \"Validate the configured credentials, check the task ID is one you created, and handle duplicates idempotently\", \"Reply with the task's artifacts\", \"Disable TLS for speed\"], \"answer\": 1, \"why\": \"Section 13.2 of the specification requires clients to validate webhook authenticity and recommends checking task IDs and idempotent processing, because duplicates can occur.\"}\n]\n```\n"}, {"id": "w9-tenancy", "week": 9, "kind": "lesson", "title": "Multi-tenancy for AI systems", "short": "Multi-tenancy for AI", "minutes": 55, "summary": "One AI platform serving many customers or teams without one ever seeing another's data, spending another's budget, or slowing another down. Isolation at every layer, the leak paths that are specific to AI (retrieval, memory, caches, adapters, traces), silo against pool, and the numbers behind the choice.", "body": "\n## Why AI systems leak across tenants in new ways\n\nA **tenant** is a customer (or an internal team) whose data, configuration and spend must stay separate from everyone else's, on infrastructure you share for cost and speed. Ordinary SaaS has learned to isolate tenants in its databases and APIs. An AI system adds components that were never built with tenants in mind, and the model itself is a powerful leak amplifier: give it a chunk from the wrong tenant and it will summarise it fluently and confidently.\n\nAWS's [SaaS tenant isolation whitepaper](https://docs.aws.amazon.com/whitepapers/latest/saas-tenant-isolation-strategies/saas-tenant-isolation-strategies.html) describes crossing a tenant boundary as \"a significant and potentially un-recoverable event for a SaaS business\". OWASP's [LLM08:2025 Vector and Embedding Weaknesses](https://genai.owasp.org/llmrisk/llm082025-vector-and-embedding-weaknesses/) names the AI form directly: in multi-tenant setups that share a vector database, one group's embeddings can be retrieved for another group's queries, and the mitigation is \"permission-aware vector and embedding stores\" with \"strict logical and access partitioning\".\n\n[Week 2](#w2-ingestion) covered access control inside one tenant: ACLs on chunks, filtered in the query. This lesson is about the boundary between tenants, which is harder, because it must hold at every layer at once.\n\n```viz\ncaption: Every layer of an AI system is a place where one tenant's data can reach another. Isolation is only as strong as the weakest layer.\n<div class=\"vz-row\"><span class=\"ch sk c\">identity<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">tenant from request body<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">tenant from verified token<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">rows<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">one forgotten WHERE<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">RLS, non-owner role<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">vector index<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">filter after search<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">tenant filter in query<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">memory<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">keyed by user only<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">keyed by tenant and user<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">caches<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">key is the question<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">key has tenant, principals<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">models, adapters<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">trained on pooled data<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">adapter per tenant<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">logs, traces<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">anyone reads prompts<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">tenant tag, access, retention<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">keys, budgets<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">one shared key<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">gateway app per tenant<\/span><\/div>\n```\n\n> [!rule] The tenant comes from authentication and nowhere else: a verified token claim, resolved on the server. Never from a header, a body field, a URL the client chose, or the model. Every layer below receives it from the request context.\n\n## Silo, pool and bridge\n\nThe AWS Well-Architected [SaaS Lens](https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/silo-pool-and-bridge-models.html) names three deployment models, and the vocabulary is now standard:\n\n- **Silo**: \"tenants are provided dedicated resources\", such as a separate database or a whole stack per tenant, still onboarded and operated through one shared control plane.\n- **Pool**: \"tenants share resources\", for economies of scale, manageability and agility.\n- **Bridge**: a mix, because \"SaaS businesses aren't always exclusively silo or pool\". The Lens notes that a service's regulatory profile and \"noisy neighbor attributes\" may steer it to silo, while cost and agility tip others to pool.\n\nThe choice is made **per layer**, not once for the whole system. A typical AI platform pools compute and the model gateway, pools the database with row-level security for most tenants, and silos the database, the vector index or the provider account only for the tenants whose contracts or regulators demand it.\n\n### What silo costs\n\nThe model bill is the same in every model: you pay per token either way. What changes is the fixed cost of infrastructure that runs whether a tenant is busy or not. Here is a worked example for 200 tenants. The prices are assumptions for illustration; put your own cloud's numbers in.\n\n| Assumption | Value |\n|---|---|\n| Tenants | 20 large (50,000 conversations a month), 180 small (2,000 a month) |\n| Model cost per conversation, after caching | $0.05 |\n| Smallest always-on silo (database, API, worker) | $150 a month per tenant |\n| Shared pooled stack sized for the combined peak | $6,000 a month |\n\n> [!numbers] Model spend is 20 × 50,000 × $0.05 + 180 × 2,000 × $0.05 = $50,000 + $18,000 = **$68,000** a month in every design. Infrastructure: **silo** 200 × $150 = **$30,000**; **pool** **$6,000**; **bridge** (silo only the 20 large tenants, pool the rest on a $5,500 stack) 20 × $150 + $5,500 = **$8,500**. For a small tenant, a silo costs $150 against $100 of model spend: the platform costs more than the AI. Pooled, the same tenant's share of $6,000 is about $30.\n\n```viz\ncaption: With these assumptions, siloing every tenant multiplies infrastructure cost by five, almost all of it for the long tail of small tenants. Bridge pays for isolation only where it is demanded.\n<div class=\"vz-bars\"><span>silo: all 200<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:100%\"><\/i><\/span><b>$30,000<\/b><span>bridge: silo 20<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:28%\"><\/i><\/span><b>$8,500<\/b><span>pool: all 200<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:20%\"><\/i><\/span><b>$6,000<\/b><\/div>\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk\"><h5>Silo<\/h5><p>strongest boundary, per-tenant upgrades and regions, no noisy neighbours<\/p><\/div>\n  <div class=\"vz-panel sk\"><h5>Bridge<\/h5><p>silo the regulated and the huge; pool the long tail<\/p><\/div>\n  <div class=\"vz-panel sk g\"><h5>Pool<\/h5><p>cheapest; isolation is your code and your database's policies<\/p><\/div>\n<\/div>\n<div class=\"vz-src\">Infrastructure cost per month, computed from the assumptions in the table above (not vendor prices). Model terms from the AWS <a href=\"https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/silo-pool-and-bridge-models.html\">SaaS Lens<\/a>.<\/div>\n```\n\nSilo also costs operations: 200 databases to migrate, back up and monitor, and 200 places a schema change can fail. Pool costs engineering discipline: every layer below must enforce the boundary, because nothing physical does.\n\n## Layer by layer\n\n### Data: row-level security\n\nIn a pooled database, the cheapest strong control is Postgres **row-level security** (RLS): the database adds a tenant condition to every query on a table, so a query that forgets its `WHERE tenant_id = ...` returns nothing instead of everyone's rows.\n\n```sql\nALTER TABLE orders ADD COLUMN tenant_id text NOT NULL REFERENCES tenants(id);\nALTER TABLE orders ENABLE ROW LEVEL SECURITY;\nALTER TABLE orders FORCE ROW LEVEL SECURITY;\nCREATE POLICY tenant_isolation ON orders\n  USING (tenant_id = current_setting('app.tenant_id', true));\n\n-- per request, inside a transaction:\nSELECT set_config('app.tenant_id', 'summit', true);  -- this transaction only\n```\n\nA policy with only `USING` also applies the same condition as a check on inserted and updated rows, so a request for one tenant cannot write a row tagged with another. `current_setting(..., true)` returns NULL when the setting is missing, so a request that never set a tenant sees no rows at all: the failure is closed. The [Postgres RLS documentation](https://www.postgresql.org/docs/current/ddl-rowsecurity.html) and the [function reference](https://www.postgresql.org/docs/current/functions-admin.html) are short and worth reading whole. Five pitfalls catch almost every team:\n\n1. **Superusers and owners bypass RLS.** \"Superusers and roles with the BYPASSRLS attribute always bypass the row security system\", and table owners do too unless you `FORCE ROW LEVEL SECURITY`. If your app connects as the role that ran the migrations, or as `postgres`, your policies do nothing. Run the app as a separate role with neither attribute, and check it at startup.\n2. **`SET LOCAL` outside a transaction does nothing.** Postgres [documents](https://www.postgresql.org/docs/current/sql-set.html) that it \"emits a warning and otherwise has no effect\". Many pools run in autocommit mode, Relay's included, so set the tenant inside an explicit transaction with `set_config(..., true)`.\n3. **Pooled connections remember session settings.** A session-level `SET app.tenant_id` survives when the connection goes back to the pool, and the next request, for another tenant, inherits it. Transaction-local settings avoid this; so does a pool reset hook ([psycopg's pool](https://www.psycopg.org/psycopg3/docs/advanced/pool.html) calls a `reset` callback before reuse).\n4. **Unique keys and foreign keys bypass RLS.** The documentation warns that integrity checks \"always bypass row security\" and can become \"covert channel\" leaks. If order IDs are unique across all tenants, a tenant that tries to insert order 1042 learns that someone else has one. Make keys composite with `tenant_id`, or use random IDs.\n5. **Views run as their owner.** By default a view applies the RLS policies of the view's owner, so a view created by the table owner shows every tenant. Create views `WITH (security_invoker = true)` ([CREATE VIEW](https://www.postgresql.org/docs/current/sql-createview.html)).\n\n> [!warn] Test RLS as the application's role, not as a superuser. A test suite that connects as `postgres` passes whether or not your policies work, because superusers bypass them all.\n\n### Retrieval: filtering a shared vector index\n\nWeek 2's rule still holds: filter inside the query, never after. Multi-tenancy adds a recall trap. Approximate indexes such as HNSW find the nearest candidates first and apply the filter afterwards. The [pgvector README](https://github.com/pgvector/pgvector) gives the arithmetic: \"If a condition matches 10% of rows, with HNSW and the default `hnsw.ef_search` of 40, only 4 rows will match on average.\" A tenant filter, whether written in the query or added by an RLS policy, is such a condition, and it gets more selective with every tenant you add.\n\n```viz\ncaption: A shared HNSW index returns about 40 candidates before filtering. With many equal tenants, the filter leaves almost nothing, and retrieval silently returns empty results for small tenants.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk\"><h5>2 tenants: half survive<\/h5>\n    <div class=\"cells\" style=\"--n:10\"><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk g\"><\/i><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk g\"><\/i><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><i class=\"sk g\"><\/i><i class=\"sk x\"><\/i><\/div>\n    <p class=\"big g\">about 20 of 40<\/p>\n  <\/div>\n  <div class=\"vz-panel sk b\"><h5>100 tenants: almost none<\/h5>\n    <div class=\"cells\" style=\"--n:10\"><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><i class=\"sk x\"><\/i><\/div>\n    <p class=\"big b\">about 0.4 of 40<\/p>\n  <\/div>\n<\/div>\n<div class=\"vz-src\">Expected survivors = candidates x share of rows matching the filter, following the example in the <a href=\"https://github.com/pgvector/pgvector\">pgvector README<\/a> (default <code>hnsw.ef_search<\/code> of 40).<\/div>\n```\n\nThe leak is prevented either way; what breaks is quality, silently, for exactly the small tenants nobody watches. Fixes, from cheapest:\n\n- **Iterative index scans** (pgvector 0.8.0 and later): `SET LOCAL hnsw.iterative_scan = relaxed_order` keeps scanning until enough rows pass the filter, up to `hnsw.max_scan_tuples` (20,000 by default).\n- **Partial indexes or partitions.** pgvector suggests partial indexes for a few distinct filter values and partitioning for many; a list partition per large tenant gives each its own index.\n- **A namespace or collection per tenant** in a dedicated vector database, which most of them support, at the cost of more objects to manage.\n\nWhatever you pick, run your retrieval eval **per tenant**. An average across tenants hides the one that gets nothing back.\n\n### Conversation memory\n\nMemory is a database table with a model in front of it, and it leaks the same way: a memory lookup keyed only by user ID breaks if user IDs repeat across tenants, and any **learned** artefact built from many conversations (auto-generated FAQs, few-shot example banks, \"lessons learned\" stores) is pooled data in disguise. Key every memory by tenant and user, put it under the same RLS as everything else, and never build a shared learned store from more than one tenant's conversations unless every one of them has agreed to it.\n\n### Caches\n\nTwo caches matter, and they are scoped very differently.\n\n**Your response and retrieval caches** are yours to key. A semantic cache keyed on the question will answer tenant B with tenant A's answer, grounded in A's documents. The key must contain the tenant, the caller's principals (or a hash of them), and the version of the knowledge base, as [Week 5's caching lesson](#w5-scaling) set out for one tenant.\n\n**Provider prompt caches** are scoped by the provider. Anthropic documents that caches \"are isolated between organizations\" and, on the Claude API, \"per workspace within an organization\", while on Bedrock and Google Cloud isolation is per organization ([prompt caching docs](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)). OpenAI states that \"caches are not shared across organizations\" ([prompt caching guide](https://developers.openai.com/api/docs/guides/prompt-caching)). So if every tenant's traffic goes through your one provider account, every tenant shares your cache scope.\n\nThat is usually acceptable, for two reasons: a cache hit requires a byte-identical prefix, and the output is the same as without caching. The residual risk is timing. [Gu et al. (ICML 2025)](https://arxiv.org/abs/2502.07776) showed that cached prompts return measurably faster, which can reveal whether someone else recently sent the same prefix, and in 2025 they detected cache sharing across users at seven API providers. Put tenant-specific content (the tenant's own instructions, its documents) after the shared prefix and inside its own cache breakpoints, and for tenants whose contracts forbid shared infrastructure, use a separate provider workspace or project.\n\n> [!numbers] Separate cache scopes cost money. With a 6,000-token shared prefix at Opus 5.5 list prices, a cache write costs 6,000 × $5 / 1M = **$0.03** and a read costs 6,000 × $0.20 / 1M = **$0.0012**: 25 times less. A small tenant in its own workspace, sending a request less often than the 5-minute cache lifetime, pays the write almost every time.\n\n### Fine-tuned models and adapters\n\nA model fine-tuned on several tenants' data can repeat that data: [Carlini et al.](https://arxiv.org/abs/2012.07805) extracted hundreds of verbatim training sequences, including personal information, from GPT-2, and found larger models more vulnerable. Fine-tune on one tenant's data for that tenant only. Serving engines make this affordable: vLLM serves many LoRA adapters on one base model, and a request picks its adapter \"as if it were any other model via the `model` request parameter\" ([vLLM LoRA docs](https://docs.vllm.ai/en/latest/features/lora.html)).\n\nThat convenience is the leak: if the client chooses the model name, a client can choose another tenant's adapter. Enforce the mapping from tenant to adapter in the gateway, never in the client. In Switchboard, that is the per-app `allowed_models` list, checked on every request and on fallbacks too. The same vLLM page warns that loading adapters at runtime \"should not be used in production unless it is an isolated, fully trusted environment\".\n\n### Logs and traces\n\nTraces hold prompts, retrieved chunks and answers: everything the isolation above protects. Tag every span and log line with the tenant, restrict who can query each tenant's traces, and apply each tenant's retention and deletion rules to them. Relay records content in traces only when you opt in, and redacts it; Switchboard stores request bodies only when an app sets `log_bodies`, always redacted, with a per-app `retention_days`.\n\n### Model keys, budgets and noisy neighbours\n\nOne provider key shared by all tenants means one rate limit shared by all tenants. When one tenant starts a bulk job, everyone else gets 429s. This is the **noisy neighbour** problem, and in AI systems it arrives in tokens per minute, not CPU.\n\nGive each tenant its own gateway identity. In Switchboard, an **app** is the unit: each has its own keys, `allowed_models`, `rpm` and `tpm` limits, and an optional monthly budget, nested under a team and an organisation, each with their own budgets. A tenant that exhausts its budget gets a 429 with `x-switchboard-limit: budget:app`, and nobody else notices.\n\nThe tool gateway needs the same boundary. Checkpoint can bind an agent to one tenant: a bound agent that presents a user token from another tenant is refused before any policy runs, approvers bound to a tenant see only that tenant's queue, and the signed assertion each MCP server receives carries a `tenant` claim the server uses to scope its data. The check is built into the gateway rather than written as a policy, because policies are edited often and one typo would open every tenant.\n\n> [!numbers] Say your provider allows your organisation 2,000,000 tokens per minute and you serve 50 tenants. One tenant's backfill takes 1,800,000 TPM; the other 49 share 200,000, about 4,100 each. Cap every tenant at 25% (500,000 TPM): the backfill slows down, and the other 49 share 1,500,000, about **30,600 each**, 7.5 times more.\n\nCaps are the blunt tool. Fairer schemes give each tenant a guaranteed share and let it borrow unused capacity, and put bulk work on a separate, lower-priority queue (or a provider's batch API) so it never competes with live chats.\n\n### Evals and red-team suites per tenant\n\nEach tenant has its own prompt, knowledge base, tools and policies, so each needs its own eval suite and its own pass threshold, run on every change that touches it. Add a **cross-tenant red-team suite** to every tenant's gate, as a must-never category alongside the cross-customer cases from Week 3:\n\n- prompt injections that ask for another tenant's records by ID, name or email;\n- requests for another tenant's policies or documents (\"what is Summit's return window?\");\n- direct API calls with another tenant's session or resource IDs;\n- tokens with a missing, unknown or tampered tenant claim.\n\nOne failure in this category blocks the release, whatever the other scores are.\n\n## Failure modes\n\n| Failure | How it happens | What catches it |\n|---|---|---|\n| RLS silently off | The app connects as the table owner or a superuser | A startup check that the role has neither `rolsuper` nor `rolbypassrls`; isolation tests run as the app role |\n| Tenant bleed between requests | A session-level `SET` survives on a pooled connection | Transaction-local `set_config`; a test that alternates tenants on one connection |\n| Empty retrieval for small tenants | HNSW post-filtering with a selective tenant filter | Per-tenant retrieval evals; iterative scans or per-tenant partitions |\n| Cross-tenant cache hit | Cache key without tenant or principals | Key review; a test that asks the same question as two tenants |\n| Adapter swap | Client picks the model name | Gateway allow-list per tenant |\n| Noisy neighbour | Shared key and limits | Per-tenant app keys, limits and budgets; bulk work on its own queue |\n| Covert channel | Global unique IDs | Composite or random keys |\n\n## Design review questions\n\n> [!interview] Show me where the tenant ID enters a request, and every place it is read afterwards. Is there any path where it comes from the client?\n\n> [!interview] Which database role does the application connect as? Prove that it cannot bypass row-level security.\n\n> [!interview] What is retrieval recall for your smallest tenant, and how do you know?\n\n> [!interview] List every cache in the system and its key. Which ones include the tenant?\n\n> [!interview] One tenant starts a bulk job at 3 a.m. What happens to the others' latency and error rate, and which limit stops it?\n\n> [!interview] Which layers are siloed for your largest regulated customer, and what would it cost to silo them for everyone?\n\n## Further reading\n\n- AWS Well-Architected [SaaS Lens: silo, pool and bridge](https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/silo-pool-and-bridge-models.html), and the older but still useful [SaaS tenant isolation strategies](https://docs.aws.amazon.com/whitepapers/latest/saas-tenant-isolation-strategies/saas-tenant-isolation-strategies.html) whitepaper.\n- [Postgres row security policies](https://www.postgresql.org/docs/current/ddl-rowsecurity.html), short and precise.\n- [pgvector: filtering and iterative index scans](https://github.com/pgvector/pgvector).\n- [OWASP LLM08:2025 Vector and Embedding Weaknesses](https://genai.owasp.org/llmrisk/llm082025-vector-and-embedding-weaknesses/).\n- [Auditing Prompt Caching in Language Model APIs](https://arxiv.org/abs/2502.07776), Gu et al., ICML 2025.\n- `platform/switchboard` in this course's repository: per-app keys, limits and budgets under teams and organisations.\n\n```quiz\n[\n  {\"q\": \"Your RLS policies are correct, but the isolation test shows tenant A reading tenant B's rows. What is the most likely cause?\", \"options\": [\"The policy uses USING instead of WITH CHECK\", \"The application connects as the table owner or a superuser, which bypass RLS\", \"pgvector disables RLS\", \"RLS only works on views\"], \"answer\": 1, \"why\": \"Superusers and BYPASSRLS roles always bypass row security, and owners do unless FORCE ROW LEVEL SECURITY is set. Run the app as a separate role and test as that role.\"},\n  {\"q\": \"Relay's connection pool runs in autocommit mode. Each request runs SET LOCAL app.tenant_id = 'summit' and then its queries. What happens?\", \"options\": [\"It works\", \"SET LOCAL outside a transaction has no effect, so the queries run with no tenant set\", \"Postgres raises an error and the request fails\", \"The setting applies to the whole session\"], \"answer\": 1, \"why\": \"Postgres emits a warning and ignores it. Open a transaction and use set_config('app.tenant_id', ..., true) inside it.\"},\n  {\"q\": \"A shared HNSW index returns about 40 candidates, and you have 100 tenants of equal size. On average, how many candidates survive the tenant filter?\", \"options\": [\"40\", \"20\", \"4\", \"Fewer than 1\"], \"answer\": 3, \"why\": \"40 x 1% = 0.4. Retrieval quietly returns nothing. Use iterative scans, partitions or per-tenant collections, and measure recall per tenant.\"},\n  {\"q\": \"Which cache key is safe for a semantic response cache on a multi-tenant support bot?\", \"options\": [\"The normalised question\", \"Question plus model name\", \"Tenant, caller's principals and knowledge-base version, plus the question\", \"The user's email\"], \"answer\": 2, \"why\": \"Without the tenant and principals, one tenant's answer, grounded in its documents, is served to another. The KB version stops stale answers after an update.\"},\n  {\"q\": \"A vLLM server hosts one LoRA adapter per tenant, selected by the model name in the request. What stops tenant A using tenant B's adapter?\", \"options\": [\"Nothing is needed; adapter names are secret\", \"The gateway maps each tenant's key to its allowed models and rejects others\", \"The model refuses\", \"Rate limits\"], \"answer\": 1, \"why\": \"The client controls the model field, so the mapping must be enforced server-side, for example with Switchboard's per-app allowed_models.\"},\n  {\"q\": \"With assumed costs of $150 a month per silo and a $6,000 pooled stack, what does siloing all 200 tenants cost in infrastructure, compared with pooling?\", \"options\": [\"The same\", \"$30,000 against $6,000\", \"$6,000 against $30,000\", \"$1,200 against $6,000\"], \"answer\": 1, \"why\": \"200 x $150 = $30,000. The model bill is the same either way; the fixed cost per silo is what multiplies, mostly for small tenants.\"},\n  {\"q\": \"One tenant's batch job uses 90% of your organisation's tokens per minute. What is the most direct fix?\", \"options\": [\"A bigger model\", \"Per-tenant gateway keys with TPM limits and budgets, and bulk work on its own lower-priority queue\", \"Turn off prompt caching\", \"Ask the tenant to stop\"], \"answer\": 1, \"why\": \"Noisy neighbours are a shared-limit problem. Per-tenant limits contain them; a separate queue keeps bulk work away from live traffic.\"}\n]\n```\n"}, {"id": "w9-lab", "week": 9, "kind": "lab", "title": "Lab 9: Make Relay multi-tenant", "short": "Lab: tenants and isolation", "minutes": 180, "builds": "Tenant column and row-level security, tenant-scoped retrieval and memory, tenant-keyed caches, per-tenant Switchboard apps, an isolation test suite", "summary": "Turn Relay from one store's support agent into a platform that serves two stores from one deployment, with Postgres row-level security under every query, tenant-scoped retrieval, memory and caches, a separate gateway budget per store, and a test suite that attacks the boundary.", "body": "\n## What you will build\n\nRelay has served one store, Northwind Outfitters, since Lab 1. In this lab it starts serving a second store, **Summit Cycles** (also fictional), from the same API, worker and database. Every customer read in Relay is already scoped by `customer_id` in SQL (`app/db.py`). That protects one customer from another inside a store. It does not protect one store from another, and a single forgotten filter would leak everything. You will add a boundary the database enforces.\n\n```viz\ncaption: One deployment, two stores. The tenant comes from the token and is enforced at every layer below it; the database refuses rows from the wrong tenant even when the code forgets.\n<div class=\"vz-row\"><span class=\"ch sk\">token: sub c_77, tenant northwind<\/span><span class=\"ch sk\">token: sub c_301, tenant summit<\/span><\/div>\n<span class=\"arr d sk\"><\/span>\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk c\"><h5>Request context<\/h5><div class=\"vz-row\"><span class=\"ch sk c\">Principal.tenant<\/span><\/div><div class=\"vz-row\"><span class=\"ch sk c\">Store.for_tenant()<\/span><\/div><p>steps 2 and 3<\/p><\/div>\n  <div class=\"vz-panel sk m\"><h5>Postgres<\/h5><div class=\"vz-row\"><span class=\"ch sk m\">tenant_id column<\/span><\/div><div class=\"vz-row\"><span class=\"ch sk m\">RLS, app role<\/span><\/div><p>step 1<\/p><\/div>\n  <div class=\"vz-panel sk g\"><h5>Around the model<\/h5><div class=\"vz-row\"><span class=\"ch sk g\">search cache key<\/span><\/div><div class=\"vz-row\"><span class=\"ch sk g\">Switchboard app each<\/span><\/div><p>steps 4 and 5<\/p><\/div>\n<\/div>\n<div class=\"vz-row\"><span class=\"ch wide sk b\">step 6: an isolation suite that attacks the boundary as the app's own role<\/span><\/div>\n```\n\n**Acceptance criteria**\n\n1. Every table that holds store data has a `tenant_id` column and a row-level security policy, and the API and worker connect as a role that is neither a superuser nor `BYPASSRLS`. Relay refuses to start otherwise.\n2. The tenant comes only from a verified token claim. A token with no tenant, or an unknown one, gets a 401.\n3. Retrieval, memory, sessions, orders, refunds, approvals, usage and feedback are scoped to the tenant by the database, not only by the code.\n4. The knowledge-base search cache keys on tenant and principals; the same question from the two stores never shares an entry.\n5. Each store calls models through its own Switchboard app with its own key and budget. Exhausting Summit's budget does not affect Northwind.\n6. `tests/test_tenancy.py` runs as the app role and passes all eleven tests: cross-tenant reads by prompt injection, by direct API call, by retrieval, by memory and by cache all fail closed. The existing tests still pass, and `uv run ruff check .` is clean.\n\n> [!tip] Read [Lesson 2](#w9-tenancy) first; this lab applies it. You need Relay from [Lab 5](#w5-lab) and Switchboard running as in [Lab 7](#w7-lab). The code below is what you add: Relay's reference implementation does not contain it yet, so you are writing it, not copying it. Every function it calls exists in `relay/` today.\n\n## Step 0: describe the two stores\n\nCreate `app/tenants.py`. It holds what differs per store; the database will hold who may see what.\n\n```python\n\"\"\"The stores Relay serves. A request's tenant comes only from a verified token claim (app/auth.py).\"\"\"\n\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nROOT = Path(__file__).parent.parent\n\n\n@dataclass(frozen=True)\nclass Tenant:\n    id: str\n    name: str\n    kb_dir: Path\n    prompt: Path\n    key_env: str  # environment variable holding this store's Switchboard key\n\n\nTENANTS = {\n    \"northwind\": Tenant(\"northwind\", \"Northwind Outfitters\", ROOT / \"kb\", ROOT / \"prompts\" / \"system.md\",\n                        \"RELAY_SWITCHBOARD_KEY_NORTHWIND\"),\n    \"summit\": Tenant(\"summit\", \"Summit Cycles\", ROOT / \"kb_summit\", ROOT / \"prompts\" / \"system_summit.md\",\n                     \"RELAY_SWITCHBOARD_KEY_SUMMIT\"),\n}\n```\n\nThen give Summit its own content:\n\n- `prompts/system_summit.md`: copy `prompts/system.md` and make it Summit's (it is a bicycle shop).\n- `kb_summit/`: two or three Markdown files in the same format as `kb/`, with IDs that do not clash with Northwind's, for example `kb_summit/SUM-RETURNS-2026.md`:\n\n```markdown\n---\ntitle: Summit returns policy 2026\nacl: public\n---\n\n## Return window\nBikes can be returned within 14 days of delivery if they have been ridden less than 20 km.\nAccessories have a 30-day return window.\n```\n\nAdd one internal document (`acl: group:support`) too, so you can check that staff of one store do not see the other store's internal pages.\n\n> [!warn] Document IDs are file names, and `documents.doc_id` is a primary key across all tenants. If Summit had a file called `POL-RETURNS-2026.md`, ingestion would collide with Northwind's row. Step 1 explains why that collision is itself a leak, and the stretch goals fix it properly.\n\n## Step 1: tenant columns, row-level security and an app role\n\n### The schema\n\nRelay applies `app/schema.sql` with idempotent statements only, so add a Lab 9 section at the end in the same style:\n\n```sql\n-- ---- Lab 9: tenants ------------------------------------------------------------------------------\nCREATE TABLE IF NOT EXISTS tenants (\n  id   text PRIMARY KEY,\n  name text NOT NULL\n);\nINSERT INTO tenants (id, name) VALUES ('northwind', 'Northwind Outfitters') ON CONFLICT (id) DO NOTHING;\n\nDO $$\nDECLARE t text;\nBEGIN\n  FOREACH t IN ARRAY ARRAY['customers', 'orders', 'refunds', 'approvals', 'escalations', 'sessions', 'messages',\n                           'memories', 'documents', 'chunks', 'ingest_jobs', 'reviews', 'usage_daily',\n                           'idempotency_keys', 'feedback', 'online_judgements']\n  LOOP\n    -- Existing rows belong to the first store.\n    EXECUTE format('ALTER TABLE %I ADD COLUMN IF NOT EXISTS tenant_id text NOT NULL DEFAULT %L REFERENCES tenants(id)',\n                   t, 'northwind');\n    -- New rows take the tenant of the transaction that writes them.\n    EXECUTE format('ALTER TABLE %I ALTER COLUMN tenant_id SET DEFAULT '\n                   'coalesce(nullif(current_setting(%L, true), %L), %L)', t, 'app.tenant_id', '', 'northwind');\n    EXECUTE format('ALTER TABLE %I ENABLE ROW LEVEL SECURITY', t);\n    EXECUTE format('ALTER TABLE %I FORCE ROW LEVEL SECURITY', t);\n    EXECUTE format('DROP POLICY IF EXISTS tenant_isolation ON %I', t);\n    EXECUTE format('CREATE POLICY tenant_isolation ON %I USING (tenant_id = current_setting(%L, true))',\n                   t, 'app.tenant_id');\n  END LOOP;\nEND $$;\n\nCREATE INDEX IF NOT EXISTS orders_tenant ON orders (tenant_id, customer_id);\nCREATE INDEX IF NOT EXISTS documents_tenant ON documents (tenant_id);\n```\n\nRead it closely, because each line carries a decision:\n\n- **The policy** shows a row only when its `tenant_id` equals the transaction's `app.tenant_id`. With only a `USING` clause, Postgres applies the same condition to inserted and updated rows, so a Summit transaction cannot write a Northwind row. `current_setting(..., true)` gives NULL (or an empty string, once the setting has been used on a connection) when no tenant is set, and neither matches any row: a request with no tenant sees nothing.\n- **The default** fills `tenant_id` from the transaction's tenant, so the existing `INSERT` statements in `app/db.py`, `app/ingest.py` and `app/seed.py` keep working unchanged. The `'northwind'` fallback exists only for jobs that run as the table owner (migrations, the existing tests); for the app role the policy's check still rejects any row whose tenant does not match the setting.\n- **`FORCE ROW LEVEL SECURITY`** applies the policies to the table's owner too. Superusers still bypass them, whatever you write here.\n- **Left out on purpose:** `jobs`, `rate_limits` and `flags` are platform tables. The worker claims jobs across all stores, rate-limit keys will carry the tenant, and flags are global kill switches.\n\n### A role the policies apply to\n\nRow-level security does nothing for a superuser, and Relay connects as `postgres` today. Create `infra/roles.sql`:\n\n```sql\n-- Run once per database as an administrator. The app and worker connect as relay_app; migrations stay with the owner.\nCREATE ROLE relay_app LOGIN PASSWORD :'app_password' NOSUPERUSER NOBYPASSRLS;\nGRANT USAGE ON SCHEMA public TO relay_app;\nGRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO relay_app;\nGRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO relay_app;\nALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO relay_app;\nALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO relay_app;\n```\n\nNow the API and the worker must stop applying the schema at startup, because DDL needs the owner. Delete the `await app.state.store.apply_schema()` line in `app/main.py`'s `lifespan` and `await store.apply_schema()` in `app/worker.py`'s `main`; `python -m app.migrate` is already the release step. In their place, refuse to run with RLS switched off. Add to `app/db.py`:\n\n```python\nasync def assert_rls_applies(store: \"Store\") -> None:\n    \"\"\"Row-level security is silently off for superusers and BYPASSRLS roles. Refuse to serve as one.\"\"\"\n    async with store.conn() as c:\n        row = await (\n            await c.execute(\"SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user\")\n        ).fetchone()\n    if row[\"rolsuper\"] or row[\"rolbypassrls\"]:\n        raise RuntimeError(\"connect as relay_app: this role bypasses row-level security\")\n```\n\nCall it where the two `apply_schema` calls were. Then, from `relay/`:\n\n```bash\ndocker compose up -d\nuv run python -m app.migrate                       # as postgres, the owner: adds the columns and policies\ndocker compose exec -T db psql -U postgres -d relay -v app_password=change-me < infra/roles.sql\ndocker compose exec -T db psql -U postgres -d relay \\\n  -c \"INSERT INTO tenants (id, name) VALUES ('summit', 'Summit Cycles') ON CONFLICT (id) DO NOTHING\"\nexport RELAY_DATABASE_URL=postgresql://relay_app:change-me@localhost:5432/relay\n```\n\n> [!warn] Postgres documents that unique and foreign-key checks \"always bypass row security\". Relay's `orders.id`, `sessions.id`, `customers.id` and `documents.doc_id` are unique across all tenants, so a Summit request that tries to create a row with a Northwind ID gets a duplicate-key error, which tells it the ID exists. In this lab you keep IDs distinct and handle the one place a client chooses an ID (sessions, in Step 2). Composite keys are a stretch goal.\n\n## Step 2: the tenant in every request\n\n### From the token\n\nIn `app/auth.py`, add the tenant to `Principal` and read it from the verified claims. A missing or unknown tenant is an authentication failure, never a default:\n\n```python\n@dataclass(frozen=True)\nclass Principal:\n    customer_id: str\n    tenant: str\n    staff: bool = False\n```\n\n```python\n        tenant = claims.get(\"tenant\")\n        if tenant not in TENANTS:  # from app.tenants; never fall back to a default store\n            raise HTTPException(401, \"Invalid or expired token\", headers={\"WWW-Authenticate\": \"Bearer\"})\n        return Principal(customer_id=str(claims[\"sub\"]), tenant=tenant,\n                         staff=self.cfg.staff_role in claims.get(\"roles\", []))\n```\n\nWith a real identity provider, map its organisation claim to your tenant ID here. For development, give `mint` in `scripts/dev_token.py` a keyword argument `tenant: str = \"northwind\"` that it puts in the claims, and add a `--tenant` flag to both `scripts/dev_token.py` and `scripts/chat.py`. The default keeps the existing tests' tokens valid.\n\n### Into every query\n\nEvery query in Relay goes through `Store.conn()`, which makes it the one place to set the tenant. In `app/db.py`, give the store an optional tenant and wrap each connection in a transaction that sets it:\n\n```python\nclass Store:\n    def __init__(self, source: AsyncConnectionPool | AsyncConnection, tenant: str | None = None):\n        self.source = source\n        self.tenant = tenant  # None: platform work (job claiming, migrations); RLS tables then show no rows\n\n    def for_tenant(self, tenant: str) -> \"Store\":\n        return Store(self.source, tenant)\n\n    @asynccontextmanager\n    async def _connection(self):\n        if isinstance(self.source, AsyncConnectionPool):\n            async with self.source.connection() as c:\n                yield c\n        else:\n            yield self.source\n\n    @asynccontextmanager\n    async def conn(self):\n        async with self._connection() as c:\n            if self.tenant is None:\n                yield c\n                return\n            async with c.transaction():  # the pool is autocommit: SET LOCAL alone would do nothing\n                await c.execute(\"SELECT set_config('app.tenant_id', %s, true)\", (self.tenant,))\n                yield c\n```\n\n`set_config(..., true)` lasts only until the transaction ends, so a connection returned to the pool carries no tenant into the next request. Code that already opens `c.transaction()` inside `conn()` (refunds, approvals, `save_turn`, rate limits) gets a savepoint, which psycopg handles.\n\nIn `app/main.py`, derive a tenant store at the top of every endpoint that takes a `Principal`, and use it everywhere below, including in `Context(store=...)`:\n\n```python\n    store: Store = request.app.state.store.for_tenant(who.tenant)\n```\n\nThree more edits complete the path:\n\n- **Rate limits.** `rate_limits` has no RLS, so put the tenant in the key: call `enforce_rate(store, f\"{who.tenant}:{who.customer_id}\", ...)` in `/chat` and `/emails`.\n- **Sessions.** In `Store.load_session`, a session ID from another tenant is invisible, so the code tries to create it, and the primary key collides. Make the insert `INSERT ... ON CONFLICT (id) DO NOTHING RETURNING id` and raise `NotFound` when it returns nothing. The other tenant's session then looks exactly like a missing one, as the docstring already promises.\n- **The prompt.** Give `system_prompt` in `app/prompts.py` a `tenant` parameter that picks `TENANTS[tenant].prompt` (read the files once at import), and pass `who.tenant` from `/chat` and `ctx.store.tenant` from `app/channels.py`.\n\n## Step 3: tenant-scoped retrieval and memory\n\n### Retrieval\n\n`Retriever` keeps the store it was built with, and `app.state.retriever` is built with the untenanted one. Under RLS that is safe but useless: every search returns nothing. Add a method in `app/retrieval.py` that rebinds it per request:\n\n```python\n    def for_store(self, store: Store) -> \"Retriever\":\n        return Retriever(store, self.embedder, self.reranker, self.candidates, self.cache)\n```\n\nand build the context in `/chat` and `/emails` with `retriever=request.app.state.retriever.for_store(store)`. The `VISIBLE` clause in `retrieval.py` already joins `documents` and filters by ACL; RLS now adds the tenant to both `chunks` and `documents` underneath it. Notice the shape of the safety: forgetting `for_store` gives empty results, not another store's documents.\n\n### Ingestion\n\nBoth `reconcile` and `run_once` in `app/ingest.py` take a store, and `reconcile` takes a folder. In the worker's loop, run them once per tenant:\n\n```python\n        if since_reconcile >= reconcile_every:\n            for t in TENANTS.values():\n                await reconcile(store.for_tenant(t.id), t.kb_dir)\n            since_reconcile = 0\n        indexed = sum([await run_once(store.for_tenant(t), embedder) for t in TENANTS])\n        done = indexed + await run_ready(store, jobs)\n```\n\n`reconcile` diffs a folder against the `documents` table and queues deletions for documents missing from the folder. Without a tenant boundary, reconciling `kb_summit/` would queue every Northwind document for deletion. With RLS, the Summit transaction cannot see Northwind's documents at all.\n\n### Memory and other background jobs\n\nJobs are claimed by the platform (untenanted) store, so the payload must carry the tenant. In `Store.save_turn`, add `\"tenant_id\": self.tenant` to the payload; do the same where `/feedback` enqueues `judge_session`. In `app/worker.py`, run each handler as its tenant:\n\n```python\n    async def extract_memory(payload: dict) -> None:\n        t = store.for_tenant(payload.get(\"tenant_id\", \"northwind\"))  # jobs queued before this change\n        session_id = UUID(payload[\"session_id\"])\n        messages = await t.load_session(session_id, payload[\"customer_id\"])\n        await remember(t, extractor, payload[\"customer_id\"], session_id, messages)\n```\n\nand pass `store.for_tenant(payload.get(\"tenant_id\", \"northwind\"))` to `online.judge_session`. Memories are now read and written under the tenant's policy; the `memories` lookup in `/chat` goes through the tenant store from Step 2.\n\n### Seed both stores\n\nEdit `scripts/seed_demo.py` to seed each store through its tenant store: Northwind's existing `DEMO` with `seed(store.for_tenant(\"northwind\"), ...)`, and a Summit set with its own customer and order IDs, for example customer `c_301` with orders `9101` and `9102` (items with `\"category\": \"bike\"`). The script applies the schema, so run it as the owner:\n\n```bash\nRELAY_DATABASE_URL=postgresql://postgres:relay@localhost:5432/relay uv run python -m scripts.seed_demo\n```\n\nCustomer IDs must also be unique across stores in this lab, because `customers.id` and `usage_daily`'s key do not include the tenant. With a real identity provider, `sub` values from one issuer are unique, which is the assumption here.\n\n## Step 4: tenant-keyed caches\n\nRelay has no response cache yet, so add the one most teams add first: a short-lived cache of knowledge-base search results. Its key must hold everything that changes the answer. Add to `app/retrieval.py`:\n\n```python\nimport time\n\n\nclass SearchCache:\n    \"\"\"In-process cache for search results. The key carries everything that changes the answer.\"\"\"\n\n    def __init__(self, ttl_s: float = 300, max_items: int = 10_000, clock=time.monotonic):\n        self.ttl_s, self.max_items, self.clock = ttl_s, max_items, clock\n        self.items: dict[tuple, tuple[float, list[Hit]]] = {}\n\n    def key(self, tenant: str | None, principals: list[str], mode: str, k: int, query: str) -> tuple:\n        if tenant is None:\n            raise ValueError(\"refusing to cache a search that has no tenant\")\n        return (tenant, tuple(sorted(principals)), mode, k, \" \".join(query.lower().split()))\n\n    def get(self, key: tuple) -> list[Hit] | None:\n        hit = self.items.get(key)\n        return hit[1] if hit and self.clock() - hit[0] < self.ttl_s else None\n\n    def put(self, key: tuple, hits: list[Hit]) -> None:\n        if len(self.items) >= self.max_items:\n            self.items.clear()  # bounded and crude; use an LRU or Redis in production\n        self.items[key] = (self.clock(), hits)\n```\n\nGive `Retriever.__init__` a `cache: SearchCache | None = None` argument, build `app.state.retriever` in `lifespan` with `cache=SearchCache()`, and at the start of `Retriever.search` return a cached result for `self.cache.key(self.store.tenant, principals, mode, k, query)` when there is one; store the result before returning. The tests' retrievers have no cache, so nothing else changes.\n\nTwo questions to answer in your notes. Why must `principals` be in the key even though the tenant is? (Staff of the same store see `group:support` documents that customers must not.) What makes a cached result stale? (A document edit within the TTL; the stretch goals add the knowledge-base version to the key.)\n\nThe provider's prompt cache is the other cache in the path. Each store now has its own system prompt, so their cached prefixes differ from the first token. All stores still share your provider account's cache scope, as Lesson 2 explained; write down which of your tenants, if any, would need their own provider workspace or project.\n\n## Step 5: a Switchboard app per store\n\nEach store gets its own app in Switchboard, with its own key, model allow-list, limits and monthly budget. With Switchboard running on port 8100 as in Lab 7:\n\n```bash\nB=http://localhost:8100; A=\"Authorization: Bearer $SWITCHBOARD_ADMIN_TOKEN\"; J='content-type: application/json'\ncurl -s -X POST $B/admin/orgs  -H \"$A\" -H \"$J\" -d '{\"id\":\"relay-saas\",\"name\":\"Relay platform\",\"budget_usd_month\":500}'\ncurl -s -X POST $B/admin/teams -H \"$A\" -H \"$J\" -d '{\"id\":\"relay-tenants\",\"org_id\":\"relay-saas\",\"nam
