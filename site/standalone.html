s when a provider has an outage?** Each team finds out on its own.\n\nAn **AI gateway** is one service that every app calls instead of the provider. Apps keep their SDKs and change only the base URL and the key. The gateway holds the real provider keys and applies one set of rules to every request.\n\nThis week's reference service is [Switchboard](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/switchboard), a gateway built for this course. It serves the Anthropic Messages API at `/v1/messages` and the OpenAI-compatible Chat Completions API at `/v1/chat/completions`, which reaches OpenAI, Gemini, OpenRouter, Hugging Face Inference Providers, and self-hosted vLLM or Ollama. Every number in this lesson about Switchboard comes from its code, README or ADRs.\n\n## What a gateway centralises\n\n```viz\ncaption: One request through the gateway. Each check adds a control the apps no longer write themselves, and all of them together cost Switchboard about 0.1 ms at p95 once a key is cached.\n<div class=\"vz-row\"><span class=\"ch sk\">app: sbk_ key<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">1. verify key<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">2. model allowed?<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">3. RPM, TPM<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">4. budgets<\/span><\/div>\n<div class=\"vz-row\"><span class=\"arr sk\"><\/span><span class=\"ch sk c\">5. PII detect or redact<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">6. provider, then fallbacks<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">7. forward original bytes<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk m\">8. meter: ledger, metrics<\/span><\/div>\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk\"><h5>Refused before the provider<\/h5><p>401 bad key, 403 model policy, 429 limit or budget, 413 too large<\/p><\/div>\n  <div class=\"vz-panel sk\"><h5>Provider key<\/h5><p>held only by the gateway; apps never see it<\/p><\/div>\n  <div class=\"vz-panel sk\"><h5>Response headers<\/h5><p><code>x-switchboard-model<\/code>, <code>Server-Timing<\/code>, <code>x-request-id<\/code><\/p><\/div>\n<\/div>\n<div class=\"vz-src\">Order of checks from <a href=\"https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/switchboard/gateway.py\">switchboard/gateway.py<\/a>; 0.1 ms p95 at concurrency 32 from <a href=\"https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/docs/adr/0002-local-rate-limits-batched-ledger.md\">ADR 0002<\/a> (one laptop, one process).<\/div>\n```\n\n| Concern | What the gateway does | How Switchboard does it |\n|---|---|---|\n| Keys | Apps get gateway keys; provider keys stay in one place | Per-app virtual keys `sbk_<id>_<secret>`, only a SHA-256 stored, expiry (90 days by default) and instant revocation |\n| Tenancy and budgets | Spend limits at every level of the org chart | org, team and app, each with an optional monthly budget in USD |\n| Rate limits | Stop one app from eating the company's provider quota | Requests and tokens per minute per app (defaults 60 RPM, 200,000 TPM) |\n| Model policy | Which apps may use which models | `allowed_models` per app, enforced on fallbacks too; an allow-list for `anthropic-beta` headers |\n| Routing and fallback | Survive a provider outage | Fallback chains that may cross providers, tried before the first byte reaches the client; a circuit breaker per model |\n| Personal data | Keep card numbers and emails away from providers | `pii_mode`: off, detect (count only) or redact |\n| Audit | Who changed what, and what was sent | Admin actions always logged; request bodies only on opt-in, always redacted, with an expiry |\n| Metering and chargeback | Bill each team for its own use | Append-only usage ledger; `GET /admin/usage` by org, team, app or model |\n| Observability | One place to see every model call | Prometheus metrics, OpenTelemetry spans, JSON logs, `Server-Timing` |\n\n### Virtual keys\n\nA virtual key names an app, not a person or a provider. Switchboard stores only the hash, looks the key up by its id, compares hashes in constant time, and caches a verified key for 30 seconds per instance. That cache is a trade-off you should be able to state: a revoked key keeps working on other instances for up to 30 seconds (the instance that handled the revocation forgets it at once).\n\n### Budgets at three levels\n\nBudgets nest. A request is refused if the org, the team or the app has used up its monthly budget, whichever runs out first.\n\n```viz\ncaption: Budgets nest, and the smallest remaining one wins. Here the team still has money, but the app has hit its own cap, so the app's next request gets a 429.\n<div class=\"vz-bars\">\n  <span>org: Northwind, $500<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:62%\"><\/i><\/span><b>$310 spent<\/b>\n  <span>team: Support, $200<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:70%\"><\/i><\/span><b>$140 spent<\/b>\n  <span>app: Relay, $20<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:100%\"><\/i><\/span><b>$20 spent<\/b>\n<\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">next request from Relay<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">429, x-switchboard-limit: budget:app<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">next request from another Support app<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">allowed<\/span><\/div>\n<div class=\"vz-src\">Illustrative amounts. Behaviour from <a href=\"https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/switchboard/budgets.py\">switchboard/budgets.py<\/a> and the 429 in <code>gateway.py<\/code>.<\/div>\n```\n\n### Rate limits that count tokens\n\nA request limit alone does not protect a tokens-per-minute quota: one request can carry 100,000 tokens. Switchboard charges each request an **estimate** before sending it (body bytes ÷ 4, plus `max_tokens`), then refunds the difference once the real usage is known.\n\n> [!numbers] Relay asks for `max_tokens` 4,096. A turn with a 12,000-byte body is estimated at 12,000 ÷ 4 + 4,096 = **7,096 tokens**. Against the default 200,000 TPM, only 200,000 ÷ 7,096 ≈ **28** such requests can be in flight in one minute before the bucket says no, even if each one really uses 1,500 tokens. The refund after each response gives the capacity back, so the limit is tight only during bursts. If your app sets `max_tokens` far above what it needs, it pays for that in rate limit headroom.\n\n### Fallbacks across providers\n\nWhen the requested model fails before any byte has reached the client, Switchboard tries the next model in its chain. The chain may cross providers, for example a hosted model falling back to a self-hosted one.\n\n```mermaid\nflowchart TB\n  R[Request: gpt-5] --> A{gpt-5 on hosted provider}\n  A -->|200| OK[Stream to the app]\n  A -->|timeout, 408, 429, 5xx, 529<br/>or breaker open| B{qwen3:8b on local Ollama}\n  B -->|200| OK2[Stream to the app<br/>x-switchboard-model: qwen3:8b]\n  B -->|fails| E[502 to the app]\n```\n\nThree rules make fallbacks safe:\n\n- **Only before the first byte.** Once streaming has started, the client has seen part of an answer; switching models mid-stream would splice two answers together. Switchboard decides on status codes and connection errors, then commits.\n- **Policy still applies.** A fallback model the app is not allowed to use is skipped. Otherwise fallback is a way around model policy.\n- **Not every error is retryable.** Switchboard falls back on 408, 429, 500, 502, 503, 504 and 529, and on connection errors. A 401 from the provider (a bad provider key) or a 400 (a bad request) goes straight back, because another model would fail the same way or hide a real bug.\n\nA circuit breaker per model skips a failing primary for 30 seconds after 5 consecutive failures, so users do not each wait for a timeout. Every fallback model must be in your eval suite: tool calling and refusals differ across models, and the fallback's prompt cache starts cold.\n\n### PII policy\n\nWith `pii_mode=detect` (the default) Switchboard counts card numbers (checked with the Luhn algorithm), emails, phone numbers and IBANs in the system prompt and message text, and records the count. With `redact` it replaces them before the request leaves the company. Detection by pattern is a floor, not a guarantee: names and addresses pass straight through. Some products in the comparison below plug in heavier detectors, such as Microsoft Presidio.\n\n## The rule that matters most: do not break prompt caching\n\nProviders cache the processed state of a prompt **prefix** and match it byte for byte ([Week 5](#w5-scaling)). A gateway that parses JSON and serialises it again can change key order, whitespace or escaping. The model sees the same meaning; the cache sees a different prefix and misses every time. Nothing errors. The bill just goes up.\n\n```viz\ncaption: The same 3-step agent loop, through two gateways. Re-serialising the body turns every cache read into a full-price miss, which more than doubles this loop's input cost.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk b\"><h5>Gateway re-serialises JSON<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">{\"model\":..., \"system\":...}<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">{\"system\":..., \"model\":...}<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch wide sk b\">12,000-token prefix: miss, full price<\/span><\/div>\n    <div class=\"vz-bars\"><span>input cost<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:100%\"><\/i><\/span><b>$0.072<\/b><\/div>\n  <\/div>\n  <div class=\"vz-panel sk g\"><h5>Gateway forwards original bytes<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">{\"model\":..., \"system\":...}<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">identical bytes<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch wide sk g\">12,000-token prefix: read from cache<\/span><\/div>\n    <div class=\"vz-bars\"><span>input cost<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:45%\"><\/i><\/span><b>$0.032<\/b><\/div>\n  <\/div>\n<\/div>\n<div class=\"vz-src\">Worked example from <a href=\"#w5-scaling\">Week 5<\/a>: Sonnet 5.5 at $2 input, $2.50 5-minute write, $0.10 read per million tokens (<a href=\"https://platform.claude.com/docs/en/about-claude/pricing\">Anthropic pricing<\/a>, checked 2026-10-14). Decision from <a href=\"https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/docs/adr/0003-forward-bytes-unchanged.md\">ADR 0003<\/a>.<\/div>\n```\n\nSwitchboard's decision ([ADR 0003](https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/docs/adr/0003-forward-bytes-unchanged.md)): **parse the body to inspect it, but forward the original bytes.** It re-serialises only when it must change the content, and a test asserts byte-for-byte equality. The changes it does make are each a deliberate trade:\n\n| Change | When | Effect on the cache |\n|---|---|---|\n| Redact PII | `pii_mode=redact` and something was found | That request loses its cache hit. Prefer redacting at the app edge for prompts that must stay cacheable |\n| Replace `model` | A fallback is served | None that matters: a different model has a different, cold cache anyway |\n| Add `stream_options.include_usage` | A streamed Chat Completions request without it | None: the field is not part of the prompt prefix. It is needed because only the final chunk carries token usage, and only when asked |\n\n> [!rule] A gateway may read every byte, but it should forward the bytes it read. Write a test that sends a request through the gateway and compares what the provider received with what the app sent.\n\n## Latency: the gateway's own budget\n\nEvery millisecond the gateway adds is paid on every model call, and an agent turn makes several. The enterprise track's target for Switchboard is **under 10 ms p95 added**, excluding provider time.\n\n### Measure it with Server-Timing\n\n[Server-Timing](https://www.w3.org/TR/server-timing/) is a W3C response header for exactly this: named durations, such as `db;dur=53`. Switchboard sends `Server-Timing: gateway;dur=0.07, upstream;dur=1.24` on non-streamed responses (on streams, only the gateway's time before the provider call, since the upstream time is not known when headers go out). Load tests, client logs and browsers can then separate \"our gateway is slow\" from \"the provider is slow\" without guessing.\n\nSwitchboard's load test (`uv run python -m loadtest.overhead --concurrency 32`) sends the same requests through the gateway to a mock provider and reads the header. The first version was not fast:\n\n```viz\ncaption: Version 0.1 spent most of its time waiting on Postgres row locks. Moving limits into memory and batching the ledger cut p95 from 63.9 ms to 0.1 ms at concurrency 32.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk b\"><h5>v0.1: shared Postgres buckets<\/h5>\n    <div class=\"vz-bars\"><span>p50<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:80%\"><\/i><\/span><b>54.1 ms<\/b><span>p95<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:94%\"><\/i><\/span><b>63.9 ms<\/b><span>p99<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:100%\"><\/i><\/span><b>67.7 ms<\/b><\/div>\n    <p>every request updated the same bucket row and three spend rows<\/p>\n  <\/div>\n  <div class=\"vz-panel sk g\"><h5>v0.2: local limits, batched ledger<\/h5>\n    <div class=\"vz-bars\"><span>p50<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:1%\"><\/i><\/span><b>&lt;0.1 ms<\/b><span>p95<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:1%\"><\/i><\/span><b>0.1 ms<\/b><span>p99<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:2%\"><\/i><\/span><b>1.0 ms<\/b><\/div>\n    <p>no shared row on the request path once a key is cached<\/p>\n  <\/div>\n<\/div>\n<div class=\"vz-src\">Gateway time inside the handler, read from Server-Timing, one laptop, one process, concurrency 32: <a href=\"https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/docs/adr/0002-local-rate-limits-batched-ledger.md\">ADR 0002<\/a>. The mock provider shared the CPU, so these numbers say nothing about end-to-end capacity.<\/div>\n```\n\nThe cause was found by sampling `pg_stat_activity` under load: requests queued on row locks for the app's bucket row and the `spend_monthly` rows. The fix ([ADR 0002](https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/docs/adr/0002-local-rate-limits-batched-ledger.md)) has three parts, and each one trades exactness for speed:\n\n1. **Rate limits are local.** Each instance keeps in-memory token buckets sized at `limit ÷ live instances`. Instances heartbeat into Postgres every 5 seconds to learn how many there are. This is the model of Envoy's [local rate limit filter](https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_filters/local_rate_limit_filter), which by default applies limits \"per Envoy process\".\n2. **Ledger writes are batched.** Usage events queue in memory and flush every 0.5 seconds in one transaction. Spend rows are updated in sorted order, so instances cannot deadlock.\n3. **Budget checks are cached** for 2 seconds per (org, team, app).\n\n> [!numbers] An agent turn with six sequential model calls (the slow pattern from the [inference lesson](#w5-inference)) pays the gateway six times. Under v0.1 at concurrency 32 that is 6 × 63.9 ms ≈ **383 ms** added to the turn at p95. Under v0.2 it is 6 × 0.1 ms = **0.6 ms**. The first number is something users feel; the second is noise next to a time to first token measured in hundreds of milliseconds.\n\n## Failure modes\n\n### The gateway as a single point of failure\n\nEvery model call in the company now depends on one service. Run several stateless instances behind a load balancer, put them in more than one zone, and know which dependencies sit on the request path. In Switchboard, Postgres is not on the path for a cached key, but it comes back on the path whenever a cache expires: a key lookup after 30 seconds, a budget lookup after 2 seconds. If Postgres is down when a budget cache expires, that request fails. Decide in advance whether that should **fail closed** (refuse, protect money) or **fail open** (serve, protect users), and write it down.\n\n### Budgets overshoot\n\nBudgets are checked when a request is admitted, against spend that is up to 2 seconds stale and flushed every 0.5 seconds. Requests already admitted keep spending.\n\n```viz\ncaption: Most of a budget overshoot comes from requests already in flight, not from the 2-second cache. Long streams are admitted before the money runs out and finish after.\n<div class=\"vz-bars\">\n  <span>2 s stale budget cache<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:12%\"><\/i><\/span><b>40 requests, about $1.16<\/b>\n  <span>requests in flight (15 s each)<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:100%\"><\/i><\/span><b>300 requests, about $8.70<\/b>\n<\/div>\n<p>20 requests per second, each 12,000 uncached input and 500 output tokens on Sonnet 5.5: 0.012 × $2 + 0.0005 × $10 ≈ $0.029<\/p>\n<div class=\"vz-src\">Cache and flush intervals from <a href=\"https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/switchboard/config.py\">switchboard/config.py<\/a>; prices from <a href=\"https://platform.claude.com/docs/en/about-claude/pricing\">Anthropic pricing<\/a>, checked 2026-10-14; the 15 s turn is the 600-token example from the <a href=\"#w5-inference\">inference lesson<\/a>.<\/div>\n```\n\nADR 0002 states the bound as \"about 2 s of traffic plus in-flight requests\". For a $20 app budget, a $10 overshoot is half the budget again. Fixes, in order of cost: set a soft limit below the hard one and alert on it; cap `max_tokens` per app so one request has a known maximum cost; reserve the estimated cost at admission (as the TPM limit already does) and release the difference afterwards.\n\n> [!warn] A spent budget is a 429, and both official SDKs retry 429s twice by default ([OpenAI](https://github.com/openai/openai-python#retries), [Anthropic](https://platform.claude.com/docs/en/api/sdks/python#retries)). Retrying cannot help until next month, so Switchboard adds `x-should-retry: false` (which the SDKs honour) and `x-switchboard-limit: budget:<scope>` (which your own retry and fallback logic should honour too: a fallback model through the same gateway hits the same budget).\n\n### Per-instance limits are approximate\n\nWith 600 RPM for an app and 3 instances, each instance allows 200. If the load balancer sends that app's traffic unevenly, the app is throttled on the busy instance while the others have room. After a scale-out, old instances keep their old share until their next heartbeat (5 seconds), so total capacity briefly exceeds the limit. That is acceptable for abuse and cost protection. For contractual per-tenant quotas, ADR 0002 names the upgrade: Redis with atomic scripts, or a dedicated rate-limit service, behind the same interface.\n\n### Other ways it goes wrong\n\n| Failure | Symptom | Defence |\n|---|---|---|\n| Body re-serialised | Cache hit rate drops to zero after the gateway rollout; no errors | Forward original bytes; a byte-equality test; watch cache-read tokens per model |\n| Fallback to an unevaluated model | Quality drops during an outage, when you are least able to notice | Every fallback model in the eval suite; alert on `switchboard_fallbacks_total` |\n| Ledger events lost | Chargeback lower than the invoice | Graceful shutdown flushes; a hard crash loses up to 0.5 s; metrics for failed flushes and drops; reconcile monthly against the provider invoice |\n| Prices out of date | Chargeback wrong by a constant factor | Prices live in config with the date checked; review on every model change |\n| Provider's model name differs from the gateway's | Spend reported under a name with no price, so it shows $0 | Price by the gateway's catalog name; test chargeback with a streamed request |\n\n## Build or buy\n\nYou will rarely build a gateway from scratch. Building Switchboard is how this course shows what is inside one; in a company, start from this table. Every row below is from the product's own documentation, checked 2026-10-15.\n\n| Product | Kind | What its docs say it does |\n|---|---|---|\n| [LiteLLM proxy](https://docs.litellm.ai/docs/proxy/virtual_keys) | Open source, Python, self-hosted | Virtual keys with spend tracking per key, user and team; `max_budget`; `rpm_limit` and `tpm_limit`; allowed models per key; needs Postgres. [Fallbacks](https://docs.litellm.ai/docs/proxy/reliability) across providers, retries and cooldowns; [PII masking](https://docs.litellm.ai/docs/proxy/guardrails/pii_masking_v2) through Microsoft Presidio |\n| [Agent Router](https://github.com/envoyproxy/ai-gateway), formerly Envoy AI Gateway | Open source, Envoy and Envoy Gateway on Kubernetes | \"One consistent, OpenAI-compatible API for every model and tool\"; provider credentials held centrally; failover; MCP servers alongside model providers |\n| [Kong AI Gateway](https://developer.konghq.com/ai-gateway/) | Open-core API gateway | Many providers behind one API; load balancing with failover; AI Rate Limiting Advanced for token quotas; AI Sanitizer to \"redact PII before it reaches the upstream LLM provider\"; semantic cache; prompt guards; MCP |\n| [Cloudflare AI Gateway](https://developers.cloudflare.com/ai-gateway/) | Managed, at Cloudflare's edge | Analytics on requests, tokens and cost; logging; response caching; rate limiting; request retry and model fallback; Workers AI, Anthropic, Gemini, OpenAI and others |\n| [Azure API Management AI gateway](https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities) | Managed API gateway | `llm-token-limit` (TPM or token quotas per any key); `llm-emit-token-metric`; semantic caching; backend load balancing and a circuit breaker that honours `Retry-After`; content safety; OpenAI, Anthropic Messages (v2 tiers) and Vertex AI schemas |\n| [Google Apigee](https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/llm-token-quota-policy) | Managed API gateway | `LLMTokenQuota` counts or enforces input and output tokens per minute to per year; [`PromptTokenLimit`](https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/prompt-token-limit-policy) throttles prompt tokens to absorb spikes |\n| [AWS Multi-Provider Generative AI Gateway](https://docs.aws.amazon.com/solutions/multi-provider-generative-ai-gateway-on-aws/) | AWS reference architecture (Guidance) | LiteLLM on ECS or EKS behind WAF and a load balancer, RDS for virtual keys, ElastiCache, Secrets Manager for provider keys; Amazon Bedrock, SageMaker AI and external providers |\n\nHow to choose:\n\n- **Already run an API gateway** (Kong, Apigee, Azure API Management)? Add its AI features first: you keep one control plane, one auth model and one on-call rotation.\n- **Want open source and Python**? LiteLLM proxy covers most of the table above. Read how it re-serialises request bodies and test cache hit rates through it before rolling it out.\n- **Kubernetes platform team**? Agent Router fits an Envoy-based ingress.\n- **Build your own** only when you need something none of them do, such as a specific chargeback model, residency routing tied to your tenancy, or a latency budget you must control. You then own an on-call service that sits in front of every model call.\n\n> [!tip] Semantic caching (Kong, Azure, Apigee) is a **response** cache: it returns a stored answer for a similar prompt. It is not prompt caching, and it has the risks from [Week 5](#w5-scaling): wrong answers for near-identical questions and cross-user leaks. Turn it on only for generic, permission-free answers.\n\nWhichever you choose, check these five things in a trial: does it forward request bytes unchanged; what latency does it add at your p95 (ask it for Server-Timing or measure); are limits global or per instance; how does a budget-exceeded error look to your SDK; can chargeback be reconciled to the invoice.\n\n## Design review questions\n\n> [!interview] Show me a request through your gateway and the bytes the provider received. Are they identical? If not, what is your cache hit rate before and after the gateway?\n\n> [!interview] Your gateway's database is down. What happens to the next request from an app whose key and budget are cached, and from one whose are not?\n\n> [!interview] A team's monthly budget is $20 and its app streams 15-second answers at 20 requests per second. How far past $20 can it go, and what would you change to bound that?\n\n> [!interview] What is your gateway's p95 added latency, how did you measure it, and how many gateway hops does one agent turn make?\n\n> [!interview] The primary provider is down and traffic falls back to a self-hosted model. How do you know answer quality held?\n\n## Further reading\n\n- Switchboard: [README](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/switchboard), [ADR 0002: local limits and a batched ledger](https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/docs/adr/0002-local-rate-limits-batched-ledger.md), [ADR 0003: forward bytes unchanged](https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/docs/adr/0003-forward-bytes-unchanged.md).\n- [Server Timing](https://www.w3.org/TR/server-timing/), W3C Working Draft.\n- Envoy [local rate limit filter](https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_filters/local_rate_limit_filter): the per-instance model Switchboard copies.\n- [AI gateway capabilities in Azure API Management](https://learn.microsoft.com/en-us/azure/api-management/genai-gateway-capabilities): a clear vendor overview of what a managed gateway offers.\n- LiteLLM [virtual keys](https://docs.litellm.ai/docs/proxy/virtual_keys) and [reliability](https://docs.litellm.ai/docs/proxy/reliability).\n- Prompt caching docs: [Anthropic](https://platform.claude.com/docs/en/build-with-claude/prompt-caching), [OpenAI](https://developers.openai.com/api/docs/guides/prompt-caching), [Gemini](https://ai.google.dev/gemini-api/docs/generate-content/caching).\n\n```quiz\n[\n  {\"q\": \"Why must a gateway forward the original request bytes instead of re-serialising the parsed JSON?\", \"options\": [\"Re-serialising is slow\", \"Prompt caching matches byte-identical prefixes, so a changed key order or whitespace turns every cache read into a full-price miss\", \"Providers reject re-serialised JSON\", \"It hides the gateway from the provider\"], \"answer\": 1, \"why\": \"The model sees the same meaning, but the cache sees a different prefix. Nothing errors; the bill goes up.\"},\n  {\"q\": \"Switchboard falls back from the primary model to another provider. When is that allowed?\", \"options\": [\"Any time, even mid-stream\", \"Only before the first byte reaches the client, and only to models the app is allowed to use\", \"Only for Anthropic models\", \"Only after the client retries\"], \"answer\": 1, \"why\": \"Mid-stream the client has seen part of one model's answer, and a fallback outside the app's allowed models would bypass policy.\"},\n  {\"q\": \"The provider returns 401 because the gateway's provider key is wrong. What should the gateway do?\", \"options\": [\"Fall back to the next model\", \"Return the error: another model on the same broken credential, or hiding a configuration bug, does not help\", \"Retry 10 times\", \"Return 200 with an empty answer\"], \"answer\": 1, \"why\": \"Fallback is for transient and capacity errors (timeouts, 429, 5xx). Authentication and bad-request errors need a fix, not a retry.\"},\n  {\"q\": \"An app has 600 RPM and Switchboard runs 3 instances. What does each instance allow, and what is the catch?\", \"options\": [\"600 each; none\", \"200 each; with uneven load balancing the app is throttled on a busy instance while others have room\", \"600 shared exactly through Postgres\", \"100 each\"], \"answer\": 1, \"why\": \"Local buckets are sized at limit divided by live instances. Exact per instance, approximate globally, as ADR 0002 says.\"},\n  {\"q\": \"Where does most of a budget overshoot come from when an app streams long answers?\", \"options\": [\"The 2-second budget cache\", \"Requests admitted before the budget ran out that keep spending while they stream\", \"Clock drift\", \"PII redaction\"], \"answer\": 1, \"why\": \"At 20 requests per second with 15-second streams, 300 requests are in flight against 40 from the stale cache.\"},\n  {\"q\": \"How do you tell gateway latency from provider latency on a single response?\", \"options\": [\"Guess from total time\", \"Read the Server-Timing header, which names the gateway's and the upstream's durations\", \"Ask the provider\", \"Turn off the gateway\"], \"answer\": 1, \"why\": \"Server-Timing is a W3C header for named server-side durations; Switchboard sends gateway;dur and upstream;dur.\"},\n  {\"q\": \"Your team already runs Azure API Management for all APIs. What is the sensible first step for an AI gateway?\", \"options\": [\"Build one from scratch\", \"Try its AI gateway features (token limits, token metrics, backends with circuit breakers) and test cache behaviour and latency\", \"Give every app its own provider key\", \"Use semantic caching for everything\"], \"answer\": 1, \"why\": \"Reusing the gateway you operate keeps one control plane and one on-call rotation; verify caching and latency in a trial.\"}\n]\n```\n"}, {"id": "w7-identity", "week": 7, "kind": "lesson", "title": "Agent identity and delegation", "short": "Agent identity", "minutes": 50, "summary": "Treat agents as principals with their own identity, separate from the user they act for and the workload they run on. OAuth client credentials, RFC 8693 token exchange and the act claim, on-behalf-of flows, the MCP authorization specification, workload identity, and Checkpoint's signed assertions, with the failure modes each one prevents.", "body": "\n## Who is calling?\n\nRelay is about to call `payments__refund` for customer `c_77`. The payments service has to decide whether to allow it, and later an auditor will ask who did it. There are three honest answers, and a good design keeps all three:\n\n- **The user**: customer `c_77`, who asked for the refund. Proven by a token from the identity provider (Week 4).\n- **The agent**: Relay, the software that decided to call the tool. It should have its own identity, its own permissions and its own audit trail.\n- **The workload**: the pod or VM running Relay's code right now. Proven by the platform it runs on, not by a secret someone pasted into an environment variable.\n\nMost early agent systems collapse these. Either the agent **runs as the user** (it holds the user's token and forwards it everywhere) or it **runs as a service account** that can do anything for anyone. The first spreads a powerful token to every tool; the second lets a prompt injection act for any customer. This lesson is about keeping the three apart.\n\n```viz\ncaption: Three identities, three different questions, three different proofs. A tool call should carry the first two, and the platform should prove the third.\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk c\"><h5>User<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk c\">c_77, role customer<\/span><\/div>\n    <p><b>Question:<\/b> for whom?<\/p>\n    <p><b>Proof:<\/b> a JWT from the IdP, verified against its JWKS<\/p>\n  <\/div>\n  <div class=\"vz-panel sk m\"><h5>Agent<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk m\">relay<\/span><\/div>\n    <p><b>Question:<\/b> which software is acting?<\/p>\n    <p><b>Proof:<\/b> its own credential: client credentials, or a gateway token<\/p>\n  <\/div>\n  <div class=\"vz-panel sk\"><h5>Workload<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">spiffe://prod.northwind/relay<\/span><\/div>\n    <p><b>Question:<\/b> which running process?<\/p>\n    <p><b>Proof:<\/b> attested by the platform, short-lived, rotated automatically<\/p>\n  <\/div>\n<\/div>\n<div class=\"vz-row\"><span class=\"ch wide sk g\">tool sees: sub = c_77, act.sub = relay<\/span><span class=\"ch sk b\">never: the user's own token, or a god key<\/span><\/div>\n```\n\n## Agents as principals\n\nA **principal** is anything a policy can name. Making the agent one means: it has an id (`relay`, `refunds`, `concierge`), its own credential you can rotate and revoke without touching any user, and its own permissions. Policies can then say \"the refunds agent may call `payments__refund` up to $200 for a user with the support role\", which neither a user identity nor a service account can express alone (Week 8 covers that policy language).\n\nRFC 8693 names the two ways one party can act for another ([section 1.1](https://www.rfc-editor.org/rfc/rfc8693.html#section-1.1)):\n\n| | Impersonation | Delegation |\n|---|---|---|\n| What the downstream sees | Only the user: the actor is \"indistinguishable\" from them | The user **and** the actor, who \"is an agent for\" the user |\n| Audit trail | Says the user did it | Says the agent did it for the user |\n| Can policy limit the agent? | No, it has all the user's rights | Yes, the agent's own permissions apply too |\n| Use for agents | Avoid | Default |\n\n> [!rule] Agents act by delegation, not impersonation. Every downstream call should say both who the user is and which agent is acting, and the effective permission is what **both** are allowed to do.\n\n## Credentials for the agent itself\n\n### OAuth client credentials\n\nWhen an agent acts on its own behalf (a nightly job that re-indexes the knowledge base, a monitoring agent), there is no user. The agent is an OAuth **confidential client** and gets an access token with the **client credentials** grant: it authenticates to the authorization server and receives a token naming itself.\n\nOAuth 2.1 consolidates OAuth 2.0 and its security best practice. It is still an Internet-Draft ([draft 16, September 2026](https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/)), but the direction is settled: it keeps three grants (authorization code, refresh token, client credentials), drops the implicit and password grants, and requires PKCE on the authorization code flow. The MCP specification already builds on it.\n\nPrefer a client credential that is not a shared secret: a private key the client signs with, or, better, a credential the platform issues to the workload (below), so there is nothing long-lived to leak.\n\n### Workload identity\n\nWorkload identity answers \"which running process is this?\" without a static secret.\n\n- **SPIFFE** gives every workload a URI identity of the form `spiffe://trust-domain/path`, for example `spiffe://staging.example.com/payments/mysql` ([SPIFFE ID standard](https://github.com/spiffe/spiffe/blob/main/standards/SPIFFE-ID.md)). The proof is an **SVID**, a \"short lived cryptographic identity document\" in X.509 or JWT form, fetched from a local Workload API and rotated automatically. **SPIRE** is the open-source implementation that attests workloads (Kubernetes, VMs, bare metal) before issuing them ([SPIFFE overview](https://spiffe.io/docs/latest/spiffe-about/overview/)).\n- **Cloud workload identity federation** lets a workload trade a credential from where it runs for a short-lived cloud token. Google Cloud's version \"eliminates the maintenance and security burden associated with service account keys\", accepts identities from AWS, Microsoft Entra ID, GitHub, GitLab, Kubernetes and any OIDC or SAML 2.0 provider, and \"follows the OAuth 2.0 token exchange specification\" through its Security Token Service ([Google Cloud docs](https://docs.cloud.google.com/iam/docs/workload-identity-federation)).\n\nWorkload identity proves the process; it does not say which agent product or which user. Use it as the agent's client credential, and still carry the user and agent separately on each call.\n\n## Token exchange: carrying the user and the agent together\n\nRFC 8693, [OAuth 2.0 Token Exchange](https://www.rfc-editor.org/rfc/rfc8693.html) (January 2020), defines how a party trades the tokens it holds for a new token aimed at one downstream service. The request to the authorization server's token endpoint uses:\n\n| Parameter | Meaning |\n|---|---|\n| `grant_type` | `urn:ietf:params:oauth:grant-type:token-exchange` |\n| `subject_token` (+ `subject_token_type`) | Who the request is on behalf of: here, the user's token |\n| `actor_token` (+ `actor_token_type`) | Who is acting: here, the agent's own token |\n| `resource` or `audience` | The one service the new token is for |\n| `scope` | The narrower scopes wanted for this call |\n\nThe issued token names the user as `sub` and the agent in the **`act`** (actor) claim:\n\n```json\n{\n  \"iss\": \"https://idp.northwind.example\",\n  \"aud\": \"https://payments.northwind.example\",\n  \"sub\": \"c_77\",\n  \"act\": { \"sub\": \"relay\" },\n  \"scope\": \"refunds:create\",\n  \"exp\": 1792047869\n}\n```\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant A as Agent\n  participant AS as IdP\n  participant P as Payments\n  U->>A: user token\n  A->>AS: exchange user + agent tokens\n  AS->>AS: may relay act for c_77?\n  AS-->>A: sub c_77, act relay, aud payments\n  A->>P: refund + new token\n  P->>P: check aud, exp, sub, act\n  P-->>A: result\n```\n\nThree details from the RFC matter for agents:\n\n- **Chains nest.** If the agent hands work to a sub-agent that exchanges again, the new `act` contains the old one. The outermost `act` is the current actor; nested ones are earlier actors.\n- **Only the current actor counts for access control.** Consumers \"MUST only consider the token's top-level claims\" and the current actor; earlier actors are \"informational only\". Log the whole chain, decide on the top.\n- **`may_act`** in the subject token can say in advance which parties may act for this user, which the authorization server can check before issuing.\n\n### On-behalf-of, as identity providers ship it\n\nSeveral identity providers had delegation flows before or beside RFC 8693. Microsoft Entra ID's [on-behalf-of flow](https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow) is the common example: a middle-tier API sends the user's token as `assertion` with `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer` and `requested_token_use=on_behalf_of`, and gets a token for the downstream API. The incoming token must have the middle tier as its audience, and the issued token carries only delegated scopes: roles \"remain attached to the principal (the user) and never to the application\". Same idea, different wire format: check what your provider supports before designing around RFC 8693.\n\n## Least privilege, in time and in scope\n\nEvery credential should be useful for as little as possible, for as short a time as possible.\n\n```viz\ncaption: A leaked credential is worth what it can do, multiplied by how long it lasts. A 60-second assertion for one server is about 130,000 times shorter-lived than a 90-day key.\n<div class=\"vz-bars\">\n  <span>gateway key, 90-day default<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:100%\"><\/i><\/span><b>129,600 min<\/b>\n  <span>typical access token, about 1 h<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:3%\"><\/i><\/span><b>about 60 min<\/b>\n  <span>Checkpoint assertion<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:1%\"><\/i><\/span><b>1 min, one server<\/b>\n<\/div>\n<div class=\"vz-row\"><span class=\"ch sk b\">refunds:* on every API<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">refunds:create, aud payments<\/span><\/div>\n<div class=\"vz-src\">90 days: Switchboard's default key expiry in <a href=\"https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/switchboard/admin.py\">admin.py<\/a>. 60 s: Checkpoint's <code>assertion_ttl_s<\/code>. The hour-long access token is the 3,269 s <code>expires_in<\/code> in Entra's <a href=\"https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow\">OBO example<\/a>; lifetimes vary by provider.<\/div>\n```\n\n- **Scope**: one action, not a family. `refunds:create` rather than `payments:*`.\n- **Audience**: one service. RFC 8707's `resource` parameter asks the authorization server to \"audience-restrict issued access tokens\", so a token for payments is refused by orders ([RFC 8707](https://www.rfc-editor.org/rfc/rfc8707.html)).\n- **Lifetime**: minutes, not months. Long-lived keys (gateway keys, service-account keys) need rotation, expiry and fast revocation, and should be the exception.\n\n## The MCP authorization specification\n\nMCP tools are where agents act, so MCP's rules for authorization are worth knowing exactly. The current revision is **2026-07-28** ([authorization](https://modelcontextprotocol.io/specification/latest/basic/authorization), [security considerations](https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization/security-considerations)). Authorization is optional, but when an implementation supports it:\n\n| Requirement | What the spec says |\n|---|---|\n| Which transports | HTTP-based transports **SHOULD** conform; stdio **SHOULD NOT** and takes credentials from the environment |\n| Roles | The MCP server is an OAuth 2.1 resource server; the MCP client is an OAuth 2.1 client |\n| Discovery | Servers **MUST** implement Protected Resource Metadata ([RFC 9728](https://www.rfc-editor.org/rfc/rfc9728.html)), served at `/.well-known/oauth-protected-resource` and pointed to by `resource_metadata` in the `WWW-Authenticate` header of a 401; clients **MUST** use it to find the authorization server |\n| Registration | Clients get a client ID by Client ID Metadata Documents (**SHOULD**), pre-registration, or Dynamic Client Registration (deprecated, kept for compatibility) |\n| PKCE | Clients **MUST** use PKCE with `S256`, and **MUST** refuse to proceed if the server's metadata does not advertise it |\n| Resource indicators | Clients **MUST** send `resource` ([RFC 8707](https://www.rfc-editor.org/rfc/rfc8707.html)) naming the MCP server's canonical URI in both the authorization and token requests |\n| Audience | Servers **MUST** validate that tokens \"were issued specifically for them as the intended audience\" and reject others |\n| Token passthrough | Servers \"**MUST NOT** accept or transit any other tokens\"; a server that calls upstream APIs uses a separate token and \"**MUST NOT** pass through the token it received\" |\n| Token handling | `Authorization: Bearer` on every request, never in the query string; short-lived access tokens **SHOULD** be issued |\n| Least privilege | Servers **SHOULD** put the needed `scope` in `WWW-Authenticate`; a 403 with `error=\"insufficient_scope\"` triggers step-up authorization for more |\n\nThe two rules agent systems break most often are audience validation and the ban on token passthrough. The MCP [security best practices](https://modelcontextprotocol.io/docs/2026-07-28/tutorials/security/security_best_practices) explain why: a server that forwards a token it was handed lets callers bypass the downstream API's own controls, makes the audit trail show the wrong identity, and turns one compromised server into access to every service that accepts the token.\n\n## Checkpoint's design: a signed assertion per call\n\n[Checkpoint](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/checkpoint) is the course's MCP gateway: every agent tool call passes through it (Week 8 covers its Cedar policies and approvals). Its identity design is small enough to read in one sitting ([`identity.py`](https://github.com/Rachneet/ai-system-design-course/blob/main/platform/checkpoint/checkpoint/identity.py), [ADR 0002](https://github.com/Rachneet/ai-system-design-course/blob/main/platform/checkpoint/docs/adr/0002-signed-assertions-not-shared-credentials.md)):\n\n1. **The agent** authenticates with its own token, `ckp_<agent>_<secret>`; only a SHA-256 of the secret is stored. Approver tokens are separate and cannot call tools.\n2. **The user** arrives as a JWT in `X-User-Token`, verified against the identity provider's JWKS (RS256 or ES256, `exp` and `sub` required, audience `checkpoint`). A plain header saying \"user c_77\" is never trusted.\n3. **Upstream**, Checkpoint signs a fresh RS256 assertion for each call and sends it in `x-checkpoint-assertion`. The server's own service credential, if it has one, is configured in Checkpoint and sent as `Authorization`. The agent never sees it.\n\n```json\n{\n  \"iss\": \"checkpoint\",\n  \"aud\": \"com.northwind/payments\",\n  \"sub\": \"c_77\",\n  \"act\": { \"sub\": \"relay\" },\n  \"tool\": \"refund\",\n  \"iat\": 1792047809,\n  \"exp\": 1792047869,\n  \"jti\": \"901b516395d34389\"\n}\n```\n\nWhen an agent acts with no user (a background job), `sub` is `agent:<id>`, so a server can tell \"the agent for nobody\" from \"the agent for c_77\". Servers verify the assertion against Checkpoint's public keys at `/.well-known/jwks.json`.\n\n```viz\ncaption: Passing tokens along turns every tool server into a place the user's power can leak from. A per-call assertion is useful to one server for one minute, and it names the agent.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk b\"><h5>Token passthrough<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">user token, aud: many<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk\">agent<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">payments server<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk b\">compromised payments server<\/span><span class=\"arr sk b\"><\/span><span class=\"ch sk b\">replays it at orders, email<\/span><\/div>\n    <p>no record that an agent acted; a stolen token works everywhere for its whole life<\/p>\n  <\/div>\n  <div class=\"vz-panel sk g\"><h5>Checkpoint assertion<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">agent token + user JWT<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">Checkpoint verifies both<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">payments server<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk g\">sub c_77, act.sub relay<\/span><span class=\"ch sk g\">aud payments<\/span><span class=\"ch sk g\">exp 60 s<\/span><\/div>\n    <p>orders rejects it: wrong audience. After a minute nobody accepts it<\/p>\n  <\/div>\n<\/div>\n<div class=\"vz-src\">Claims and lifetime from <a href=\"https://github.com/Rachneet/ai-system-design-course/blob/main/platform/checkpoint/checkpoint/identity.py\">checkpoint/identity.py<\/a> and <a href=\"https://github.com/Rachneet/ai-system-design-course/blob/main/platform/checkpoint/docs/adr/0002-signed-assertions-not-shared-credentials.md\">ADR 0002<\/a>; the audience rule is the MCP specification's.<\/div>\n```\n\nWhat a server must check, in this order: signature with a key from the JWKS (look up by `kid`, pin the algorithm to RS256), `iss`, `aud` equal to its own name, `exp`, then `sub`, `act.sub` and `tool` against its own rules. To make the assertion single-use, also remember each `jti` until its `exp` and refuse repeats; Checkpoint issues the `jti`, but only the server can enforce it.\n\nCheckpoint's ADR is honest about the gap: here **Checkpoint** issues the downstream token. The production upgrade is RFC 8693 at the identity provider, so the IdP, which already knows every user, agent and service, issues it. The claim shape (`sub`, `act`, `aud`) stays the same, which is why the design copies it.\n\n## Failure modes\n\n### Confused deputy\n\nNorm Hardy named the [confused deputy](https://css.csail.mit.edu/6.566/2011/readings/confused-deputy.html) in 1988: a compiler with permission to write a billing file was asked by a user to write its debug output to \"the billing file\", and did, with its own authority. An agent is the ideal deputy to confuse. It holds more authority than any one user, and its instructions come partly from text it read (an email, a web page, a tool result).\n\n| Version | How it goes wrong | Defence |\n|---|---|---|\n| Agent with a service account | Injected text asks for a refund to another customer; the agent's account can do it | The tool authorises against `sub` (the user), not the agent's own power, and policy checks both |\n| MCP proxy with a static client ID | An attacker registers a client, sends the user a link, and a stored consent cookie skips the consent screen, so the code goes to the attacker | Per-client consent at the proxy before forwarding, exact redirect URI match, single-use `state` ([MCP best practices](https://modelcontextprotocol.io/docs/2026-07-28/tutorials/security/security_best_practices)) |\n| Tool trusts a header | The agent (or injected text) sets `X-User: c_12` | Identity only from a verified token, never from a plain header or the model |\n\n### Token passthrough\n\nThe agent, or an MCP server, forwards the token it received to the next service. Symptoms: downstream logs show the user calling services they never used, and one leaked token opens everything that trusts the issuer. The MCP spec forbids it outright. Defence: audience-bound tokens, and a fresh token or assertion per hop.\n\n### Over-broad scopes\n\nAsking for every scope up front is convenient, and it makes every stolen token a skeleton key. The MCP best practices list the mistakes: publishing every scope in `scopes_supported`, wildcard scopes like `*` or `full-access`, and bundling privileges to avoid prompts. Start with a minimal set and step up on `insufficient_scope`.\n\n### Long-lived keys\n\nStatic keys in environment variables outlive the people who created them. Give every key an expiry, a named owner and a revocation path you have tested, and prefer workload identity so the key does not exist at all. Know your revocation lag: a Switchboard key keeps working on other instances for up to the 30-second key cache.\n\n### Signing keys that differ per instance\n\nIf `CHECKPOINT_ASSERTION_PRIVATE_KEY` is empty, Checkpoint generates a key at startup, for development only. Run three instances that way and each publishes a different JWKS: a server that cached instance A's keys rejects instance B's assertions, apparently at random. In production, load one key from your secret store, publish it, and rotate by publishing the new key in the JWKS before signing with it.\n\n## Design review questions\n\n> [!interview] A tool server receives a refund request. Show me how it knows which user it is for and which agent is asking, and why it can trust both.\n\n> [!interview] Which credentials in your agent platform live longer than an hour? Who owns each one, and how fast does revocation reach every instance?\n\n> [!interview] Your MCP server calls a third-party API. Which token does it send there, and where did that token come from?\n\n> [!interview] An agent hands work to a sub-agent, which calls a tool. What does the tool's token say, and which identity does policy decide on?\n\n> [!interview] Prompt injection convinces the agent to refund another customer. Which check stops it, and does that check depend on the model behaving?\n\n## Further reading\n\n- [RFC 8693: OAuth 2.0 Token Exchange](https://www.rfc-editor.org/rfc/rfc8693.html), especially section 4.1 on the `act` claim.\n- [MCP authorization specification](https://modelcontextprotocol.io/specification/latest/basic/authorization) and [security best practices](https://modelcontextprotocol.io/docs/2026-07-28/tutorials/security/security_best_practices), revision 2026-07-28.\n- [RFC 9728: Protected Resource Metadata](https://www.rfc-editor.org/rfc/rfc9728.html) and [RFC 8707: Resource Indicators](https://www.rfc-editor.org/rfc/rfc8707.html).\n- [The OAuth 2.1 Authorization Framework](https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/), the current draft.\n- [SPIFFE overview](https://spiffe.io/docs/latest/spiffe-about/overview/) and Google Cloud [workload identity federation](https://docs.cloud.google.com/iam/docs/workload-identity-federation).\n- Norm Hardy, [The Confused Deputy (or why capabilities might have been invented)](https://css.csail.mit.edu/6.566/2011/readings/confused-deputy.html), ACM SIGOPS Operating Systems Review, 1988.\n- Checkpoint: [README](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/checkpoint) and [ADR 0002: signed assertions, not shared credentials](https://github.com/Rachneet/ai-system-design-course/blob/main/platform/checkpoint/docs/adr/0002-signed-assertions-not-shared-credentials.md).\n\n```quiz\n[\n  {\"q\": \"In an RFC 8693 token issued for an agent acting for a user, where does each identity go?\", \"options\": [\"Both in sub\", \"The user in sub, the agent in act.sub\", \"The agent in sub, the user in act.sub\", \"The agent in aud\"], \"answer\": 1, \"why\": \"sub is the subject the action is for; act names the current actor, the party acting for that subject.\"},\n  {\"q\": \"A token has a nested act chain: act.sub is sub-agent B, and act.act.sub is agent A. Which actor should access control decide on?\", \"options\": [\"A, the first actor\", \"B, the current (outermost) actor; earlier actors are informational\", \"Both equally\", \"Neither, only sub\"], \"answer\": 1, \"why\": \"RFC 8693 says consumers must only consider top-level claims and the current actor; nested actors are for the record.\"},\n  {\"q\": \"Under the MCP authorization specification, may an MCP server forward the access token it received to an upstream API?\", \"options\": [\"Yes, if it uses HTTPS\", \"No: it must not pass the token through, and uses a separate token for the upstream API\", \"Yes, if the token is short-lived\", \"Only for stdio servers\"], \"answer\": 1, \"why\": \"The spec forbids token passthrough; tokens must be audience-bound to the server that receives them.\"},\n  {\"q\": \"Why does the MCP spec require clients to send the resource parameter (RFC 8707)?\", \"options\": [\"To speed up discovery\", \"So the authorization server can audience-restrict the token to that one MCP server\", \"To pick a model\", \"To enable streaming\"], \"answer\": 1, \"why\": \"A token restricted to one resource is refused elsewhere, which limits the damage of a leak.\"},\n  {\"q\": \"Checkpoint sends the payments server a 60-second assertion instead of the agent's token. What does that buy?\", \"options\": [\"Nothing, both work the same\", \"A leaked assertion works for one server for one minute, and the server sees both user and agent without trusting plain headers\", \"Faster tool calls\", \"No need for TLS\"], \"answer\": 1, \"why\": \"That is ADR 0002's reasoning: passing the agent's or user's token would let any server replay it elsewhere.\"},\n  {\"q\": \"An agent with a powerful service account follows injected text and refunds another customer. What is this classic failure called?\", \"options\": [\"Token passthrough\", \"A confused deputy\", \"Mix-up attack\", \"Replay\"], \"answer\": 1, \"why\": \"A privileged program is tricked into using its own authority for someone else's purpose, as in Hardy's 1988 compiler story.\"},\n  {\"q\": \"Three Checkpoint instances run without CHECKPOINT_ASSERTION_PRIVATE_KEY. What breaks?\", \"options\": [\"Nothing\", \"Each generates its own signing key, so servers reject assertions from instances whose keys they did not fetch\", \"Users cannot log in\", \"Policies stop loading\"], \"answer\": 1, \"why\": \"The generated key is per process and for development only; production loads one key and publishes it in the JWKS.\"}\n]\n```\n"}, {"id": "w7-lab", "week": 7, "kind": "lab", "title": "Lab 7: Put Relay behind a gateway and give its tool calls an identity", "short": "Lab: gateway and identity", "minutes": 180, "builds": "Switchboard tenancy, chargeback, budget and fallback drills, verified Checkpoint assertions", "summary": "Run Switchboard, provision an org, team, app and key, route Relay's model calls through it to a hosted provider with a local Ollama fallback, prove chargeback, trigger a budget block and a cross-provider fallback, then mint a Checkpoint assertion and verify it against the published JWKS.", "body": "\n## What you will build\n\n```mermaid\nflowchart TB\n  R[Relay :8000] -->|sbk_ key, compatible:gpt-5| SB[Switchboard :8100]\n  SB -->|provider key| H[Hosted provider:<br/>OpenAI, Gemini or OpenRouter]\n  SB -.->|fallback| O[Ollama :11434<br/>qwen3:8b]\n  SB -. batched ledger .-> PG[(Postgres :5433)]\n  FIN[You as FinOps] -->|GET /admin/usage| SB\n  CP[Checkpoint :8200] -->|/.well-known/jwks.json| V[Your verifier script]\n  CP -.-> PG\n```\n\n```viz\ncaption: Three parts, each ending in evidence you can show: a chargeback table, two refusals and a fallback you caused on purpose, and an assertion a stranger can verify.\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk c\"><h5>1. Route<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk c\">org, team, app<\/span><span class=\"ch sk c\">sbk_ key<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk c\">Relay to /v1<\/span><\/div>\n    <p>steps 1 to 4<\/p>\n  <\/div>\n  <div class=\"vz-panel sk w\"><h5>2. Control<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk w\">chargeback<\/span><span class=\"ch sk b\">budget: 429<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk g\">fallback to Ollama<\/span><span class=\"ch sk w\">overhead p95<\/span><\/div>\n    <p>steps 5 to 8<\/p>\n  <\/div>\n  <div class=\"vz-panel sk m\"><h5>3. Identity<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk m\">agent token<\/span><span class=\"ch sk m\">RS256 assertion<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"ch sk g\">sub user, act.sub agent<\/span><\/div>\n    <p>step 9<\/p>\n  <\/div>\n<\/div>\n<div class=\"vz-row\"><b>ports:<\/b><span class=\"ch sk\">Relay 8000<\/span><span class=\"ch sk\">Switchboard 8100<\/span><span class=\"ch sk\">Checkpoint 8200<\/span><span class=\"ch sk\">Postgres 5433<\/span><span class=\"ch sk\">Ollama 11434<\/span><\/div>\n```\n\n**Acceptance criteria**\n\n1. Relay answers a chat turn with every model call going through Switchboard, and Relay holds no provider key, only an `sbk_` key.\n2. `GET /admin/usage` shows your requests under the right org, team and app, with a non-zero cost for the priced model, and you can explain each column.\n3. You triggered an app budget block and captured the 429 with `x-switchboard-limit: budget:app`, and you can say how many requests Relay sent before giving up and why.\n4. You triggered a cross-provider fallback and captured `x-switchboard-model` naming the fallback model, the `fallbacks` column in chargeback and `switchboard_fallbacks_total` in `/metrics`.\n5. You recorded the gateway's own p50, p95 and p99 from `Server-Timing` with the load test, next to the numbers in ADR 0002.\n6. You minted a Checkpoint assertion, verified it against the live `/.well-known/jwks.json`, and showed it is refused for another audience and after it expires.\n\n> [!tip] The reference services are [`platform/switchboard`](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/switchboard) and [`platform/checkpoint`](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/checkpoint). Their tests need no provider key: `uv run pytest` in each folder. Read [Lesson 1](#w7-gateways) and [Lesson 2](#w7-identity) first; this lab assumes them.\n\n## Step 0: what you need\n\n- `uv`, `openssl`, `curl`, and Relay running from [Lab 5](#w5-lab).\n- **Postgres** for the platform services. Relay's own database already uses port 5432, so put these on 5433.\n- **A model** for the primary route: an OpenAI, Gemini or OpenRouter key. No key? Use a second local model as the \"primary\"; the fallback drill still works.\n- **[Ollama](https://ollama.com/)** with a small model for the fallback: `ollama pull qwen3:8b`. Its OpenAI-compatible API is at `http://localhost:11434/v1`, and it ignores the API key ([docs](https://docs.ollama.com/api/openai-compatibility)).\n\n## Step 1: Postgres\n\n**Option A, Docker** (one server, two databases):\n\n```bash\ndocker run -d --name platform-pg -e POSTGRES_PASSWORD=platform -p 5433:5432 postgres:16\ndocker exec platform-pg createdb -U postgres switchboard\ndocker exec platform-pg createdb -U postgres checkpoint\nexport SWITCHBOARD_DATABASE_URL=postgresql://postgres:platform@localhost:5433/switchboard\n```\n\n**Option B, no Docker.** Both services list [`pgserver`](https://pypi.org/project/pgserver/) as a dev dependency, which is how their tests get an embedded Postgres. Start one that keeps running after the command exits, and copy the URI it prints:\n\n```bash\ncd platform/switchboard && uv sync\nuv run python -c \"import pgserver, tempfile; print(pgserver.get_server(tempfile.mkdtemp(), cleanup_mode=None).get_uri())\"\nexport SWITCHBOARD_DATABASE_URL='postgresql://postgres:@/postgres?host=/private/var/folders/.../tmpabc123'   # the printed URI\n```\n\npgserver connects over a Unix socket inside its data directory, and fails with \"Could not find a suitable socket path\" when that path is long, which is why the command uses `tempfile.mkdtemp()`. Start a second one the same way for Checkpoint in Step 9.\n\n## Step 2: run Switchboard\n\n```bash\ncd platform/switchboard\nuv sync\nuv run alembic upgrade head\n\nexport SWITCHBOARD_ADMIN_TOKEN=$(openssl rand -hex 24)\nexport SWITCHBOARD_PROVIDERS='{\n  \"openai\": {\"base_url\": \"https://api.openai.com/v1\", \"api_key\": \"sk-...\"},\n  \"local\":  {\"base_url\": \"http://localhost:11434/v1\"}\n}'\nexport SWITCHBOARD_CHAT_MODELS='{\n  \"gpt-5\":    {\"provider\": \"openai\", \"prices\": [1.25, 0, 0.125, 10]},\n  \"qwen3:8b\": {\"provider\": \"local\",  \"prices\": [0, 0, 0, 0]}\n}'\nexport SWITCHBOARD_FALLBACKS='{\"gpt-5\": [\"qwen3:8b\"]}'\nuv run uvicorn switchboard.main:app --port 8100\n```\n\nWhat each setting does:\n\n- `SWITCHBOARD_PROVIDERS` lists OpenAI-compatible endpoints. Gemini (`https://generativelanguage.googleapis.com/v1beta/openai/`) and OpenRouter (`https://openrouter.ai/api/v1`) work the same way; the Switchboard README shows both.\n- `SWITCHBOARD_CHAT_MODELS` is the catalog: each model apps may ask for, its provider, and prices in USD per million tokens as `[input, cache_write, cache_read, output]`. Copy prices from the provider's pricing page and note the date: the GPT-5 numbers above ($1.25 input, $0.125 cached input, $10 output) are from [OpenAI's pricing page](https://developers.openai.com/api/docs/pricing), checked 2026-10-15. A self-hosted model costs nothing per token; if your company charges teams for GPU time, put an internal transfer price here instead.\n- `SWITCHBOARD_FALLBACKS` **replaces** the default chains, so list every chain you want.\n\n> [!tip] You can give a chat model a friendlier catalog name than the provider uses (for example `qwen-local` with `\"upstream_model\": \"qwen3:8b\"`). Switchboard rewrites the model name on the way out and always bills under the catalog name, including for streamed responses, where the provider reports its own name in the stream. You will check this in Step 5.\n\n## Step 3: provision an org, a team, an app and a key\n\nEvery admin call needs the admin token, and every write lands in the `admin_audit` table.\n\n```bash\nB=http://localhost:8100; A=\"Authorization: Bearer $SWITCHBOARD_ADMIN_TOKEN\"; J='content-type: application/json'\ncurl -s -X POST $B/admin/orgs  -H \"$A\" -H \"$J\" -d '{\"id\":\"northwind\",\"name\":\"Northwind\",\"budget_usd_month\":500}'\ncurl -s -X POST $B/admin/teams -H \"$A\" -H \"$J\" -d '{\"id\":\"support\",\"org_id\":\"northwind\",\"name\":\"Support\",\"budget_usd_month\":200}'\ncurl -s -X POST $B/admin/apps  -H \"$A\" -H \"$J\" -d '{\"id\":\"relay\",\"team_id\":\"support\",\"name\":\"Relay\",\n  \"allowed_models\":[\"gpt-5\",\"qwen3:8b\"],\"rpm\":60,\"tpm\":200000,\"budget_usd_month\":20,\"pii_mode\":\"detect\"}'\ncurl -s -X POST $B/admin/apps/relay/keys -H \"$A\" -H \"$J\" -d '{\"label\":\"lab7\"}'\n```\n\nThe last call returns `{\"id\": ..., \"key\": \"sbk_...\", \"expires_at\": ..., \"note\": \"Store this key now; it is not shown again.\"}`. Only its SHA-256 is stored. `allowed_models` must name models in the catalog, or the call is refused with 422.\n\nSend one request and read the headers:\n\n```bash\nexport SBK=sbk_...   # the key you just created\ncurl -si $B/v1/chat/completions -H \"Authorization: Bearer $SBK\" -H \"$J\" \\\n  -d '{\"model\":\"gpt-5\",\"messages\":[{\"role\":\"user\",\"content\":\"Say hi in five words.\"}]}' \\\n  | grep -iE '^(HTTP|x-switchboard-model|server-timing|x-request-id)'\n```\n\nYou should see `x-switchboard-model: gpt-5` and `server-timing: gateway;dur=..., upstream;dur=...`. The first request after a restart has a higher gateway time: the key is looked up in Postgres once, then cached for 30 seconds.\n\n## Step 4: point Relay at Switchboard\n\nRelay's `compatible:` provider sends Chat Completions to any base URL ([Relay README](https://github.com/Rachneet/ai-system-design-course/tree/main/relay#choose-any-model-provider)). Point every model setting at Switchboard, so no call bypasses it:\n\n```bash\ncd relay\nexport RELAY_COMPATIBLE_BASE_URL=http://localhost:8100/v1\nexport RELAY_COMPATIBLE_API_KEY=$SBK\nexport RELAY_MODEL=compatible:gpt-5\nexport RELAY_FALLBACK_MODEL=compatible:qwen3:8b\nexport RELAY_MEMORY_MODEL=compatible:qwen3:8b\nexport RELAY_ROUTER_MODEL=compatible:qwen3:8b\nexport RELAY_JUDGE_MODEL=compatible:gpt-5\nexport RELAY_PRICES='{\"gpt-5\": [1.25, 0, 0.125, 10], \"qwen3:8b\": [0, 0, 0, 0]}'\nuv run uvicorn app.main:app            # plus the worker, as in Lab 5\nuv run python -m scripts.chat --customer c_77\n```\n\nRemove `ANTHROPIC_API_KEY`, `OPENAI_API_KEY` and the other provider keys from Relay's `.env`. If anything still works without Switchboard running, some call bypasses the gateway: find it.\n\nRelay already asks for `stream_options.include_usage`, so Switchboard forwards its request bodies byte for byte. Relay also has its own fallback (`RELAY_FALLBACK_MODEL`). Write down which layer should own fallback now, and why two layers of fallback multiply attempts the same way two layers of retries do.\n\n## Step 5: prove chargeback\n\nHave three or four conversations, then ask for the month's usage (wait a second: the ledger flushes every 0.5 s):\n\n```bash\nM=$(date +%Y-%m)\ncurl -s \"$B/admin/usage?month=$M&group_by=team\"  -H \"$A\"\ncurl -s \"$B/admin/usage?month=$M&group_by=model\" -H \"$A\"\n```\n\nEach row has `requests`, `cost_usd`, `input_tokens`, `output_tokens`, `cache_read_tokens`, `fallbacks` and `errors`. `group_by` also takes `org` and `app`.\n\nCheck three things and write them in your notes:\n\n1. **The cost adds up.** Take the `gpt-5` row and recompute it from the tokens and your prices: input × 1.25 + cache reads × 0.125 + output × 10, divided by a million.\n2. **Every row has a catalog name.** A row named after something you did not configure (a dated snapshot such as `gpt-5-...`, or an upstream name) with `cost_usd` 0 is the streaming issue from the warning in Step 2.\n3. **Cache reads appear.** OpenAI caches long prefixes automatically, so after a few turns of the same conversation `cache_read_tokens` should be non-zero. If it stays at zero for long conversations, something between Relay and the provider is changing the prefix.\n\n## Step 6: trigger a budget block\n\n`PUT /admin/apps/{id}/policy` replaces the whole policy, so send every field you want to keep. Set the app's budget to zero:\n\n```bash\ncurl -s -X PUT $B/admin/apps/relay/policy -H \"$A\" -H \"$J\" -d '{\"allowed_models\":[\"gpt-5\",\"qwen3:8b\"],\n  \"rpm\":60,\"tpm\":200000,\"budget_usd_month\":0,\"pii_mode\":\"detect\"}'\ncurl -si $B/v1/chat/completions -H \"Authorization: Bearer $SBK\" -H \"$J\" \\\n  -d '{\"model\":\"qwen3:8b\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}' | grep -iE '^(HTTP|x-switchboard-limit)|budget'\n```\n\nExpect `HTTP/1.1 429`, `x-switchboard-limit: budget:app` and \"The monthly budget for this app is used up.\" A budget of 0 blocks at once because spend (0) is not below it. The policy change clears this instance's caches immediately; other instances would follow within the 2-second budget cache.\n\nNow send one chat turn through Relay and count the refusals:\n\n```bash\ncurl -s $B/metrics | grep 'switchboard_rejections_total{reason=\"budget_app\"}'\n```\n\nThe count rises by exactly one for the turn. A 429 would normally be retried twice by the OpenAI SDK inside Relay ([openai-python](https://github.com/openai/openai-python#retries)) and again by Relay's resilience layer, but Switchboard marks budget refusals with `x-should-retry: false`: the official SDKs honour it, and so does Relay's `ResilientLLM`, which also skips its fallback model (it goes through the same budget). Check the response header in the curl above, then restore the budget:\n\n```bash\ncurl -s -X PUT $B/admin/apps/relay/policy -H \"$A\" -H \"$J\" -d '{\"allowed_models\":[\"gpt-5\",\"qwen3:8b\"],\n  \"rpm\":60,\"tpm\":200000,\"budget_usd_month\":20,\"pii_mode\":\"detect\"}'\n```\n\n## Step 7: trigger a cross-provider fallback\n\nSimulate an outage of the hosted provider. Stop Switchboard, point the `openai` provider at a port where nothing listens, and start it again:\n\n```bash\nexport SWITCHBOARD_PROVIDERS='{\n  \"openai\": {\"base_url\": \"http://127.0.0.1:9/v1\", \"api_key\": \"sk-...\"},\n  \"local\":  {\"base_url\": \"http://localhost:11434/v1\"}\n}'\nuv run uvicorn switchboard.main:app --port 8100\n```\n\n```bash\ncurl -si $B/v1/chat/completions -H \"Authorization: Bearer $SBK\" -H \"$J\" \\\n  -d '{\"model\":\"gpt-5\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}' | grep -iE '^(HTTP|x-switchboard-model)'\ncurl -s $B/metrics | grep -E '^switchboard_(fallbacks|upstream_errors)_total'\n```\n\nYou should get `HTTP/1.1 200` with `x-switchboard-model: qwen3:8b`, `switchboard_fallbacks_total{requested=\"gpt-5\",served=\"qwen3:8b\"}` counting up, and a connection error under `switchboard_upstream_errors_total`. Chat with Relay: it still answers, now from the local model. Then check the `fallbacks` column in chargeback.\n\nTwo more things to try and explain:\n\n- Send 6 requests quickly. After 5 consecutive failures the breaker for `gpt-5` opens and Switchboard skips it for 30 seconds, going straight to `qwen3:8b`.\n- Give the `openai` provider a **wrong API key** with the real base URL instead. The provider answers 401, which is not a fallback status, so the app gets the error. Why is that the right behaviour?\n\nRestore the real provider settings when you are done.\n\n## Step 8: measure the gateway's own latency\n\n```bash\ncd platform/switchboard\nuv run python -m loadtest.overhead --concurrency 32\nuv run python -m loadtest.overhead --concurrency 8\n```\n\nThe load test starts its own Postgres, a mock provider and a gateway, provisions a key, and prints p50, p95 and p99 end to end and for the gateway's own time from `Server-Timing`. Put your numbers in a table beside ADR 0002's (0.1 ms p95 at concurrency 32 on the author's laptop). They will differ by machine; the order of magnitude should not. If yours are tens of milliseconds, sample `pg_stat_activity` during the run as the ADR describes.\n\n## Step 9: mint and verify a Checkpoint assertion\n\nCheckpoint signs a short RS256 assertion for every tool call it forwards, and publishes the public key. Here you sign one directly with Checkpoint's `Signer` and verify it the way a tool server would.\n\n```bash\ncd platform/checkpoint\nuv sync\nexport CHECKPOINT_DATABASE_URL=postgresql://postgres:platform@localhost:5433/checkpoint   # or a second pgserver URI\nuv run alembic upgrade head\nopenssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out assertion-key.pem\nexport CHECKPOINT_ADMIN_TOKEN=$(openssl rand -hex 24)\nCHECKPOINT_ASSERTION_PRIVATE_KEY=\"$(cat assertion-key.pem)\" uv run uvicorn checkpoint.main:app --port 8200\n```\n\nIn another terminal, register Relay as an agent and fetch the public keys:\n\n```bash\ncurl -s -X POST localhost:8200/admin/agents -H \"Authorization: Bearer $CHECKPOINT_ADMIN_TOKEN\" \\\n  -H 'content-type: application/json' -d '{\"id\":\"relay\"}'\ncurl -s localhost:8200/.well-known/jwks.json\n```\n\nThe first call returns Relay's agent token (`ckp_relay_...`, shown once). The JWKS has one RSA key with `alg: RS256`, `use: sig` and a `kid`. Keep `assertion-key.pem` out of git.\n\nSave this as `mint_assertion.py` in `platform/checkpoint` (a scratch file; do not commit it):\n\n```python\nimport json\nimport sys\nimport time\n\nimport jwt\n\nfrom checkpoint.identity import Agent, Signer, User\n\nsigner = Signer(open(sys.argv[1]).read(), ttl_s=60)\ntoken = signer.assertion(\"com.northwind/orders\", \"lookup_order\", Agent(\"relay\", \"agent\"), User(\"c_77\", (\"customer\",)))\n\njwks = jwt.PyJWKClient(\"http://localhost:8200/.well-known/jwks.json\")\nkey = jwks.get_signing_key_from_jwt(token).key  # found by kid\nclaims = jwt.decode(token, key, algorithms=[\"RS256\"], audience=\"com.northwind/orders\", issuer=\"checkpoint\")\nprint(json.dumps(claims, indent=2))\n\ntry:\n    jwt.decode(token, key, algorithms=[\"RS256\"], audience=\"com.northwind/payments\")\nexcept jwt.InvalidAudienceError as e:\n    print(\"payments refuses it:\", e)\n\nif \"--wait\" in sys.argv:\n    time.sleep(61)\n    try:\n        jwt.decode(token, key, algorithms=[\"RS256\"], audience=\"com.northwind/orders\")\n    except jwt.ExpiredSignatureError as e:\n        print(\"after 61 s:\", e)\n```\n\n```bash\nuv run python mint_assertion.py assertion-key.pem --wait\n```\n\nYou should see `\"sub\": \"c_77\"`, `\"act\": {\"sub\": \"relay\"}`, `\"aud\": \"com.northwind/orders\"`, a `tool`, a unique `jti` and `exp` 60 seconds after `iat`; then \"payments refuses it: Audience doesn't match\"; then, a minute later, \"Signature has expired\".\n\nFinally, break it on purpose: restart Checkpoint **without** `CHECKPOINT_ASSERTION_PRIVATE_KEY` and run the script again. Checkpoint now publishes a key it generated at startup, the `kid` no longer matches the one your script signed with, and verification fails. That is what a tool server sees when several Checkpoint instances run without a shared key.\n\n## Stretch goals\n\n- **Raise a team budget without a restart**: `PUT /admin/teams/<id>/budget` with a new `budget_usd_month`, and confirm the next request goes through within the budget cache window (2 s).\n- **Write a tool server that verifies assertions**: a small MCP server that requires `x-checkpoint-assertion`, checks signature, `iss`, `aud`, `exp`, and refuses a reused `jti` until it expires. Put it behind Checkpoint (this needs Atlas to approve it; see the Checkpoint README).\n- **Run two Switchboard instances** behind a load balancer with the same database and watch the per-instance RPM share halve within one heartbeat (5 s). Then stop one and measure how long until the survivor's share recovers.\n- **Measure caching through the gateway**: the same 10-turn conversation direct to the provider and through Switchboard; compare cache-read tokens. They should match.\n\n## Reference reading\n\n- [Switchboard README](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/switchboard) and its ADRs [0002](https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/docs/adr/0002-local-rate-limits-batched-ledger.md) and [0003](https://github.com/Rachneet/ai-system-design-course/blob/main/platform/switchboard/docs/adr/0003-forward-bytes-unchanged.md).\n- [Checkpoint README](https://github.com/Rachneet/ai-system-design-course/tree/main/platform/checkpoint) and [ADR 0002](https://github.com/Rachneet/ai-system-design-course/blob/main/platform/checkpoint/docs/adr/0002-signed-assertions-not-shared-credentials.md).\n- [PyJWT: retrieving keys from a JWKS endpoint](https://pyjwt.readthedocs.io/en/stable/usage.html#retrieve-rsa-signing-keys-from-a-jwks-endpoint).\n- [Ollama OpenAI compatibility](https://docs.ollama.com/api/openai-compatibility).\n"}, {"id": "w8-policy", "week": 8, "kind": "lesson", "title": "Policy as code for agents", "short": "Policy as code", "minutes": 50, "summary": "Decide every tool call deterministically from the agent, the tool, the arguments and the user. Cedar and OPA compared from their docs, where policy should run, how to design human approvals that cannot be replayed or rubber-stamped, and how to test policies before they block real traffic.", "body": "\n## Why a prompt is not a policy\n\nRelay's system prompt says \"never refund more than 200 without a manager\". That sentence is a request to the model, not a control. The [injection lesson](#w3-security) showed why: any text the model reads can override it, and the model can also simply get it wrong. A prompt can make bad behaviour rarer. It cannot make it impossible, and it leaves no record of why anything was allowed.\n\nWeek 3 put the refund cap inside the tool, in code. That works for one tool in one service. A company with fifty agents and three hundred tools needs the same rule written once, reviewed by security, enforced in one place and logged for every call. That is **policy as code**: authorization rules in a dedicated language, evaluated by an engine outside the model, for every tool call.\n\n```viz\ncaption: A prompt asks the model to behave. A policy decides outside the model, so a fooled model changes nothing.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk b\"><h5>Rule in the prompt<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">system prompt: cap 200<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk b\">injected review<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"arr sk b\"><\/span><span class=\"ch sk b\">refund 900: sent<\/span><\/div>\n    <p>the model is both the judge and the target<\/p>\n  <\/div>\n  <div class=\"vz-panel sk g\"><h5>Rule as policy<\/h5>\n    <div class=\"vz-row\"><span class=\"ch sk\">model asks: refund 900<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">policy engine<\/span><\/div>\n    <div class=\"vz-row\"><span class=\"arr sk g\"><\/span><span class=\"ch sk g\">held for a person<\/span><span class=\"ch sk\">logged with reason<\/span><\/div>\n    <p>the model can ask for anything; it decides nothing<\/p>\n  <\/div>\n<\/div>\n```\n\n> [!rule] Every tool call gets a deterministic decision from four inputs: which agent, which tool, which arguments, and which user. The model supplies none of the identity and none of the decision.\n\n## The four inputs of a decision\n\nA tool call decision needs more than \"is this agent allowed to use this tool\".\n\n| Input | Where it comes from | Why it matters |\n|---|---|---|\n| Agent | The agent's own credential at the gateway | The refunds agent and the FAQ agent should not hold the same tools |\n| Tool | The tool name, namespaced by server | `payments__refund` and `weather__get_forecast` carry different risk |\n| Arguments | The call body, checked against the tool's schema | A refund of 45 and a refund of 4,500 are different decisions |\n| User | A verified token for the person the agent acts for | Support staff may refund; a sales user may not; nobody refunds themselves |\n\nIdentity must come from verified tokens, never from the model's arguments. Checkpoint, the course's gateway, takes the agent from
