oint** after each step: persist the message list and task state. On restart, the worker loads the checkpoint and continues the loop. Because tool calls are recorded with their results, the agent does not repeat completed writes. Combine with idempotent tools for the step that was in flight.\n\nFor complex, long-lived processes (wait for human approval for up to 3 days, then refund, then email), consider a **durable execution** engine such as Temporal. You write the workflow as ordinary code; the engine records each step's result and replays the workflow after failures, so `await approval_signal()` can wait for days without holding a process. LangGraph's checkpointers offer a lighter version for agent graphs.\n\n### Human approval as a workflow\n\nRelay's refund approvals are a natural workflow:\n\n```mermaid\nstateDiagram-v2\n  [*] --> pending: agent requests approval\n  pending --> approved: staff approves\n  pending --> rejected: staff rejects\n  pending --> expired: 72h timeout\n  approved --> executed: worker issues refund (idempotent)\n  executed --> notified: customer emailed\n  rejected --> notified\n  expired --> notified\n  notified --> [*]\n```\n\nModel it as a state machine in a table with explicit transitions. Each transition is a guarded `UPDATE` that only succeeds from the expected state, which makes concurrent workers and double-clicks safe.\n\n## Concurrency and backpressure\n\nYour workers share the model provider's rate limits with the API. If 50 workers start a bulk job, they can starve interactive users.\n\n- Separate queues and worker pools for **interactive** and **batch** work, with batch workers capped.\n- A global concurrency limit on model calls (a Redis semaphore or token bucket shared across processes).\n- Batch work should use the provider's batch API when latency does not matter. OpenAI, Anthropic and Gemini batch APIs all charge half the standard price, and OpenAI states its [batch rate limits are separate](https://developers.openai.com/api/docs/guides/batch) from per-model limits. If you self-host with vLLM, run batch work on its own replicas, or use vLLM's [offline inference](https://docs.vllm.ai/en/stable/serving/offline_inference/) for bulk jobs, so it cannot fill the KV cache that live chats need.\n- Autoscale workers on **queue depth and age**, not CPU. A worker waiting on a model API uses almost no CPU.\n\n> [!numbers] Ingestion and memory jobs average 6 seconds of wall time, mostly waiting on APIs. One async worker process can run 20 jobs concurrently. To drain 10,000 jobs in under 30 minutes you need 10,000 × 6 s / 1,800 s ≈ 34 concurrent slots, so two worker processes with concurrency 20, provided your rate limits allow about 34 concurrent model calls.\n\n## Scheduled jobs\n\nSome work runs on a clock: nightly reconciliation, evals against production snapshots, cleanup of expired sessions, budget resets. Use your platform's scheduler (Cloud Scheduler, Amazon EventBridge Scheduler, scheduled [Azure Container Apps jobs](https://learn.microsoft.com/en-us/azure/container-apps/jobs), Kubernetes CronJob) to enqueue a job, rather than a `while True: sleep` in a container. Make scheduled jobs idempotent too: schedulers can fire twice.\n\n## Design review questions\n\n> [!interview] A worker crashes after calling the payment API but before marking the job done. What happens on retry?\n\n> [!interview] How many database connections does your system open at peak scale, and what is the database's limit?\n\n> [!interview] How do you stop a bulk backfill from slowing down live chats?\n\n> [!interview] Where is the state of a pending approval, and what happens to it during a deploy?\n\n## Further reading\n\n- [Transactional outbox](https://microservices.io/patterns/data/transactional-outbox.html), microservices.io.\n- [Implementing Stripe-like Idempotency Keys in Postgres](https://brandur.org/idempotency-keys).\n- [Temporal documentation](https://docs.temporal.io/), for durable execution concepts even if you never use it.\n- [arq](https://arq-docs.helpmanual.io/), a small async job queue for Python.\n- [Designing Data-Intensive Applications](https://dataintensive.net/), Martin Kleppmann. Not free, but often in libraries; chapters on transactions and stream processing are the background for this lesson.\n\n```quiz\n[\n  {\"q\": \"Why should you not hold a database connection while waiting on an LLM call?\", \"options\": [\"LLM SDKs forbid it\", \"Connections are scarce; holding them during multi-second waits exhausts the pool under load\", \"It corrupts data\", \"It increases token usage\"], \"answer\": 1, \"why\": \"A slow model call holding a connection wastes a limited resource. Keep transactions short around the slow work.\"},\n  {\"q\": \"What does at-least-once delivery imply for your job handlers?\", \"options\": [\"Nothing\", \"They must be idempotent, because a job can run more than once\", \"They must be faster\", \"They must use Redis\"], \"answer\": 1, \"why\": \"Duplicate execution is normal. Unique constraints, idempotency keys, and guarded state transitions make it harmless.\"},\n  {\"q\": \"What problem does the transactional outbox solve?\", \"options\": [\"Slow queries\", \"Writing to the database and publishing to a queue atomically, so neither happens without the other\", \"Rate limiting\", \"Embedding updates\"], \"answer\": 1, \"why\": \"By recording the message in the same transaction as the data, a separate relay can publish reliably.\"},\n  {\"q\": \"What should you autoscale model-calling workers on?\", \"options\": [\"CPU usage\", \"Queue depth and job age\", \"Memory\", \"Number of API instances\"], \"answer\": 1, \"why\": \"Workers waiting on remote APIs use little CPU, so CPU-based autoscaling never triggers. Queue metrics reflect actual demand.\"}\n]\n```\n"}, {"id": "w4-cicd", "week": 4, "kind": "lesson", "title": "Automated testing and deployment with CI/CD", "short": "CI/CD for AI apps", "minutes": 45, "summary": "A pipeline that lints, tests, evaluates, builds, and deploys an AI application on every change, with prompt and model versioning, environments, progressive rollout, and one-command rollback.", "body": "\n## What is different about CI/CD for AI systems\n\nThe mechanics are the same as any service: build, test, package, deploy. Three things differ:\n\n1. **Tests are probabilistic and cost money.** Your eval suite takes minutes, spends tokens, and has noise. It needs tiers, budgets, and statistical gates (Week 3).\n2. **Behaviour changes without code changes.** Prompts, model versions, knowledge base content, and config all change behaviour. They must flow through the pipeline too.\n3. **Production is the real test.** Offline evals approximate reality, so progressive rollout with online monitoring is part of the pipeline, not an afterthought.\n\n## The pipeline\n\n```mermaid\nflowchart LR\n  PR[Pull request] --> L[Lint + types<br/>ruff, mypy]\n  L --> U[Unit tests<br/>no model calls]\n  U --> S[Eval smoke<br/>20 cases]\n  S --> G[Eval PR gate<br/>200 cases × 3]\n  G --> R[Review + merge]\n  R --> B[Build image<br/>tag = git SHA]\n  B --> SC[Scan image]\n  SC --> ST[Deploy staging]\n  ST --> E2E[E2E smoke<br/>against staging]\n  E2E --> C[Canary 5%<br/>prod]\n  C -->|metrics OK| F[100% prod]\n  C -->|regression| RB[Auto rollback]\n```\n\n### Stage by stage\n\n**Lint and type check.** Ruff and a type checker. Cheap, fast, catch a surprising number of bugs.\n\n**Unit tests without models.** Most of your code (tool logic, auth, permission checks, guardrails, parsing, the retrieval SQL) can be tested deterministically with fake models. Use a fake LLM client that returns scripted responses, including tool calls, so you can test the agent loop's control flow: step limits, error handling, parallel tool results. These run in seconds and cost nothing.\n\n```python\nclass ScriptedLLM:\n    \"\"\"Returns pre-baked responses in order. Lets you test the loop without the API.\"\"\"\n    def __init__(self, responses): self.responses = iter(responses)\n    async def create(self, **kwargs): return next(self.responses)\n\nasync def test_step_limit_escalates():\n    llm = ScriptedLLM([tool_use(\"get_order\", {\"order_id\": 1})] * 20)   # never stops\n    result = await run_turn(ctx_with(llm), [user(\"hi\")], on_text=noop)\n    assert ctx.escalations == [\"step_limit\"]\n```\n\n**Eval smoke and PR gate.** Run only when behaviour-affecting paths change (`app/**`, `prompts/**`, `evals/**`, model config). Post results as a PR comment. Block merge on gate failure.\n\n**Build once, deploy the same artifact everywhere.** The image built from `main` at SHA `9f3e2c1` is what goes to staging and then production. Never rebuild for production.\n\n```viz\ncaption: One image, promoted. Only configuration changes between environments, so production runs exactly the bytes that passed staging.\n<div class=\"vz-row\"><span class=\"ch sk c\">build once<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">relay:9f3e2c1<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">staging<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk g\">production<\/span><\/div>\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk c\"><h5>Inside the image<\/h5><div class=\"vz-row\"><span class=\"ch sk\">code<\/span><span class=\"ch sk\">prompts<\/span><span class=\"ch sk\">tool schemas<\/span><span class=\"ch sk\">model config<\/span><\/div><\/div>\n  <div class=\"vz-panel sk\"><h5>Injected per environment<\/h5><div class=\"vz-row\"><span class=\"ch sk ghost\">database URL<\/span><span class=\"ch sk ghost\">API keys<\/span><span class=\"ch sk ghost\">flags<\/span><\/div><\/div>\n<\/div>\n```\n\n**Scan.** Check the image for known vulnerabilities (Trivy, Grype, or your registry's scanner) and dependencies for licences and CVEs.\n\n**Staging + end-to-end smoke.** Deploy to a staging environment with its own database and model key, then run a handful of real requests through the public endpoint: auth works, a chat streams, a tool call succeeds.\n\n**Canary, then full rollout.** Covered below.\n\n## A GitHub Actions example\n\n```yaml\n# .github/workflows/ci.yml\nname: ci\non:\n  pull_request:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n  pull-requests: write          # to post eval comments\n  id-token: write               # for keyless cloud auth (OIDC)\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    services:\n      db:\n        image: pgvector/pgvector:pg16\n        env: { POSTGRES_PASSWORD: relay }\n        ports: [\"5432:5432\"]\n        options: --health-cmd pg_isready --health-interval 5s\n    steps:\n      - uses: actions/checkout@v7\n      - uses: astral-sh/setup-uv@v10.0.1\n        with: { enable-cache: true }\n      - run: uv sync --frozen\n      - run: uv run ruff check . && uv run ruff format --check .\n      - run: uv run pytest -q\n\n  evals:\n    needs: test\n    if: github.event_name == 'pull_request'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v7\n      - uses: dorny/paths-filter@v4\n        id: changed\n        with:\n          filters: |\n            behaviour: ['app/**', 'prompts/**', 'evals/**', 'config/models.yaml']\n      - if: steps.changed.outputs.behaviour == 'true'\n        uses: astral-sh/setup-uv@v10.0.1\n      - if: steps.changed.outputs.behaviour == 'true'\n        env:\n          # Model specs live in repo variables, so switching provider is a settings change.\n          RELAY_MODEL: ${{ vars.EVAL_MODEL }}               # e.g. openai:gpt-5 or gemini:gemini-2.5-flash\n          RELAY_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}   # e.g. anthropic:claude-opus-5-5\n          # Separate eval-only keys with spend caps. Set only the ones your specs use.\n          OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}\n          GEMINI_API_KEY: ${{ secrets.EVAL_GEMINI_API_KEY }}\n          ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}\n          OPENROUTER_API_KEY: ${{ secrets.EVAL_OPENROUTER_API_KEY }}\n        run: |\n          uv sync --frozen\n          uv run python -m evals.run --suite pr --trials 3 \\\n            --baseline gs://relay-evals/baselines/main.json --report report.md   # or s3://, or Azure Blob\n      - if: always() && steps.changed.outputs.behaviour == 'true'\n        uses: marocchino/sticky-pull-request-comment@v3.0.5\n        with: { path: report.md }\n```\n\nA separate `deploy.yml` on pushes to `main` builds the image, pushes it to a registry, deploys to staging, runs the E2E smoke, then promotes to production.\n\nSecurity notes for pipelines (see GitHub's [security hardening guide](https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions)):\n\n- Use **OIDC** to authenticate to your cloud instead of storing long-lived cloud keys in GitHub. GitHub documents the setup for [AWS](https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws), [Azure](https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-azure) and [Google Cloud](https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-google-cloud-platform). Model API keys are usually still static secrets, so keep eval keys separate and capped.\n- Running evals against a self-hosted model (vLLM or Ollama) in CI needs a GPU runner or a reachable private endpoint; most teams point CI at a hosted provider or a staging inference server instead.\n- Give workflows **minimal permissions**.\n- Do not expose secrets to workflows triggered by pull requests from forks.\n- Pin third-party actions to an exact version or, better, a commit SHA. Not every action publishes a moving major tag such as `@v10`, so check the action's releases page for the tags that actually exist.\n\n## Versioning prompts and models\n\nTreat prompts as code:\n\n- Store prompts as files (`prompts/system.md`, `prompts/judges/refund_promise.md`), not strings scattered through Python.\n- Reference models through one config file:\n\n```yaml\n# config/models.yaml: provider:model specs, so any role can move to any provider\nagent:      {model: \"openai:gpt-5\",                 max_tokens: 2048}\nfallback:   {model: \"anthropic:claude-sonnet-5-5\",  max_tokens: 2048}   # a different vendor\nrouter:     {model: \"ollama:qwen3:8b\",              max_tokens: 64}     # small local model\njudge:      {model: \"gemini:gemini-2.5-flash\",      max_tokens: 512}    # another family\nembeddings: {model: \"BAAI/bge-small-en-v1.5\", dim: 384}                  # open weights, CPU\n```\n\nThe mix above is an illustration, not a recommendation: pick each role from your own evals. Embedding models are the exception to free swapping, because vectors from two models are not comparable. Changing the embedding model means re-embedding the whole index.\n\n- Log the prompt hash and model ID on every trace, so any conversation can be tied to the exact behaviour that produced it.\n- Upgrading a model is a PR that changes one line in this file and must pass the full release suite.\n\nSome teams use a prompt management platform so non-engineers can edit prompts. That is fine if edits still go through evals and produce a versioned artifact the deploy pins to. \"Edit in a web UI and it is live instantly\" bypasses everything this week teaches.\n\n## Feature flags\n\nFlags decouple deploy from release. Ship new behaviour dark, then turn it on for staff, then 5% of users, then everyone. Useful flags in AI systems:\n\n- Which prompt version or model a user gets (for A/B tests).\n- Enabling a new tool.\n- Kill switches: disable the refund tool instantly if something goes wrong, without a deploy.\n\n## Progressive delivery and rollback\n\n```viz\ncaption: Canary risks a small slice of users and needs time; blue-green switches everyone at once but rolls back in one step.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk\"><h5>Canary: new revision's share<\/h5>\n    <div class=\"vz-bars\"><span>step 1<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:5%\"><\/i><\/span><b>5%<\/b><span>step 2<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:25%\"><\/i><\/span><b>25%<\/b><span>step 3<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:50%\"><\/i><\/span><b>50%<\/b><span>done<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:100%\"><\/i><\/span><b>100%<\/b><\/div>\n    <p>a bad prompt reaches 5% of users before metrics catch it<\/p>\n  <\/div>\n  <div class=\"vz-panel sk\"><h5>Blue-green: new revision's share<\/h5>\n    <div class=\"vz-bars\"><span>before<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:1%\"><\/i><\/span><b>0%<\/b><span>switch<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:100%\"><\/i><\/span><b>100%<\/b><span>rollback<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:1%\"><\/i><\/span><b>0%<\/b><\/div>\n    <p>old revision stays warm, so rollback is one traffic switch<\/p>\n  <\/div>\n<\/div>\n<p>Cloud Run and <a href=\"https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting\">Azure Container Apps<\/a> split traffic between revisions by percentage, <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-bluegreen.html\">Amazon ECS<\/a> supports blue/green with canary or linear shifting, and on Kubernetes <a href=\"https://argoproj.github.io/argo-rollouts/\">Argo Rollouts<\/a> does both. Percentages are this lesson's example steps.<\/p>\n```\n\n```mermaid\nsequenceDiagram\n  participant P as Pipeline\n  participant LB as Traffic split\n  participant N as New revision\n  participant O as Old revision\n  P->>N: deploy (0% traffic)\n  P->>LB: 5% → N\n  Note over N: watch 30 min: error rate, p95 latency,<br/>judge pass rate, escalation rate, cost/convo\n  alt healthy\n    P->>LB: 25% → 50% → 100%\n  else regression\n    P->>LB: 100% → O (rollback)\n  end\n```\n\nCanary analysis for AI services should watch AI-specific signals in addition to errors and latency:\n\n- Online judge pass rates on sampled conversations.\n- Escalation-to-human rate and thumbs-down rate.\n- Tokens and cost per conversation.\n- Tool error rates and guardrail firing rates.\n\nRollback must be one command (or automatic) and fast: shift traffic back to the previous revision. Because the image tag is the Git SHA and prompts are inside the image, rolling back the image rolls back the prompt too.\n\n> [!warn] Database migrations do not roll back with traffic. Make schema changes backward-compatible (expand, migrate, contract over several deploys) so the previous revision can still run against the new schema.\n\n## Design review questions\n\n> [!interview] A product manager wants to change one sentence in the system prompt. Walk me through how it reaches production.\n\n> [!interview] How long from merge to 100% production, and how long to roll back?\n\n> [!interview] Which signals does the canary watch, and who decided the thresholds?\n\n> [!interview] How would you know if your eval budget in CI doubled?\n\n## Further reading\n\n- [GitHub Actions documentation](https://docs.github.com/en/actions).\n- [Using uv in GitHub Actions](https://docs.astral.sh/uv/guides/integration/github/).\n- [Security hardening for GitHub Actions](https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions).\n- [SLSA](https://slsa.dev/), a framework for supply-chain integrity of build artifacts.\n- [promptfoo CI integration](https://github.com/promptfoo/promptfoo) for a ready-made eval-in-CI option.\n\n```quiz\n[\n  {\"q\": \"What can you unit test without calling a model?\", \"options\": [\"Nothing useful\", \"Tool logic, permission checks, guardrails, retrieval SQL, and the agent loop's control flow using a scripted fake LLM\", \"Only formatting\", \"Only the database\"], \"answer\": 1, \"why\": \"Most of an AI application is deterministic code. Fakes let you test it fast and for free, leaving evals for model behaviour.\"},\n  {\"q\": \"Why build the image once and promote it through environments?\", \"options\": [\"It saves CI minutes only\", \"So production runs exactly the artifact that was tested, including prompts\", \"Registries charge per build\", \"Docker requires it\"], \"answer\": 1, \"why\": \"Rebuilding can pull different dependencies. Promoting one artifact guarantees what you tested is what you run.\"},\n  {\"q\": \"Which signal is specific to canarying an AI service?\", \"options\": [\"HTTP 5xx rate\", \"CPU usage\", \"Online judge pass rate and escalation rate on sampled conversations\", \"Disk usage\"], \"answer\": 2, \"why\": \"A new prompt can be fast and error-free but worse at the job. Quality signals must be part of canary analysis.\"},\n  {\"q\": \"Why must schema migrations be backward-compatible?\", \"options\": [\"For performance\", \"Rolling back the app does not roll back the database; the old revision must still work with the new schema\", \"Postgres requires it\", \"To keep migrations small\"], \"answer\": 1, \"why\": \"Expand and contract migrations let you roll back code safely.\"}\n]\n```\n"}, {"id": "w4-cloud", "week": 4, "kind": "lesson", "title": "Managing containerized AI apps on the cloud", "short": "Containers on the cloud", "minutes": 50, "summary": "Choose a runtime for your containers, size and autoscale it for I/O-bound LLM traffic, wire up networking, secrets, and managed data services, and keep the bill predictable.", "body": "\n## Choosing a runtime\n\nYour Relay image can run on many platforms. The choice is mostly about how much infrastructure you want to operate.\n\n| Platform | Model | Good for | Trade-offs |\n|---|---|---|---|\n| Google Cloud Run, Azure Container Apps | Serverless containers, scale to zero, per-request billing | Most API-calling AI apps, small teams, spiky traffic | Request timeouts (Cloud Run up to 60 min), cold starts, less control |\n| AWS ECS on Fargate | Managed containers, no servers | AWS shops, steady services | More configuration (task defs, load balancers); [ECS Express Mode](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-overview.html) sets up the load balancer and autoscaling for you |\n| Fly.io, Render, Railway | Developer platforms | Fast setup, free or cheap small apps | Fewer enterprise features |\n| Kubernetes (GKE, EKS, AKS) | Full orchestration | Many services, GPUs, custom networking, platform teams | Significant operational cost |\n| VMs | You manage everything | Special hardware or licensing | You manage everything |\n\nAWS App Runner, once the obvious AWS answer here, is [no longer open to new customers](https://docs.aws.amazon.com/apprunner/latest/dg/what-is-apprunner.html); AWS points new users to ECS Express Mode.\n\n> [!rule] If your app calls hosted model APIs and you do not already run Kubernetes, start on a serverless container platform. Move only when you hit a concrete limit.\n\n**When you self-host models** (open-weights models such as Llama, Qwen, DeepSeek or Mistral on GPUs), the picture changes: GPU scheduling, model loading time, and batching make Kubernetes (GKE, EKS, AKS) with an inference server such as vLLM, or a managed inference platform, the usual choice. Serverless GPUs exist too: [Cloud Run](https://docs.cloud.google.com/run/docs/configuring/services/gpu) offers NVIDIA L4 and RTX PRO 6000 Blackwell GPUs. This course focuses on API-calling apps; the same deployment principles apply to the API layer in front of self-hosted models.\n\n**Each cloud also resells models**, which can matter more than the container runtime: billing, data residency and private networking stay inside one account. [Amazon Bedrock](https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards.html) lists Anthropic, Meta, Mistral, DeepSeek, Qwen and OpenAI open-weights models among others; [Vertex AI Model Garden](https://docs.cloud.google.com/vertex-ai/generative-ai/docs/model-garden/explore-models) offers Gemini, partner models such as Claude, and open models; [Microsoft Foundry](https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure) sells OpenAI's models and others directly. A router or gateway (OpenRouter, LiteLLM) gives a similar single bill across vendors outside any one cloud.\n\n## LLM apps are I/O bound\n\nA request to Relay spends perhaps 95% of its time waiting: for the model API, the database, the reranker. CPU and memory use per request are small. This shapes sizing and scaling:\n\n- **Use async servers** (FastAPI on uvicorn with async handlers and async clients). One process can hold hundreds of concurrent waiting requests.\n- **Scale on concurrency, not CPU.** CPU-based autoscaling sees idle CPUs and never scales out, while requests queue. Cloud Run's [concurrency setting](https://docs.cloud.google.com/run/docs/about-concurrency), Azure Container Apps' [HTTP scale rule](https://learn.microsoft.com/en-us/azure/container-apps/scale-app) (concurrent requests per replica), and Kubernetes HPA on custom metrics (in-flight requests) fit better.\n- **Long requests limit throughput per instance.** If streams last 20 seconds, each instance can only complete a bounded number per minute even when idle.\n\n> [!numbers] Peak: 40 new chats/sec, each holding a streaming connection for 12 s on average. By Little's law, concurrent requests = arrival rate × duration = 40 × 12 = **480**. With async instances configured for 80 concurrent requests each, you need 6 instances at peak, 8 with headroom. Memory per in-flight request is small (tens of KB of conversation), so 1 vCPU / 1 GB instances are plenty. Your real bottleneck will be the model provider's rate limits, not compute.\n\n```viz\ncaption: Size by concurrency. 480 requests in flight at 80 per instance is 6 instances, while each one's CPU sits nearly idle.\n<div class=\"vz-row\"><span class=\"ch sk\">40 chats/s<\/span>x<span class=\"ch sk\">12 s each<\/span>=<span class=\"ch sk c\">480 in flight<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">80<\/span><span class=\"ch sk c\">80<\/span><span class=\"ch sk c\">80<\/span><span class=\"ch sk c\">80<\/span><span class=\"ch sk c\">80<\/span><span class=\"ch sk c\">80<\/span><span class=\"ch sk ghost g\">spare<\/span><span class=\"ch sk ghost g\">spare<\/span><\/div>\n<p>6 instances at 80 each, plus 2 for headroom<\/p>\n<div class=\"vz-bars\"><span>concurrency used<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:100%\"><\/i><\/span><b>80 of 80<\/b><span>CPU used<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:8%\"><\/i><\/span><b>low<\/b><\/div>\n<div class=\"vz-src\">Little's law with the worked example's traffic. Cloud Run's default is 80 concurrent requests per vCPU, settable up to 1,000: <a href=\"https://docs.cloud.google.com/run/docs/about-concurrency\">Cloud Run docs<\/a>.<\/div>\n```\n\n## Cold starts and minimum instances\n\nScale-to-zero platforms start containers on demand. A Python app that imports heavy libraries can take several seconds to start, which a user experiences as a slow first response.\n\n- Keep images small and imports lean (do not import a local reranker model in the API container if it is only used by workers).\n- Set **minimum instances** to 1 or 2 for user-facing services. The cost is small compared with the experience.\n- Lazy-load rarely used heavy components.\n\n## Networking and data services\n\nA minimal production layout on Google Cloud (the table after the diagram maps it to AWS and Azure):\n\n```mermaid\nflowchart TB\n  U[Users] --> LB[HTTPS load balancer<br/>+ Cloud Armor WAF]\n  LB --> API[Cloud Run: relay-api<br/>min 1, max 20]\n  API --> SQL[(Cloud SQL Postgres<br/>+ pgvector, private IP)]\n  API --> R[(Memorystore Redis)]\n  API --> PUB[Pub/Sub or<br/>Postgres queue]\n  PUB --> WRK[Cloud Run: relay-worker<br/>scaled on backlog]\n  WRK --> SQL\n  WRK --> GCS[(Cloud Storage)]\n  API & WRK --> SM[Secret Manager]\n  API & WRK --> LLM[Model provider API]\n  API & WRK --> OBS[Logging, tracing, metrics]\n```\n\n| Piece | Google Cloud | AWS | Azure |\n|---|---|---|---|\n| Serverless containers | Cloud Run | ECS on Fargate | Container Apps |\n| Managed Postgres + pgvector | Cloud SQL, AlloyDB | RDS, Aurora | Azure Database for PostgreSQL |\n| Redis-compatible cache | Memorystore | ElastiCache | Azure Managed Redis |\n| Queue | Pub/Sub, Cloud Tasks | SQS | Service Bus |\n| Object storage | Cloud Storage | S3 | Blob Storage |\n| Secrets | Secret Manager | Secrets Manager | Key Vault |\n| WAF | Cloud Armor | AWS WAF | Azure WAF (Front Door, Application Gateway) |\n| Model APIs in-account | Vertex AI | Bedrock | Foundry |\n\nPrinciples:\n\n- **Private networking for data.** Databases and caches have no public IP. Services reach them through a VPC connector or private service access.\n- **Managed databases.** Use a managed Postgres (Cloud SQL, RDS, Azure Database for PostgreSQL, Neon, Supabase). Backups, point-in-time recovery, and failover are not things you want to build. Check the provider supports pgvector.\n- **Secrets from a secret manager**, mounted as environment variables, with each service's identity granted access only to its own secrets.\n- **Service identities.** Each service runs as its own service account with least-privilege IAM. The worker can write to the bucket; the API cannot.\n- **Egress control.** If tools make outbound requests, consider routing through a proxy with an allow-list, which also helps against injection-driven exfiltration.\n\n## Configuration per environment\n\nSame image, different configuration:\n\n| Setting | Staging | Production |\n|---|---|---|\n| Database | `relay-staging` | `relay-prod` |\n| Model API key | Staging key, $50/day cap | Prod key, monitored |\n| Models | Same as prod (test what you ship) | Pinned IDs |\n| Min instances | 0 | 2 |\n| Refund tool | Writes to sandbox payment provider | Live |\n| Log level | Debug | Info |\n\n## Infrastructure as code\n\nClick-ops does not survive the second environment. Describe infrastructure in code (Terraform/OpenTofu, Pulumi, or the platform's own config files) and apply it from CI. Then staging and production differ only in variables, and every change is reviewed. For a course project, a short shell script with `gcloud run deploy` flags checked into the repo is an acceptable start. Treat servers and containers as **immutable**: replace them with new versions rather than patching them in place.\n\n## Cost management\n\nFor API-calling apps, the cloud bill is usually small compared with the model bill. Still:\n\n- Set **budgets and alerts** on the cloud account and on every model provider account, from day one. If you self-host models, the GPU bill replaces the token bill: a GPU billed by the hour costs the same at 3 a.m. with no traffic, so scale GPU pools down or to zero when idle.\n- Scale to zero for staging and preview environments.\n- Right-size the database: it is often the largest fixed cost.\n- Watch egress charges if you move large files.\n- Track **cost per conversation** as a product metric, combining model tokens, infrastructure, and third-party APIs.\n\nFree tiers are enough for this course: Cloud Run, [Google Cloud free tier](https://cloud.google.com/free), [AWS free tier](https://aws.amazon.com/free/), [Render free instances](https://render.com/docs/free), [Neon](https://neon.com/) and [Supabase](https://supabase.com/docs/guides/ai) free Postgres with pgvector.\n\n## Reliability basics\n\n- **Run at least two instances** for anything users depend on, across zones if the platform allows.\n- **Graceful shutdown**: when an instance is told to stop (SIGTERM), stop accepting new requests and let in-flight streams finish within the grace period. Configure the platform's termination grace period longer than your typical stream.\n- **Timeouts everywhere**: platform request timeout > your agent's overall timeout > per-tool timeouts > model call timeout. Mismatched timeouts cause confusing failures (the platform kills the request while your code thinks it has time).\n\n```viz\ncaption: Nest timeouts so the inner one always fires first. Then your code, not the platform, decides what the user sees.\n<div class=\"vz-bars\"><span>platform request<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:100%\"><\/i><\/span><b>300 s<\/b><span>agent turn<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:80%\"><\/i><\/span><b>240 s<\/b><span>one model call<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:30%\"><\/i><\/span><b>90 s<\/b><span>one tool call<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:10%\"><\/i><\/span><b>30 s<\/b><\/div>\n<p>example values; keep each inner limit well below the one outside it<\/p>\n<div class=\"vz-src\">300 s is Cloud Run's default request timeout, which can be raised to 60 minutes: <a href=\"https://docs.cloud.google.com/run/docs/configuring/request-timeout\">Cloud Run docs<\/a>. Other values are illustrative.<\/div>\n```\n- **Backups tested by restoring them.**\n\n## Design review questions\n\n> [!interview] How many instances do you need at peak, and how did you calculate it?\n\n> [!interview] What happens to in-flight streaming responses during a deploy?\n\n> [!interview] Which service can read which secret? Show me the IAM bindings.\n\n> [!interview] What is the monthly cost at today's traffic and at 10x, split into model, compute, database, and other?\n\n## Further reading\n\n- [Cloud Run documentation](https://cloud.google.com/run/docs) and its [concurrency guide](https://cloud.google.com/run/docs/configuring/concurrency).\n- [Fly.io docs](https://fly.io/docs/), a simple alternative with a generous developer experience.\n- [Kubernetes autoscaling concepts](https://kubernetes.io/docs/concepts/workloads/autoscaling/), when you outgrow serverless.\n- [AWS Well-Architected Generative AI Lens](https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html), a checklist-style review of AI workloads.\n- [Azure AI architecture guidance](https://learn.microsoft.com/en-us/azure/architecture/ai-ml/) and [Google Cloud AI/ML architecture](https://cloud.google.com/architecture/ai-ml).\n\n```quiz\n[\n  {\"q\": \"Your CPU-based autoscaler never adds instances, yet users see queueing. Why?\", \"options\": [\"The autoscaler is broken\", \"LLM requests are I/O-bound; CPU stays low while concurrency is saturated\", \"Too many instances\", \"The model is slow\"], \"answer\": 1, \"why\": \"Waiting on remote APIs uses little CPU. Scale on concurrent requests or queue depth instead.\"},\n  {\"q\": \"40 chats per second each hold a connection for 10 seconds. How many concurrent requests is that?\", \"options\": [\"4\", \"40\", \"400\", \"4,000\"], \"answer\": 2, \"why\": \"Little's law: concurrency = arrival rate × duration = 40 × 10 = 400.\"},\n  {\"q\": \"Why set minimum instances to 1 or 2 on a user-facing serverless service?\", \"options\": [\"Required by the platform\", \"To avoid cold-start delays and keep at least one warm, available instance\", \"To reduce cost\", \"For logging\"], \"answer\": 1, \"why\": \"Cold starts add seconds to the first request. A small always-on floor is cheap insurance.\"},\n  {\"q\": \"What should the relationship between timeouts be?\", \"options\": [\"All equal\", \"Platform request timeout greater than agent timeout greater than tool and model call timeouts\", \"Model timeout largest\", \"No timeouts on streaming\"], \"answer\": 1, \"why\": \"Inner operations must time out before outer ones, so your code handles the failure instead of being killed mid-flight.\"}\n]\n```\n"}, {"id": "w4-lab", "week": 4, "kind": "lab", "title": "Lab 4: Deploy the agent to the cloud with secure APIs", "short": "Lab: deploy", "minutes": 270, "builds": "Relay on Cloud Run with CI/CD", "summary": "Containerise Relay, add real authentication, rate limits, and idempotency, move background work to a worker service, and ship it to the cloud through a pipeline that runs your evals and supports instant rollback.", "body": "\n## What you will build\n\n```mermaid\nflowchart LR\n  GH[GitHub PR] --> CI[CI: lint, unit,<br/>eval gate]\n  CI --> M[Merge to main]\n  M --> CD[CD: build image,<br/>push, deploy staging,<br/>smoke, promote]\n  CD --> API[relay-api<br/>Cloud Run]\n  CD --> WK[relay-worker<br/>Cloud Run]\n  API & WK --> DB[(Managed Postgres<br/>+ pgvector)]\n  API & WK --> SM[Secret Manager]\n  U[Client with JWT] --> API\n```\n\nThe lab shows Google Cloud Run. Azure Container Apps (revisions with [percentage traffic splitting](https://learn.microsoft.com/en-us/azure/container-apps/traffic-splitting)), Amazon ECS on Fargate (where [ECS Express Mode](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-overview.html) creates the load balancer and autoscaling for you), Fly.io, Render or Railway work too; translate the commands. The pieces map one to one: see the cross-cloud table in the cloud lesson.\n\nUse any model provider. Relay reads a `provider:model` spec from `RELAY_MODEL` (for example `openai:gpt-5`, `gemini:gemini-2.5-flash`, `anthropic:claude-haiku-5-5` or `openrouter:...`) plus that provider's key; see \"Choose any model provider\" in `relay/README.md`. A cross-vendor `RELAY_FALLBACK_MODEL` is worth setting in production: the reference retries rate limits, 5xx and connection errors from either SDK and can fall back across providers. To serve an open-weights model yourself (vLLM or Ollama), deploy it as a separate private service and point `VLLM_BASE_URL` or `OLLAMA_BASE_URL` at it; never expose it publicly.\n\n```viz\ncaption: The rollout you will practise. The new revision earns traffic in steps, and rollback is one traffic command, not a rebuild.\n<div class=\"vz-cols\" style=\"--k:4\">\n  <div class=\"vz-panel sk\"><h5>1. Deploy<\/h5><div class=\"vz-bars\"><span>new<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:1%\"><\/i><\/span><b>0%<\/b><span>old<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:100%\"><\/i><\/span><b>100%<\/b><\/div><p>--no-traffic, tagged canary<\/p><\/div>\n  <div class=\"vz-panel sk\"><h5>2. Canary<\/h5><div class=\"vz-bars\"><span>new<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:10%\"><\/i><\/span><b>10%<\/b><span>old<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:90%\"><\/i><\/span><b>90%<\/b><\/div><p>watch errors, latency, judge pass rate<\/p><\/div>\n  <div class=\"vz-panel sk\"><h5>3. Promote<\/h5><div class=\"vz-bars\"><span>new<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:100%\"><\/i><\/span><b>100%<\/b><span>old<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:1%\"><\/i><\/span><b>0%<\/b><\/div><p>old revision kept for rollback<\/p><\/div>\n  <div class=\"vz-panel sk b\"><h5>Or roll back<\/h5><div class=\"vz-bars\"><span>new<\/span><span class=\"bar sk\"><i class=\"sk b\" style=\"--w:1%\"><\/i><\/span><b>0%<\/b><span>old<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:100%\"><\/i><\/span><b>100%<\/b><\/div><p>update-traffic, seconds<\/p><\/div>\n<\/div>\n```\n\n**Acceptance criteria**\n\n1. `docker build` produces a non-root image that runs locally with `docker compose up` (API, worker, Postgres). Record its size and what makes it big: the reference image is 417 MB because it bundles a local embedding runtime; one that calls a hosted embedding API can be much smaller.\n2. The API verifies JWTs from an identity provider (Auth0, Clerk, Supabase Auth, or Firebase Auth free tiers). Customer identity comes only from the token.\n3. Per-user rate limit (messages per minute) and daily token budget, returning `429` with `Retry-After`.\n4. `Idempotency-Key` support on the refund approval endpoint.\n5. Memory extraction and ingestion run in a separate worker service, not in API background tasks.\n6. CI runs lint, unit tests (with a scripted fake LLM), and the eval PR gate. CD deploys to staging, runs a smoke test, then production.\n7. You can roll back production to the previous revision with one command, and you have done it once.\n\n> [!tip] A tested reference implementation is under [`relay/` at tag `lab4`](https://github.com/Rachneet/ai-system-design-course/tree/lab4/relay). Its CI builds the image and runs the real API and worker containers against Postgres on every push. The Cloud Run pipeline is included but has not been run against a live project.\n\n## Step 1: container and compose\n\nUse the multi-stage Dockerfile from the secure APIs lesson. Add a worker entry point that uses the same image:\n\n```yaml\n# docker-compose.yml\nservices:\n  db:\n    image: pgvector/pgvector:pg16\n    environment: { POSTGRES_PASSWORD: relay, POSTGRES_DB: relay }\n  api:\n    build: .\n    env_file: .env\n    environment: { RELAY_DATABASE_URL: postgresql://postgres:relay@db/relay }\n    ports: [\"8080:8080\"]\n    depends_on: [db]\n  worker:\n    build: .\n    command: [\"python\", \"-m\", \"app.worker\"]\n    env_file: .env\n    environment: { RELAY_DATABASE_URL: postgresql://postgres:relay@db/relay }\n    depends_on: [db]\n```\n\nAdd `.dockerignore` (exclude `.venv`, `evals/runs`, `.git`, `.env`). Check the image size with `docker image ls` and that `docker run --rm relay id` prints a non-root user.\n\n## Step 2: authentication\n\nCreate a free application in an identity provider. Configure the API with the JWKS URL, issuer, and audience. Replace the `X-Customer-Id` dependency with `current_user` from the lesson. Map the token's `sub` to your `customers` table (create the row on first login).\n\nWrite tests: expired token → 401; token for customer A requesting session of customer B → 404; valid token → 200.\n\n## Step 3: rate limits and budgets\n\nImplement a token bucket in Postgres or Redis keyed by user:\n\n```python\nasync def allow(user_id: str, cost: int = 1, rate_per_min: int = 20, burst: int = 20) -> tuple[bool, float]:\n    \"\"\"Atomic token bucket in Redis using a small Lua script. Returns (allowed, retry_after_s).\"\"\"\n    now = time.time()\n    allowed, retry = await redis.eval(TOKEN_BUCKET_LUA, 1, f\"rl:{user_id}\", now, rate_per_min / 60, burst, cost)\n    return bool(allowed), float(retry)\n```\n\nAlso record tokens used per user per day (from `resp.usage`), and refuse new turns past the budget with a clear message.\n\n## Step 4: worker service and idempotency\n\nMove memory extraction and ingestion into `app/worker.py`, consuming the Postgres job table from Lab 2. The API enqueues jobs in the same transaction as the data that triggers them (outbox style).\n\nAdd an `idempotency_keys` table and wrap `POST /approvals/{id}/decision`: the first request with a key stores its response; repeats return it.\n\n## Step 5: cloud setup\n\n```bash\ngcloud services enable run.googleapis.com sqladmin.googleapis.com secretmanager.googleapis.com artifactregistry.googleapis.com\ngcloud artifacts repositories create relay --repository-format=docker --location=europe-west1\n\n# Postgres: Cloud SQL (or a free Neon/Supabase database with pgvector)\n# Model: any spec from relay/README.md, and the key variable that provider reads\nMODEL=openai:gpt-5        # or gemini:gemini-2.5-flash, anthropic:claude-haiku-5-5, openrouter:...\nKEY_VAR=OPENAI_API_KEY    # or GEMINI_API_KEY, ANTHROPIC_API_KEY, OPENROUTER_API_KEY, HF_TOKEN\n# Secrets\nprintf \"%s\" \"${!KEY_VAR}\"   | gcloud secrets create model-api-key --data-file=-\nprintf \"%s\" \"$DATABASE_URL\" | gcloud secrets create database-url  --data-file=-\n\n# Service accounts with least privilege\ngcloud iam service-accounts create relay-api\ngcloud iam service-accounts create relay-worker\ngcloud secrets add-iam-policy-binding model-api-key \\\n  --member=serviceAccount:relay-api@$PROJECT.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor\n# ... repeat per secret and per service as needed\n```\n\nDeploy:\n\n```bash\nIMAGE=europe-west1-docker.pkg.dev/$PROJECT/relay/relay:$(git rev-parse --short HEAD)\ndocker build -t $IMAGE . && docker push $IMAGE\n\ngcloud run deploy relay-api --image $IMAGE --region europe-west1 \\\n  --service-account relay-api@$PROJECT.iam.gserviceaccount.com \\\n  --set-secrets $KEY_VAR=model-api-key:latest,RELAY_DATABASE_URL=database-url:latest \\\n  --set-env-vars RELAY_MODEL=$MODEL \\\n  --concurrency 80 --min-instances 1 --max-instances 10 --timeout 300 \\\n  --allow-unauthenticated          # the app checks JWTs itself\n\ngcloud run deploy relay-worker --image $IMAGE --region europe-west1 \\\n  --command python --args=-m,app.worker \\\n  --service-account relay-worker@$PROJECT.iam.gserviceaccount.com \\\n  --set-secrets $KEY_VAR=model-api-key:latest,RELAY_DATABASE_URL=database-url:latest \\\n  --set-env-vars RELAY_MODEL=$MODEL \\\n  --no-cpu-throttling --min-instances 1 --max-instances 3 --no-allow-unauthenticated\n```\n\n`--no-cpu-throttling` keeps CPU allocated to the worker between requests so its polling loop runs. A Cloud Run *service* must listen on `$PORT`, so have the worker start a tiny health endpoint alongside its loop (a few lines with `uvicorn` or `http.server`). Alternatively, use Cloud Run worker pools (`gcloud run worker-pools deploy`), which are built for continuous background work and need no endpoint, but do not autoscale, so you set the instance count yourself. Run database migrations as a one-off job (`gcloud run jobs`) before shifting traffic.\n\n## Step 6: CI/CD\n\nCreate `.github/workflows/ci.yml` from the CI/CD lesson. Then `deploy.yml` on push to `main`:\n\n1. Authenticate to Google Cloud with **Workload Identity Federation** (OIDC), no JSON keys. On AWS or Azure, use GitHub's OIDC setup for [AWS](https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws) or [Azure](https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-azure) instead.\n2. Build and push the image tagged with the Git SHA.\n3. Deploy to `relay-api-staging` and run `scripts/smoke.sh` (get a test token, send one chat, assert a streamed reply and a tool call).\n4. Deploy to production with `--no-traffic --tag canary`, shift 10% of traffic, wait, check error rate and latency from the platform's metrics, then shift 100%.\n\nRollback:\n\n```bash\ngcloud run services update-traffic relay-api --to-revisions=PREVIOUS_REVISION=100\n```\n\nPractice it. Deploy a deliberately broken prompt (for example one that makes the agent refuse everything), watch the smoke test or canary catch it, and roll back. Write down how long it took.\n\n## Stretch goals\n\n- Terraform or Pulumi for all of the above.\n- A `preview` environment per PR, torn down on merge.\n- Cloud Armor (or your platform's WAF) rate limiting at the edge.\n- Egress through a proxy with an allow-list for any tool that calls external URLs.\n- Graceful shutdown: handle SIGTERM by finishing in-flight streams within the grace period.\n\n## Reference reading\n\n- [Cloud Run docs](https://cloud.google.com/run/docs), [Azure Container Apps docs](https://learn.microsoft.com/en-us/azure/container-apps/), [Amazon ECS Express Mode](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-overview.html).\n- [Using uv in Docker](https://docs.astral.sh/uv/guides/integration/docker/) and [in GitHub Actions](https://docs.astral.sh/uv/guides/integration/github/).\n- [Security hardening for GitHub Actions](https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions).\n- [FastAPI in containers](https://fastapi.tiangolo.com/deployment/docker/).\n"}, {"id": "w5-tracing", "week": 5, "kind": "lesson", "title": "Tracing requests across agent actions and MCP", "short": "Tracing agents + MCP", "minutes": 50, "summary": "Instrument an agent so every conversation becomes a navigable trace of model calls, tool calls, retrieval, and remote MCP servers, using OpenTelemetry and its GenAI conventions, with context propagated across process boundaries.", "body": "\n## Why logs are not enough\n\nAn agent turn might involve a router call, three model calls, five tool calls (two in parallel), a retrieval with reranking, and a call to a remote MCP server that itself queries a database. When a user says \"it gave me the wrong refund amount\", you need to see that entire tree, in order, with inputs, outputs, timings, and token counts. Flat log lines with no relationship to one another make this nearly impossible.\n\n**Distributed tracing** records each unit of work as a **span** with a start time, duration, attributes, and a parent. All spans for one request share a **trace ID**. The result is a tree you can open and read.\n\n```mermaid\nflowchart TB\n  T[\"trace: POST /chat (session 8fa2, user c_77) 7.9 s\"]\n  T --> R[\"chat gemini-2.5-flash · router · 210 ms · 640 tok\"]\n  T --> A[\"invoke_agent relay · 7.4 s · 3 steps\"]\n  A --> M1[\"chat claude-sonnet-5-5 · step 1 · 1.9 s · in 9,120 / out 85\"]\n  A --> P[\"tools (parallel)\"]\n  P --> T1[\"execute_tool get_order · 40 ms\"]\n  P --> T2[\"execute_tool search_kb · 610 ms\"]\n  T2 --> S1[\"retrieval.hybrid · 70 ms\"]\n  T2 --> S2[\"rerank · 230 ms\"]\n  A --> M2[\"chat claude-sonnet-5-5 · step 2 · 1.2 s\"]\n  A --> X[\"execute_tool shipping.track · 880 ms (remote MCP server)\"]\n  A --> M3[\"chat claude-sonnet-5-5 · step 3 · 2.6 s · out 240\"]\n  T --> G[\"guardrails.output · 35 ms\"]\n```\n\nThe same trace drawn against time, as tracing tools show it, makes the bottleneck obvious:\n\n```viz\ncaption: Four model calls take 5.9 of the 7.9 seconds, and they run one after another. Faster tools would barely help; fewer steps would.\n<div class=\"vz-bars\">\n<span>router (model)<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:3%\"><\/i><\/span><b>0.2 s<\/b>\n<span>agent step 1<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:24%;margin-left:3%\"><\/i><\/span><b>1.9 s<\/b>\n<span>get_order<\/span><span class=\"bar sk\"><i class=\"sk m\" style=\"--w:1%;margin-left:27%\"><\/i><\/span><b>0.04 s<\/b>\n<span>search_kb<\/span><span class=\"bar sk\"><i class=\"sk m\" style=\"--w:8%;margin-left:27%\"><\/i><\/span><b>0.6 s<\/b>\n<span>agent step 2<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:15%;margin-left:35%\"><\/i><\/span><b>1.2 s<\/b>\n<span>MCP shipping<\/span><span class=\"bar sk\"><i class=\"sk m\" style=\"--w:11%;margin-left:50%\"><\/i><\/span><b>0.9 s<\/b>\n<span>agent step 3<\/span><span class=\"bar sk\"><i class=\"sk c\" style=\"--w:33%;margin-left:62%\"><\/i><\/span><b>2.6 s<\/b>\n<span>guardrail<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:1%;margin-left:96%\"><\/i><\/span><b>0.04 s<\/b>\n<\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">model call<\/span><span class=\"ch sk m\">tool or MCP<\/span><span class=\"ch sk g\">guardrail<\/span><b>time runs left to right, 0 to 7.9 s<\/b><\/div>\n<div class=\"vz-src\">Illustrative timings from the example trace above, not a benchmark. The two tools run in parallel, so their bars overlap.<\/div>\n```\n\n## OpenTelemetry and the GenAI conventions\n\n[OpenTelemetry](https://opentelemetry.io/docs/languages/python/) (OTel) is the vendor-neutral standard for traces, metrics, and logs. Instrument once, send anywhere: Jaeger, Grafana Tempo, Honeycomb, Datadog, or LLM-focused tools like [Langfuse](https://langfuse.com/docs) and [Arize Phoenix](https://github.com/Arize-ai/phoenix) that accept OTel data.\n\nOTel defines [semantic conventions for generative AI](https://github.com/open-telemetry/semantic-conventions-genai/tree/main/docs/gen-ai): standard span names and attribute keys for model calls, agent operations, and tool executions. Using them means your traces work across tools without custom mapping. Key attributes include:\n\n| Attribute | Example |\n|---|---|\n| `gen_ai.operation.name` | `chat`, `generate_content`, `execute_tool`, `invoke_agent`, `embeddings` |\n| `gen_ai.provider.name` | `anthropic`, `openai`, `gcp.gemini`, `aws.bedrock`; a custom value such as `vllm` or `ollama` when none applies |\n| `gen_ai.request.model` / `gen_ai.response.model` | `claude-sonnet-5-5`, `gpt-5`, `gemini-2.5-flash`, `qwen3:8b` |\n| `gen_ai.usage.input_tokens` / `gen_ai.usage.output_tokens` | `9120` / `85` (input includes cached tokens) |\n| `gen_ai.response.finish_reasons` | `[\"tool_use\"]` (Anthropic), `[\"tool_calls\"]` (OpenAI) |\n| `gen_ai.tool.name` / `gen_ai.tool.call.id` | `get_order` / `toolu_01A…` |\n| `gen_ai.conversation.id` | session ID |\n\nThis is what makes traces **provider-neutral**. Relay can run its agent on one provider, its router on another and its judge on a third, and every model call still lands in the same trace with the same attribute names, so one dashboard compares them. `gen_ai.provider.name` has a list of well-known values (`anthropic`, `openai`, `gcp.gemini`, `aws.bedrock`, `groq`, `mistral_ai` and others); for anything not listed, such as your own vLLM or Ollama server, the spec allows a custom value.\n\nThe conventions are marked **Development** (not yet stable) and moved to their own repository in 2026, so pin the version you follow and expect renames. Cached tokens, for example, are `gen_ai.usage.cache_read.input_tokens` and `gen_ai.usage.cache_write.input_tokens`, and the spec says `gen_ai.usage.input_tokens` **should include** cached tokens. Providers report usage differently, so map each one carefully:\n\n| Provider | What its usage fields mean | `gen_ai.usage.input_tokens` |\n|---|---|---|\n| Anthropic | `input_tokens`, `cache_creation_input_tokens` and `cache_read_input_tokens` are separate counts ([docs](https://platform.claude.com/docs/en/api/rate-limits#cache-aware-itpm)) | sum all three |\n| OpenAI | `input_tokens` already includes `input_tokens_details.cached_tokens` ([docs](https://developers.openai.com/api/docs/guides/prompt-caching)) | `input_tokens` |\n| Gemini | `prompt_token_count` already includes `cached_content_token_count` ([docs](https://ai.google.dev/api/generate-content)) | `prompt_token_count` |\n| OpenAI-compatible servers (vLLM, Ollama, gateways) | Chat Completions `usage`; cached counts only if the server reports them | `prompt_tokens` |\n\nLibraries like [OpenLLMetry](https://github.com/traceloop/openllmetry) and the OTel contrib instrumentations can auto-instrument popular SDKs.\n\n## Instrumenting the agent loop\n\nAuto-instrumentation gives you model calls. Add manual spans for the parts that carry your application's meaning: the agent run, each tool, retrieval stages, guardrails.\n\n```python\nfrom opentelemetry import trace\ntracer = trace.get_tracer(\"relay\")\n\nasync def run_turn(ctx, messages, on_text):\n    with tracer.start_as_current_span(\"invoke_agent relay\") as span:\n        span.set_attribute(\"gen_ai.operation.name\", \"invoke_agent\")\n        span.set_attribute(\"gen_ai.conversation.id\", str(ctx.session_id))\n        span.set_attribute(\"relay.prompt_sha\", PROMPT_SHA)\n        span.set_attribute(\"enduser.id\", ctx.customer_hash)       # hashed, not raw\n        for step in range(MAX_STEPS):\n            with tracer.start_as_current_span(f\"chat {MODEL}\") as llm:\n                llm.set_attribute(\"gen_ai.operation.name\", \"chat\")\n                llm.set_attribute(\"gen_ai.provider.name\", PROVIDER)     # \"anthropic\", \"openai\", \"gcp.gemini\", ...\n                llm.set_attribute(\"gen_ai.request.model\", MODEL)\n                llm.set_attribute(\"relay.step\", step)\n                resp = await call_model(ctx, messages, on_text)\n                u = resp.usage   # normalised by the client: uncached, cache_read, cache_write, output\n                llm.set_attribute(\"gen_ai.usage.input_tokens\", u.uncached + u.cache_read + u.cache_write)  # total, per the spec\n                llm.set_attribute(\"gen_ai.usage.output_tokens\", u.output)\n                llm.set_attribute(\"gen_ai.usage.cache_read.input_tokens\", u.cache_read)\n                llm.set_attribute(\"gen_ai.usage.cache_write.input_tokens\", u.cache_write)\n                llm.set_attribute(\"gen_ai.response.finish_reasons\", [resp.stop_reason])\n            ...\n\nasync def run_tool(ctx, block):\n    with tracer.start_as_current_span(f\"execute_tool {block.name}\") as span:\n        span.set_attribute(\"gen_ai.operation.name\", \"execute_tool\")\n        span.set_attribute(\"gen_ai.tool.name\", block.name)\n        span.set_attribute(\"gen_ai.tool.call.id\", block.id)\n        try:\n            ...\n        except ToolError as e:\n            span.set_status(trace.Status(trace.StatusCode.ERROR, str(e)))\n            span.set_attribute(\"relay.tool.error_kind\", type(e).__name__)\n            raise\n```\n\nBecause `asyncio.gather` runs tools inside the current context, parallel tool spans correctly share the agent span as parent.\n\n## Propagating context across services and MCP\n\nA trace is only useful if it crosses process boundaries. When the API enqueues a job for a worker, or calls a remote MCP server, the trace context (trace ID and parent span ID) must travel with the request so downstream spans attach to the same trace.\n\n- **HTTP**: OTel's W3C `traceparent` header. Auto-instrumented HTTP clients and servers (httpx, FastAPI) inject and extract it.\n- **Queues**: put the `traceparent` in the job payload when enqueuing; extract it in the worker and start the job span as a child (or as a linked span for long-delayed jobs).\n- **MCP**: the [Model Context Protocol](https://modelcontextprotocol.io/) sends JSON-RPC messages over stdio or Streamable HTTP. The OpenTelemetry MCP convention puts the W3C `traceparent` (and `tracestate`, `baggage`) inside each request's `params._meta` field, unprefixed, on every transport, and the server uses it as the remote parent for its spans. Because it travels in the message body, it works on stdio too. Support varies by SDK version, so verify it end to end: make an MCP tool call and check that the server's spans appear under your agent's trace.\n\n```viz\ncaption: One trace ID crosses three boundaries. Each boundary needs its own carrier for the traceparent, or the trace breaks into pieces.\n<div class=\"vz-row\"><span class=\"ch sk c\">API<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk\">HTTP header<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">retrieval<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">API<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk\">job payload<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">worker<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk c\">agent<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk\">params._meta<\/span><span class=\"arr sk\"><\/span><span class=\"ch sk c\">MCP server<\/span><\/div>\n<div class=\"vz-row\"><span class=\"ch sk g\">one trace ID: 4bf92f35...<\/span><b>every span joins the same tree<\/b><\/div>\n<div class=\"vz-src\">Carriers from the W3C <a href=\"https://www.w3.org/TR/trace-context/\">Trace Context<\/a> spec and the OpenTelemetry <a href=\"https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/mcp.md\">MCP semantic conventions<\/a>.<\/div>\n```\n\n```python\nfrom opentelemetry.propagate import inject, extract\n\n# producer\ncarrier = {}\ninject(carrier)                                # {\"traceparent\": \"00-<trace>-<span>-01\"}\nawait enqueue(\"extract_memory\", {\"session_id\": sid, \"trace\": carrier})\n\n# consumer\nctx = extract(job.payload[\"trace\"])\nwith tracer.start_as_current_span(\"job extract_memory\", context=ctx):\n    ...\n```\n\n> [!warn] Third-party MCP servers you do not control will not send spans to your backend. Record a client-side span for every MCP call (server name, tool name, duration, error, response size) so you can at least see their latency and failures from your side.\n\n## What to capture, and what not to\n\nTraces are most useful when you can read the actual prompts and responses. They are also full of personal data. Decide deliberately:\n\n| Capture | Default |\n|---|---|\n| Model, tokens, latency, finish reason, step, tool names, errors | Always |\n| Prompt hash, model config, feature flags, deploy SHA | Always |\n| Full message content and tool arguments/results | In a restricted store with retention limits, or sampled, or redacted |\n| User identifiers | Hashed or pseudonymous IDs; raw only where policy allows |\n| Secrets, card numbers | Never (redact before export) |\n\nThe OTel GenAI conventions keep message content out of span attributes by default and make content capture opt-in, for this reason. Apply redaction in an exporter or processor, so it cannot be forgotten in application code.\n\n## Sampling\n\nHigh-volume systems cannot keep every trace. Typical policy:\n\n- **Head sampling** keeps a percentage chosen at the start of the request (for example 10%).\n- **Tail sampling** decides after the trace completes: keep **all** traces with errors, guardrail firings, step-limit hits, high cost, high latency, or negative user feedback, plus a random sample of the rest. Tail sampling needs a collector (the OTel Collector) that buffers spans per trace.\n\nFor AI systems, tail sampling is almost always worth it: the interesting traces are rare, and they are the ones you need for error analysis.\n\n## From traces to evals\n\nTraces are the raw material for Week 3's eval datasets. Make the path short:\n\n1. A user gives a thumbs-down, or an online judge fails a conversation.\n2. The trace ID is attached to that feedback.\n3. A reviewer opens the trace, labels the failure category, and clicks \"add to dataset\", which runs your trace-to-case converter.\n\nTools like Langfuse and Phoenix have dataset features for exactly this loop. You can also build it with a small script against your trace store.\n\n## Design review questions\n\n> [!interview] Open the trace for the slowest conversation yesterday. Which span dominated?\n\n> [!interview] When a worker processes a memory job, can you see which chat request caused it?\n\n> [!interview] Where does message content in traces go, who can read it, and when is it deleted?\n\n> [!interview] Which traces are guaranteed to be kept under your sampling policy?\n\n## Further reading\n\n- [OpenTelemetry semantic conventions for GenAI](https://github.com/open-telemetry/semantic-conventions-genai/tree/main/docs/gen-ai), including the [span attributes](https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/gen-ai-spans.md) and the [MCP conventions](https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/mcp.md).\n- [OpenTelemetry Python](https://opentelemetry.io/docs/languages/python/) and [contrib instrumentations](https://github.com/open-telemetry/opentelemetry-python-contrib).\n- [OpenLLMetry](https://github.com/traceloop/openllmetry), OTel-based auto-instrumentation for LLM SDKs.\n- [Langfuse docs](https://langfuse.com/docs) and [Arize Phoenix](https://github.com/Arize-ai/phoenix), open-source LLM observability.\n- [Model Context Protocol](https://modelcontextprotocol.io/).\n\n```quiz\n[\n  {\"q\": \"What links all spans belonging to one user request?\", \"options\": [\"The session ID\", \"A shared trace ID, with parent-child relationships between spans\", \"Timestamps\", \"The model name\"], \"answer\": 1, \"why\": \"Spans share a trace ID and point to their parent, which builds the tree you navigate.\"},\n  {\"q\": \"How do spans in a background worker join the trace of the API request that enqueued the job?\", \"options\": [\"Automatically, always\", \"The producer injects trace context (traceparent) into the job payload and the worker extracts it\", \"By matching timestamps\", \"They cannot\"], \"answer\": 1, \"why\": \"Context propagation must cross every boundary, including queues, explicitly.\"},\n  {\"q\": \"Which sampling policy best fits AI systems?\", \"options\": [\"Keep 1% randomly\", \"Tail sampling that keeps all errors, guardrail firings, expensive, slow, or negatively rated traces plus a random sample\", \"Keep nothing\", \"Head sampling at 100%\"], \"answer\": 1, \"why\": \"The traces you need for debugging and eval building are rare. Tail sampling keeps them.\"},\n  {\"q\": \"Relay's router runs on Gemini and its agent on Claude. How do both model calls show up comparably in one trace?\", \"options\": [\"They cannot\", \"Both spans use the OTel GenAI attributes, with gen_ai.provider.name telling them apart\", \"Only by using one provider\", \"By logging each SDK's raw response\"], \"answer\": 1, \"why\": \"The GenAI semantic conventions are provider-neutral: the same attribute names for every provider, with the provider recorded as an attribute.\"},\n  {\"q\": \"A third-party MCP server you do not control is slow. How do you see it in your traces?\", \"options\": [\"You cannot\", \"Record a client-side span around each MCP call with server, tool, duration, and errors\", \"Ask the vendor for logs\", \"Use print statements\"], \"answer\": 1, \"why\": \"Even without their spans, your client span shows their latency and failure rate inside your trace.\"}\n]\n```\n"}, {"id": "w5-monitoring", "week": 5, "kind": "lesson", "title": "Monitoring errors, token usage, and user feedback", "short": "Monitoring cost + quality", "minutes": 45, "summary": "The metrics that tell you whether an AI system is healthy, affordable, and actually helping users, and how to collect explicit and implicit feedback and turn it into online evaluation.", "body": "\n## Three questions every dashboard answers\n\n1. **Is it working?** Errors, latency, availability, dependency health.\n2. **What does it cost?** Tokens, dollars, per user, per tenant, per feature.\n3. **Is it any good?** Quality signals from users, judges, and outcomes.\n\nTraditional services stop at the first. AI systems fail quietly on the second and third: a prompt change that makes answers 30% longer doubles the bill without a single error; a retrieval regression makes answers worse with every request returning 200 OK.\n\n```viz\ncaption: Every one of these requests returned 200 OK. Only the cost and quality rows of the dashboard can tell them apart.\n<div class=\"vz-cols\" style=\"--k:3\">\n  <div class=\"vz-panel sk g\"><h5>Is it working?<\/h5><div class=\"vz-row\"><span class=\"ch sk g\">200 OK<\/span><span class=\"ch sk g\">TTFT 0.9 s<\/span><\/div><p>errors, latency, saturation<\/p><\/div>\n  <div class=\"vz-panel sk w\"><h5>What does it cost?<\/h5><div class=\"vz-row\"><span class=\"ch sk g\">200 OK<\/span><span class=\"ch sk w\">14 steps, $0.85<\/span><\/div><p>a loop: no error, big bill<\/p><\/div>\n  <div class=\"vz-panel sk b\"><h5>Is it any good?<\/h5><div class=\"vz-row\"><span class=\"ch sk g\">200 OK<\/span><span class=\"ch sk b\">wrong refund amount<\/span><\/div><p>judges, feedback, outcomes<\/p><\/div>\n<\/div>\n```\n\n## Golden signals, adapted\n\nThe classic four (latency, traffic, errors, saturation, from Google's [SRE book](https://sre.google/sre-book/monitoring-distributed-systems/)) still apply, with AI-specific detail:\n\n| Signal | What to track | Why |\n|---|---|---|\n| Latency | TTFT p50/p95, total turn time p50/p95, per-stage (retrieval, model, tools) | Users feel TTFT; total time affects abandonment |\n| Traffic | Conversations, turns, model calls per turn, by route and model | Calls-per-turn growth is often a looping or prompt bug |\n| Errors | HTTP 5xx; provider errors by type (429, 5xx, overloaded, timeouts); tool errors by tool; refusals; step-limit hits; guardrail blocks | Many AI failures are not exceptions |\n| Saturation | Provider rate-limit headroom (tokens/min used vs limit, read from response headers such as `anthropic-ratelimit-*` or `x-ratelimit-*`), worker queue depth and age, DB connections; GPU KV cache use and queue length if you self-host | Rate limits (or your own GPUs) are the usual bottleneck |\n\n## Token and cost monitoring\n\nRecord usage on every model call (you already have it in spans): provider, model, input tokens, cached input tokens, output tokens, and the feature, user, and tenant it served. Compute cost from a price table versioned in your repo. Providers count tokens differently, so first turn each provider's usage object into the same four disjoint numbers, then price them:\n\n```python\nPRICES = {  # USD per million tokens: uncached input, cache write, cache read, output (checked 2026-10-14)\n    \"claude-opus-5-5\":   {\"in\": 4.00, \"cache_write\": 5.00,  \"cache_read\": 0.20,  \"out\": 20.00},\n    \"claude-sonnet-5-5\": {\"in\": 2.00, \"cache_write\": 2.50,  \"cache_read\": 0.10,  \"out\": 10.00},\n    \"claude-haiku-5-5\":  {\"in\": 0.10, \"cache_write\": 0.125, \"cache_read\": 0.01,  \"out\": 0.50},  # prompts ≤100k tokens\n    \"gpt-5\":             {\"in\": 1.25, \"cache_write\": 1.25,  \"cache_read\": 0.125, \"out\": 10.00}, # no write premium\n    \"gemini-2.5-flash\":  {\"in\": 0.30, \"cache_write\": 0.30,  \"cache_read\": 0.03,  \"out\": 2.50},  # text; explicit caches add storage\n    \"qwen3:8b\":          {\"in\": 0.0,  \"cache_write\": 0.0,   \"cache_read\": 0.0,   \"out\": 0.0},   # self-hosted: price the GPU-hours instead\n}\n\ndef normalise(provider, u) -> tuple[int, int, int, int]:\n    \"\"\"Return (uncached input, cache write, cache read, output) as disjoint counts.\"\"\"\n    if provider == \"anthropic\":   # three separate input counts that add up to the total\n        return u.input_tokens, u.cache_creation_input_tokens or 0, u.cache_read_input_tokens or 0, u.output_tokens\n    if provider == \"openai\":      # input_tokens already includes cached tokens\n        d = u.input_tokens_details\n        write = getattr(d, \"cache_write_tokens\", 0) or 0\n        return u.input_tokens - d.cached_tokens - write, write, d.cached_tokens, u.output_tokens\n    if provider == \"gcp.gemini\":  # prompt_token_count already includes cached tokens; thinking is billed as output\n        cached = u.cached_content_token_count or 0\n        return u.prompt_token_count - cached, 0, cached, u.candidates_token_count + (u.thoughts_token_count or 0)\n    raise ValueError(provider)\n\ndef cost_usd(model, uncached, write, read, out) -> float:\n    p = PRICES[model]\n    return (uncached * p[\"in\"] + write * p[\"cache_write\"] + read * p[\"cache_read\"] + out * p[\"out\"]) / 1e6\n```\n\n> [!warn] Check exactly how each provider reports cached tokens and cache writes, because they disagree. On the Claude API, `input_tokens`, `cache_creation_input_tokens`, and `cache_read_input_tokens` are separate counts that add up to the total input, and cache writes cost more than normal input (1.25x for 5-minute, 2x for 1-hour caches); Haiku 5.5 also charges higher rates when a prompt exceeds 100,000 tokens. On OpenAI, `input_tokens` already includes `cached_tokens`; GPT-5.6 and later also bill cache writes at 1.25x, reported as `cache_write_tokens`. On Gemini, `prompt_token_count` already includes `cached_content_token_count`, and explicit caches add an hourly storage charge. Getting this wrong makes your cost dashboards disagree with the invoice, and nobody trusts a dashboard that disagrees with the invoice. Reconcile against each provider's usage report monthly.\n\nPrices: [Anthropic](https://platform.claude.com/docs/en/about-claude/pricing), [OpenAI](https://developers.openai.com/api/docs/pricing), [Gemini](https://ai.google.dev/gemini-api/docs/pricing), all checked 2026-10-14. Usage fields: [Anthropic](https://platform.claude.com/docs/en/api/rate-limits#cache-aware-itpm), [OpenAI](https://developers.openai.com/api/docs/guides/prompt-caching), [Gemini](https://ai.google.dev/api/generate-content). For self-hosted models (vLLM, Ollama) there is no token bill: cost is GPU-hours divided by tokens served, as in the [inference lesson](#w5-inference).\n\nDashboards to build:\n\n- **Cost per conversation** (p50, p95, max) over time, by route and model. The single most useful AI cost chart.\n- **Tokens per turn**, split into input, cached input, and output. Rising input means context bloat; rising output means verbosity.\n- **Cache hit rate** (cached input / total input). A sudden drop means a prefix change broke caching.\n- **Spend by tenant and by feature**, for pricing and abuse detection.\n- **Top 20 most expensive conversations** this week, linked to their traces. Read them. They are usually loops, huge tool results, or abuse.\n\n> [!numbers] Relay's p50 conversation costs $0.012 but p99 costs $0.85. The top 1% of conversations is about 0.01 × 0.85 / (0.99 × 0.012 + 0.01 × 0.85) ≈ **42% of total spend** (using p99 as a rough stand-in for the tail). Fixing the tail (step limits, result truncation, compaction) often saves more than optimising the median.\n\n```viz\ncaption: The top 1% of conversations spends 42% of the budget. Read the expensive ones first.\n<div class=\"vz-cols\">\n  <div class=\"vz-panel sk\"><h5>Cost of one conversation<\/h5>\n    <div class=\"vz-bars\"><span>p50<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:2%\"><\/i><\/span><b>$0.012<\/b><span>p99<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:100%\"><\/i><\/span><b>$0.85<\/b><\/div>\n    <p>71 times the median<\/p>\n  <\/div>\n  <div class=\"vz-panel sk\"><h5>Share of total spend<\/h5>\n    <div class=\"vz-bars\"><span>99% of chats<\/span><span class=\"bar sk\"><i class=\"sk g\" style=\"--w:58%\"><\/i><\/span><b>58%<\/b><span>top 1%<\/span><span class=\"bar sk\"><i class=\"sk w\" style=\"--w:42%\"><\/i><\/span><b>42%<\/b><\/div>\n    <p>loops, huge tool results, abuse<\/p>\n  <\/div>\n<\/div>\n<div class=\"vz-src\">Illustrative Relay numbers from the worked example above; 0.85 / 0.012 ≈ 71.<\/div>\n```\n\n## Quality monitoring\n\n### Explicit feedback\n\nThumbs up/down, star ratings, \"report a problem\". Cheap to add, but:\n\n- Response rates are low (often 1 to 5%) and skewed toward unhappy users.\n- A thumbs-down without a reason is hard to act on. Offer quick reason chips (\"wrong info\", \"didn't do what I asked\", \"too long\", \"unsafe\") and an optional comment.\n- Always store the trace ID with feedback.\n\n### Implicit feedback\n\nBehaviour tells you more, more often:\n\n| Signal | Suggests |\n|---|---|\n| User rephrases the same question | The answer missed |\n| User asks for a human / escalation rate | The agent could not resolve it |\n| Conversation abandoned mid-flow | Frustration or slowness |\n| Copy or click on a cited source | The answer was useful |\n| Repeat contact on the same order within 48 hours | The issue was not actually resolved |\n| Refund reversed or approval rejected by staff | The agent proposed a wrong action |\n\nDefine a **resolution rate**: the share of conversations that end without escalation and without repeat contact within N days. It is a better north-star metric for a support agent than thumbs-up rate.\n\n### Online evaluation\n\nRun your Week 3 judges on a sample of live conversations (for example 5%, plus all conversations with negative signals). Chart judge pass rates per category over time. A drop after a deploy is a regression; a slow drift may mean user behaviour or the knowledge base changed.\n\n```mermaid\nflowchart LR\n  P[Production traces] --> S{Sampler:<br/>5% random +<br/>all negative signals}\n  S --> J[Online judges]\n  J --> D[Dashboards:<br/>pass rate by category]\n  J -->|fail| RQ[Review queue]\n  RQ --> L[Human label + category]\n  L --> DS[(Eval dataset)]\n  L --> JC[Judge calibration data]\n```\n\nHuman review of the review queue keeps judges honest and turns production failures into eval cases. Budget a few hours a week for it. This loop is where most quality improvement comes from after launch.\n\n## Error tracking\n\nUse an error tracker (for example [Sentry](https://docs.sentry.io/), which has a free tier) for exceptions with stack traces, grouped and deduplicated. Tag errors with model, prompt SHA, route, and trace ID. Many AI \"errors\" are not exceptions (a refusal, a guardrail block, a step-limit hit, a malformed tool argument the model retried), so emit them as **metrics and structured events** too.\n\n## Metrics plumbing\n\nA simple, standard stack: OTel metrics (or Prometheus client) → [Prometheus](https://prometheus.io/docs/introduction/overview/) or your cloud's metrics service → [Grafana](https://grafana.com/docs/grafana/latest/) dashboards. LLM observability platforms (Langfuse, Phoenix, and commercial ones) give you token, cost, and feedback views out of the box from traces. Many teams use both: infrastructure metrics in Grafana, conversation-level analytics in an LLM tool.\n\nWatch **cardinality**: do not put user IDs or session IDs as metric labels (millions of series). Put them on traces and events; keep metric labels to bounded sets like route, model, tool, and tenant tier.\n\n## A Relay dashboard\n\n| Row | Panels |\n|---|---|\n| Health | Requests/min, 5xx rate, provider error rate by type, TTFT p95, turn p95 |\n| Cost | $/hour, $/conversation p50/p95/p99, cache hit rate, tokens/turn split, spend by tenant and by provider and model |\n| Agent behaviour | Steps per turn histogram, step-limit hits, tool calls by tool, tool error rate, guardrail fires by guardrail |\n| Quality | Online judge pass rate by category, resolution rate, escalation rate, thumbs-down rate, review queue size |\n| Capacity | Rate-limit headroom per model, queue depth and age, DB connections, instance count |\n\n## Design review questions\n\n> [!interview] What did the most expensive conversation yesterday cost, and why?\n\n> [!interview] How would you notice a 10-point drop in answer quality that throws no errors?\n\n> [!interview] What is your resolution rate, and how is it defined?\n\n> [!interview] Does your cost dashboard match last month's invoice within 5%?\n\n## Further reading\n\n- [Monitoring Distributed Systems](https://sre.google/sre-book/monitoring-distributed-systems/), Google SRE book.\n- [Building A Generative AI Platform](https://huyenchip.com/2024/07/25/genai-platform.html), Chip Huyen. The observability and feedback sections.\n- [Langfuse docs](https://langfuse.com/docs) for cost tracking, scores, and datasets.\n- [Arize Phoenix](https://github.com/Arize-ai/phoenix) for open-source tracing and online evals.\n- [Prometheus overview](https://prometheus.io/docs/introduction/overview/) and [Grafana docs](https://grafana.com/docs/grafana/latest/).\n\n```quiz\n[\n  {\"q\": \"Average input tokens per turn rose 40% after a release while error rates stayed flat. What is the likely issue?\", \"options\": [\"Traffic growth\", \"Context bloat: larger prompts, tool results, or history, or broken compaction\", \"The provider raised prices\", \"Users typing more\"], \"answer\": 1, \"why\": \"Input growth per turn points to what you put in the context. Check prompt size, tool result size, and compaction.\"},\n  {\"q\": \"Why is resolution rate a better north-star than thumbs-up rate for a support agent?\", \"options\": [\"It is easier to compute\", \"It measures whether the problem was actually solved, from behaviour on all conversations rather than a small, skewed sample\", \"Users prefer it\", \"It is always higher\"], \"answer\": 1, \"why\": \"Explicit feedback is sparse and biased. Outcome-based metrics reflect real value.\"},\n  {\"q\": \"Why not use user IDs as metric labels?\", \"options\": [\"Privacy only\", \"Unbounded label values create huge numbers of time series and overwhelm the metrics system\", \"Prometheus forbids strings\", \"They are not useful\"], \"answer\": 1, \"why\": \"High cardinality explodes metric storage. Keep per-user detail in traces and events.\"},\n  {\"q\": \"Your cache hit rate dropped from 80% to 5% overnight. What should you check first?\", \"opti
