ass=\"vz-panel sk\"><h5>Out of framing<\/h5><p>assumptions, users, risk, tokens and cost<\/p><\/div>\n  <div class=\"vz-panel sk c\"><h5>Out of design<\/h5><p>one diagram, one request walked end to end<\/p><\/div>\n  <div class=\"vz-panel sk g\"><h5>Out of trade-offs<\/h5><p>what you rejected, and when to revisit<\/p><\/div>\n<\/div>\n```\n\nEvery outline below is provider-neutral on purpose. Where it says \"a small model\" or \"a large model\", any tier works: a hosted API (OpenAI, Anthropic, Google Gemini, Mistral), an open-weights model on vLLM or Ollama, or a mix behind a gateway. Naming the deciding factor (quality on your evals, latency, price, data residency) scores better than naming a brand.\n\nThen compare with the outline. The outlines are not the only right answer; they show the considerations a strong answer covers.\n\n## Drill 1: Internal knowledge assistant for a 5,000-person company\n\n*Employees ask questions over Confluence, Google Drive, and Slack. Answers must respect each employee's existing permissions. Target: answer in under 5 seconds, citations required.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Clarify:** ~5,000 users, maybe 20,000 questions/day, peak ~3/sec. 2M documents, many updated daily. Permissions vary per document and change often. Wrong answers are tolerable if cited; leaks are not.\n- **Estimate:** 2M docs × ~8 chunks = 16M chunks × 1,024 dims × 4 bytes ≈ 65 GB vectors (consider 512-dim or int8: ~16 GB).\n- **Ingestion:** connectors per source using webhooks + nightly reconciliation; queue; parse, structure-aware chunking, contextual prefixes; incremental hash-based upserts. ACLs synced as document metadata, permission changes as fast-path events.\n- **Access control:** the hardest part. Copying ACLs per chunk for Drive's sharing model is fragile; use coarse pre-filter (tenant, group membership snapshot) plus fine post-filter through a ReBAC service (OpenFGA-style) with over-fetching. Never cache answers across users.\n- **Retrieval:** hybrid BM25 + vector, RRF, rerank top 50 → 8; query rewrite for follow-ups; source routing (Slack vs docs).\n- **Generation:** cite chunk IDs; validate citations against retrieved set; abstain when nothing relevant.\n- **Model hosting:** a hosted API is simplest. If documents may not leave the company, serve an open-weights model (Llama, Qwen, Mistral) with vLLM inside your network, and size the GPUs on measured goodput at the ~3 questions a second peak, not on a guess.\n- **Evals:** retrieval recall@8 per source; permission leak tests (must-never); groundedness judge calibrated on 150 labels.\n- **Failure modes:** stale permissions (revocation lag SLO), Slack noise, outdated docs outranking current ones (freshness boost), prompt injection in shared docs (assistant has no write tools; no external links rendered).\n\n<\/details>\n\n## Drill 2: Customer support agent that can issue refunds\n\n*E-commerce, 50,000 conversations/day. The agent should resolve order status, returns, and refunds up to a limit. Fraud is a concern.*\n\n<details><summary>Solution outline<\/summary>\n\n- This is Relay. Key points: router to send simple intents to a small model; tool tiers with refund limits in code; identity from auth context only; approvals for high-value refunds as a state machine with idempotent execution; quarantined processing of emails and reviews.\n- **Estimate:** 50k × ~7 calls × ~11k tokens → caching essential; compute cost per conversation for no-cache, cache, and routing designs.\n- **Fraud:** per-customer refund velocity limits, anomaly alerts on refund rate, human review sampling, never let memory or content grant permissions.\n- **Evals:** τ-bench-style end-state checks; must-not-call cases; red-team via reviews and emails; pass^k on refund flows.\n- **Ops:** kill switch for `issue_refund`; cost and refund-rate alerts; canary on escalation and refund rates.\n\n<\/details>\n\n## Drill 3: Coding agent that opens pull requests from bug reports\n\n*Given a GitHub issue, the agent reproduces the bug, writes a fix and a test, and opens a PR for human review. 500 issues/day across 200 repos.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Execution environment:** per-task sandboxed containers with repo checkout, no production credentials, egress restricted to package registries.\n- **Agent:** single agent with file read/write, search (grep), shell (in sandbox), test runner. Long context needs: just-in-time file exploration, compaction, notes file.\n- **Durability:** tasks take 5 to 30 minutes; run in workers with checkpoints; budgets per task (tokens and wall time).\n- **Security:** issue text is untrusted (injection could ask to exfiltrate secrets or add a backdoor). No secrets in sandbox; PRs always human-reviewed; diff scanners for suspicious changes (CI config, credentials, network calls).\n- **Evals:** historical issues with known fixes (SWE-bench style): does the generated test fail before and pass after? Hidden tests. Measure resolve rate, PR acceptance rate in production.\n- **Cost:** long agent runs; prompt caching on repo context; cap steps; route trivial issues (typos, docs) to cheaper path.\n\n<\/details>\n\n## Drill 4: Document processing pipeline for insurance claims\n\n*Extract 40 fields from scanned claim forms and attachments (photos, invoices), validate, and route for approval. 100,000 documents/day, accuracy matters more than latency.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Workflow, not agent:** the path is known. Steps: classify document type → OCR/vision extraction with structured output schema → code validation (dates, totals, policy number checksum) → cross-document consistency checks → confidence scoring → auto-approve, human review, or reject.\n- **Batch:** use the provider's batch API for cost (OpenAI, Anthropic and Gemini all offer one), or run an open model offline at high batch size if you self-host; queue with priority lanes for urgent claims.\n- **Human in the loop:** low-confidence fields highlighted in a review UI; corrections stored as labelled data.\n- **Evals:** field-level precision/recall per document type on a labelled set; end-to-end decision accuracy; calibration of confidence scores (are 0.9-confidence fields right 90% of the time?).\n- **Compliance:** PII handling, audit log of every decision with model version, explainability for denials, data residency.\n\n<\/details>\n\n## Drill 5: Multi-tenant RAG platform (B2B SaaS)\n\n*Each customer company uploads its own documents and gets a chat assistant. 2,000 tenants, from 100 to 5M documents each.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Isolation:** namespace per tenant (or RLS on shared tables for small tenants, dedicated indexes for large ones). Tenant ID from auth, enforced at the storage layer.\n- **Noisy neighbours:** per-tenant ingestion queues and rate limits; per-tenant model token budgets; fair scheduling.\n- **Sharding:** by tenant; large tenants get dedicated shards; small tenants packed.\n- **Customisation:** per-tenant prompts and settings stored as versioned config; per-tenant eval sets for top customers.\n- **Cost attribution:** tokens, storage, and compute per tenant; pricing tiers map to models and limits.\n- **Failure modes:** cross-tenant cache hits, embedding model migration across 2,000 tenants (blue/green per tenant, gradual), one tenant's malicious documents attempting injection (no cross-tenant tools; outputs scoped).\n\n<\/details>\n\n## Drill 6: Research agent that writes reports from the web\n\n*Users ask open-ended questions (\"compare battery chemistries for grid storage\"); the agent searches, reads, and writes a cited 2,000-word report in under 10 minutes.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Multi-agent is justified:** orchestrator plans sub-questions; parallel sub-agents search and read (context isolation for large pages); orchestrator synthesises; a citation checker verifies each claim against sources.\n- **Delegation quality:** explicit sub-task specs with output format and scope; effort scaling by question complexity.\n- **Async UX:** job with progress events over SSE; resumable.\n- **Security:** web content is untrusted; sub-agents have read-only tools; no private data in this flow, so the trifecta lacks private data (keep it that way: do not add user document access without isolation).\n- **Evals:** rubric-based judges for coverage, accuracy, citation faithfulness; human expert review sample; cost and time per report.\n- **Cost:** multi-agent uses many times the tokens of chat; cap sub-agents and searches per depth tier.\n\n<\/details>\n\n## Drill 7: Voice assistant for restaurant phone orders\n\n*Takes orders by phone, answers menu questions, handles modifications. Must feel natural: under 800 ms response latency.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Latency budget dominates:** streaming speech-to-text, a small fast model for dialogue, streaming text-to-speech, start speaking on first clause. Total budget: STT final ~200 ms + LLM TTFT ~300 ms + TTS first audio ~200 ms.\n- **Structure:** order state as a structured object updated by tool calls (`add_item`, `modify_item`), not free text; confirm the order by reading it back.\n- **Context:** menu in a cached prefix; keep conversation short.\n- **Failure modes:** mishearing (confirmations, spelling-sensitive items), barge-in handling, allergies (hard rules: escalate or confirm; never guess), payment (never by voice to the model; hand to secure IVR or link).\n- **Evals:** recorded call simulations with noise and accents; order accuracy (end-state), latency p95, handoff rate.\n\n<\/details>\n\n## Drill 8: Add memory to an existing chat assistant with 10M users\n\n*Users want the assistant to remember preferences and past context. Privacy and correctness are critical.*\n\n<details><summary>Solution outline<\/summary>\n\n- **Write path:** background extraction after sessions, small model, structured atomic facts with confidence and source; consolidation (add, update, skip) against existing memories; never store instructions or sensitive categories without consent.\n- **Read path:** profile summary always injected (small), plus semantic retrieval of relevant memories filtered by user ID; memory labelled as possibly outdated.\n- **Scale:** 10M users × ~50 memories × 1 KB ≈ 500 GB text + vectors; shard by user ID; most users inactive, so tiered storage.\n- **User control:** view, edit, delete memories; \"forget this\" commands; full deletion on account removal including vectors, caches, traces.\n- **Evals:** extraction precision (wrong memories are worse than none), personalization benefit via A/B on satisfaction, memory poisoning red-team.\n- **Failure modes:** stale facts, cross-user leakage (filter enforced at storage layer), creepiness (surfacing remembered facts unexpectedly).\n\n<\/details>\n"}, {"id": "glossary", "week": 7, "kind": "page", "title": "Glossary", "short": "Glossary", "summary": "Short, plain definitions of the terms used throughout the course, from ADR and goodput to KV cache and τ-bench.", "minutes": 0, "body": "\n| Term | Meaning |\n|---|---|\n| **A2A** | Agent2Agent protocol. An open protocol, now at the Linux Foundation, for one agent to discover and delegate to another agent built by a different team or vendor. MCP connects agents to tools; A2A connects agents to agents. |\n| **ADR** | Architecture decision record. A one-page note of one decision: context, options, choice, consequences, and when to revisit. |\n| **Agent** | A loop in which a model chooses actions (tool calls) based on what it observes, until it decides the task is done. |\n| **ANN** | Approximate nearest neighbour search. Finds vectors close to a query fast, trading a little accuracy. HNSW and IVF are common index types. |\n| **At-least-once delivery** | A queue guarantee that every message is delivered, possibly more than once. Requires idempotent handlers. |\n| **BM25** | A classic keyword ranking function based on term frequency and rarity. Strong on exact terms and identifiers. |\n| **Burn rate** | How fast you are consuming your error budget relative to the sustainable rate. Used for SLO alerting. |\n| **Chunked prefill** | Splitting a long prompt's prefill into pieces of a few thousand tokens and running each piece alongside other users' decode steps, so one long prompt does not freeze everyone's stream. |\n| **Circuit breaker** | A wrapper that stops calling a failing dependency for a cool-down period and uses a fallback instead. |\n| **Cohen's kappa** | Agreement between two raters corrected for chance agreement. Used to compare a judge with human labels. |\n| **Compaction** | Summarising older conversation turns to keep the context within budget. |\n| **Context engineering** | Deciding what tokens go into each model call, in what order and form: instructions, tools, memory, retrieved data, history. |\n| **Contextual retrieval** | Adding a short, model-generated description of where a chunk sits in its document before embedding and indexing it. |\n| **Continuous batching** | Scheduling at the level of each decode step, so a new request takes a slot the moment another finishes instead of waiting for the whole batch. Introduced as iteration-level scheduling in Orca; every modern serving engine does it. |\n| **Cross-encoder (reranker)** | A model that reads a query and a document together to score relevance. Accurate, too slow for first-stage search. |\n| **Dead-letter queue (DLQ)** | Where jobs go after exhausting retries, so they do not block the queue and can be inspected. |\n| **Decode** | The second phase of generation: writing the reply one token at a time, running the whole model once per token. Limited mainly by memory bandwidth; sets TPOT. |\n| **Disaggregated serving** | Running prefill and decode on separate GPU pools, shipping the KV cache between them, so each pool is sized and tuned for its own bottleneck. |\n| **Dual LLM pattern** | Separating a privileged model with tools from a quarantined model that reads untrusted content, so injected text cannot trigger actions. |\n| **Embedding** | A vector representation of text where similar meanings are close together. |\n| **Error analysis** | Reading traces, noting the first failure in each, and grouping failures into categories to prioritise work and evals. |\n| **Error budget** | The amount of unreliability an SLO allows over a period (for example 0.5% of requests in 30 days). |\n| **Expert parallelism** | Spreading the experts of an MoE model across GPUs, with the network routing each token to the GPUs that hold its chosen experts. |\n| **FP8** | An 8-bit floating-point number format. Halves weight memory against 16-bit and is natively supported on NVIDIA Hopper (H100, H200); the usual safe default for quantized serving there. |\n| **Golden signals** | Latency, traffic, errors, saturation: the core service health metrics. |\n| **Goodput** | The highest request rate a system can serve while meeting its latency targets (TTFT and TPOT). Counts only work that arrived in time, unlike raw throughput. |\n| **Groundedness** | Whether an answer's claims are supported by the provided sources. |\n| **Guardrail** | A check outside the main model call that can block, modify, or flag inputs, outputs, or tool calls. |\n| **HNSW** | Hierarchical Navigable Small World graph. The most common ANN index; fast and accurate, memory-hungry. |\n| **Hybrid search** | Combining lexical (BM25) and vector search, usually with rank fusion. |\n| **HyDE** | Hypothetical Document Embeddings. Embed a generated hypothetical answer instead of the question to improve retrieval. |\n| **Idempotency key** | A client-supplied unique key that lets a server recognise and safely deduplicate retried requests. |\n| **Indirect prompt injection** | Malicious instructions embedded in content the agent processes (web pages, emails, documents, tool results). |\n| **KV cache** | The keys and values of every earlier token, kept in GPU memory so each new token does not recompute them. Grows with every token of every live conversation; usually the largest use of memory under load. |\n| **Lethal trifecta** | Private data access + untrusted content + external communication. Together they enable data exfiltration via injection. |\n| **Little's law** | Concurrency = arrival rate × time in system. Used to size instances. |\n| **LLM-as-judge** | Using a model to grade outputs against criteria. Must be calibrated against human labels. |\n| **McNemar's test** | A statistical test on paired pass/fail results, used to decide if a version regressed on the same cases. |\n| **MCP** | Model Context Protocol. An open protocol for connecting models and agents to tools and data sources through servers. |\n| **Memory poisoning** | Getting false facts or instructions stored in an agent's long-term memory so they affect future sessions. |\n| **Model gateway** | A proxy between your application and model providers (LiteLLM, OpenRouter, Hugging Face Inference Providers, or your own) that gives one API, one set of keys, fallbacks, budgets, and logging across hosted and self-hosted models. |\n| **Model spec** | A published document in which a model developer states how its models should behave, including whose instructions win when system, developer and user disagree. OpenAI's Model Spec calls this the chain of command. |\n| **MoE** | Mixture of experts. A model with many expert sub-networks per layer, of which a router activates only a few per token. Memory follows total parameters; compute per token follows active parameters. |\n| **MRR** | Mean reciprocal rank. The average of 1/rank of the first relevant result. |\n| **nDCG** | Normalised discounted cumulative gain. A rank-aware relevance metric supporting graded relevance. |\n| **NVFP4** | NVIDIA's 4-bit floating-point format for Blackwell GPUs: 4-bit values in blocks of 16, each block with its own FP8 scale, about 4.5 bits per value in total. |\n| **OpenAI-compatible API** | The chat completions request and response format that OpenAI introduced and many others accept: Gemini, vLLM, SGLang, Ollama, OpenRouter, LiteLLM and Hugging Face Inference Providers. Switching provider is often a change of base URL, key and model name, but features such as caching and tool-call details still differ. |\n| **OpenTelemetry (OTel)** | The vendor-neutral standard for traces, metrics, and logs, with semantic conventions for GenAI. |\n| **Outbox pattern** | Writing an event to an outbox table in the same transaction as the data change, then publishing it, to avoid dual-write inconsistency. |\n| **PagedAttention** | The vLLM technique of storing the KV cache in small fixed-size blocks allocated as tokens arrive, like virtual memory pages, which cuts wasted cache memory to a few percent. |\n| **pass@k / pass^k** | Passed at least once in k trials (capability) / passed in all k trials (reliability). |\n| **pgvector** | A Postgres extension for vector storage and similarity search. |\n| **Prefill** | The first phase of generation: reading the whole prompt in one parallel pass and building its KV cache. Compute-bound; sets most of TTFT. |\n| **Prompt caching** | Provider-side reuse of a processed prompt prefix, giving cheaper and faster input tokens on repeats. |\n| **Prompt injection** | Input that causes a model to follow an attacker's instructions instead of the developer's. |\n| **Quantization** | Storing model weights (and sometimes the KV cache) in fewer bits, such as FP8, INT4 or NVFP4 instead of 16-bit, for faster decode and more memory headroom. Check quality on your own evals. |\n| **RAG** | Retrieval-augmented generation. Retrieving relevant data and putting it in the prompt so the model can use it. |\n| **Recall@k** | The fraction of relevant items that appear in the top k results. |\n| **RLS** | Row-level security. Database policies that restrict which rows a session can see, enforcing tenant isolation. |\n| **RRF** | Reciprocal rank fusion. Combines ranked lists by summing 1/(k + rank). |\n| **Semantic cache** | A cache that returns a stored answer for a sufficiently similar question. Risky for personalised or permissioned content. |\n| **Shadow mode** | Running a new version on copies of live traffic without showing or acting on its output, to compare with the current version. |\n| **SLI / SLO** | Service level indicator (what you measure) / objective (the target). |\n| **Span / trace** | A span is one timed unit of work; a trace is the tree of spans for one request. |\n| **Speculative decoding** | A small draft model (or extra heads) guesses several tokens and the large model verifies them in one pass. Same output distribution, fewer passes; helps most when the GPU is not already busy. |\n| **SSE** | Server-sent events. A simple HTTP streaming format for sending tokens to a browser. |\n| **Tail sampling** | Deciding which traces to keep after they complete, so you can keep all errors and outliers. |\n| **Tensor / pipeline parallelism** | Two ways to split a model too big for one GPU. Tensor parallelism slices every layer across GPUs that talk constantly, so it stays inside one fast node; pipeline parallelism gives each GPU a block of layers and can span nodes. |\n| **Tool calling** | The model requests a function call with structured arguments; your code executes it and returns the result. |\n| **TPOT** | Time per output token, also called inter-token latency. The steady gap between streamed tokens during decode. |\n| **TTFT** | Time to first token. How long until the user sees output begin. |\n| **Workflow** | A fixed path of LLM calls and code, where your code decides the order of steps. |\n| **τ-bench** | A benchmark for tool-using agents in customer-service domains, with simulated users and database-state grading. |\n"}, {"id": "resources", "week": 7, "kind": "page", "title": "Reading list", "short": "Reading list", "summary": "Every free resource used in the course, grouped by topic, with a note on why each one is worth your time.", "minutes": 0, "body": "\nAll links are free to read. Starred items (★) are the ones to read if you only have time for a few. The course is provider-neutral: where one vendor has a good guide, the equivalent from other providers and from the open-model world sits next to it, so you can learn on whichever stack you use.\n\n## Other free courses worth taking alongside this one\n\n- [LLM Zoomcamp](https://github.com/DataTalksClub/llm-zoomcamp), DataTalks.Club. 10 weeks, video lectures, graded homework in cohorts, strong on RAG, evaluation, and monitoring.\n- [Production Agentic RAG course](https://github.com/jamwithai/production-agentic-rag-course), Jam with AI. A 7-week build of an arXiv research assistant with a tagged code release per week: BM25 first, then hybrid search, Langfuse, caching, and LangGraph agentic RAG. Weekly write-ups on [the Jam with AI Substack](https://jamwithai.substack.com/).\n- [Anthropic Academy](https://anthropic.skilljar.com/) and [Anthropic's course notebooks](https://github.com/anthropics/courses): the Claude API, tool use, MCP, and agent skills.\n- [5-Day AI Agents Intensive](https://www.kaggle.com/learn-guide/5-day-agents) and [5-Day Gen AI Intensive](https://www.kaggle.com/learn-guide/5-day-genai), Google and Kaggle. Self-paced guides that pair Google whitepapers with notebooks; the agents run (November 2025) drew over 1.5 million learners ([Google's recap](https://blog.google/technology/developers/ai-agents-intensive-recap/)).\n- [AI Agents for Beginners](https://github.com/microsoft/ai-agents-for-beginners), Microsoft. 18 open (MIT) lessons from tool use and agentic RAG to memory, protocols, production and security; its samples need an Azure account. The companion [Generative AI for Beginners](https://github.com/microsoft/generative-ai-for-beginners) has 21 lessons on the basics.\n- [Hugging Face Agents Course](https://huggingface.co/learn/agents-course), the best free route to agents on open-weights models, with smolagents, LangGraph and LlamaIndex units.\n- [OpenAI Cookbook](https://developers.openai.com/cookbook), runnable notebooks for tool calling, evals, retrieval and agents.\n- [LLM Twin course](https://github.com/decodingai-magazine/llm-twin-course), Decoding AI, and the companion [LLM Engineer's Handbook code](https://github.com/PacktPublishing/LLM-Engineers-Handbook): end-to-end LLMOps on AWS.\n- [Gaurav Sen's YouTube channel](https://www.youtube.com/@gkcs): short videos on AI system design topics such as multi-agent failures, chatbot latency, long context windows, and speculative decoding. His [AI Engineering course](https://interviewready.io/course-page/ai-engineering) on InterviewReady ($55) covers LLM internals, optimisations, and reasoning.\n- [Krish Naik's Agentic AI roadmap](https://github.com/krishnaik06/Roadmap-To-Learn-Agentic-AI): free YouTube playlists for LangChain, LangGraph, MCP, CrewAI, and AutoGen. Strongest for breadth across frameworks.\n- [LangChain Academy](https://academy.langchain.com/) for LangGraph, and [DeepLearning.AI short courses](https://www.deeplearning.ai/short-courses/) for one-to-two-hour introductions to specific tools.\n\n## Foundations\n\n- ★ [Intro to Large Language Models](https://www.youtube.com/watch?v=zjkBMFhNj_g), Andrej Karpathy. One hour, the best mental model of what an LLM is.\n- ★ [Building A Generative AI Platform](https://huyenchip.com/2024/07/25/genai-platform.html), Chip Huyen. A reference architecture for everything in this course.\n- [AI Engineering book resources](https://github.com/chiphuyen/aie-book), Chip Huyen's companion repo.\n- ★ [What We Learned from a Year of Building with LLMs](https://applied-llms.org/), practitioners' lessons across tactics, operations, and strategy.\n- [Patterns for Building LLM-based Systems & Products](https://eugeneyan.com/writing/llm-patterns/), Eugene Yan.\n- [Emerging Patterns in Building GenAI Products](https://martinfowler.com/articles/gen-ai-patterns/), martinfowler.com.\n- [LLM Course](https://github.com/mlabonne/llm-course), Maxime Labonne. A roadmap for deeper ML background.\n- [System Design Primer](https://github.com/donnemartin/system-design-primer), for general distributed systems design.\n\n## Agents and context\n\n- ★ [Building effective agents](https://www.anthropic.com/engineering/building-effective-agents), Anthropic.\n- [How we built our multi-agent research system](https://www.anthropic.com/engineering/multi-agent-research-system), Anthropic.\n- [Don't build multi-agents](https://cognition.ai/blog/dont-build-multi-agents), Cognition.\n- ★ [Effective context engineering for AI agents](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents), Anthropic.\n- [Writing effective tools for agents](https://www.anthropic.com/engineering/writing-tools-for-agents), Anthropic.\n- [Context Engineering for Agents](https://rlancemartin.github.io/2025/06/23/context_engineering/), Lance Martin.\n- [The New Skill in AI is Context Engineering](https://www.philschmid.de/context-engineering), Philipp Schmid.\n- [Context Rot](https://www.trychroma.com/research/context-rot), Chroma research.\n- [12-factor agents](https://github.com/humanlayer/12-factor-agents), HumanLayer.\n- [LLM Powered Autonomous Agents](https://lilianweng.github.io/posts/2023-06-23-agent/), Lilian Weng.\n- [ReAct](https://arxiv.org/abs/2210.03629), [MemGPT](https://arxiv.org/abs/2310.08560), [Generative Agents](https://arxiv.org/abs/2304.03442), [CoALA](https://arxiv.org/abs/2309.02427): foundational papers.\n- [LangGraph memory overview](https://docs.langchain.com/oss/python/langgraph/memory).\n- Open-source memory layers to study: [Mem0](https://github.com/mem0ai/mem0), [Letta](https://github.com/letta-ai/letta), [Graphiti](https://github.com/getzep/graphiti).\n- ★ [A practical guide to building agents](https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf), OpenAI. 34 pages on when an agent is worth it, single agent before multi-agent, and guardrails as layered defence. Read it next to Anthropic's essay: they agree.\n- [Why Do Multi-Agent LLM Systems Fail?](https://arxiv.org/abs/2503.13657), the MAST taxonomy: 14 failure modes from 1,600+ annotated traces, a ready-made checklist for reading multi-agent traces.\n\n## Retrieval\n\n- ★ [Contextual Retrieval](https://www.anthropic.com/engineering/contextual-retrieval), Anthropic.\n- ★ [Systematically Improving Your RAG](https://jxnl.co/writing/2024/05/22/systematically-improving-your-rag/), Jason Liu.\n- [pgvector](https://github.com/pgvector/pgvector) and [pgvector-python](https://github.com/pgvector/pgvector-python).\n- [HNSW explained](https://www.pinecone.io/learn/series/faiss/hnsw/), Pinecone, and the [HNSW paper](https://arxiv.org/abs/1603.09320).\n- [Hybrid search explained](https://weaviate.io/blog/hybrid-search-explained), Weaviate.\n- [Reciprocal Rank Fusion](https://plg.uwaterloo.ca/~gvcormac/cormacksigir09-rrf.pdf), the original paper.\n- [Retrieve and re-rank](https://sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html), Sentence-Transformers.\n- [MTEB leaderboard](https://huggingface.co/spaces/mteb/leaderboard) for embedding models.\n- [Qdrant filtering](https://qdrant.tech/documentation/concepts/filtering/) and [Postgres full-text search](https://www.postgresql.org/docs/current/textsearch.html).\n- [Docling](https://github.com/docling-project/docling) for document parsing.\n- Papers: [RAG](https://arxiv.org/abs/2005.11401), [Lost in the Middle](https://arxiv.org/abs/2307.03172), [HyDE](https://arxiv.org/abs/2212.10496), [RAPTOR](https://arxiv.org/abs/2401.18059), [ColBERT](https://arxiv.org/abs/2004.12832), [RAG survey](https://arxiv.org/abs/2312.10997), [Financial report chunking](https://arxiv.org/abs/2402.05131).\n- Authorization: [OpenFGA](https://openfga.dev/) and the [Zanzibar paper](https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/).\n\n## Evals\n\n- ★ [Your AI Product Needs Evals](https://hamel.dev/blog/posts/evals/), Hamel Husain.\n- ★ [AI Evals FAQ](https://hamel.dev/blog/posts/evals-faq/), Hamel Husain and Shreya Shankar.\n- [Creating a LLM-as-a-Judge That Drives Business Results](https://hamel.dev/blog/posts/llm-judge/), Hamel Husain.\n- [Evaluating the Effectiveness of LLM-Evaluators](https://eugeneyan.com/writing/llm-evaluators/), Eugene Yan.\n- ★ [Demystifying evals for AI agents](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents), Anthropic.\n- Papers: [τ-bench](https://arxiv.org/abs/2406.12045), [Judging LLM-as-a-Judge](https://arxiv.org/abs/2306.05685), [Who Validates the Validators?](https://arxiv.org/abs/2404.12272), [RAGAS](https://arxiv.org/abs/2309.15217), [AgentBench](https://arxiv.org/abs/2308.03688).\n- Tools: [promptfoo](https://github.com/promptfoo/promptfoo), [Inspect](https://inspect.aisi.org.uk/), [DeepEval](https://github.com/confident-ai/deepeval), [RAGAS](https://docs.ragas.io/), [τ-bench code](https://github.com/sierra-research/tau-bench), [OpenAI evals](https://github.com/openai/evals).\n\n## Security\n\n- ★ [The lethal trifecta](https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/), Simon Willison, and his [prompt injection series](https://simonwillison.net/series/prompt-injection/).\n- [The Dual LLM pattern](https://simonwillison.net/2023/Apr/25/dual-llm-pattern/), Simon Willison.\n- ★ [Design Patterns for Securing LLM Agents against Prompt Injections](https://arxiv.org/abs/2506.08837).\n- [Defeating Prompt Injections by Design (CaMeL)](https://arxiv.org/abs/2503.18813).\n- [Indirect prompt injection](https://arxiv.org/abs/2302.12173), Greshake et al.\n- [OWASP Top 10 for LLM Applications](https://genai.owasp.org/llm-top-10/) and [OWASP API Security Top 10](https://owasp.org/API-Security/).\n- [MCP security best practices](https://modelcontextprotocol.io/specification/2026-07-28/basic/security_best_practices).\n- [Adversarial attacks on LLMs](https://lilianweng.github.io/posts/2023-10-25-adv-attack-llm/), Lilian Weng.\n- [Embrace The Red](https://embracethered.com/blog/), real-world AI exploit write-ups.\n- [MITRE ATLAS](https://atlas.mitre.org/), adversarial technique catalogue.\n- Tools: [AgentDojo](https://github.com/ethz-spylab/agentdojo), [garak](https://github.com/NVIDIA/garak), [PyRIT](https://github.com/Azure/PyRIT), [promptfoo red teaming](https://www.promptfoo.dev/docs/red-team/), [Presidio](https://microsoft.github.io/presidio/), [NeMo Guardrails](https://github.com/NVIDIA/NeMo-Guardrails), [Guardrails AI](https://github.com/guardrails-ai/guardrails).\n- ★ [Purple Llama](https://github.com/meta-llama/PurpleLlama), Meta's open trust and safety tools, which work in front of any model: [Llama Guard 4](https://huggingface.co/meta-llama/Llama-Guard-4-12B) (a 12B multimodal input and output classifier on the MLCommons hazard taxonomy), [Llama Prompt Guard 2](https://huggingface.co/meta-llama/Llama-Prompt-Guard-2-86M) (86M and 22M injection and jailbreak detectors), and CyberSecEval benchmarks.\n- [OpenAI Model Spec](https://model-spec.openai.com/), how one lab says its models should rank system, developer and user instructions (the chain of command). Useful vocabulary when you design your own instruction hierarchy.\n- [NIST AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework).\n\n## Deployment and operations\n\n- [FastAPI](https://fastapi.tiangolo.com/), including [security](https://fastapi.tiangolo.com/tutorial/security/) and [Docker](https://fastapi.tiangolo.com/deployment/docker/) guides.\n- [uv with Docker](https://docs.astral.sh/uv/guides/integration/docker/) and [with GitHub Actions](https://docs.astral.sh/uv/guides/integration/github/).\n- [The Twelve-Factor App](https://12factor.net/).\n- [Docker build best practices](https://docs.docker.com/build/building/best-practices/).\n- [GitHub Actions](https://docs.github.com/en/actions) and its [security hardening guide](https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions).\n- [Cloud Run](https://cloud.google.com/run/docs), [Fly.io](https://fly.io/docs/), [Render free tier](https://render.com/docs/free), [Kubernetes autoscaling](https://kubernetes.io/docs/concepts/workloads/autoscaling/).\n- ★ [Implementing Stripe-like Idempotency Keys in Postgres](https://brandur.org/idempotency-keys), Brandur Leach.\n- [Transactional outbox](https://microservices.io/patterns/data/transactional-outbox.html).\n- [Temporal](https://docs.temporal.io/), [arq](https://arq-docs.helpmanual.io/), [RQ](https://python-rq.org/), [Celery](https://docs.celeryq.dev/).\n- [SLSA](https://slsa.dev/) for supply-chain integrity.\n- [AWS Well-Architected Generative AI Lens](https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/generative-ai-lens.html).\n\n## Observability and scaling\n\n- ★ [OpenTelemetry GenAI semantic conventions](https://github.com/open-telemetry/semantic-conventions-genai/tree/main/docs/gen-ai) and [OTel Python](https://opentelemetry.io/docs/languages/python/).\n- [OpenLLMetry](https://github.com/traceloop/openllmetry), [Langfuse](https://langfuse.com/docs), [Arize Phoenix](https://github.com/Arize-ai/phoenix).\n- ★ Google SRE: [Monitoring Distributed Systems](https://sre.google/sre-book/monitoring-distributed-systems/), [Service Level Objectives](https://sre.google/sre-book/service-level-objectives/), [Alerting on SLOs](https://sre.google/workbook/alerting-on-slos/), the [full SRE book](https://sre.google/sre-book/table-of-contents/).\n- [Timeouts, retries, and backoff with jitter](https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/), Amazon Builders' Library.\n- [Circuit Breaker](https://martinfowler.com/bliki/CircuitBreaker.html), Martin Fowler.\n- Prompt caching, three ways: [Anthropic](https://platform.claude.com/docs/en/build-with-claude/prompt-caching) (marked breakpoints), [OpenAI](https://developers.openai.com/api/docs/guides/prompt-caching) (automatic, with explicit breakpoints on newer models), [Gemini](https://ai.google.dev/gemini-api/docs/caching) (implicit by default, explicit cache objects optional). Compare minimum lengths and write prices before you design your prompt order.\n- [Artificial Analysis](https://artificialanalysis.ai/) for model speed and price comparisons.\n- [Prometheus](https://prometheus.io/docs/introduction/overview/), [Grafana](https://grafana.com/docs/grafana/latest/), [Sentry](https://docs.sentry.io/).\n\n## Protocols\n\n- ★ [MCP specification](https://modelcontextprotocol.io/specification/latest) (current version 2026-07-28), the source of truth for how tools, resources and prompts reach any agent, with its own security principles.\n- [A2A specification](https://a2a-protocol.org/latest/specification/) (v1.0), for agents that delegate to agents another team or vendor runs.\n- [Code execution with MCP](https://www.anthropic.com/engineering/code-execution-with-mcp), Anthropic, on cutting tool-definition tokens by letting the agent call tools from code.\n\n## Provider docs: tool calling and agent SDKs\n\nThe same concepts, in each provider's words. Read the one you build on, and skim one other to see what is a standard and what is a vendor choice.\n\n- Tool calling: [OpenAI](https://developers.openai.com/api/docs/guides/function-calling), [Gemini](https://ai.google.dev/gemini-api/docs/function-calling), [Claude](https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview). The JSON schema shapes differ slightly; the loop is the same.\n- [OpenAI Agents SDK](https://openai.github.io/openai-agents-python/): agents, handoffs, guardrails, sessions and tracing in a small API, with adapters (LiteLLM, Any-LLM) for non-OpenAI models.\n- [Google Agent Development Kit (ADK)](https://adk.dev/): open-source, in Python, TypeScript, Go, Java and Kotlin, works with Gemini and other models, with built-in evaluation and user simulation.\n- [Microsoft Foundry Agent Service](https://learn.microsoft.com/en-us/azure/foundry/agents/overview): a managed runtime for prompt agents or your own containerised agent (Agent Framework, LangGraph, OpenAI or Anthropic SDKs), with tracing, evaluation and A2A endpoints. A good map of what \"managed agents\" means.\n- [Claude cookbooks](https://github.com/anthropics/claude-cookbooks) and the [OpenAI Cookbook](https://developers.openai.com/cookbook): worked notebooks per provider.\n- [Gemini's OpenAI compatibility](https://ai.google.dev/gemini-api/docs/openai): call Gemini with the OpenAI client by changing the base URL, a concrete example of the OpenAI-compatible API.\n- Other frameworks to compare: [Pydantic AI](https://github.com/pydantic/pydantic-ai), [smolagents](https://huggingface.co/docs/smolagents/index) (Hugging Face; code-writing agents, any model through Inference Providers, LiteLLM, Transformers or Ollama), [LlamaIndex](https://docs.llamaindex.ai/en/stable/).\n\n## Open models, serving, and gateways\n\n- ★ [vLLM OpenAI-compatible server](https://docs.vllm.ai/en/latest/serving/online_serving/): `vllm serve <model>` gives Llama, Qwen, DeepSeek or Mistral weights the same chat, Responses and embeddings endpoints your app already calls.\n- [SGLang](https://docs.sglang.io/), high-throughput serving with RadixAttention prefix caching, used for large MoE deployments.\n- [Ollama](https://ollama.com/) and its [OpenAI compatibility](https://docs.ollama.com/api/openai-compatibility) (`http://localhost:11434/v1`): the quickest way to run an open model on a laptop for development and evals.\n- [OGX](https://github.com/ogx-ai/ogx), formerly Meta's Llama Stack: an open-source, OpenAI-compatible server that adds vector stores, files, tool calling and agent orchestration on top of pluggable model providers.\n- [Hugging Face Inference Providers](https://huggingface.co/docs/inference-providers/index): open-weights models on many hosts (Groq, Together, Cerebras, Fireworks and others) behind one token and an OpenAI-compatible router, with `:fastest` and `:cheapest` selection.\n- [OpenRouter](https://openrouter.ai/docs/quickstart): hundreds of hosted and open models through one OpenAI-compatible endpoint, with automatic fallbacks.\n- [LiteLLM](https://docs.litellm.ai/docs/): a self-hosted gateway over 100+ providers in the OpenAI format, with retries, fallbacks, virtual keys, budgets and spend tracking per team.\n- Inference background: [Optimizing your LLM in production](https://huggingface.co/blog/optimize-llm), [PagedAttention](https://arxiv.org/abs/2309.06180), [speculative decoding](https://arxiv.org/abs/2211.17192), and this course's [inference lesson](#w5-inference).\n"}];

/* ---------- Markdown ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TICK = '<svg viewBox="0 0 21 18" aria-hidden="true"><path d="M3 10 L8.5 15 L19 2"/></svg>';
const tickBox = (on, draw) => `<i class="tick${draw ? " draw" : ""}" aria-hidden="true">${on ? TICK : ""}</i>`;
let quizCount = 0, figCount = 0, figPrefix = "";
const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  lang = (lang || "").trim();
  if (lang === "mermaid") {
    figCount++;
    return `<figure class="fig" id="fig-${figPrefix}${figCount}"><div class="mmd" data-src="${esc(code)}">${esc(code)}</div><figcaption><b>Fig. ${figPrefix}${figCount}</b></figcaption></figure>`;
  }
  if (lang === "viz") {
    figCount++;
    const lines = code.split("\n");
    const cap = /^caption:/i.test(lines[0]) ? lines.shift().replace(/^caption:\s*/i, "") : "";
    return `<figure class="fig" id="fig-${figPrefix}${figCount}"><div class="viz">${lines.join("\n")}</div><figcaption><b>Fig. ${figPrefix}${figCount}</b>${cap ? " " + marked.parseInline(cap) : ""}</figcaption></figure>`;
  }
  if (lang === "widget") {
    let spec; try { spec = JSON.parse(code); } catch { return `<pre>${esc(code)}</pre>`; }
    return `<div class="widget" data-spec="${esc(JSON.stringify(spec))}"></div>`;
  }
  if (lang === "quiz") {
    let items; try { items = JSON.parse(code); } catch { return `<pre>${esc(code)}</pre>`; }
    const id = "quiz" + (quizCount++);
    const qs = items.map((it, i) => `<div class="q" data-answer="${it.answer}" data-why="${esc(it.why || "")}">
      <p>${i + 1}. ${marked.parseInline(it.q)}</p>

/* ---------- Calculators ---------- */
const fmt = (n, d = 0) => Number.isFinite(n) ? n.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d }) : "n/a";
const WIDGETS = {
  kv: {
    title: "KV cache calculator",
    presets: {
      "Llama 3 70B, BF16, 2 x 80 GB": { layers: 80, kvheads: 8, dim: 128, bytes: 2, ctx: 8192, gpu: 160, weights: 141 },
      "Same model without GQA (64 KV heads)": { layers: 80, kvheads: 64, dim: 128, bytes: 2, ctx: 8192, gpu: 160, weights: 141 },
      "Llama 3 8B, BF16, 1 x 80 GB": { layers: 32, kvheads: 8, dim: 128, bytes: 2, ctx: 8192, gpu: 80, weights: 16 },
      "Llama 3 8B, FP8 KV cache": { layers: 32, kvheads: 8, dim: 128, bytes: 1, ctx: 8192, gpu: 80, weights: 16 },
    },
    fields: [["layers", "Layers"], ["kvheads", "KV heads"], ["dim", "Head dimension"], ["bytes", "Bytes per value"], ["ctx", "Tokens per conversation"], ["gpu", "GPU memory, GB"], ["weights", "Weights, GB"]],
    calc(v) {
      const perTok = 2 * v.layers * v.kvheads * v.dim * v.bytes; // keys and values
      const perConv = perTok * v.ctx / 1e9;
      const free = v.gpu * 0.9 - v.weights; // keep about 10% for activations and the runtime
      const fit = Math.max(0, Math.floor(free / perConv));
      return {
        out: [["Per token", `${fmt(perTok / 1024)} KB`], ["Per conversation", `${fmt(perConv, 2)} GB`], ["Memory left for KV", `${fmt(Math.max(0, free))} GB`], ["Conversations at once", fmt(fit), fit > 0 ? "ok" : "bad"]],
        meter: Math.min(1, v.weights / (v.gpu * 0.9)),
        note: `2 (keys and values) x ${v.layers} layers x ${v.kvheads} KV heads x ${v.dim} dims x ${v.bytes} bytes = ${fmt(perTok)} bytes per token. The bar shows weights as a share of usable memory; the rest holds KV cache, so every long conversation pushes out others.`,
      };
    },
  },
  cost: {
    title: "Cost per million tokens",
    presets: {
      "DeepSeek decode node (8 x H800 at $2/h, 14.8k tok/s)": { price: 2, gpus: 8, tps: 14800, util: 100 },
      "Same node at a realistic 40% utilisation": { price: 2, gpus: 8, tps: 14800, util: 40 },
      "One rented GPU, small model, light traffic": { price: 2.5, gpus: 1, tps: 1500, util: 25 },
    },
    fields: [["price", "Price per GPU-hour, $"], ["gpus", "GPUs"], ["tps", "Output tokens/s when busy"], ["util", "Busy share of the hour, %"]],
    calc(v) {
      const perHour = v.price * v.gpus, tokens = v.tps * 3600 * (v.util / 100);
      const per1m = perHour / (tokens / 1e6);
      return {
        out: [["Cost per hour", `$${fmt(perHour, 2)}`], ["Tokens per hour", `${fmt(tokens / 1e6, 1)} M`], ["Per 1M output tokens", `$${fmt(per1m, 2)}`]],
        meter: Math.min(1, v.util / 100), meterClass: "c",
        note: "Divide what the GPUs cost per hour by the millions of tokens they produce in that hour. Idle time is the hidden multiplier: the same hardware at 40% busy costs 2.5 times as much per token. Prefill capacity, redundancy and people are extra.",
      };
    },
  },
  batch: {
    title: "Batch size against wait per user",
    presets: { "8B model, BF16, one H100-class GPU (3.35 TB/s)": { batch: 16, weights: 16, kvgb: 1, bw: 3.35, slo: 30 } },
    fields: [["batch", "Users per step", "range", 1, 256], ["weights", "Weights, GB"], ["kvgb", "KV cache per user, GB"], ["bw", "Memory bandwidth, TB/s"], ["slo", "Target tokens/s per user"]],
    calc(v) {
      const step = (v.weights + v.batch * v.kvgb) / (v.bw * 1000); // seconds: each decode step reads weights + every user's cache
      const perUser = 1 / step, total = v.batch / step;
      const ok = perUser >= v.slo;
      let best = 1;
      for (let b = 1; b <= 512; b++) if (1 / ((v.weights + b * v.kvgb) / (v.bw * 1000)) >= v.slo) best = b;
      return {
        out: [["Step time", `${fmt(step * 1000, 1)} ms`], ["Tokens/s per user", fmt(perUser), ok ? "ok" : "bad"], ["Tokens/s, whole GPU", fmt(total)], ["Goodput", ok ? `${fmt(total)} tok/s` : "0: all too slow", ok ? "ok" : "bad"], ["Largest batch on target", fmt(best)]],
        meter: Math.min(1, v.batch / 256),
        note: "A bandwidth-only model of decode: every step reads all weights once plus each user's KV cache. More users per step multiply total throughput but slow every user. Goodput counts only tokens served within the per-user target, so the best batch is the largest one that still meets it.",
      };
    },
  },
};

    qz.querySelectorAll(".q").forEach(q => q.addEventListener("click", ev => {
      const btn = ev.target.closest(".opt"); if (!btn || btn.disabled) return;
      const ans = +q.dataset.answer, pick = +btn.dataset.i;
      q.querySelectorAll(".opt").forEach((o, i) => {
        o.disabled = true;
        if (i === ans) { o.classList.add("right"); o.querySelector(".tick").outerHTML = tickBox(true, true); }
      });
      if (pick !== ans) btn.classList.add("wrong"); else right++;
      answered++;
      const why = document.createElement("div"); why.className = "why";
      why.innerHTML = (pick === ans ? "<strong>Correct.</strong> " : "<strong>Not quite.</strong> ") + marked.parseInline(q.dataset.why);
      q.appendChild(why);
      qz.querySelector("[data-score]").textContent = answered === total ? `${right} of ${total} correct` : `${answered} of ${total} answered`;
    }));
  });
  const doneBtn = root.querySelector("#doneBtn");
  if (doneBtn) doneBtn.addEventListener("click", () => {
    if (done.has(e.id)) { done.delete(e.id); justTicked = null; } else { done.add(e.id); justTicked = e.id; }
    store.set("aisd.done", [...done]);
    const y = scrollY; route(); scrollTo(0, y);
    document.getElementById("doneBtn")?.focus({ preventScroll: true });
    justTicked = null;
  });
  drawDiagrams(root);
  drawSketches(root);
  mountWidgets(root);
}

function route() {
  const id = (location.hash || "#home").slice(1);
  const main = document.getElementById("main");
  const e = byId[id];
  main.innerHTML = e ? renderEntry(e) : renderHome();
  if (e) enhance(main, e);
  else drawSketches(main);
  renderNav(e ? e.id : null);
  document.title = e ? `${e.title} · AI System Design` : "AI System Design";
  closeMenu();
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

/* ---------- Search ---------- */
const plain = COURSE.map(e => ({ e, text: (e.title + " " + e.body).toLowerCase() }));
const qInput = document.getElementById("q");
qInput.addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase();
  const out = document.getElementById("results"), nav = document.getElementById("navWrap");
  if (q.length < 2) { out.hidden = true; nav.hidden = false; return; }
  const terms = q.split(/\s+/);
  const hits = plain.filter(p => terms.every(t => p.text.includes(t))).slice(0, 12);
  out.innerHTML = hits.length ? hits.map(({ e, text }) => {
    const i = text.indexOf(terms[0]);
    const snip = e.body.slice(Math.max(0, i - 50), i + 90).replace(/[#*`>\[\]]/g, "").replace(/\s+/g, " ");
    return `<li><a href="#${e.id}">${sheetNo[e.id] ? `${sheetNo[e.id]} · ` : ""}${esc(e.title)}<small>…${esc(snip)}…</small></a></li>`;
  }).join("") : `<li class="empty">Nothing matches “${esc(q)}”. Try a shorter term such as “cache” or “judge”.</li>`;
  out.hidden = false; nav.hidden = true;
});
document.getElementById("results").addEventListener("click", () => { qInput.value = ""; document.getElementById("results").hidden = true; document.getElementById("navWrap").hidden = false; });

/* ---------- Theme, menu, reset ---------- */
const themes = ["system", "light", "dark"];
function applyTheme(t) {
  if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  document.getElementById("themeBtn").textContent = "Theme: " + t;
}
let theme = store.get("aisd.theme", "system"); applyTheme(theme);
document.getElementById("themeBtn").addEventListener("click", () => {
  theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set("aisd.theme", theme); applyTheme(theme); route();
});
let armed = false;
document.getElementById("resetBtn").addEventListener("click", ev => {
  if (!armed) { armed = true; ev.target.textContent = "Click again to reset"; setTimeout(() => { armed = false; ev.target.textContent = "Reset progress"; }, 3000); return; }
  done = new Set(); store.set("aisd.done", []); armed = false; ev.target.textContent = "Progress reset"; route();
});
const app = document.getElementById("app"), scrim = document.getElementById("scrim"), menuBtn = document.getElementById("menuBtn");
function closeMenu() { const was = app.classList.contains("open"); app.classList.remove("open"); scrim.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); if (was) menuBtn.focus(); }
menuBtn.addEventListener("click", () => { app.classList.add("open"); scrim.hidden = false; menuBtn.setAttribute("aria-expanded", "true"); qInput.focus(); });
scrim.addEventListener("click", closeMenu);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeMenu(); if (ev.key === "/" && document.activeElement !== qInput) { ev.preventDefault(); qInput.focus(); } });

route();
</script>
