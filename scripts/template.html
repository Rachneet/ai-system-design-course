<title>AI System Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: a quiet index rail and a white page with one centered column that text, figures, tables and code
   share, so every edge lines up. One family (Inter), soft fills instead of frames, one accent colour.
   The lesson outline lives in the rail under the current lesson. See DESIGN.md, "Reading principles". */
:root {
  --pad: #f7f8fa;          /* the index rail */
  --pad-line: #e3e5e9;
  --pad-major: #b9bec7;
  --sheet: #ffffff;        /* the reading sheet */
  --box: #f4f6f8;          /* soft fills: code, callouts, quiz */
  --ink: #1b1f24;
  --ink-2: #57606a;        /* secondary text, AA on white */
  --rule: #e4e7eb;         /* hairlines */
  --pen: #1f4f9c;          /* blue ballpoint: links and marks */
  --pen-soft: #dbe5f4;
  --red: #b8352a;          /* reserved: you are here, and the single next action */

  --code-key: #1f4f9c;
  --code-str: #1d6b3a;
  --code-com: #5f6672;
  --code-num: #8a4b12;
  /* Diagram inks: one meaning each, the same in every figure. */
  --vz-compute: #2a5db0;   /* compute, prefill, the work */
  --vz-memory: #6c4aa6;    /* memory, decode, storage */
  --vz-good: #23784a;      /* a win: met the target, cache hit */
  --vz-warn: #a8650f;      /* a cost: KV cache, network, attention */
  --vz-bad: #b3362b;       /* waste, failure, a miss */
  --font-hand: "Kalam", "Comic Neue", "Segoe Print", cursive;
  --font-display: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; /* one family for everything */
  --font-read: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --cell: 18px;
  --rail: 304px;
  /* One column for everything (owner's choice): text, figures, tables and code share both edges. Type grows with
     the screen and the column is measured in ems, so a full line stays about 90 characters at every width. */
  --fs: clamp(17px, 0.55vw + 10.5px, 21px);
  --col: calc(var(--fs) * 44);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pad: #0d0f12; --pad-line: #1c1f24; --pad-major: #4a505b; --sheet: #16181c; --box: #1e2126;
    --ink: #eceef1; --ink-2: #b0b6c0; --rule: #2e323a; --pen: #93b4ef; --pen-soft: #22324c;
    --red: #f07a6a; --code-key: #93b4ef; --code-str: #9fd3a8; --code-com: #8a919c; --code-num: #e3b07a; --vz-compute: #8db2f2; --vz-memory: #c0a6f0; --vz-good: #7fcf9f; --vz-warn: #e8b464; --vz-bad: #f08a7e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pad: #0d0f12; --pad-line: #1c1f24; --pad-major: #4a505b; --sheet: #16181c; --box: #1e2126;
  --ink: #eceef1; --ink-2: #b0b6c0; --rule: #2e323a; --pen: #93b4ef; --pen-soft: #22324c;
  --red: #f07a6a; --code-key: #93b4ef; --code-str: #9fd3a8; --code-com: #8a919c; --code-num: #e3b07a; --vz-compute: #8db2f2; --vz-memory: #c0a6f0; --vz-good: #7fcf9f; --vz-warn: #e8b464; --vz-bad: #f08a7e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--sheet); color: var(--ink); }
body { margin: 0; font-family: var(--font-read); font-size: var(--fs); line-height: 1.7; font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; font-optical-sizing: auto; }
::selection { background: var(--pen-soft); color: var(--ink); }
input, textarea { caret-color: var(--red); }
a { color: var(--pen); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--pad-major) transparent; }


.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }

/* ---------- Index rail ---------- */
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
  padding-block: 22px 40px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px;
  font-family: var(--font-display); font-size: 14px; line-height: 1.4; border-right: 1px solid var(--rule); background: var(--pad);
  scrollbar-width: thin; scrollbar-color: var(--ink-2) var(--sheet);
  overscroll-behavior: contain; /* reaching the end of the index must not scroll the lesson behind it */
}
/* A solid track so the scroll position is easy to see. */
.rail::-webkit-scrollbar { width: 10px; }
.rail::-webkit-scrollbar-track { background: var(--sheet); border-left: 1px solid var(--rule); }
.rail::-webkit-scrollbar-thumb { background: var(--ink-2); border: 2px solid var(--sheet); }
.rail::-webkit-scrollbar-thumb:hover { background: var(--ink); }
.rail-head { position: sticky; top: -22px; z-index: 1; margin: -22px -18px 0; padding: 22px 18px 12px; background: var(--pad); border-bottom: 1px solid var(--rule); } /* search and progress stay in reach */
.pad-title { display: block; text-decoration: none; color: var(--ink); padding: 2px 2px 4px; }
.pad-title b { display: block; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; line-height: 1.2; }
.pad-title span { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink-2); }
.search-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.search { width: 100%; margin-top: 16px; padding: 8px 11px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); color: var(--ink); font: 14px var(--font-display); }
.search::placeholder { color: var(--ink-2); }
.tally { margin-top: 10px; display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-2); padding: 0 2px; }
.tally b { font-size: 13px; color: var(--ink-2); font-weight: 500; font-variant-numeric: tabular-nums; }
#navWrap { margin-top: 14px; }
.track-label { margin: 22px 8px 2px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.group { margin-top: 2px; }
.group > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 22px 1fr auto 10px; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 6px; }
.group > summary::-webkit-details-marker { display: none; }
.group > summary:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.group > summary::after { content: ""; width: 5px; height: 5px; border: solid var(--ink-2); border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(45deg); transition: transform .15s; }
.group[open] > summary::after { transform: translateY(1px) rotate(-135deg); }
.group-head b { font-weight: 600; font-size: 14px; color: var(--ink); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group-head .no { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.group-head small { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nav { list-style: none; margin: 0 0 8px 30px; padding: 0; } /* lessons sit under the week title, one step in from the week number */
.nav a { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; padding: 4px 8px; color: var(--ink); text-decoration: none; border-radius: 6px; font-size: 13.5px; line-height: 1.4; }
.nav a:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.nav .no { font-size: 12px; color: var(--ink-2); padding-top: 1px; font-variant-numeric: tabular-nums; }
.nav .no.ok svg { width: 13px; height: 11px; overflow: visible; }
.nav .no.ok path { fill: none; stroke: var(--pen); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.nav .no .ref { margin-top: 0; }
.toc { list-style: none; margin: 2px 0 10px 27px; padding: 0 0 0 10px; border-left: 1px solid var(--rule); } /* text lines up with lesson titles */
.toc a { display: block; padding: 3px 0; font-size: 13px; line-height: 1.3; color: var(--ink-2); text-decoration: none; }
.toc a:hover { color: var(--ink); text-decoration: underline; text-decoration-color: var(--pen); }
.toc { position: relative; }
.toc a.on { color: var(--ink); } /* colour only: the marker shows position, nothing reflows */
.toc-mark { position: absolute; left: -1.5px; top: 0; width: 2px; background: var(--pen); opacity: 0; transition: transform .22s cubic-bezier(.2,.7,.2,1), height .22s cubic-bezier(.2,.7,.2,1), opacity .15s; pointer-events: none; }
.toc-mark.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toc-mark { transition: none; } }
.nav a[aria-current="page"] { background: var(--sheet); box-shadow: 0 0 0 1px var(--rule); }
.nav a[aria-current="page"] .no { color: var(--red); font-weight: 600; }
.nav a[aria-current="page"] .t { font-weight: 600; }
.nav .lab-tag, .sheets .lab-tag { font-size: 11px; color: var(--ink-2); background: color-mix(in srgb, var(--ink) 6%, transparent); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }

/* Tick boxes: state is the mark, never colour alone. */
.ref { display: inline-block; width: 14px; height: 14px; margin-top: 3px; }
.ref svg { display: block; width: 14px; height: 14px; }
.ref path { fill: none; stroke: var(--ink-2); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.tick { position: relative; display: inline-block; width: 14px; height: 14px; border: 1.25px solid var(--ink-2); border-radius: 3px; margin-top: 3px; background: var(--sheet); flex: none; }
.tick svg { position: absolute; inset: -4px -5px -2px -1px; width: 21px; height: 18px; overflow: visible; }
.tick path { fill: none; stroke: var(--pen); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.tick.draw path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: pen 420ms cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes pen { to { stroke-dashoffset: 0; } }

.results { list-style: none; padding: 0; margin: 12px 0 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.results a { display: block; padding: 9px 10px; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); }
.results li:last-child a { border-bottom: 0; }
.results a:hover { background: var(--box); }
.results small { display: block; color: var(--ink-2); font-family: var(--font-read); font-size: 13.5px; margin-top: 2px; }
.results .empty { padding: 10px; color: var(--ink-2); font-size: 13.5px; }
.rail-foot { margin-top: 26px; display: flex; gap: 8px; flex-wrap: wrap; }
.tool { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); padding: 5px 10px; font: 500 12.5px var(--font-display); cursor: pointer; border-radius: 6px; }
.tool:hover { background: var(--box); }

/* ---------- Sheet ---------- */
.topbar { display: none; }
main { min-width: 0; padding-block: 40px 96px; padding-left: max(28px, calc((100vw - var(--rail) - var(--col)) / 2), env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.sheet { max-width: var(--col); margin: 0; background: var(--sheet); } /* centred beside the index by main's padding */
.sheet-body { padding: 8px 0 0; }
/* One centered column, about 75 characters wide, shared by text and figures so every edge lines up. */
article { min-width: 0; }
.meta { margin: 0 0 14px; font-size: 13.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 0; }
.meta span { white-space: nowrap; }
@media (max-width: 640px) { .meta { gap: 2px 14px; } .meta span + span::before { content: none; } } /* no dot can start a wrapped line */
.meta span + span::before { content: "\00b7"; margin: 0 9px; color: var(--rule); }
.meta a { color: var(--ink-2); }

h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(30px, 3.6vw, 40px); font-weight: 700; letter-spacing: -0.022em; margin: 0 0 14px; }
.lede { font-size: calc(var(--fs) + 2px); line-height: 1.6; color: var(--ink-2); margin: 0 0 8px; }
.body h2 { font-size: 25px; font-weight: 650; letter-spacing: -0.018em; margin: 2.4em 0 .5em; }
.body h3 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 1.9em 0 .4em; }
.body h4 { font-size: 17px; margin: 1.5em 0 .3em; }
.body ul, .body ol { padding-left: 1.3em; }
.body li { margin: .3em 0; }
.body li::marker { color: var(--ink-2); }
.body strong { font-weight: 600; }
.body hr { border: 0; border-top: 1px solid var(--rule); margin: 2.6em 0; }
.body blockquote { margin: 1.4em 0; padding: 2px 0 2px 16px; border-left: 1px solid var(--rule); color: var(--ink-2); }

code { font-family: var(--font-mono); font-size: .84em; background: var(--box); padding: .12em .36em; border-radius: 4px; }
.codewrap { position: relative; margin: 1.4em 0; }
pre { margin: 0; background: var(--box); border-radius: 10px; padding: 16px 18px; overflow-x: auto; font-size: 13.5px; line-height: 1.65; color: var(--ink); }
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-type, .hljs-literal { color: var(--code-key); }
.hljs-string, .hljs-attr, .hljs-symbol, .hljs-bullet, .hljs-addition { color: var(--code-str); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--code-com); font-style: italic; }
.hljs-number, .hljs-title, .hljs-title.function_, .hljs-section { color: var(--code-num); }
.copy { position: absolute; top: 8px; right: 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); color: var(--ink-2); font: 500 12px var(--font-display); padding: 3px 9px; cursor: pointer; opacity: .85; }
.copy:hover { background: var(--pen-soft); }

.table-wrap { overflow-x: auto; margin: 1.4em 0; }
table { border-collapse: collapse; width: 100%; font-family: var(--font-display); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px 9px 0; vertical-align: top; }
th:last-child, td:last-child { border-right: 0; }
th { font-weight: 600; font-size: 13px; color: var(--ink-2); border-bottom: 1px solid var(--rule); }
tbody tr + tr td { border-top: 1px solid var(--rule); }

/* Figures: numbered like plates, drawn in ink on the sheet. */
figure.fig { margin: 1.8em 0; }
.mmd { padding: 16px; border-radius: 10px; background: var(--sheet); border: 1px solid var(--rule); overflow-x: auto; text-align: center; font-family: var(--font-mono); font-size: 12px; white-space: pre; color: var(--ink-2); }
.mmd[data-done] { white-space: normal; }
.mmd svg { max-width: 100%; height: auto; }
figure.tall .mmd svg { max-height: 80vh; width: auto; } /* same frame width as everything else, drawing kept within a screen */
.mmd::-webkit-scrollbar { height: 8px; }
.mmd::-webkit-scrollbar-thumb { background: var(--ink-2); }
.mmd::-webkit-scrollbar-track { background: var(--box); }
figcaption { margin-top: 6px; font-family: var(--font-display); font-size: 13px; color: var(--ink-2); }
figcaption b { color: var(--ink); font-variant-numeric: tabular-nums; }
figure.scrolls figcaption::after { content: " Scroll sideways for the full figure."; }

/* Sketch figures: HTML lays them out (so they reflow on phones), rough.js draws the hand-drawn strokes on top. */
.viz { position: relative; padding: 4px 2px; background: var(--sheet); font-family: var(--font-hand); font-size: 16px; line-height: 1.3; color: var(--ink); overflow-x: auto; }
.viz.roughed { border-color: transparent; }
.viz > svg.rough { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.viz * { position: relative; z-index: 1; }
.viz h5 { margin: 0 0 8px; font: 700 17px var(--font-hand); }
.viz p, .viz .note { margin: 4px 0 0; font-size: 14.5px; color: var(--ink-2); }
.viz b { font-weight: 700; }
.vz-cols { display: grid; grid-template-columns: repeat(var(--k, 2), minmax(0, 1fr)); gap: 14px; }
.vz-panel { padding: 12px 14px; min-width: 0; }
.vz-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 6px 0; }
.ch { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; padding: 3px 9px; font-size: 15px; white-space: nowrap; }
.ch.wide { flex: 1 1 auto; }
.big { font: 700 30px/1.1 var(--font-hand); }
.big.c { color: var(--vz-compute); } .big.m { color: var(--vz-memory); } .big.g { color: var(--vz-good); } .big.w { color: var(--vz-warn); } .big.b { color: var(--vz-bad); }
.arr { display: inline-block; width: 36px; height: 16px; flex: none; }
.arr.long { width: 64px; }
.arr.d { width: 16px; height: 26px; display: block; margin: 2px auto; }
.vz-bars { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; gap: 8px 10px; align-items: center; }
.bar { height: 16px; display: block; }
.bar > i { display: block; height: 100%; width: var(--w, 50%); }
.cells { display: grid; grid-template-columns: repeat(var(--n, 8), minmax(16px, 1fr)); gap: 4px; max-width: calc(var(--n, 8) * 34px); }
.cells > i { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 13px; }
.vz-src { margin-top: 10px; font: 13px var(--font-display); color: var(--ink-2); }
.vz-src a { color: inherit; }
/* Without rough.js (or before it draws), the same marks as plain CSS. */
.viz:not(.roughed) .sk { border: 1.5px solid var(--ink-2); }
.viz:not(.roughed) .sk.c { border-color: var(--vz-compute); } .viz:not(.roughed) .sk.m { border-color: var(--vz-memory); }
.viz:not(.roughed) .sk.g { border-color: var(--vz-good); } .viz:not(.roughed) .sk.w { border-color: var(--vz-warn); } .viz:not(.roughed) .sk.b { border-color: var(--vz-bad); }
.viz:not(.roughed) .bar > i.sk { background: var(--vz-compute); border: 0; } .viz:not(.roughed) .bar > i.sk.m { background: var(--vz-memory); }
.viz:not(.roughed) .bar > i.sk.g { background: var(--vz-good); } .viz:not(.roughed) .bar > i.sk.w { background: var(--vz-warn); } .viz:not(.roughed) .bar > i.sk.b { background: var(--vz-bad); }
.viz:not(.roughed) .arr::after { content: "\2192"; font-size: 20px; line-height: 16px; } .viz:not(.roughed) .arr.d::after { content: "\2193"; }
@media (max-width: 640px) { .vz-cols { grid-template-columns: minmax(0, 1fr); } .viz { padding: 14px; font-size: 15px; } }

/* Calculators: change the numbers, watch the consequence. */
.widget { margin: 1.8em 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; font-family: var(--font-display); }
.widget-head { padding: 12px 18px; border-bottom: 1px solid var(--rule); font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.widget-head small { font: 500 12.5px var(--font-display); color: var(--ink-2); }
.widget-body { padding: 14px 16px 16px; display: grid; gap: 14px; }
.w-inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
.w-inputs label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.w-inputs input, .w-inputs select { font: 15px var(--font-mono); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; width: 100%; }
.w-inputs input[type="range"] { padding: 0; border: 0; accent-color: var(--pen); }
.w-out { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.w-out div { background: var(--box); border-radius: 8px; padding: 10px 12px; }
.w-out small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.w-out b { display: block; font: 700 22px var(--font-mono); font-variant-numeric: tabular-nums; margin-top: 2px; }
.w-out b.ok { color: var(--vz-good); } .w-out b.bad { color: var(--vz-bad); }
.w-note { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.w-meter { height: 8px; background: var(--box); border-radius: 4px; overflow: hidden; position: relative; }
.w-meter i { position: absolute; inset: 0 auto 0 0; background: var(--vz-memory); }
.w-meter i.c { background: var(--vz-compute); }

/* Callouts: each type is told apart by its mark shape, set before the label. */
.callout { margin: 1.6em 0; padding: 14px 18px; border-radius: 10px; background: var(--box); }
.callout .label { display: flex; align-items: center; gap: 8px; font: 600 13px var(--font-display); color: var(--ink-2); margin-bottom: 4px; }
.callout .label::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--ink-2); }
.callout .label + p { margin-top: 2px; }
.callout > :last-child { margin-bottom: 0; }
.callout.rule { background: color-mix(in srgb, var(--pen) 7%, var(--sheet)); }
.callout.rule .label::before { background: var(--pen); }
/* rule keeps the solid square: a hollow one read as a tick box */
.callout.warn { background: color-mix(in srgb, var(--vz-warn) 9%, var(--sheet)); }
.callout.warn .label::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); width: 10px; height: 9px; border-radius: 0; background: var(--vz-warn); }

<script>

const CORE = [0, 1, 2, 3, 4, 5, 6], ENTERPRISE = [7, 8, 9, 10, 11, 12];

const store = {

const byId = Object.fromEntries(COURSE.map(e => [e.id, e]));

/* ---------- Markdown ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TICK = '<svg viewBox="0 0 21 18" aria-hidden="true"><path d="M3 10 L8.5 15 L19 2"/></svg>';
const refMark = `<i class="ref" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M3.5 1.5h5l2.5 2.5v8.5h-7.5z M8.5 1.5v2.5h2.5 M5.5 7h3.5 M5.5 9.5h3.5"/></svg></i>`;

const renderer = new marked.Renderer();

/* ---------- Sketch figures: rough.js strokes over an HTML layout ---------- */
const INK = { c: "--vz-compute", m: "--vz-memory", g: "--vz-good", w: "--vz-warn", b: "--vz-bad" };

/* ---------- Calculators ---------- */
const fmt = (n, d = 0) => Number.isFinite(n) ? n.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d }) : "n/a";
const WIDGETS = {
  kv: {
    title: "KV cache calculator",
    presets: {
      "Llama 3 70B, BF16, 2 x 80 GB": { layers: 80, kvheads: 8, dim: 128, bytes: 2, ctx: 8192, gpu: 160, weights: 141 },
      "Same model without GQA (64 KV heads)": { layers: 80, kvheads: 64, dim: 128, bytes: 2, ctx: 8192, gpu: 160, weights: 141 },
      "Llama 3 8B, BF16, 1 x 80 GB": { layers: 32, kvheads: 8, dim: 128, bytes: 2, ctx: 8192, gpu: 80, weights: 16 },
      "Llama 3 8B, FP8 KV cache": { layers: 32, kvheads: 8, dim: 128, bytes: 1, ctx: 8192, gpu: 80, weights: 16 },

    fields: [["layers", "Layers"], ["kvheads", "KV heads"], ["dim", "Head dimension"], ["bytes", "Bytes per value"], ["ctx", "Tokens per conversation"], ["gpu", "GPU memory, GB"], ["weights", "Weights, GB"]],
    calc(v) {

      const fit = Math.max(0, Math.floor(free / perConv));
      return {

        meter: Math.min(1, v.weights / (v.gpu * 0.9)),
        note: `2 (keys and values) x ${v.layers} layers x ${v.kvheads} KV heads x ${v.dim} dims x ${v.bytes} bytes = ${fmt(perTok)} bytes per token. The bar shows weights as a share of usable memory; the rest holds KV cache, so every long conversation pushes out others.`,
      };
    },
  },
  cost: {
    title: "Cost per million tokens",
    presets: {
      "DeepSeek decode node (8 x H800 at $2/h, 14.8k tok/s)": { price: 2, gpus: 8, tps: 14800, util: 100 },
      "Same node at a realistic 40% utilisation": { price: 2, gpus: 8, tps: 14800, util: 40 },
      "One rented GPU, small model, light traffic": { price: 2.5, gpus: 1, tps: 1500, util: 25 },
    },
    fields: [["price", "Price per GPU-hour, $"], ["gpus", "GPUs"], ["tps", "Output tokens/s when busy"], ["util", "Busy share of the hour, %"]],
    calc(v) {
      const perHour = v.price * v.gpus, tokens = v.tps * 3600 * (v.util / 100);
      const per1m = perHour / (tokens / 1e6);
      return {
        out: [["Cost per hour", `$${fmt(perHour, 2)}`], ["Tokens per hour", `${fmt(tokens / 1e6, 1)} M`], ["Per 1M output tokens", `$${fmt(per1m, 2)}`]],
        meter: Math.min(1, v.util / 100), meterClass: "c",
        note: "Divide what the GPUs cost per hour by the millions of tokens they produce in that hour. Idle time is the hidden multiplier: the same hardware at 40% busy costs 2.5 times as much per token. Prefill capacity, redundancy and people are extra.",
      };
    },
  },
  batch: {
    title: "Batch size against wait per user",
    presets: { "8B model, BF16, one H100-class GPU (3.35 TB/s)": { batch: 16, weights: 16, kvgb: 1, bw: 3.35, slo: 30 } },
    fields: [["batch", "Users per step", "range", 1, 256], ["weights", "Weights, GB"], ["kvgb", "KV cache per user, GB"], ["bw", "Memory bandwidth, TB/s"], ["slo", "Target tokens/s per user"]],
    calc(v) {
      const step = (v.weights + v.batch * v.kvgb) / (v.bw * 1000); // seconds: each decode step reads weights + every user's cache

      return {
        out: [["Step time", `${fmt(step * 1000, 1)} ms`], ["Tokens/s per user", fmt(perUser), ok ? "ok" : "bad"], ["Tokens/s, whole GPU", fmt(total)], ["Goodput", ok ? `${fmt(total)} tok/s` : "0: all too slow", ok ? "ok" : "bad"], ["Largest batch on target", fmt(best)]],
        meter: Math.min(1, v.batch / 256),
        note: "A bandwidth-only model of decode: every step reads all weights once plus each user's KV cache. More users per step multiply total throughput but slow every user. Goodput counts only tokens served within the per-user target, so the best batch is the largest one that still meets it.",
      };
    },
  },
};
function mountWidgets(root) {

async function drawDiagrams(root) {

let outline = [];
function enhance(root, e) {
  const heads = [...root.querySelectorAll(".body h2")];
  heads.forEach(h => h.id = slug(h.textContent));
  outline = heads;
  root.querySelectorAll(".copy").forEach(b => b.addEventListener("click", async () => {
    const pre = b.nextElementSibling;
    try { await navigator.clipboard.writeText(pre.innerText); b.textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; }
    setTimeout(() => b.textContent = "Copy", 1500);
  }));
  root.querySelectorAll(".quiz").forEach(qz => {
    const total = qz.querySelectorAll(".q").length; let answered = 0, right = 0;
    qz.querySelectorAll(".q").forEach(q => q.addEventListener("click", ev => {
      const btn = ev.target.closest(".opt"); if (!btn || btn.disabled) return;
      const ans = +q.dataset.answer, pick = +btn.dataset.i;
      q.querySelectorAll(".opt").forEach((o, i) => {
        o.disabled = true;
        if (i === ans) { o.classList.add("right"); o.querySelector(".tick").outerHTML = tickBox(true, true); }
      });

      answered++;
      const why = document.createElement("div"); why.className = "why";
      why.innerHTML = (pick === ans ? "<strong>Correct.</strong> " : "<strong>Not quite.</strong> ") + marked.parseInline(q.dataset.why);
      q.appendChild(why);

    }));
  });

  if (doneBtn) doneBtn.addEventListener("click", () => {
    if (done.has(e.id)) { done.delete(e.id); justTicked = null; } else { done.add(e.id); justTicked = e.id; }

/* ---------- Lesson outline in the index rail, with the section in view marked ---------- */
let outlineSpy = null;
function mountOutline() {
  outlineSpy?.disconnect(); outlineSpy?.ends?.disconnect();
  const cur = document.querySelector('.nav a[aria-current="page"]');
  const rail = document.getElementById("rail");
  if (cur && rail) { // bring the current lesson into view inside the index, without scrolling the page
    const head = rail.querySelector(".rail-head")?.offsetHeight || 0;
    const off = cur.getBoundingClientRect().top - rail.getBoundingClientRect().top;
    if (off < head + 40 || off > rail.clientHeight * 0.6) rail.scrollTop += off - head - 60;
  }
  if (!cur || outline.length < 2) return;
  const ol = document.createElement("ol");
  ol.className = "toc";
  ol.setAttribute("aria-label", "In this lesson");
  ol.innerHTML = outline.map(h => `<li><a href="${esc(location.hash || "#home")}" data-target="${h.id}">${esc(h.textContent)}</a></li>`).join("");
  cur.after(ol);
  ol.addEventListener("click", ev => {
    const a = ev.target.closest("a[data-target]"); if (!a) return;
    ev.preventDefault();
    closeMenu();
    document.getElementById(a.dataset.target)?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  const links = Object.fromEntries([...ol.querySelectorAll("a")].map(a => [a.dataset.target, a]));
  const mark = document.createElement("span");
  mark.className = "toc-mark";
  ol.prepend(mark);
  let atEnd = false;
  // The section being read is the last heading above a reading line 30% down the screen; at the end of the lesson,
  // where the last heading may never reach that line, it is the last one.
  const pick = () => {
    const line = innerHeight * 0.3;
    const above = outline.filter(h => h.getBoundingClientRect().top <= line);
    const cur = atEnd ? outline[outline.length - 1] : above[above.length - 1];
    Object.values(links).forEach(a => a.classList.remove("on"));
    const a = cur && links[cur.id];
    if (!a) return mark.classList.remove("on");
    a.classList.add("on");
    mark.style.transform = `translateY(${a.offsetTop}px)`;
    mark.style.height = `${a.offsetHeight}px`;
    mark.classList.add("on");
  };
  if (!window.IntersectionObserver) return;
  // Recompute when a heading crosses the reading line or the end of the lesson comes into view. The observed band
  // is everything above the line, so a fast scroll or a jump link that carries a heading past it still flips it.
  outlineSpy = new IntersectionObserver(pick, { rootMargin: "100000px 0px -70% 0px" });
  outline.forEach(h => outlineSpy.observe(h));
  const end = document.querySelector(".pager");
  if (end) { const endSpy = new IntersectionObserver(([x]) => { atEnd = x.isIntersecting; pick(); }); endSpy.observe(end); outlineSpy.ends = endSpy; }
  pick();
}

function route() {
  const id = (location.hash || "#home").slice(1);
  const main = document.getElementById("main");
  const e = byId[id];
  main.innerHTML = e ? renderEntry(e) : renderHome();
  outline = [];
  if (e) enhance(main, e);
  else drawSketches(main);
  renderNav(e ? e.id : null);
  mountOutline();
  document.title = e ? `${e.title} · AI System Design` : "AI System Design";
  closeMenu();
}

const app = document.getElementById("app"), scrim = document.getElementById("scrim"), menuBtn = document.getElementById("menuBtn");
function closeMenu() { const was = app.classList.contains("open"); app.classList.remove("open"); scrim.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); if (was) menuBtn.focus(); }
menuBtn.addEventListener("click", () => { app.classList.add("open"); scrim.hidden = false; menuBtn.setAttribute("aria-expanded", "true"); qInput.focus(); });
scrim.addEventListener("click", closeMenu);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeMenu(); if (ev.key === "/" && document.activeElement !== qInput) { ev.preventDefault(); qInput.focus(); } });

route();
</script>
