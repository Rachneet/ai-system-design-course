<title>AI System Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: a plain neutral frame (index rail, outer margin); each lesson is a numbered worksheet on a white sheet
   with a 66ch reading column; figures, tables and code use the full width. The lesson outline lives in the index
   rail under the current lesson. High contrast first: no textures behind text. */
:root {
  --pad: #f2f3f5;          /* page frame: plain neutral, no texture */
  --pad-line: #e3e5e9;
  --pad-major: #b9bec7;
  --sheet: #ffffff;        /* the reading sheet */
  --box: #f4f5f7;          /* answer and code boxes */
  --ink: #111418;
  --ink-2: #474e5a;        /* secondary text, AA+ on sheet and frame */
  --rule: #d9dce2;         /* hairlines */
  --pen: #1f4f9c;          /* blue ballpoint: links and marks */
  --pen-soft: #dbe5f4;
  --red: #b8352a;          /* reserved: you are here, and the single next action */

  --code-key: #1f4f9c;
  --code-str: #1d6b3a;
  --code-com: #5f6672;
  --code-num: #8a4b12;
  /* Diagram inks: one meaning each, the same in every figure. */
  --vz-compute: #2a5db0;   /* compute, prefill, the work */
  --vz-memory: #6c4aa6;    /* memory, decode, storage */
  --vz-good: #23784a;      /* a win: met the target, cache hit */
  --vz-warn: #a8650f;      /* a cost: KV cache, network, attention */
  --vz-bad: #b3362b;       /* waste, failure, a miss */
  --font-hand: "Kalam", "Comic Neue", "Segoe Print", cursive;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-read: "Literata", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --cell: 18px;
  --rail: 304px;
  --measure: 66ch;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pad: #0d0f12; --pad-line: #1c1f24; --pad-major: #4a505b; --sheet: #16181c; --box: #1e2126;
    --ink: #eceef1; --ink-2: #b0b6c0; --rule: #2e323a; --pen: #93b4ef; --pen-soft: #22324c;
    --red: #f07a6a; --code-key: #93b4ef; --code-str: #9fd3a8; --code-com: #8a919c; --code-num: #e3b07a; --vz-compute: #8db2f2; --vz-memory: #c0a6f0; --vz-good: #7fcf9f; --vz-warn: #e8b464; --vz-bad: #f08a7e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pad: #0d0f12; --pad-line: #1c1f24; --pad-major: #4a505b; --sheet: #16181c; --box: #1e2126;
  --ink: #eceef1; --ink-2: #b0b6c0; --rule: #2e323a; --pen: #93b4ef; --pen-soft: #22324c;
  --red: #f07a6a; --code-key: #93b4ef; --code-str: #9fd3a8; --code-com: #8a919c; --code-num: #e3b07a; --vz-compute: #8db2f2; --vz-memory: #c0a6f0; --vz-good: #7fcf9f; --vz-warn: #e8b464; --vz-bad: #f08a7e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--pad); color: var(--ink); }
body { margin: 0; font-family: var(--font-read); font-size: 18px; line-height: 1.68; -webkit-font-smoothing: antialiased; font-optical-sizing: auto; }
::selection { background: var(--pen-soft); color: var(--ink); }
input, textarea { caret-color: var(--red); }
a { color: var(--pen); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--pad-major) transparent; }


.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }

/* ---------- Index rail ---------- */
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
  padding-block: 22px 40px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px;
  font-family: var(--font-display); font-size: 14px; line-height: 1.35; border-right: 1px solid var(--rule);
  scrollbar-width: thin; scrollbar-color: var(--ink-2) var(--sheet);
  overscroll-behavior: contain; /* reaching the end of the index must not scroll the lesson behind it */
}
/* A solid track so the scroll position is easy to see. */
.rail::-webkit-scrollbar { width: 10px; }
.rail::-webkit-scrollbar-track { background: var(--sheet); border-left: 1px solid var(--rule); }
.rail::-webkit-scrollbar-thumb { background: var(--ink-2); border: 2px solid var(--sheet); }
.rail::-webkit-scrollbar-thumb:hover { background: var(--ink); }
.pad-title { display: block; text-decoration: none; color: var(--ink); background: var(--sheet); border: 1px solid var(--ink); padding: 10px 12px 9px; }
.pad-title b { display: block; font-weight: 800; font-size: 21px; letter-spacing: -0.01em; font-stretch: 85%; line-height: 1.05; }
.pad-title span { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink-2); font-stretch: 100%; }
.search-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.search { width: 100%; margin-top: 14px; padding: 9px 11px; border: 1px solid var(--ink); border-radius: 0; background: var(--sheet); color: var(--ink); font: 15px var(--font-display); }
.search::placeholder { color: var(--ink-2); }
.tally { margin-top: 12px; display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-2); background: var(--sheet); border: 1px solid var(--rule); padding: 6px 10px; }
.tally b { font-family: var(--font-mono); font-size: 13px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.group { margin-top: 20px; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--ink); background: var(--pad); }
.group-head b { font-weight: 700; font-size: 14px; font-stretch: 90%; }
.group-head small { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nav { list-style: none; margin: 4px 0 0; padding: 0; }
.nav a { display: grid; grid-template-columns: 16px 28px 1fr; gap: 8px; align-items: start; padding: 6px 6px 6px 2px; color: var(--ink); text-decoration: none; }
.nav a:hover { background: color-mix(in srgb, var(--sheet) 70%, transparent); }
.nav .no { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); padding-top: 1px; font-variant-numeric: tabular-nums; }
.toc { list-style: none; margin: 2px 0 10px 54px; padding: 0 0 0 10px; border-left: 1px solid var(--rule); }
.toc a { display: block; padding: 3px 0; font-size: 13px; line-height: 1.3; color: var(--ink-2); text-decoration: none; }
.toc a:hover { color: var(--ink); text-decoration: underline; text-decoration-color: var(--pen); }
.toc a.on { color: var(--ink); font-weight: 600; box-shadow: -11px 0 0 -9px var(--pen); }
.nav a[aria-current="page"] { background: var(--sheet); }
.nav a[aria-current="page"] .no { color: var(--red); font-weight: 600; }
.nav a[aria-current="page"] .t { text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.nav .lab-tag, .sheets .lab-tag { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); border: 1px solid var(--ink-2); padding: 0 4px; margin-left: 6px; vertical-align: 1px; }

/* Tick boxes: state is the mark, never colour alone. */
.tick { position: relative; display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--ink); margin-top: 2px; background: var(--sheet); flex: none; }
.tick svg { position: absolute; inset: -4px -5px -2px -1px; width: 21px; height: 18px; overflow: visible; }
.tick path { fill: none; stroke: var(--pen); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.tick.draw path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: pen 420ms cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes pen { to { stroke-dashoffset: 0; } }

.results { list-style: none; padding: 0; margin: 12px 0 0; background: var(--sheet); border: 1px solid var(--rule); }
.results a { display: block; padding: 9px 10px; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); }
.results li:last-child a { border-bottom: 0; }
.results a:hover { background: var(--box); }
.results small { display: block; color: var(--ink-2); font-family: var(--font-read); font-size: 13.5px; margin-top: 2px; }
.results .empty { padding: 10px; color: var(--ink-2); font-size: 13.5px; }
.rail-foot { margin-top: 26px; display: flex; gap: 8px; flex-wrap: wrap; }
.tool { border: 1px solid var(--ink); background: var(--sheet); color: var(--ink); padding: 6px 10px; font: 600 12.5px var(--font-display); cursor: pointer; border-radius: 0; }
.tool:hover { background: var(--box); }

/* ---------- Sheet ---------- */
.topbar { display: none; }
main { min-width: 0; padding-block: 28px 80px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.sheet { max-width: 1120px; margin: 0 auto; background: var(--sheet); border: 1px solid var(--ink); }
.header-strip { display: grid; grid-template-columns: auto 1fr auto auto auto; border-bottom: 1px solid var(--ink); font-family: var(--font-display); }
.header-strip > div { padding: 8px 14px; border-right: 1px solid var(--rule); min-width: 0; }
.header-strip > div:last-child { border-right: 0; }
.header-strip small { display: block; font-size: 11px; color: var(--ink-2); letter-spacing: .02em; }
.header-strip span { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.header-strip .sheetno span { font-family: var(--font-mono); font-size: 15px; }
.sheet-body { padding: 44px 48px 56px; }
/* One column. Prose keeps the reading measure; figures, tables, code, calculators and quizzes use the full width. */
article { min-width: 0; max-width: 980px; }

h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.12; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(34px, 4.4vw, 52px); font-weight: 800; font-stretch: 82%; letter-spacing: -0.02em; margin: 0 0 16px; }
.lede { font-size: 20.5px; line-height: 1.55; color: var(--ink-2); margin: 0 0 8px; max-width: var(--measure); }
.body h2 { font-size: 28px; font-weight: 750; font-stretch: 88%; letter-spacing: -0.01em; margin: 2.3em 0 .55em; padding-top: 14px; border-top: 1px solid var(--ink); }
.body h3 { font-size: 21px; font-weight: 700; font-stretch: 92%; margin: 1.9em 0 .4em; }
.body h4 { font-size: 17px; margin: 1.5em 0 .3em; }
.body p, .body li, .body h2, .body h3, .body h4, .body blockquote { max-width: var(--measure); }
.body h2 { max-width: none; }
.body ul, .body ol { padding-left: 1.3em; }
.body li { margin: .3em 0; }
.body li::marker { color: var(--ink-2); }
.body strong { font-weight: 600; }
.body hr { border: 0; border-top: 1px solid var(--rule); margin: 2.6em 0; }
.body blockquote { margin: 1.4em 0; padding: 4px 0 4px 18px; border-left: 1px solid var(--ink-2); color: var(--ink-2); font-style: italic; }

code { font-family: var(--font-mono); font-size: .82em; background: var(--box); padding: .1em .32em; border: 1px solid var(--rule); }
.codewrap { position: relative; margin: 1.4em 0; }
pre { margin: 0; background: var(--box); border: 1px solid var(--ink-2); padding: 16px 18px; overflow-x: auto; font-size: 13.5px; line-height: 1.6; color: var(--ink); }
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-type, .hljs-literal { color: var(--code-key); }
.hljs-string, .hljs-attr, .hljs-symbol, .hljs-bullet, .hljs-addition { color: var(--code-str); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--code-com); font-style: italic; }
.hljs-number, .hljs-title, .hljs-title.function_, .hljs-section { color: var(--code-num); }
.copy { position: absolute; top: 0; right: 0; border: 0; border-left: 1px solid var(--ink-2); border-bottom: 1px solid var(--ink-2); background: var(--sheet); color: var(--ink); font: 600 12px var(--font-display); padding: 4px 10px; cursor: pointer; }
.copy:hover { background: var(--pen-soft); }

.table-wrap { overflow-x: auto; margin: 1.4em 0; border: 1px solid var(--ink); }
table { border-collapse: collapse; width: 100%; font-family: var(--font-display); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 13px; vertical-align: top; border-right: 1px solid var(--rule); }
th:last-child, td:last-child { border-right: 0; }
th { font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--ink); background: var(--box); }
tbody tr + tr td { border-top: 1px solid var(--rule); }

/* Figures: numbered like plates, drawn in ink on the sheet. */
figure.fig { margin: 1.8em 0; }
.mmd { padding: 18px; border: 1px solid var(--ink); background: var(--sheet); overflow-x: auto; text-align: center; font-family: var(--font-mono); font-size: 12px; white-space: pre; color: var(--ink-2); }
.mmd[data-done] { white-space: normal; }
.mmd svg { max-width: 100%; height: auto; }
.mmd::-webkit-scrollbar { height: 8px; }
.mmd::-webkit-scrollbar-thumb { background: var(--ink-2); }
.mmd::-webkit-scrollbar-track { background: var(--box); }
figcaption { margin-top: 6px; font-family: var(--font-display); font-size: 13px; color: var(--ink-2); }
figcaption b { color: var(--ink); font-variant-numeric: tabular-nums; }
figure.scrolls figcaption::after { content: " Scroll sideways for the full figure."; }

/* Sketch figures: HTML lays them out (so they reflow on phones), rough.js draws the hand-drawn strokes on top. */
.viz { position: relative; padding: 18px; border: 1px solid var(--ink); background: var(--sheet); font-family: var(--font-hand); font-size: 16px; line-height: 1.3; color: var(--ink); overflow-x: auto; }
.viz.roughed { border-color: transparent; }
.viz > svg.rough { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.viz * { position: relative; z-index: 1; }
.viz h5 { margin: 0 0 8px; font: 700 17px var(--font-hand); }
.viz p, .viz .note { margin: 4px 0 0; font-size: 14.5px; color: var(--ink-2); }
.viz b { font-weight: 700; }
.vz-cols { display: grid; grid-template-columns: repeat(var(--k, 2), minmax(0, 1fr)); gap: 14px; }
.vz-panel { padding: 12px 14px; min-width: 0; }
.vz-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 6px 0; }
.ch { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; padding: 3px 9px; font-size: 15px; white-space: nowrap; }
.ch.wide { flex: 1 1 auto; }
.big { font: 700 30px/1.1 var(--font-hand); }
.big.c { color: var(--vz-compute); } .big.m { color: var(--vz-memory); } .big.g { color: var(--vz-good); } .big.w { color: var(--vz-warn); } .big.b { color: var(--vz-bad); }
.arr { display: inline-block; width: 36px; height: 16px; flex: none; }
.arr.long { width: 64px; }
.arr.d { width: 16px; height: 26px; display: block; margin: 2px auto; }
.vz-bars { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; gap: 8px 10px; align-items: center; }
.bar { height: 16px; display: block; }
.bar > i { display: block; height: 100%; width: var(--w, 50%); }
.cells { display: grid; grid-template-columns: repeat(var(--n, 8), minmax(16px, 1fr)); gap: 4px; max-width: calc(var(--n, 8) * 34px); }
.cells > i { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 13px; }
.vz-src { margin-top: 10px; font: 13px var(--font-display); color: var(--ink-2); }
.vz-src a { color: inherit; }
/* Without rough.js (or before it draws), the same marks as plain CSS. */
.viz:not(.roughed) .sk { border: 1.5px solid var(--ink-2); }
.viz:not(.roughed) .sk.c { border-color: var(--vz-compute); } .viz:not(.roughed) .sk.m { border-color: var(--vz-memory); }
.viz:not(.roughed) .sk.g { border-color: var(--vz-good); } .viz:not(.roughed) .sk.w { border-color: var(--vz-warn); } .viz:not(.roughed) .sk.b { border-color: var(--vz-bad); }
.viz:not(.roughed) .bar > i.sk { background: var(--vz-compute); border: 0; } .viz:not(.roughed) .bar > i.sk.m { background: var(--vz-memory); }
.viz:not(.roughed) .bar > i.sk.g { background: var(--vz-good); } .viz:not(.roughed) .bar > i.sk.w { background: var(--vz-warn); } .viz:not(.roughed) .bar > i.sk.b { background: var(--vz-bad); }
.viz:not(.roughed) .arr::after { content: "\2192"; font-size: 20px; line-height: 16px; } .viz:not(.roughed) .arr.d::after { content: "\2193"; }
@media (max-width: 640px) { .vz-cols { grid-template-columns: minmax(0, 1fr); } .viz { padding: 14px; font-size: 15px; } }

/* Calculators: change the numbers, watch the consequence. */
.widget { margin: 1.8em 0; border: 1px solid var(--ink); font-family: var(--font-display); }
.widget-head { padding: 9px 16px; border-bottom: 1px solid var(--ink); background: var(--box); font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.widget-head small { font: 600 12.5px var(--font-mono); color: var(--ink-2); }
.widget-body { padding: 14px 16px 16px; display: grid; gap: 14px; }
.w-inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
.w-inputs label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.w-inputs input, .w-inputs select { font: 15px var(--font-mono); color: var(--ink); background: var(--sheet); border: 1px solid var(--ink-2); border-radius: 0; padding: 6px 8px; width: 100%; }
.w-inputs input[type="range"] { padding: 0; border: 0; accent-color: var(--pen); }
.w-out { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.w-out div { border: 1px solid var(--rule); padding: 10px 12px; }
.w-out small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.w-out b { display: block; font: 700 22px var(--font-mono); font-variant-numeric: tabular-nums; margin-top: 2px; }
.w-out b.ok { color: var(--vz-good); } .w-out b.bad { color: var(--vz-bad); }
.w-note { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.w-meter { height: 12px; border: 1px solid var(--ink-2); position: relative; }
.w-meter i { position: absolute; inset: 0 auto 0 0; background: var(--vz-memory); }
.w-meter i.c { background: var(--vz-compute); }

/* Callouts: each type is told apart by its mark shape, set before the label. */
.callout { margin: 1.6em 0; padding: 14px 18px 14px 18px; border: 1px solid var(--ink); background: var(--sheet); max-width: calc(var(--measure) + 40px); }
.callout .label { display: flex; align-items: center; gap: 9px; font: 700 13px var(--font-display); margin-bottom: 4px; }
.callout .label::before { content: ""; flex: none; width: 12px; height: 12px; background: var(--ink); }
.callout .label + p { margin-top: 2px; }
.callout > :last-child { margin-bottom: 0; }
.callout.rule { border-width: 1px; box-shadow: inset 0 0 0 3px var(--sheet), inset 0 0 0 4px var(--ink); }
/* rule keeps the solid square: a hollow one read as a tick box */
.callout.warn .label::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); width: 14px; }
.callout.tip .label::before { border-radius: 50%; background: transparent; border: 2px solid var(--ink); }
.callout.interview { border-style: dashed; }
.callout.interview .label::before { width: 12px; height: 2px; }
.callout.numbers {
  border-color: var(--ink-2); font-family: var(--font-display); font-size: 16.5px; line-height: 1.6; font-variant-numeric: tabular-nums;
  background-color: var(--sheet);
}
.callout.numbers .label::before { width: 14px; height: 10px; background: transparent; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
.callout.numbers strong { font-family: var(--font-mono); font-size: .95em; border: 1.5px solid var(--ink); padding: 0 5px; background: var(--sheet); white-space: nowrap; }

/* Quiz: tick-box answers on the sheet. */
.quiz { margin: 2.2em 0 1em; border: 1px solid var(--ink); }
.quiz-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 9px 16px; border-bottom: 1px solid var(--ink); background: var(--box); font: 700 15px var(--font-display); }
.quiz-head small { font: 600 13px var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.q { padding: 16px 16px 18px; }
.q + .q { border-top: 1px solid var(--rule); }
.q > p { margin: 0 0 10px; font-weight: 600; }
.opts { display: grid; gap: 4px; }
.opt { display: grid; grid-template-columns: 18px 1fr; gap: 12px; align-items: start; text-align: left; padding: 8px 10px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; font-family: var(--font-read); font-size: 16px; line-height: 1.45; }
.opt:hover:not(:disabled) { border-color: var(--rule); background: var(--box); }
.opt:disabled { cursor: default; }
.opt .tick { margin-top: 3px; }

<script>
const COURSE = /*__COURSE_DATA__*/[];

const WEEKS = {

const store = {

let justTicked = null;
const byId = Object.fromEntries(COURSE.map(e => [e.id, e]));
const trackable = COURSE.filter(e => e.week >= 0 && e.week <= 6);
const sheetNo = Object.fromEntries(trackable.map((e, i) => [e.id, String(i + 1).padStart(2, "0")]));
const pad2 = n => String(n).padStart(2, "0");

/* ---------- Markdown ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TICK = '<svg viewBox="0 0 21 18" aria-hidden="true"><path d="M3 10 L8.5 15 L19 2"/></svg>';
const tickBox = (on, draw) => `<i class="tick${draw ? " draw" : ""}" aria-hidden="true">${on ? TICK : ""}</i>`;
let quizCount = 0, figCount = 0, figPrefix = "";
const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  lang = (lang || "").trim();
  if (lang === "mermaid") {
    figCount++;

  }
  if (lang === "viz") {
    figCount++;
    const lines = code.split("\n");
    const cap = /^caption:/i.test(lines[0]) ? lines.shift().replace(/^caption:\s*/i, "") : "";
    return `<figure class="fig" id="fig-${figPrefix}${figCount}"><div class="viz">${lines.join("\n")}</div><figcaption><b>Fig. ${figPrefix}${figCount}</b>${cap ? " " + marked.parseInline(cap) : ""}</figcaption></figure>`;
  }
  if (lang === "widget") {
    let spec; try { spec = JSON.parse(code); } catch { return `<pre>${esc(code)}</pre>`; }
    return `<div class="widget" data-spec="${esc(JSON.stringify(spec))}"></div>`;
  }
  if (lang === "quiz") {
    let items; try { items = JSON.parse(code); } catch { return `<pre>${esc(code)}</pre>`; }
    const id = "quiz" + (quizCount++);
    const qs = items.map((it, i) => `<div class="q" data-answer="${it.answer}" data-why="${esc(it.why || "")}">
      <p>${i + 1}. ${marked.parseInline(it.q)}</p>
      <div class="opts">${it.options.map((o, j) => `<button class="opt" type="button" data-i="${j}">${tickBox(false)}<span>${marked.parseInline(o)}</span></button>`).join("")}</div>
    </div>`).join("");
    return `<div class="quiz" id="${id}"><div class="quiz-head"><span>Check yourself</span><small data-score>0 of ${items.length} answered</small></div>${qs}</div>`;
  }
  const valid = lang && hljs.getLanguage(lang);
  const html = valid ? hljs.highlight(code, { language: lang }).value : esc(code);
  return `<div class="codewrap"><button class="copy" type="button">Copy</button><pre><code class="hljs language-${esc(lang || "text")}">${html}</code></pre></div>`;
};
renderer.table = (header, body) => `<div class="table-wrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
renderer.link = (href, title, text) => {
  const ext = /^https?:/.test(href || "");
  return `<a href="${esc(href || "")}"${title ? ` title="${esc(title)}"` : ""}${ext ? ' target="_blank" rel="noopener"' : ""}>${text}</a>`;
};
const CALLOUTS = { rule: "Design rule", warn: "Watch out", tip: "Tip", numbers: "Worked numbers", interview: "Design review question" };
renderer.blockquote = quote => {
  const m = quote.match(/^<p>\[!(\w+)\]\s*/);
  if (m && CALLOUTS[m[1]]) return `<div class="callout ${m[1]}"><div class="label">${CALLOUTS[m[1]]}</div>${quote.replace(m[0], "<p>")}</div>`;
  return `<blockquote>${quote}</blockquote>`;
};
marked.setOptions({ renderer, gfm: true });

/* ---------- Sketch figures: rough.js strokes over an HTML layout ---------- */
const INK = { c: "--vz-compute", m: "--vz-memory", g: "--vz-good", w: "--vz-warn", b: "--vz-bad" };
const tone = el => Object.keys(INK).find(k => el.classList.contains(k));
function sketch(fig) {
  if (!window.rough) return;
  const box = fig.getBoundingClientRect();
  if (!box.width) return;
  fig.querySelector(":scope > svg.rough")?.remove();
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "rough"); svg.setAttribute("aria-hidden", "true");
  fig.prepend(svg);

  const o = (extra = {}) => ({ seed: seed++, roughness: 1.1, bowing: 0.8, strokeWidth: 1.4, ...extra });
  const frame = at(fig);
  svg.appendChild(rc.rectangle(3, 3, frame.w - 6, frame.h - 6, o({ stroke: ink, roughness: 0.9 })));

    const r = at(el), t = tone(el), col = t ? css(INK[t]) : ink2;
    if (el.classList.contains("arr")) {
      const vert = el.classList.contains("d");
      const [x1, y1, x2, y2] = vert ? [r.x + r.w / 2, r.y + 1, r.x + r.w / 2, r.y + r.h - 1] : [r.x + 1, r.y + r.h / 2, r.x + r.w - 1, r.y + r.h / 2];
      svg.appendChild(rc.line(x1, y1, x2, y2, o({ stroke: col })));
      const head = vert ? [[x2 - 5, y2 - 7], [x2, y2], [x2 + 5, y2 - 7]] : [[x2 - 7, y2 - 5], [x2, y2], [x2 - 7, y2 + 5]];
      svg.appendChild(rc.linearPath(head, o({ stroke: col })));
      return;
    }
    const isFill = el.parentElement?.classList.contains("bar") || el.classList.contains("fill");
    const opts = { stroke: col };
    if (isFill) Object.assign(opts, { fill: col, fillStyle: "hachure", hachureGap: 4, fillWeight: 1.6 });
    else if (el.classList.contains("x")) Object.assign(opts, { fill: css("--vz-bad"), fillStyle: "cross-hatch", hachureGap: 6, fillWeight: 0.8 });
    else if (t && !el.classList.contains("vz-panel")) Object.assign(opts, { fill: col + "26", fillStyle: "solid" });
    if (el.classList.contains("ghost")) opts.strokeLineDash = [5, 4];
    if (el.classList.contains("vz-panel")) Object.assign(opts, { roughness: 0.8, strokeWidth: 1.2 });
    if (r.w > 0 && r.h > 0) svg.appendChild(rc.rectangle(r.x + 1, r.y + 1, Math.max(2, r.w - 2), Math.max(2, r.h - 2), o(opts)));
  });

}
const sketchObserver = window.ResizeObserver ? new ResizeObserver(es => es.forEach(e => sketch(e.target))) : null;

/* ---------- Calculators ---------- */
const fmt = (n, d = 0) => Number.isFinite(n) ? n.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d }) : "n/a";
const WIDGETS = {
  kv: {
    title: "KV cache calculator",
    presets: {
      "Llama 3 70B, BF16, 2 x 80 GB": { layers: 80, kvheads: 8, dim: 128, bytes: 2, ctx: 8192, gpu: 160, weights: 141 },
      "Same model without GQA (64 KV heads)": { layers: 80, kvheads: 64, dim: 128, bytes: 2, ctx: 8192, gpu: 160, weights: 141 },
      "Llama 3 8B, BF16, 1 x 80 GB": { layers: 32, kvheads: 8, dim: 128, bytes: 2, ctx: 8192, gpu: 80, weights: 16 },
      "Llama 3 8B, FP8 KV cache": { layers: 32, kvheads: 8, dim: 128, bytes: 1, ctx: 8192, gpu: 80, weights: 16 },
    },
    fields: [["layers", "Layers"], ["kvheads", "KV heads"], ["dim", "Head dimension"], ["bytes", "Bytes per value"], ["ctx", "Tokens per conversation"], ["gpu", "GPU memory, GB"], ["weights", "Weights, GB"]],
    calc(v) {
      const perTok = 2 * v.layers * v.kvheads * v.dim * v.bytes; // keys and values
      const perConv = perTok * v.ctx / 1e9;
      const free = v.gpu * 0.9 - v.weights; // keep about 10% for activations and the runtime
      const fit = Math.max(0, Math.floor(free / perConv));
      return {
        out: [["Per token", `${fmt(perTok / 1024)} KB`], ["Per conversation", `${fmt(perConv, 2)} GB`], ["Memory left for KV", `${fmt(Math.max(0, free))} GB`], ["Conversations at once", fmt(fit), fit > 0 ? "ok" : "bad"]],
        meter: Math.min(1, v.weights / (v.gpu * 0.9)),
        note: `2 (keys and values) x ${v.layers} layers x ${v.kvheads} KV heads x ${v.dim} dims x ${v.bytes} bytes = ${fmt(perTok)} bytes per token. The bar shows weights as a share of usable memory; the rest holds KV cache, so every long conversation pushes out others.`,
      };
    },
  },
  cost: {
    title: "Cost per million tokens",
    presets: {
      "DeepSeek decode node (8 x H800 at $2/h, 14.8k tok/s)": { price: 2, gpus: 8, tps: 14800, util: 100 },
      "Same node at a realistic 40% utilisation": { price: 2, gpus: 8, tps: 14800, util: 40 },
      "One rented GPU, small model, light traffic": { price: 2.5, gpus: 1, tps: 1500, util: 25 },
    },
    fields: [["price", "Price per GPU-hour, $"], ["gpus", "GPUs"], ["tps", "Output tokens/s when busy"], ["util", "Busy share of the hour, %"]],
    calc(v) {
      const perHour = v.price * v.gpus, tokens = v.tps * 3600 * (v.util / 100);
      const per1m = perHour / (tokens / 1e6);
      return {
        out: [["Cost per hour", `$${fmt(perHour, 2)}`], ["Tokens per hour", `${fmt(tokens / 1e6, 1)} M`], ["Per 1M output tokens", `$${fmt(per1m, 2)}`]],
        meter: Math.min(1, v.util / 100), meterClass: "c",
        note: "Divide what the GPUs cost per hour by the millions of tokens they produce in that hour. Idle time is the hidden multiplier: the same hardware at 40% busy costs 2.5 times as much per token. Prefill capacity, redundancy and people are extra.",
      };
    },
  },
  batch: {
    title: "Batch size against wait per user",
    presets: { "8B model, BF16, one H100-class GPU (3.35 TB/s)": { batch: 16, weights: 16, kvgb: 1, bw: 3.35, slo: 30 } },
    fields: [["batch", "Users per step", "range", 1, 256], ["weights", "Weights, GB"], ["kvgb", "KV cache per user, GB"], ["bw", "Memory bandwidth, TB/s"], ["slo", "Target tokens/s per user"]],
    calc(v) {
      const step = (v.weights + v.batch * v.kvgb) / (v.bw * 1000); // seconds: each decode step reads weights + every user's cache
      const perUser = 1 / step, total = v.batch / step;
      const ok = perUser >= v.slo;
      let best = 1;
      for (let b = 1; b <= 512; b++) if (1 / ((v.weights + b * v.kvgb) / (v.bw * 1000)) >= v.slo) best = b;
      return {
        out: [["Step time", `${fmt(step * 1000, 1)} ms`], ["Tokens/s per user", fmt(perUser), ok ? "ok" : "bad"], ["Tokens/s, whole GPU", fmt(total)], ["Goodput", ok ? `${fmt(total)} tok/s` : "0: all too slow", ok ? "ok" : "bad"], ["Largest batch on target", fmt(best)]],
        meter: Math.min(1, v.batch / 256),
        note: "A bandwidth-only model of decode: every step reads all weights once plus each user's KV cache. More users per step multiply total throughput but slow every user. Goodput counts only tokens served within the per-user target, so the best batch is the largest one that still meets it.",
      };
    },
  },
};
function mountWidgets(root) {
  root.querySelectorAll(".widget[data-spec]").forEach(el => {
    const spec = JSON.parse(el.dataset.spec), W = WIDGETS[spec.type];
    if (!W) return;
    const names = Object.keys(W.presets);
    const v = { ...W.presets[spec.preset] || W.presets[names[0]] };
    el.innerHTML = `<div class="widget-head"><span>${W.title}</span><small>try your own numbers</small></div><div class="widget-body">
      <div class="w-inputs">${names.length > 1 ? `<label>Preset<select data-preset>${names.map(n => `<option${v === W.presets[n] ? " selected" : ""}>${esc(n)}</option>`).join("")}</select></label>` : ""}
      ${W.fields.map(([k, label, type, min, max]) => `<label>${label}${type === "range" ? ` <span data-show="${k}"></span>` : ""}<input data-k="${k}" type="${type || "number"}" ${min ? `min="${min}" max="${max}"` : 'min="0" step="any"'} value="${v[k]}"></label>`).join("")}</div>
      <div class="w-out"></div><div class="w-meter"><i></i></div><p class="w-note"></p></div>`;
    const draw = () => {
      el.querySelectorAll("[data-k]").forEach(i => { v[i.dataset.k] = Number(i.value); });
      el.querySelectorAll("[data-show]").forEach(s => { s.textContent = v[s.dataset.show]; });
      const r = W.calc(v);
      el.querySelector(".w-out").innerHTML = r.out.map(([k, val, cls]) => `<div><small>${k}</small><b${cls ? ` class="${cls}"` : ""}>${val}</b></div>`).join("");
      const m = el.querySelector(".w-meter i"); m.style.width = `${Math.round(r.meter * 100)}%`; m.className = r.meterClass || "";
      el.querySelector(".w-note").textContent = r.note;
    };
    el.addEventListener("input", ev => {
      if (ev.target.matches("[data-preset]")) {
        Object.assign(v, W.presets[ev.target.value]);
        el.querySelectorAll("[data-k]").forEach(i => { i.value = v[i.dataset.k]; });
      }
      draw();
    });
    draw();
  });
}

/* ---------- Mermaid, drawn in the pad's inks ---------- */
const isDark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
async function drawDiagrams(root) {
  if (!window.mermaid) return;
  const nodes = [...root.querySelectorAll(".mmd")];
  if (!nodes.length) return;
  // Mermaid sizes boxes from text measured now, so the hand font must be loaded first or labels get clipped.
  try { await Promise.all([document.fonts.load("16px Kalam"), document.fonts.load("bold 16px Kalam")]); } catch {}
  mermaid.initialize({
    startOnLoad: false, securityLevel: "strict", theme: "base",
    look: "handDrawn", handDrawnSeed: 7, // the same sketch every load
    fontFamily: "Kalam, Comic Neue, Segoe Print, cursive",
    themeVariables: {
      darkMode: isDark(), background: css("--sheet"), fontSize: "16px",
      primaryColor: css("--sheet"), primaryTextColor: css("--ink"), primaryBorderColor: css("--ink"),
      secondaryColor: css("--box"), tertiaryColor: css("--box"), lineColor: css("--ink-2"),
      clusterBkg: css("--box"), clusterBorder: css("--ink-2"), edgeLabelBackground: css("--sheet"),
      actorBkg: css("--sheet"), actorBorder: css("--ink"), actorTextColor: css("--ink"), signalColor: css("--ink"), signalTextColor: css("--ink"),
      noteBkgColor: css("--box"), noteBorderColor: css("--ink-2"), noteTextColor: css("--ink"),
      labelBoxBkgColor: css("--box"), labelBoxBorderColor: css("--ink-2"), labelTextColor: css("--ink"),
    },
    flowchart: { htmlLabels: true, curve: "basis" },
  });
  for (const [i, n] of nodes.entries()) {
    try {
      const { svg } = await mermaid.render(`m${Date.now()}${i}`, n.dataset.src);
      n.innerHTML = svg; n.dataset.done = "1";
      const el = n.querySelector("svg"), w = el?.viewBox?.baseVal?.width;
      if (w) el.style.minWidth = `${Math.round(w * 0.7)}px`; // wide diagrams scroll rather than shrink past legibility
    } catch (e) { n.textContent = n.dataset.src; }
  }
  const mark = () => nodes.forEach(n => n.closest("figure")?.classList.toggle("scrolls", n.scrollWidth > n.clientWidth + 2));
  mark(); document.fonts?.ready.then(mark);
  if (window.ResizeObserver) { const ro = new ResizeObserver(mark); nodes.forEach(n => ro.observe(n)); }
}

/* ---------- Index ---------- */
const slug = s => s.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function weekGroups() {
  const g = {};
  for (const e of COURSE) (g[e.week] ||= []).push(e);
  return g;
}
const groupName = w => w == 0 ? "Start" : w == 7 ? "Library" : `Week ${w}`;
function renderNav(current) {
  const g = weekGroups();
  let html = "";
  for (const w of Object.keys(g).sort((a, b) => a - b)) {
    const items = g[w];
    const count = items.filter(e => done.has(e.id)).length;
    html += `<section class="group"><div class="group-head"><b>${w >= 1 && w <= 6 ? `${groupName(w)}: ${esc(WEEKS[w].title)}` : groupName(w)}</b>${w <= 6 ? `<small>${count}/${items.length}</small>` : ""}</div><ul class="nav">`;
    html += items.map(e => {
      const no = sheetNo[e.id] || "";
      const tracked = e.week <= 6;
      return `<li><a href="#${e.id}" ${e.id === current ? 'aria-current="page"' : ""}>${tracked ? tickBox(done.has(e.id)) : "<i></i>"}<span class="no">${no}</span><span class="t">${esc(e.title)}${e.kind === "lab" ? '<span class="lab-tag">lab</span>' : ""}</span></a></li>`;
    }).join("");
    html += `</ul></section>`;
  }
  document.getElementById("navWrap").innerHTML = html;
  const n = trackable.filter(e => done.has(e.id)).length;
  document.getElementById("tally").textContent = `${n} of ${trackable.length}`;
  document.getElementById("topTally").textContent = `${n} of ${trackable.length}`;
}

function renderHome() {
  const g = weekGroups();
  const next = trackable.find(e => !done.has(e.id)) || trackable[0];
  const n = trackable.filter(e => done.has(e.id)).length;
  const week = w => {
    const items = g[w] || [];
    const c = items.filter(e => done.has(e.id)).length;
    const first = sheetNo[items[0]?.id], last = sheetNo[items[items.length - 1]?.id];
    return `<section class="wk"><div class="wk-no"><b>${w === 0 ? "Start" : `Week ${w}`}</b><small>Lessons ${Number(first)}-${Number(last)}</small><small>${c} of ${items.length} done</small></div><div>
      <h2>${esc(WEEKS[w].title)}</h2><p>${esc(WEEKS[w].blurb)}</p>
      <ul class="sheets">${items.map(e => `<li><a href="#${e.id}"${e.id === next.id ? ' class="next-up"' : ""}>${tickBox(done.has(e.id))}<span class="no">${sheetNo[e.id]}</span><span class="t">${esc(e.short || e.title)}${e.kind === "lab" ? '<span class="lab-tag">lab</span>' : ""}</span></a></li>`).join("")}</ul>
    </div></section>`;
  };
  const extras = (g[7] || []).map(e => `<li><a href="#${e.id}"><b>${esc(e.title)}</b><span>${esc(e.summary || "")}</span></a></li>`).join("");
  const minutes = COURSE.reduce((s, e) => s + e.minutes, 0);
  const strip = `<div class="header-strip pad-strip">
      <div><small>Your progress</small><span>${n} of ${trackable.length} lessons done</span></div>
      <div><small>Up next</small><span><a href="#${next.id}">${Number(sheetNo[next.id])}. ${esc(next.short || next.title)}</a></span></div>
      <div><small>Length</small><span>6 weeks, about ${Math.round(minutes / 60)} hours</span></div>
      <div><small>Price</small><span>Free</span></div>
    </div>`;
  return `<div class="sheet">${strip}<div class="cover">
    <h1>Design AI systems that survive production.</h1>
    <p class="lede">Six weeks on agents, retrieval, evals, security, deployment and operations, worked through one system you build from prototype to monitored service. Free, with tested reference code for every lab.</p>
    <div class="resume">
      <a class="go" href="#${next.id}">${n ? `Continue with lesson ${Number(sheetNo[next.id])}` : "Start the course"}</a>
    </div>
    <section class="map"><h2>One system, built in five labs</h2>
      <p>Every lab adds a layer to Relay, a support agent for an online store, until it is a monitored production service. Use any model provider.</p>
      <div class="viz"><div class="vz-row"><span class="ch sk">customer</span><span class="arr sk"></span><span class="ch sk c">Relay API</span><span class="arr sk"></span><span class="ch sk m">any model: hosted or open</span></div>
        <div class="vz-cols" style="--k:5">${[
          ["w1-lab", "Lab 1", "c", ["agent loop", "tools", "memory"]],
          ["w2-lab", "Lab 2", "m", ["hybrid search", "access control", "guardrails"]],
          ["w3-lab", "Lab 3", "g", ["eval suite", "LLM judges", "red-team gate"]],
          ["w4-lab", "Lab 4", "w", ["auth and limits", "workers", "CI/CD to cloud"]],
          ["w5-lab", "Lab 5", "c", ["tracing", "SLOs and alerts", "cost per turn"]],
        ].map(([id, n, ink, parts]) => `<a class="vz-panel sk ${ink} lab-col" href="#${id}"><h5>${n}${done.has(id) ? " \u2713" : ""}</h5>${parts.map(t => `<span class="ch sk ${ink}">${t}</span>`).join("")}</a>`).join("")}</div>
      </div>
    </section>
    <div class="weeks">${[0, 1, 2, 3, 4, 5, 6].map(week).join("")}</div>
    <section class="library"><h2>Library</h2><ul>${extras}</ul></section>
  </div></div>`;
}

function renderEntry(e) {
  quizCount = 0; figCount = 0;
  const idx = COURSE.indexOf(e);
  const prev = COURSE[idx - 1], next = COURSE[idx + 1];
  const no = sheetNo[e.id];
  figPrefix = no ? `${Number(no)}.` : "";
  const body = marked.parse(e.body);
  const tracked = e.week <= 6;
  const kind = { lesson: "Lesson", lab: "Lab", page: "Reference" }[e.kind] || e.kind;
  const weekCell = e.week >= 1 && e.week <= 6 ? `Week ${e.week}: ${WEEKS[e.week].title}` : groupName(e.week);
  const strip = `<div class="header-strip">
      <div class="sheetno"><small>Lesson</small><span>${no ? `${Number(no)} of ${trackable.length}` : "Reference"}</span></div>
      <div class="wk-cell"><small>Week</small><span>${esc(weekCell)}</span></div>
      <div><small>Type</small><span>${kind}</span></div>
      <div><small>Time</small><span>${e.minutes ? `${e.minutes} min` : "As needed"}</span></div>
      <div><small>Status</small><span>${tracked ? (done.has(e.id) ? "Done" : "Not done yet") : "Reference"}</span></div>
    </div>`;
  const nextLabel = n => `${sheetNo[n.id] ? `Lesson ${Number(sheetNo[n.id])}` : "Library"}`;
  return `<div class="sheet">${strip}<div class="sheet-body"><article>
    <h1>${esc(e.title)}</h1>
    ${e.summary ? `<p class="lede">${esc(e.summary)}</p>` : ""}
    <div class="body">${body}</div>
    ${tracked ? `<div class="sign-off"><button class="mark" id="doneBtn" type="button" aria-pressed="${done.has(e.id)}">${tickBox(done.has(e.id), justTicked === e.id)}${done.has(e.id) ? "Done" : "Mark as done"}</button><p>${done.has(e.id) ? "Marked as done. Click again to undo." : "Mark it done once you can answer the self-check questions without looking back."}</p></div>` : ""}
    <nav class="pager" aria-label="Lessons">${prev ? `<a class="prev" href="#${prev.id}"><small>${nextLabel(prev)}</small><b>${esc(prev.title)}</b></a>` : "<span></span>"}${next ? `<a class="next" href="#${next.id}"><small>Next: ${nextLabel(next)}</small><b>${esc(next.title)}</b></a>` : ""}</nav>
  </article></div></div>`;
}

let outline = [];
function enhance(root, e) {
  const heads = [...root.querySelectorAll(".body h2")];
  heads.forEach(h => h.id = slug(h.textContent));
  outline = heads;
  root.querySelectorAll(".copy").forEach(b => b.addEventListener("click", async () => {
    const pre = b.nextElementSibling;
    try { await navigator.clipboard.writeText(pre.innerText); b.textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; }
    setTimeout(() => b.textContent = "Copy", 1500);
  }));
  root.querySelectorAll(".quiz").forEach(qz => {
    const total = qz.querySelectorAll(".q").length; let answered = 0, right = 0;
    qz.querySelectorAll(".q").forEach(q => q.addEventListener("click", ev => {
      const btn = ev.target.closest(".opt"); if (!btn || btn.disabled) return;
      const ans = +q.dataset.answer, pick = +btn.dataset.i;
      q.querySelectorAll(".opt").forEach((o, i) => {
        o.disabled = true;
        if (i === ans) { o.classList.add("right"); o.querySelector(".tick").outerHTML = tickBox(true, true); }
      });
      if (pick !== ans) btn.classList.add("wrong"); else right++;
      answered++;
      const why = document.createElement("div"); why.className = "why";
      why.innerHTML = (pick === ans ? "<strong>Correct.</strong> " : "<strong>Not quite.</strong> ") + marked.parseInline(q.dataset.why);
      q.appendChild(why);
      qz.querySelector("[data-score]").textContent = answered === total ? `${right} of ${total} correct` : `${answered} of ${total} answered`;
    }));
  });
  const doneBtn = root.querySelector("#doneBtn");
  if (doneBtn) doneBtn.addEventListener("click", () => {
    if (done.has(e.id)) { done.delete(e.id); justTicked = null; } else { done.add(e.id); justTicked = e.id; }
    store.set("aisd.done", [...done]);
    const y = scrollY; route(); scrollTo(0, y);
    document.getElementById("doneBtn")?.focus({ preventScroll: true });
    justTicked = null;
  });
  drawDiagrams(root);
  drawSketches(root);
  mountWidgets(root);
}

/* ---------- Lesson outline in the index rail, with the section in view marked ---------- */
let outlineSpy = null;
function mountOutline() {
  outlineSpy?.disconnect();
  const cur = document.querySelector('.nav a[aria-current="page"]');
  const rail = document.getElementById("rail");
  if (cur && rail) { // bring the current lesson into view inside the index, without scrolling the page
    const off = cur.getBoundingClientRect().top - rail.getBoundingClientRect().top;
    if (off < 80 || off > rail.clientHeight * 0.6) rail.scrollTop += off - 120;
  }
  if (!cur || outline.length < 2) return;
  const ol = document.createElement("ol");
  ol.className = "toc";
  ol.setAttribute("aria-label", "In this lesson");
  ol.innerHTML = outline.map(h => `<li><a href="${esc(location.hash || "#home")}" data-target="${h.id}">${esc(h.textContent)}</a></li>`).join("");
  cur.after(ol);
  ol.addEventListener("click", ev => {
    const a = ev.target.closest("a[data-target]"); if (!a) return;
    ev.preventDefault();
    closeMenu();
    document.getElementById(a.dataset.target)?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  const links = Object.fromEntries([...ol.querySelectorAll("a")].map(a => [a.dataset.target, a]));
  if (!window.IntersectionObserver) return;
  outlineSpy = new IntersectionObserver(entries => {
    const top = entries.filter(x => x.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (!top) return;
    Object.values(links).forEach(a => a.classList.remove("on"));
    links[top.target.id]?.classList.add("on");
  }, { rootMargin: "0px 0px -70% 0px" });
  outline.forEach(h => outlineSpy.observe(h));
}

function route() {
  const id = (location.hash || "#home").slice(1);
  const main = document.getElementById("main");
  const e = byId[id];
  main.innerHTML = e ? renderEntry(e) : renderHome();
  outline = [];
  if (e) enhance(main, e);
  else drawSketches(main);
  renderNav(e ? e.id : null);
  mountOutline();
  document.title = e ? `${e.title} · AI System Design` : "AI System Design";
  closeMenu();
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

/* ---------- Search ---------- */
const plain = COURSE.map(e => ({ e, text: (e.title + " " + e.body).toLowerCase() }));
const qInput = document.getElementById("q");
qInput.addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase();
  const out = document.getElementById("results"), nav = document.getElementById("navWrap");
  if (q.length < 2) { out.hidden = true; nav.hidden = false; return; }
  const terms = q.split(/\s+/);
  const hits = plain.filter(p => terms.every(t => p.text.includes(t))).slice(0, 12);
  out.innerHTML = hits.length ? hits.map(({ e, text }) => {
    const i = text.indexOf(terms[0]);
    const snip = e.body.slice(Math.max(0, i - 50), i + 90).replace(/[#*`>\[\]]/g, "").replace(/\s+/g, " ");
    return `<li><a href="#${e.id}">${sheetNo[e.id] ? `${sheetNo[e.id]} · ` : ""}${esc(e.title)}<small>…${esc(snip)}…</small></a></li>`;
  }).join("") : `<li class="empty">Nothing matches “${esc(q)}”. Try a shorter term such as “cache” or “judge”.</li>`;
  out.hidden = false; nav.hidden = true;
});
document.getElementById("results").addEventListener("click", () => { qInput.value = ""; document.getElementById("results").hidden = true; document.getElementById("navWrap").hidden = false; });

/* ---------- Theme, menu, reset ---------- */
const themes = ["system", "light", "dark"];
function applyTheme(t) {
  if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  document.getElementById("themeBtn").textContent = "Theme: " + t;
}
let theme = store.get("aisd.theme", "system"); applyTheme(theme);
document.getElementById("themeBtn").addEventListener("click", () => {
  theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set("aisd.theme", theme); applyTheme(theme); route();
});
let armed = false;
document.getElementById("resetBtn").addEventListener("click", ev => {
  if (!armed) { armed = true; ev.target.textContent = "Click again to reset"; setTimeout(() => { armed = false; ev.target.textContent = "Reset progress"; }, 3000); return; }
  done = new Set(); store.set("aisd.done", []); armed = false; ev.target.textContent = "Progress reset"; route();
});
const app = document.getElementById("app"), scrim = document.getElementById("scrim"), menuBtn = document.getElementById("menuBtn");
function closeMenu() { const was = app.classList.contains("open"); app.classList.remove("open"); scrim.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); if (was) menuBtn.focus(); }
menuBtn.addEventListener("click", () => { app.classList.add("open"); scrim.hidden = false; menuBtn.setAttribute("aria-expanded", "true"); qInput.focus(); });
scrim.addEventListener("click", closeMenu);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeMenu(); if (ev.key === "/" && document.activeElement !== qInput) { ev.preventDefault(); qInput.focus(); } });

route();
</script>
