# OpenTelemetry Collector: receive OTLP, keep every interesting trace and 10% of the rest, export to your backend.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  tail_sampling:
    decision_wait: 30s          # agent turns can take a while; wait for the whole trace
    num_traces: 50000
    policies:
      - name: errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: slow
        type: latency
        latency: {threshold_ms: 15000}
      - name: many-steps
        type: numeric_attribute
        numeric_attribute: {key: relay.steps, min_value: 5, max_value: 1000}
      - name: guardrail-fired
        type: numeric_attribute
        numeric_attribute: {key: relay.guard_failures, min_value: 1, max_value: 1000}
      - name: fallback-or-router
        type: string_attribute
        string_attribute: {key: relay.route, values: [simple]}
      - name: baseline
        type: probabilistic
        probabilistic: {sampling_percentage: 10}
  batch: {}

exporters:
  otlphttp:
    endpoint: ${env:TRACE_BACKEND_ENDPOINT}   # e.g. Langfuse, Phoenix, Tempo, Honeycomb
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlphttp]
