name: pages
# Builds the course site from content/ and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["content/**", "scripts/build.py", "scripts/template.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false # never cut off a deploy halfway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build (fails on missing front matter or en and em dashes)
        run: uv run --no-project python scripts/build.py
      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp site/standalone.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
