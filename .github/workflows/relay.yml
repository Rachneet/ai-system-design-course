name: relay
on:
  push:
    paths: ["relay/**", ".github/workflows/relay.yml"]
  pull_request:
    paths: ["relay/**", ".github/workflows/relay.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python -m evals.run --validate

  evals:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # Separate keys with spend caps. Set the one for your provider; pick models with repository variables
      # EVAL_MODEL and EVAL_JUDGE_MODEL (provider:model specs, ideally the judge from a different family).
      ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.EVAL_GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.EVAL_OPENROUTER_API_KEY }}
      RELAY_DATABASE_URL: postgresql://postgres:relay@localhost:5432/relay
      RELAY_MODEL: ${{ vars.EVAL_MODEL || 'claude-haiku-5-5' }}
      RELAY_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || vars.EVAL_MODEL || 'claude-opus-5-5' }}
      RELAY_MEMORY_MODEL: ${{ vars.EVAL_MODEL || 'claude-haiku-5-5' }}
      HAS_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY != '' || secrets.EVAL_OPENAI_API_KEY != '' || secrets.EVAL_GEMINI_API_KEY != '' || secrets.EVAL_OPENROUTER_API_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::No EVAL_*_API_KEY secret is set, so the model eval gate was skipped."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_KEY == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - if: env.HAS_KEY == 'true'
        run: |
          uv sync --locked
          uv run python -m evals.run --suite pr --trials 3 --save runs/pr.json | tee runs-report.txt
      - if: always() && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            relay/runs/pr.json
            relay/runs-report.txt

  container:
    needs: test
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB: postgresql://postgres:relay@localhost:5432/relay
      SECRET: ci-only-secret-0123456789-abcdefghijklmnop
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t relay:ci relay
      - name: Inspect image
        run: |
          docker image ls relay:ci --format 'size {{.Size}}'
          test "$(docker run --rm relay:ci id -u)" = "10001"
      - name: Migrate
        run: docker run --rm --network host -e RELAY_DATABASE_URL=$DB relay:ci python -m app.migrate
      - name: Start API and worker (offline backends, no API key)
        run: |
          common="--network host -e RELAY_DATABASE_URL=$DB -e RELAY_LLM_BACKEND=echo -e RELAY_EMBEDDINGS=hash -e RELAY_AUTH_MODE=dev -e RELAY_DEV_JWT_SECRET=$SECRET"
          docker run -d --name api $common -e PORT=8080 relay:ci
          docker run -d --name worker $common -e PORT=8081 relay:ci python -m app.worker
          for i in $(seq 1 30); do curl -fs localhost:8080/readyz && curl -fs localhost:8081/healthz && break; sleep 2; done
      - name: Smoke test
        run: |
          TOKEN=$(docker run --rm -e RELAY_AUTH_MODE=dev -e RELAY_DEV_JWT_SECRET=$SECRET relay:ci python -m scripts.dev_token c_77)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/chat -H 'content-type: application/json' -d '{"message":"hi"}')" = "401"
          OUT=$(curl -fsN -X POST localhost:8080/chat -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"message":"hello relay"}')
          echo "$OUT"
          echo "$OUT" | grep -q '(echo) hello relay'
          SID=$(echo "$OUT" | grep -o '"session_id": "[^"]*"' | tail -1 | cut -d'"' -f4)
          curl -fsN -X POST localhost:8080/chat -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "{\"message\":\"again\",\"session_id\":\"$SID\"}" | grep -q '"done": true'
          curl -fs localhost:8080/sessions/$SID -H "Authorization: Bearer $TOKEN" | grep -q 'again'
      - name: Worker indexed the knowledge base
        run: |
          for i in $(seq 1 30); do n=$(psql "$DB" -tAc "SELECT count(*) FROM documents"); [ "$n" = "30" ] && break; sleep 2; done
          test "$n" = "30"
          psql "$DB" -tAc "SELECT count(*) FROM chunks"
      - name: Graceful shutdown
        run: |
          docker stop --time 20 api worker
          test "$(docker inspect api --format '{{.State.ExitCode}}')" = "0"
          test "$(docker inspect worker --format '{{.State.ExitCode}}')" = "0"
      - if: failure()
        run: docker logs api; docker logs worker

  ops-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus rules
        run: docker run --rm -v "$PWD/relay/ops/prometheus:/r:ro" --entrypoint promtool prom/prometheus:v2.53.0 check rules /r/alerts.yml
      - name: Prometheus config
        run: docker run --rm -v "$PWD/relay/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml
      - name: Collector config
        run: docker run --rm -e TRACE_BACKEND_ENDPOINT=http://localhost:4318 -v "$PWD/relay/ops/otel-collector.yaml:/c.yaml:ro" otel/opentelemetry-collector-contrib:0.111.0 validate --config=/c.yaml
