name: atlas
on:
  push:
    paths: ["platform/atlas/**", ".github/workflows/atlas.yml"]
  pull_request:
    paths: ["platform/atlas/**", ".github/workflows/atlas.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/atlas
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Static security analysis
        run: uv run bandit -q -r atlas -ll
      - name: Known vulnerabilities in locked dependencies
        run: |
          uv export --frozen --no-dev --no-hashes -q > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --no-deps --disable-pip

  image:
    needs: test
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB: postgresql://postgres:atlas@localhost:5432/atlas
      ADMIN: ci-admin-token-0123456789-abcdefgh
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t atlas:ci platform/atlas
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: atlas:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: atlas:ci
          format: spdx-json
          output-file: atlas.spdx.json
      - name: Migrate and smoke test the container
        run: |
          test "$(docker run --rm atlas:ci id -u)" = "10001"
          docker run --rm --network host -e ATLAS_DATABASE_URL=$DB atlas:ci alembic upgrade head
          docker run -d --name atlas --network host -e ATLAS_DATABASE_URL=$DB -e ATLAS_ADMIN_TOKEN=$ADMIN -e PORT=8080 atlas:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/readyz && break; sleep 2; done
          A="Authorization: Bearer $ADMIN"
          J='content-type: application/json'
          curl -fs -X POST localhost:8080/admin/teams -H "$A" -H "$J" -d '{"id":"ci","name":"CI"}'
          PUB=$(curl -fs -X POST localhost:8080/admin/principals -H "$A" -H "$J" -d '{"label":"ci","team_id":"ci","roles":["publisher"]}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          curl -fs -X POST localhost:8080/v1/mcp-servers -H "Authorization: Bearer $PUB" -H "$J" \
            -d '{"server":{"name":"io.github.ci/demo","description":"CI demo","version":"1.0.0","remotes":[{"type":"streamable-http","url":"https://ci.example/mcp"}]}}' | grep -q '"in_review"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v0/servers)" = "401"
          docker stop --time 20 atlas && test "$(docker inspect atlas --format '{{.State.ExitCode}}')" = "0"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-sbom
          path: atlas.spdx.json
